\r\n    { key: 'خرج‌کرد', value: m.expense, color: '#f43f5e' },\r\n    { key: 'اقساط', value: m.instTotal, color: '#f59e0b' }\r\n  ].filter(function(p) { return p.value > 0; });\r\n  const total = parts.reduce(function(sum, p) { return sum + p.value; }, 0);\r\n  if (!total) { el.innerHTML = emptyBox('خرج یا قسطی برای این ماه ثبت نشده است'); return; }\r\n\r\n  const C = 2 * Math.PI * 46;\r\n  let cum = 0;\r\n  const segments = parts.map(function(p) {\r\n    const len = p.value / total * C;\r\n    const segment = '<circle cx=\"60\" cy=\"60\" r=\"46\" fill=\"none\" stroke=\"' + p.color +\r\n      '\" stroke-width=\"14\" stroke-linecap=\"round\" stroke-dasharray=\"' + Math.max(len - 3, 0.5) + ' ' + C +\r\n      '\" stroke-dashoffset=\"' + (-cum) + '\" transform=\"rotate(-90 60 60)\"><title>' + p.key + ': ' + fmt(p.value) + '<\/title><\/circle>';\r\n    cum += len;\r\n    return segment;\r\n  }).join('');\r\n\r\n  const legend = parts.map(function(p) {\r\n    return '<div class=\"of-legend-row\"><i style=\"background:' + p.color + '\"><\/i>' +\r\n      '<span>' + p.key + '<\/span><b>' + fmt(p.value) + '<\/b>' +\r\n      '<small>' + pctText(p.value, total) + '٪<\/small><\/div>';\r\n  }).join('');\r\n\r\n  el.innerHTML = '<div class=\"of-chart\"><svg viewBox=\"0 0 120 120\">' +\r\n    '<circle cx=\"60\" cy=\"60\" r=\"46\" fill=\"none\" stroke=\"var(--border)\" stroke-width=\"14\"/>' +\r\n    segments +\r\n    '<text x=\"60\" y=\"57\" text-anchor=\"middle\" class=\"of-total\">' + khCompact(total) + '<\/text>' +\r\n    '<text x=\"60\" y=\"71\" text-anchor=\"middle\" class=\"of-unit\">تومان<\/text><\/svg><\/div>' +\r\n    '<div class=\"of-legend\">' + legend +\r\n    '<div class=\"of-income\">درآمد ماه: <b>' + fmt(m.income) + '<\/b> تومان<\/div><\/div>';\r\n}\r\n\r\nfunction renderCompareBars() {\r\n  const el = document.getElementById('compareBars');\r\n  if (!el) return;\r\n  const months = [];\r\n  let y = reportYear, m = reportMonth;\r\n  for (let i = 0; i < 6; i++) {\r\n    months.unshift({ jy: y, jm: m });\r\n    m--;\r\n    if (m < 1) { m = 12; y--; }\r\n  }\r\n  const rows = months.map(function(mo) {\r\n    const f = computeMonthFinance(mo.jy, mo.jm);\r\n    return { label: jMonths[mo.jm - 1], income: f.income, inst: f.instTotal, expense: f.expense };\r\n  });\r\n  const hasAny = rows.some(function(r) { return r.income > 0 || r.inst > 0 || r.expense > 0; });\r\n  if (!hasAny) { el.innerHTML = emptyBox('داده‌ای برای ۶ ماه اخیر وجود ندارد'); return; }\r\n\r\n  const max = Math.max.apply(null, rows.map(function(r) {\r\n    return Math.max(r.income, r.inst, r.expense, 1);\r\n  }));\r\n  let yLabels = '';\r\n  for (let i = 0; i <= 3; i++) {\r\n    yLabels += '<span class=\"cb-y\" style=\"bottom:' + (i / 3 * 100) + '%\">' + khCompact(max * i / 3) + '<\/span>';\r\n  }\r\n  let cols = '', monthLabels = '';\r\n  rows.forEach(function(r) {\r\n    const series = [\r\n      { label: 'درآمد', value: r.income, color: '#10b981' },\r\n      { label: 'اقساط', value: r.inst, color: '#f59e0b' },\r\n      { label: 'خرج‌کرد', value: r.expense, color: '#ef4444' }\r\n    ];\r\n    cols += '<div class=\"cb-col\">';\r\n    series.forEach(function(s) {\r\n      cols += '<i class=\"cb-bar\" style=\"height:' + (s.value / max * 100) + '%;background:' + s.color +\r\n        '\" title=\"' + r.label + ' — ' + s.label + ': ' + fmt(s.value) + ' تومان\"><\/i>';\r\n    });\r\n    cols += '<\/div>';\r\n    monthLabels += '<div class=\"cb-month\">' + r.label + '<\/div>';\r\n  });\r\n\r\n  el.innerHTML = '<div class=\"cb-chart\">' +\r\n    '<div class=\"cb-ylabels\">' + yLabels + '<\/div>' +\r\n    '<div class=\"cb-bars-row\">' + cols + '<\/div>' +\r\n    '<div class=\"cb-months\">' + monthLabels + '<\/div><\/div>';\r\n}\r\n\r\n/* ---------- گزارش‌های خرج‌یار (منتقل‌شده به گزارش کل) ---------- */\r\nfunction renderKharchReports() {\r\n  initReportMonth();\r\n  const data = khGetData();\r\n  const sources = data.sources;\r\n  const txs = data.transactions;\r\n  const budgets = data.budgets;\r\n  const today = todayJalali();\r\n  const monthLabel = jMonths[reportMonth - 1] + ' ' + toPersianDigits(reportYear);\r\n\r\n  let monthIncome = 0, monthExpense = 0, allIncome = 0, allExpense = 0;\r\n  let todayIncome = 0, todayExpense = 0, monthCount = 0;\r\n  const expenseByCat = {}, incomeByCat = {}, dayExpense = {};\r\n\r\n  txs.forEach(function(t) {\r\n    const amount = Number(t.amount) || 0;\r\n    const j = tsToJalali(t.timestamp);\r\n    if (t.type === 'income') allIncome += amount;\r\n    if (t.type === 'expense') allExpense += amount;\r\n    if (j.jy === reportYear && j.jm === reportMonth) {\r\n      monthCount++;\r\n      if (t.type === 'income') {\r\n        monthIncome += amount;\r\n        incomeByCat[t.category] = (incomeByCat[t.category] || 0) + amount;\r\n      } else if (t.type === 'expense') {\r\n        monthExpense += amount;\r\n        expenseByCat[t.category] = (expenseByCat[t.category] || 0) + amount;\r\n        dayExpense[j.jd] = (dayExpense[j.jd] || 0) + amount;\r\n      }\r\n    }\r\n    if (j.jy === today.jy && j.jm === today.jm && j.jd === today.jd) {\r\n      if (t.type === 'income') todayIncome += amount;\r\n      else if (t.type === 'expense') todayExpense += amount;\r\n    }\r\n  });\r\n\r\n  let totalBalance = 0;\r\n  sources.forEach(function(src) { totalBalance += khSourceBalance(src, txs); });\r\n  const cash = sources.filter(function(s) { return s.type === 'cash'; })\r\n    .reduce(function(sum, s) { return sum + khSourceBalance(s, txs); }, 0);\r\n  const bank = totalBalance - cash;\r\n\r\n  setText('khSummaryMonth', monthLabel);\r\n  setText('khExpenseMonthLabel', monthLabel);\r\n  setText('khIncomeMonthLabel', monthLabel);\r\n  setText('khTrendMonthLabel', monthLabel);\r\n\r\n  const statsEl = document.getElementById('khStatsGrid');\r\n  if (statsEl) {\r\n    statsEl.innerHTML =\r\n      '<div class=\"kh-stat income\"><span>درآمد ماه<\/span><b>' + fmt(monthIncome) + '<\/b><small>' + toPersianDigits(monthCount) + ' تراکنش<\/small><\/div>' +\r\n      '<div class=\"kh-stat expense\"><span>خرج‌کرد ماه<\/span><b>' + fmt(monthExpense) + '<\/b><small>' + (monthIncome > 0 ? pctText(monthExpense, monthIncome) + '٪ از درآمد' : 'بدون درآمد') + '<\/small><\/div>' +\r\n      '<div class=\"kh-stat balance\"><span>مانده ماه<\/span><b class=\"' + (monthIncome - monthExpense >= 0 ? 'pos' : 'neg') + '\">' + (monthIncome - monthExpense < 0 ? '−' : '') + fmt(Math.abs(monthIncome - monthExpense)) + '<\/b><small>درآمد منهای خرج<\/small><\/div>' +\r\n      '<div class=\"kh-stat wallet\"><span>موجودی منابع<\/span><b>' + fmt(totalBalance) + '<\/b><small>نقدی + کارت<\/small><\/div>' +\r\n      '<div class=\"kh-rows\">' +\r\n        '<div><span>درآمد کل (همه ماه‌ها)<\/span><b class=\"pos\">' + fmt(allIncome) + '<\/b><\/div>' +\r\n        '<div><span>خرج کل (همه ماه‌ها)<\/span><b class=\"neg\">' + fmt(allExpense) + '<\/b><\/div>' +\r\n        '<div><span>موجودی نقدی<\/span><b>' + fmt(cash) + '<\/b><\/div>' +\r\n        '<div><span>موجودی کارت‌ها<\/span><b>' + fmt(bank) + '<\/b><\/div>' +\r\n        '<div><span>خرج امروز<\/span><b class=\"neg\">' + fmt(todayExpense) + '<\/b><\/div>' +\r\n        '<div><span>درآمد امروز<\/span><b class=\"pos\">' + fmt(todayIncome) + '<\/b><\/div>' +\r\n      '<\/div>';\r\n  }\r\n\r\n  renderKhDonut('khCategoryChart', expenseByCat, KH_EXPENSE_CATS, KH_PALETTE, monthExpense);\r\n  renderKhDonut('khIncomeChart', incomeByCat, KH_INCOME_CATS, KH_INCOME_PALETTE, monthIncome);\r\n  renderKhTrend(dayExpense);\r\n  renderKhBudget(budgets, txs);\r\n  renderKhSources(sources, txs);\r\n}\r\n\r\nfunction renderKhDonut(elId, dataObj, names, palette, total) {\r\n  const el = document.getElementById(elId);\r\n  if (!el) return;\r\n  const entries = Object.keys(dataObj).filter(function(k) { return dataObj[k] > 0; })\r\n    .map(function(k) { return [k, dataObj[k]]; })\r\n    .sort(function(a, b) { return b[1] - a[1]; });\r\n  if (!entries.length || total <= 0) {\r\n    el.innerHTML = emptyBox('داده‌ای برای این ماه ثبت نشده است');\r\n    return;\r\n  }\r\n  const C = 2 * Math.PI * 40;\r\n  let cum = 0;\r\n  const segments = entries.map(function(entry, i) {\r\n    const len = entry[1] / total * C;\r\n    const seg = '<circle cx=\"60\" cy=\"60\" r=\"40\" fill=\"none\" stroke=\"' + palette[i % palette.length] +\r\n      '\" stroke-width=\"12\" stroke-linecap=\"round\" stroke-dasharray=\"' + Math.max(len - 2, 0.5) + ' ' + C +\r\n      '\" stroke-dashoffset=\"' + (-cum) + '\" transform=\"rotate(-90 60 60)\"><title>' +\r\n      (names[entry[0]] || 'سایر') + ': ' + fmt(entry[1]) + '<\/title><\/circle>';\r\n    cum += len;\r\n    return seg;\r\n  }).join('');\r\n  const legend = entries.map(function(entry, i) {\r\n    return '<div class=\"legend-row\"><i style=\"background:' + palette[i % palette.length] + '\"><\/i>' +\r\n      '<span class=\"n\">' + (names[entry[0]] || 'سایر') + '<\/span>' +\r\n      '<span class=\"p\">' + pctText(entry[1], total) + '٪<\/span>' +\r\n      '<span class=\"a\">' + khCompact(entry[1]) + '<\/span><\/div>';\r\n  }).join('');\r\n  el.innerHTML = '<div class=\"donut-wrap\"><svg viewBox=\"0 0 120 120\" class=\"donut-svg\">' +\r\n    '<circle cx=\"60\" cy=\"60\" r=\"40\" fill=\"none\" stroke=\"var(--border)\" stroke-width=\"12\"/>' +\r\n    segments +\r\n    '<text x=\"60\" y=\"58\" text-anchor=\"middle\" class=\"d-total\">' + khCompact(total) + '<\/text>' +\r\n    '<text x=\"60\" y=\"72\" text-anchor=\"middle\" class=\"d-unit\">تومان<\/text><\/svg>' +\r\n    '<div class=\"legend\">' + legend + '<\/div><\/div>';\r\n}\r\n\r\nfunction renderKhTrend(dayExpense) {\r\n  const el = document.getElementById('khTrendChart');\r\n  if (!el) return;\r\n  const today = todayJalali();\r\n  const monthDays = jalaliMonthDays(reportYear, reportMonth);\r\n  let lastDay = monthDays;\r\n  if (reportYear === today.jy && reportMonth === today.jm) lastDay = Math.min(monthDays, today.jd);\r\n  if (reportYear > today.jy || (reportYear === today.jy && reportMonth > today.jm)) lastDay = 0;\r\n\r\n  const values = [];\r\n  for (let d = 1; d <= lastDay; d++) values.push(dayExpense[d] || 0);\r\n  const total = values.reduce(function(sum, v) { return sum + v; }, 0);\r\n  if (!lastDay || total <= 0) {\r\n    el.innerHTML = emptyBox('خرجی در این ماه ثبت نشده است');\r\n    return;\r\n  }\r\n\r\n  const max = Math.max.apply(null, values.concat([1]));\r\n  const W = 360, H = 150, L = 10, R = 10, top = 14, base = 118;\r\n  const n = values.length;\r\n  const X = function(i) { return n === 1 ? W / 2 : W - R - (i / (n - 1)) * (W - L - R); };\r\n  const Y = function(v) { return base - (v / max) * (base - top); };\r\n  const pts = values.map(function(v, i) { return [X(i), Y(v)]; });\r\n  const line = pts.map(function(p, i) { return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' ');\r\n  const area = line + ' L' + X(n - 1).toFixed(1) + ' ' + base + ' L' + X(0).toFixed(1) + ' ' + base + ' Z';\r\n  const dots = values.map(function(v, i) {\r\n    return v > 0 ? '<circle cx=\"' + pts[i][0].toFixed(1) + '\" cy=\"' + pts[i][1].toFixed(1) +\r\n      '\" r=\"2.2\" fill=\"#fff\" stroke=\"#f43f5e\" stroke-width=\"1.5\"><title>روز ' + toPersianDigits(i + 1) + ': ' + fmt(v) + '<\/title><\/circle>' : '';\r\n  }).join('');\r\n  const peakIndex = values.indexOf(max);\r\n  const midIndex = Math.floor((n - 1) / 2);\r\n\r\n  el.innerHTML = '<svg viewBox=\"0 0 ' + W + ' ' + H + '\" class=\"trend-svg\">' +\r\n    '<defs><linearGradient id=\"khTrendGrad\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">' +\r\n    '<stop offset=\"0\" stop-color=\"#f43f5e\" stop-opacity=\".26\"/><stop offset=\"1\" stop-color=\"#f43f5e\" stop-opacity=\"0\"/>' +\r\n    '<\/linearGradient><\/defs>' +\r\n    '<line x1=\"0\" x2=\"' + W + '\" y1=\"' + top + '\" y2=\"' + top + '\" class=\"ct-grid\"/>' +\r\n    '<line x1=\"0\" x2=\"' + W + '\" y1=\"' + base + '\" y2=\"' + base + '\" class=\"ct-grid\"/>' +\r\n    '<path d=\"' + area + '\" fill=\"url(#khTrendGrad)\"/>' +\r\n    '<path d=\"' + line + '\" fill=\"none\" stroke=\"#f43f5e\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>' +\r\n    dots +\r\n    '<text x=\"' + (W - R) + '\" y=\"' + (base + 17) + '\" text-anchor=\"end\" class=\"cb-axis\">روز ' + toPersianDigits(n) + '<\/text>' +\r\n    '<text x=\"' + W / 2 + '\" y=\"' + (base + 17) + '\" text-anchor=\"middle\" class=\"cb-axis\">روز ' + toPersianDigits(midIndex + 1) + '<\/text>' +\r\n    '<text x=\"' + L + '\" y=\"' + (base + 17) + '\" text-anchor=\"start\" class=\"cb-axis\">روز ۱<\/text>' +\r\n    '<\/svg>' +\r\n    '<div class=\"trend-meta\"><div><small>میانگین روزانه<\/small><b>' + fmt(total / n) + ' تومان<\/b><\/div>' +\r\n    '<div><small>پرخرج‌ترین روز (روز ' + toPersianDigits(peakIndex + 1) + ')<\/small><b>' + fmt(max) + ' تومان<\/b><\/div><\/div>';\r\n}\r\n\r\nfunction renderKhBudget(budgets, txs) {\r\n  const el = document.getElementById('khBudgetContent');\r\n  if (!el) return;\r\n  const today = todayJalali();\r\n  const key = khCurrentMonthKey();\r\n  const budget = budgets[key] || { total: 0, categories: {} };\r\n  setText('khBudgetMonthLabel', jMonths[today.jm - 1] + ' ' + toPersianDigits(today.jy));\r\n\r\n  const monthExpenses = txs.filter(function(t) {\r\n    return t.type === 'expense' && sameKhMonth(t.timestamp, today.jy, today.jm);\r\n  });\r\n  const totalSpent = monthExpenses.reduce(function(sum, t) { return sum + (Number(t.amount) || 0); }, 0);\r\n\r\n  let html = '';\r\n  if (budget.total > 0) {\r\n    const pct = Math.min(100, Math.round(totalSpent / budget.total * 100));\r\n    const status = pct >= 100 ? 'danger' : pct >= 80 ? 'warning' : 'safe';\r\n    const remaining = budget.total - totalSpent;\r\n    html += '<div class=\"khb-item\">' +\r\n      '<div class=\"khb-head\"><span>بودجه کل ماه<\/span><button onclick=\"khEditBudget(\\'total\\', null)\">ویرایش<\/button><\/div>' +\r\n      '<div class=\"khb-track\"><div class=\"khb-fill ' + status + '\" style=\"width:' + pct + '%\"><\/div><\/div>' +\r\n      '<div class=\"khb-foot\"><span>خرج شده: <b>' + fmt(totalSpent) + '<\/b> از ' + fmt(budget.total) + '<\/span>' +\r\n      '<b class=\"' + status + '\">' + (remaining >= 0 ? 'باقی: ' + fmt(remaining) : 'اضافه: ' + fmt(-remaining)) + '<\/b><\/div>' +\r\n    '<\/div>';\r\n  } else {\r\n    html += '<div class=\"khb-empty\">بودجه‌ای برای این ماه تنظیم نشده.' +\r\n      '<button onclick=\"khEditBudget(\\'total\\', null)\">تعیین بودجه کل ماه<\/button><\/div>';\r\n  }\r\n\r\n  const cats = budget.categories || {};\r\n  const shownCats = Object.keys(KH_EXPENSE_CATS).filter(function(cat) {\r\n    return (cats[cat] || 0) > 0 || monthExpenses.some(function(t) { return t.category === cat; });\r\n  });\r\n  if (shownCats.length) {\r\n    html += '<div class=\"khb-sub\">بودجه دسته‌ها<\/div>';\r\n    shownCats.forEach(function(cat) {\r\n      const limit = cats[cat] || 0;\r\n      const spent = monthExpenses.filter(function(t) { return t.category === cat; })\r\n        .reduce(function(sum, t) { return sum + (Number(t.amount) || 0); }, 0);\r\n      const pct = limit > 0 ? Math.min(100, Math.round(spent / limit * 100)) : 0;\r\n      const status = limit > 0 ? (pct >= 100 ? 'danger' : pct >= 80 ? 'warning' : 'safe') : 'safe';\r\n      html += '<div class=\"khb-item\">' +\r\n        '<div class=\"khb-head\"><span>' + KH_EXPENSE_CATS[cat] + '<\/span><button onclick=\"khEditBudget(\\'category\\', \\'' + cat + '\\')\">ویرایش<\/button><\/div>' +\r\n        '<div class=\"khb-track\"><div class=\"khb-fill ' + status + '\" style=\"width:' + (limit > 0 ? pct : 0) + '%\"><\/div><\/div>' +\r\n        '<div class=\"khb-foot\"><span>' + (limit > 0 ? 'خرج شده: <b>' + fmt(spent) + '<\/b> از ' + fmt(limit) : 'خرج شده: <b>' + fmt(spent) + '<\/b> (بدون سقف)') + '<\/span>' +\r\n        (limit > 0 ? '<b class=\"' + status + '\">' + (limit - spent >= 0 ? 'باقی: ' + fmt(limit - spent) : 'اضافه: ' + fmt(spent - limit)) + '<\/b>' : '') +\r\n        '<\/div><\/div>';\r\n    });\r\n  }\r\n  el.innerHTML = html;\r\n}\r\n\r\nfunction khEditBudget(type, category) {\r\n  const budgets = khGetData().budgets;\r\n  const key = khCurrentMonthKey();\r\n  const budget = budgets[key] || { total: 0, categories: {} };\r\n  const current = type === 'total' ? (budget.total || 0) : ((budget.categories || {})[category] || 0);\r\n  const title = type === 'total' ? 'بودجه کل ماه' : 'بودجه ' + (KH_EXPENSE_CATS[category] || category);\r\n  document.getElementById('modalContainer').innerHTML =\r\n    '<div class=\"modal-overlay\" onclick=\"if(event.target===this) closeModal()\">' +\r\n      '<div class=\"modal\">' +\r\n        '<h3>🎯 ' + title + '<\/h3>' +\r\n        '<p class=\"modal-hint\">سقف بودجه را به تومان وارد کنید (۰ = حذف بودجه)<\/p>' +\r\n        '<input type=\"text\" id=\"khBudgetInput\" inputmode=\"numeric\" value=\"' + (current ? String(current) : '') + '\" placeholder=\"مثلاً 5,000,000\">' +\r\n        '<div class=\"modal-actions\">' +\r\n          '<button class=\"btn-secondary\" onclick=\"closeModal()\">انصراف<\/button>' +\r\n          '<button class=\"btn-success\" onclick=\"khSaveBudget(\\'' + type + '\\', ' + (category ? \"'\" + category + \"'\" : 'null') + ')\">ذخیره<\/button>' +\r\n        '<\/div>' +\r\n      '<\/div>' +\r\n    '<\/div>';\r\n  setTimeout(function() {\r\n    const input = document.getElementById('khBudgetInput');\r\n    if (input) { input.focus(); input.select(); }\r\n  }, 60);\r\n}\r\n\r\nfunction khSaveBudget(type, category) {\r\n  const input = document.getElementById('khBudgetInput');\r\n  if (!input) return;\r\n  const value = parseInt(String(input.value)\r\n    .replace(/[۰-۹]/g, function(d) { return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d); })\r\n    .replace(/[٠-٩]/g, function(d) { return '٠١٢٣٤٥٦٧٨٩'.indexOf(d); })\r\n    .replace(/[^\\d]/g, ''), 10) || 0;\r\n  const data = khGetData();\r\n  const key = khCurrentMonthKey();\r\n  if (!data.budgets[key]) data.budgets[key] = { total: 0, categories: {} };\r\n  if (!data.budgets[key].categories) data.budgets[key].categories = {};\r\n  if (type === 'total') data.budgets[key].total = value;\r\n  else if (category) {\r\n    if (value > 0) data.budgets[key].categories[category] = value;\r\n    else delete data.budgets[key].categories[category];\r\n  }\r\n  localStorage.setItem('khariyar_budgets', JSON.stringify(data.budgets));\r\n  closeModal();\r\n  renderKharchReports();\r\n  reloadKhFrame();\r\n  showToast('✓ بودجه به‌روزرسانی شد');\r\n}\r\n\r\nfunction renderKhSources(sources, txs) {\r\n  const el = document.getElementById('khSourcesList');\r\n  if (!el) return;\r\n  let total = 0;\r\n  sources.forEach(function(s) { total += khSourceBalance(s, txs); });\r\n  const rows = sources.map(function(s) {\r\n    const bal = khSourceBalance(s, txs);\r\n    const isCash = s.type === 'cash';\r\n    return '<div class=\"kh-source-row\">' +\r\n      '<div class=\"ks-ico ' + (isCash ? 'cash' : 'bank') + '\">' + (isCash ? '💵' : '💳') + '<\/div>' +\r\n      '<div class=\"ks-info\"><b>' + escapeHtml(s.name) + '<\/b>' +\r\n        '<small>' + (isCash ? 'نقدی' : 'کارت بانکی') + ' · موجودی اولیه: ' + fmt(s.initialBalance) + '<\/small><\/div>' +\r\n      '<div class=\"ks-bal ' + (bal >= 0 ? 'pos' : 'neg') + '\">' + fmt(bal) + '<\/div>' +\r\n    '<\/div>';\r\n  }).join('');\r\n  el.innerHTML = '<div class=\"kh-sources-total\"><span>موجودی کل منابع<\/span><b>' + fmt(total) + ' تومان<\/b><\/div>' + rows;\r\n}\r\n\r\n/* ---------- خروجی و پشتیبان خرج‌یار ---------- */\r\nfunction khDownload(content, filename, mime) {\r\n  const blob = new Blob(['\\uFEFF' + content], { type: mime || 'text/csv;charset=utf-8;' });\r\n  const url = URL.createObjectURL(blob);\r\n  const a = document.createElement('a');\r\n  a.href = url;\r\n  a.download = filename;\r\n  document.body.appendChild(a);\r\n  a.click();\r\n  document.body.removeChild(a);\r\n  URL.revokeObjectURL(url);\r\n}\r\nfunction khCsvEscape(value) {\r\n  if (value == null) return '';\r\n  const s = String(value).replace(/\"/g, '\"\"');\r\n  return /[\",\\n\\r]/.test(s) ? '\"' + s + '\"' : s;\r\n}\r\nfunction khExportCSV(scope) {\r\n  const data = khGetData();\r\n  let list = data.transactions.slice();\r\n  if (scope === 'month') {\r\n    list = list.filter(function(t) { return sameKhMonth(t.timestamp, reportYear, reportMonth); });\r\n  }\r\n  if (!list.length) { showToast('تراکنشی برای خروجی وجود ندارد'); return; }\r\n  const sourceName = function(id) {\r\n    const src = data.sources.find(function(s) { return s.id === id; });\r\n    return src ? src.name : '';\r\n  };\r\n  const headers = ['تاریخ', 'نوع', 'عنوان', 'مبلغ (تومان)', 'دسته‌بندی', 'منبع/از', 'به'];\r\n  const rows = [headers.map(khCsvEscape).join(',')];\r\n  list.forEach(function(t) {\r\n    const dateStr = new Date(t.timestamp).toLocaleString('fa-IR');\r\n    if (t.type === 'transfer') {\r\n      rows.push([dateStr, 'انتقال', t.title, t.amount, 'انتقال', sourceName(t.fromSourceId), sourceName(t.toSourceId)].map(khCsvEscape).join(','));\r\n    } else {\r\n      const cat = t.type === 'income' ? (KH_INCOME_CATS[t.category] || 'سایر') : (KH_EXPENSE_CATS[t.category] || 'سایر');\r\n      rows.push([dateStr, t.type === 'income' ? 'درآمد' : 'هزینه', t.title, t.amount, cat, sourceName(t.sourceId), ''].map(khCsvEscape).join(','));\r\n    }\r\n  });\r\n  khDownload(rows.join('\\n'), 'khariyar-' + (scope === 'month' ? reportYear + '-' + reportMonth : 'all') + '.csv');\r\n  showToast('✓ فایل CSV دانلود شد');\r\n}\r\nfunction khExportSourcesCSV() {\r\n  const data = khGetData();\r\n  const headers = ['نام منبع', 'نوع', 'موجودی اولیه (تومان)', 'موجودی فعلی (تومان)', 'تعداد تراکنش'];\r\n  const rows = [headers.map(khCsvEscape).join(',')];\r\n  data.sources.forEach(function(s) {\r\n    const count = data.transactions.filter(function(t) {\r\n      return t.sourceId === s.id || t.fromSourceId === s.id || t.toSourceId === s.id;\r\n    }).length;\r\n    rows.push([s.name, s.type === 'cash' ? 'نقدی' : 'کارت بانکی', s.initialBalance, khSourceBalance(s, data.transactions), count].map(khCsvEscape).join(','));\r\n  });\r\n  khDownload(rows.join('\\n'), 'khariyar-sources.csv');\r\n  showToast('✓ گزارش منابع دانلود شد');\r\n}\r\nfunction khExportBackup() {\r\n  const data = khGetData();\r\n  khDownload(JSON.stringify({\r\n    app: 'khariyar', version: 1, exportedAt: new Date().toISOString(),\r\n    sources: data.sources, transactions: data.transactions, budgets: data.budgets\r\n  }), 'khariyar-backup-' + Date.now() + '.json', 'application/json;charset=utf-8;');\r\n  showToast('✓ فایل پشتیبان ذخیره شد');\r\n}\r\nfunction khImportBackup(event) {\r\n  const file = event.target.files && event.target.files[0];\r\n  event.target.value = '';\r\n  if (!file) return;\r\n  const reader = new FileReader();\r\n  reader.onload = function() {\r\n    try {\r\n      const data = JSON.parse(String(reader.result).replace(/^\\uFEFF/, ''));\r\n      if (!data || !Array.isArray(data.sources) || !Array.isArray(data.transactions) || !data.sources.length) {\r\n        throw new Error('bad');\r\n      }\r\n      if (!confirm('اطلاعات فعلی خرج‌یار جایگزین می‌شود. ادامه می‌دهید؟')) return;\r\n      localStorage.setItem('khariyar_sources', JSON.stringify(data.sources));\r\n      localStorage.setItem('khariyar_transactions', JSON.stringify(data.transactions.slice().sort(function(a, b) { return b.timestamp - a.timestamp; })));\r\n      localStorage.setItem('khariyar_budgets', JSON.stringify(data.budgets && typeof data.budgets === 'object' ? data.budgets : {}));\r\n      renderTotalReport();\r\n      reloadKhFrame();\r\n      showToast('✓ اطلاعات بازیابی شد');\r\n    } catch (e) { showToast('فایل پشتیبان معتبر نیست'); }\r\n  };\r\n  reader.readAsText(file);\r\n}\r\nfunction khResetData() {\r\n  if (!confirm('همه تراکنش‌ها، منابع و بودجه‌های خرج‌یار پاک می‌شوند. این کار قابل بازگشت نیست. ادامه می‌دهید؟')) return;\r\n  localStorage.setItem('khariyar_sources', JSON.stringify([\r\n    { id: 'cash-default', name: 'نقدی', type: 'cash', initialBalance: 0 },\r\n    { id: 'bank-default', name: 'کارت بانکی', type: 'bank', initialBalance: 0 }\r\n  ]));\r\n  localStorage.setItem('khariyar_transactions', '[]');\r\n  localStorage.setItem('khariyar_budgets', '{}');\r\n  renderTotalReport();\r\n  reloadKhFrame();\r\n  showToast('اطلاعات خرج‌یار پاک شد');\r\n}\r\n\r\n/* ---------- جاسازی خرج‌یار ---------- */\r\nfunction initKhFrame() {\r\n  const frame = document.getElementById('khFrame');\r\n  if (!frame) return;\r\n  if (!frame.dataset.bound) {\r\n    frame.dataset.bound = '1';\r\n    frame.addEventListener('load', onKhFrameLoad);\r\n  }\r\n  if (!frame.dataset.loaded) {\r\n    frame.dataset.loaded = '1';\r\n    frame.srcdoc = KHARIYAR_HTML;\r\n  } else {\r\n    syncKhFrameTheme();\r\n  }\r\n}\r\nfunction onKhFrameLoad() {\r\n  syncKhFrameTheme();\r\n  showKharchPage('home');\r\n}\r\nfunction syncKhFrameTheme() {\r\n  const frame = document.getElementById('khFrame');\r\n  if (!frame) return;\r\n  try {\r\n    const doc = frame.contentDocument;\r\n    if (!doc) return;\r\n    doc.documentElement.setAttribute('data-theme', localStorage.getItem(THEME_KEY) || 'light');\r\n  } catch (e) {}\r\n}\r\nfunction reloadKhFrame() {\r\n  const frame = document.getElementById('khFrame');\r\n  if (!frame) return;\r\n  frame.dataset.loaded = '';\r\n  if (currentView === 'khariyar') initKhFrame();\r\n}\r\nfunction showKharchPage(page) {\r\n  const frame = document.getElementById('khFrame');\r\n  const tabHome = document.getElementById('khTabHome');\r\n  const tabSources = document.getElementById('khTabSources');\r\n  if (tabHome) tabHome.classList.toggle('active', page === 'home');\r\n  if (tabSources) tabSources.classList.toggle('active', page === 'sources');\r\n  try {\r\n    if (frame && frame.contentWindow && typeof frame.contentWindow.switchPage === 'function') {\r\n      frame.contentWindow.switchPage(page);\r\n      syncKhFrameTheme();\r\n    }\r\n  } catch (e) {}\r\n}\r\n\r\n/* ---------- پورتفولیو و اهداف سرمایه‌گذاری ---------- */\r\nconst PF_KEY = 'portfolio_v1';\r\nconst PF_TYPES = {\r\n  gold:     { label: 'طلا و سکه', icon: '🪙', color: '#f59e0b' },\r\n  stock:    { label: 'سهام و بورس', icon: '📈', color: '#10b981' },\r\n  crypto:   { label: 'رمزارز', icon: '₿', color: '#8b5cf6' },\r\n  fund:     { label: 'صندوق سرمایه‌گذاری', icon: '📊', color: '#4f6bff' },\r\n  deposit:  { label: 'سپرده و اوراق', icon: '🏦', color: '#06b6d4' },\r\n  property: { label: 'ملک و املاک', icon: '🏠', color: '#ef4444' },\r\n  other:    { label: 'سایر دارایی‌ها', icon: '💼', color: '#94a3b8' }\r\n};\r\nlet pfAssets = loadPortfolio();\r\n\r\nfunction loadPortfolio() {\r\n  try {\r\n    const raw = localStorage.getItem(PF_KEY);\r\n    const list = raw ? JSON.parse(raw) : [];\r\n    return Array.isArray(list) ? list : [];\r\n  } catch (e) { return []; }\r\n}\r\nfunction saveAssets() {\r\n  try { localStorage.setItem(PF_KEY, JSON.stringify(pfAssets)); }\r\n  catch (e) { alert('خطا در ذخیره‌سازی: ' + e.message); }\r\n}\r\nfunction pfSum(list, field) {\r\n  return list.reduce(function(s, a) { return s + (Number(a[field]) || 0); }, 0);\r\n}\r\nfunction pfType(t) { return PF_TYPES[t] || PF_TYPES.other; }\r\nfunction pfAmount(id) {\r\n  const el = document.getElementById(id);\r\n  if (!el) return 0;\r\n  const raw = String(el.value)\r\n    .replace(/[۰-۹]/g, function(d) { return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d); })\r\n    .replace(/[٠-٩]/g, function(d) { return '٠١٢٣٤٥٦٧٨٩'.indexOf(d); })\r\n    .replace(/[^\\d]/g, '');\r\n  return parseInt(raw, 10) || 0;\r\n}\r\nfunction pfPct(part, whole) {\r\n  if (!whole || whole <= 0) return 0;\r\n  return part / whole * 100;\r\n}\r\n\r\nfunction renderPortfolioPage() {\r\n  const hero = document.getElementById('pfHero');\r\n  if (!hero) return;\r\n  const totalValue = pfSum(pfAssets, 'value');\r\n  const totalCost = pfSum(pfAssets, 'cost');\r\n  const totalTarget = pfSum(pfAssets, 'target');\r\n  const targetCount = pfAssets.filter(function(a) { return Number(a.target) > 0; }).length;\r\n  const profit = totalValue - totalCost;\r\n  const profitPct = pfPct(profit, totalCost);\r\n  const goalPct = pfPct(totalValue, totalTarget);\r\n\r\n  let profitHtml = '<b>با ثبت بهای تمام‌شده نمایش داده می‌شود<\/b>';\r\n  if (totalCost > 0) {\r\n    const cls = profit >= 0 ? 'up' : 'down';\r\n    const sign = profit > 0 ? '+' : (profit < 0 ? '−' : '');\r\n    profitHtml = '<b class=\"' + cls + '\">' + sign + fmt(Math.abs(profit)) + ' تومان (' +\r\n      toPersianDigits(Math.abs(Math.round(profitPct))) + '٪)<\/b>';\r\n  }\r\n\r\n  hero.innerHTML =\r\n    '<div class=\"phero-top\"><span>ارزش کل پورتفولیو<\/span>' +\r\n      '<span class=\"phero-badge\">' + toPersianDigits(pfAssets.length) + ' دارایی<\/span><\/div>' +\r\n    '<div class=\"phero-value\">' + fmt(totalValue) + ' <small>تومان<\/small><\/div>' +\r\n    '<div class=\"phero-sub\"><span>سود/زیان: ' + profitHtml + '<\/span><\/div>';\r\n\r\n  const stats = document.getElementById('pfStats');\r\n  if (stats) {\r\n    const plVal = totalCost > 0\r\n      ? (profit > 0 ? '+' : (profit < 0 ? '−' : '')) + fmt(Math.abs(profit))\r\n      : '—';\r\n    stats.innerHTML =\r\n      '<div class=\"pf-stat\"><div class=\"lbl\">بهای تمام‌شده<\/div>' +\r\n        '<div class=\"val\">' + (totalCost > 0 ? fmt(totalCost) : '—') + '<\/div>' +\r\n        '<div class=\"sub\">' + (totalCost > 0 ? 'سرمایه اولیه' : 'ثبت نشده') + '<\/div><\/div>' +\r\n      '<div class=\"pf-stat ' + (totalCost > 0 ? (profit >= 0 ? 'pos' : 'neg') : '') + '\">' +\r\n        '<div class=\"lbl\">سود / زیان<\/div>' +\r\n        '<div class=\"val\">' + plVal + '<\/div>' +\r\n        '<div class=\"sub\">' + (totalCost > 0 ? toPersianDigits(Math.abs(Math.round(profitPct))) + '٪ بازدهی' : 'بهای تمام‌شده ثبت نشده') + '<\/div><\/div>' +\r\n      '<div class=\"pf-stat goal\"><div class=\"lbl\">هدف کل<\/div>' +\r\n        '<div class=\"val\">' + (totalTarget > 0 ? fmt(totalTarget) : '—') + '<\/div>' +\r\n        '<div class=\"sub\">' + (targetCount > 0 ? toPersianDigits(targetCount) + ' دارایی هدف‌دار' : 'هدفی تعیین نشده') + '<\/div><\/div>' +\r\n      '<div class=\"pf-stat goal\"><div class=\"lbl\">پیشرفت هدف<\/div>' +\r\n        '<div class=\"val\">' + (totalTarget > 0 ? toPersianDigits(Math.round(Math.min(goalPct, 100))) + '٪' : '—') + '<\/div>' +\r\n        '<div class=\"sub\">' + (totalTarget > 0 ? 'از ' + fmt(totalTarget) + ' تومان' : '—') + '<\/div><\/div>';\r\n  }\r\n\r\n  renderPfAllocation(totalValue);\r\n  renderPfGoals();\r\n  renderPfList();\r\n}\r\n\r\nfunction renderPfAllocation(totalValue) {\r\n  const el = document.getElementById('pfAllocation');\r\n  if (!el) return;\r\n  const groups = Object.keys(PF_TYPES).map(function(k) {\r\n    const list = pfAssets.filter(function(a) { return (a.type || 'other') === k; });\r\n    return {\r\n      key: k, label: PF_TYPES[k].label, icon: PF_TYPES[k].icon, color: PF_TYPES[k].color,\r\n      value: pfSum(list, 'value'), count: list.length\r\n    };\r\n  }).filter(function(g) { return g.value > 0; })\r\n    .sort(function(a, b) { return b.value - a.value; });\r\n\r\n  if (!groups.length) {\r\n    el.innerHTML = emptyBox('هنوز دارایی‌ای برای نمایش ترکیب ثبت نشده است');\r\n    return;\r\n  }\r\n  const total = groups.reduce(function(s, g) { return s + g.value; }, 0);\r\n  const C = 2 * Math.PI * 46;\r\n  let cum = 0;\r\n  const segments = groups.map(function(g) {\r\n    const len = g.value / total * C;\r\n    const seg = '<circle cx=\"60\" cy=\"60\" r=\"46\" fill=\"none\" stroke=\"' + g.color +\r\n      '\" stroke-width=\"14\" stroke-linecap=\"round\" stroke-dasharray=\"' + Math.max(len - 3, 0.5) + ' ' + C +\r\n      '\" stroke-dashoffset=\"' + (-cum) + '\" transform=\"rotate(-90 60 60)\">' +\r\n      '<title>' + g.label + ': ' + fmt(g.value) + '<\/title><\/circle>';\r\n    cum += len;\r\n    return seg;\r\n  }).join('');\r\n  const legend = groups.map(function(g) {\r\n    return '<div class=\"pf-alloc-row\"><i style=\"background:' + g.color + '\"><\/i>' +\r\n      '<span>' + g.icon + ' ' + g.label + '<\/span><b>' + fmt(g.value) + '<\/b>' +\r\n      '<small>' + pctText(g.value, total) + '٪<\/small><\/div>';\r\n  }).join('');\r\n\r\n  el.innerHTML = '<div class=\"pf-alloc-wrap\">' +\r\n    '<div class=\"pf-alloc-chart\"><svg viewBox=\"0 0 120 120\">' +\r\n      '<circle cx=\"60\" cy=\"60\" r=\"46\" fill=\"none\" stroke=\"var(--border)\" stroke-width=\"14\"/>' +\r\n      segments +\r\n      '<text x=\"60\" y=\"57\" text-anchor=\"middle\" class=\"of-total\">' + khCompact(total) + '<\/text>' +\r\n      '<text x=\"60\" y=\"71\" text-anchor=\"middle\" class=\"of-unit\">تومان<\/text><\/svg><\/div>' +\r\n    '<div class=\"pf-alloc-legend\">' + legend + '<\/div><\/div>';\r\n}\r\n\r\nfunction renderPfGoals() {\r\n  const el = document.getElementById('pfGoals');\r\n  if (!el) return;\r\n  const summary = document.getElementById('pfGoalSummary');\r\n  const goals = pfAssets.filter(function(a) { return Number(a.target) > 0; });\r\n  if (summary) summary.textContent = goals.length ? toPersianDigits(goals.length) + ' هدف فعال' : '';\r\n  if (!goals.length) {\r\n    el.innerHTML = emptyBox('برای دارایی‌های خود «هدف ارزش» تعیین کنید تا پیشرفت رسیدن به هدف اینجا نمایش داده شود');\r\n    return;\r\n  }\r\n  goals.sort(function(a, b) {\r\n    return pfPct(Number(b.value) || 0, Number(b.target) || 0) - pfPct(Number(a.value) || 0, Number(a.target) || 0);\r\n  });\r\n  el.innerHTML = goals.map(function(a) {\r\n    const t = pfType(a.type);\r\n    const value = Number(a.value) || 0;\r\n    const target = Number(a.target) || 0;\r\n    const rawPct = pfPct(value, target);\r\n    const barPct = Math.min(rawPct, 100);\r\n    const remaining = Math.max(target - value, 0);\r\n    return '<div class=\"pf-goal\">' +\r\n      '<div class=\"pf-goal-head\"><span>' + t.icon + '<\/span><b>' + escapeHtml(a.name) + '<\/b>' +\r\n        '<span>' + toPersianDigits(Math.round(rawPct)) + '٪<\/span><\/div>' +\r\n      '<div class=\"pf-goal-bar' + (rawPct >= 100 ? ' done' : '') + '\"><div style=\"width:' + barPct + '%\"><\/div><\/div>' +\r\n      '<div class=\"pf-goal-foot\"><span>' + fmt(value) + ' از ' + fmt(target) + ' تومان<\/span>' +\r\n        '<span>' + (remaining > 0 ? 'باقی‌مانده ' + fmt(remaining) + ' تومان' : '✓ هدف محقق شد') + '<\/span><\/div>' +\r\n    '<\/div>';\r\n  }).join('');\r\n}\r\n\r\nfunction renderPfList() {\r\n  const el = document.getElementById('pfList');\r\n  if (!el) return;\r\n  const countEl = document.getElementById('pfCount');\r\n  if (countEl) countEl.textContent = pfAssets.length ? toPersianDigits(pfAssets.length) + ' دارایی' : '';\r\n  if (!pfAssets.length) {\r\n    el.innerHTML = '<div class=\"pf-empty\"><div class=\"ico\">💼<\/div>' +\r\n      '<b>هنوز دارایی‌ای ثبت نکرده‌اید<\/b>' +\r\n      '<p>طلا، سهام، رمزارز، ملک یا هر سرمایه‌گذاری دیگری را اضافه کنید تا ارزش و سود آن را ببینید.<\/p>' +\r\n      '<button class=\"btn-success\" style=\"margin-top:14px;\" onclick=\"openAssetForm()\">+ افزودن دارایی<\/button><\/div>';\r\n    return;\r\n  }\r\n  const sorted = pfAssets.slice().sort(function(a, b) {\r\n    return (Number(b.value) || 0) - (Number(a.value) || 0);\r\n  });\r\n  el.innerHTML = sorted.map(function(a) {\r\n    const t = pfType(a.type);\r\n    const value = Number(a.value) || 0;\r\n    const cost = Number(a.cost) || 0;\r\n    let plHtml = '';\r\n    if (cost > 0) {\r\n      const diff = value - cost;\r\n      const cls = diff >= 0 ? 'pos' : 'neg';\r\n      const sign = diff > 0 ? '+' : (diff < 0 ? '−' : '');\r\n      plHtml = '<div class=\"p ' + cls + '\">' + sign + fmt(Math.abs(diff)) + ' (' +\r\n        toPersianDigits(Math.abs(Math.round(pfPct(diff, cost)))) + '٪)<\/div>';\r\n    }\r\n    const meta = [a.date ? faDate(a.date) : '', a.note ? escapeHtml(a.note) : '']\r\n      .filter(Boolean).join(' • ');\r\n    return '<div class=\"pf-row\">' +\r\n      '<div class=\"pf-icon\" style=\"background:' + t.color + '1a; color:' + t.color + ';\">' + t.icon + '<\/div>' +\r\n      '<div class=\"pf-row-main\"><div class=\"pf-row-name\">' + escapeHtml(a.name) + '<\/div>' +\r\n        '<div class=\"pf-row-meta\"><span class=\"pf-type-chip\" style=\"background:' + t.color + '1a; color:' + t.color + ';\">' + t.label + '<\/span>' +\r\n        (meta ? '<span>' + meta + '<\/span>' : '') + '<\/div><\/div>' +\r\n      '<div class=\"pf-row-value\"><div class=\"v\">' + fmt(value) + '<\/div>' + plHtml + '<\/div>' +\r\n      '<div class=\"pf-row-actions\">' +\r\n        '<button onclick=\"openAssetForm(\\'' + escapeJs(a.id) + '\\')\" title=\"ویرایش\">✏️<\/button>' +\r\n        '<button class=\"del\" onclick=\"deleteAsset(\\'' + escapeJs(a.id) + '\\')\" title=\"حذف\">🗑️<\/button>' +\r\n      '<\/div><\/div>';\r\n  }).join('');\r\n}\r\n\r\nfunction pfRefreshDays() {\r\n  const y = parseInt(document.getElementById('pfYear').value, 10) || 1405;\r\n  const m = parseInt(document.getElementById('pfMonth').value, 10) || 1;\r\n  const daySel = document.getElementById('pfDay');\r\n  const cur = parseInt(daySel.value, 10) || 1;\r\n  const max = jalaliMonthDays(y, m);\r\n  let opts = '';\r\n  for (let d = 1; d <= max; d++) {\r\n    opts += '<option value=\"' + d + '\"' + (d === Math.min(cur, max) ? ' selected' : '') + '>' + toPersianDigits(d) + '<\/option>';\r\n  }\r\n  daySel.innerHTML = opts;\r\n}\r\n\r\nfunction openAssetForm(id) {\r\n  const asset = id ? pfAssets.find(function(a) { return a.id === id; }) : null;\r\n  const today = todayJalali();\r\n  const parsed = asset && asset.date ? parseJalali(asset.date) : null;\r\n  const date = parsed || today;\r\n  const typeOptions = Object.keys(PF_TYPES).map(function(k) {\r\n    return '<option value=\"' + k + '\"' + (asset && (asset.type || 'other') === k ? ' selected' : '') + '>' +\r\n      PF_TYPES[k].icon + ' ' + PF_TYPES[k].label + '<\/option>';\r\n  }).join('');\r\n  const monthOptions = jMonths.map(function(m, i) {\r\n    return '<option value=\"' + (i + 1) + '\"' + (date.jm === i + 1 ? ' selected' : '') + '>' + m + '<\/option>';\r\n  }).join('');\r\n  let yearOptions = '';\r\n  for (let y = today.jy - 20; y <= today.jy + 1; y++) {\r\n    yearOptions += '<option value=\"' + y + '\"' + (date.jy === y ? ' selected' : '') + '>' + toPersianDigits(y) + '<\/option>';\r\n  }\r\n  let dayOptions = '';\r\n  const maxDays = jalaliMonthDays(date.jy, date.jm);\r\n  for (let d = 1; d <= maxDays; d++) {\r\n    dayOptions += '<option value=\"' + d + '\"' + (date.jd === d ? ' selected' : '') + '>' + toPersianDigits(d) + '<\/option>';\r\n  }\r\n\r\n  document.getElementById('modalContainer').innerHTML =\r\n    '<div class=\"modal-overlay\" onclick=\"if(event.target===this) closeModal()\">' +\r\n      '<div class=\"modal\">' +\r\n        '<h3>' + (asset ? '✏️ ویرایش دارایی' : '💼 دارایی جدید') + '<\/h3>' +\r\n        '<label>نام دارایی<\/label>' +\r\n        '<input type=\"text\" id=\"pfName\" placeholder=\"مثلاً طلای ۱۸ عیار یا سهام فولاد\" value=\"' +\r\n          escapeAttr(asset ? asset.name : '') + '\">' +\r\n        '<label>نوع دارایی<\/label>' +\r\n        '<select id=\"pfType\">' + typeOptions + '<\/select>' +\r\n        '<div class=\"pf-form-grid\">' +\r\n          '<div><label>ارزش فعلی (تومان)<\/label>' +\r\n            '<input type=\"text\" id=\"pfValue\" inputmode=\"numeric\" placeholder=\"مثلاً 50,000,000\" value=\"' +\r\n              (asset && Number(asset.value) ? Number(asset.value).toLocaleString('en-US') : '') +\r\n              '\" oninput=\"formatNumberInput(this)\"><\/div>' +\r\n          '<div><label>بهای تمام‌شده (تومان)<\/label>' +\r\n            '<input type=\"text\" id=\"pfCost\" inputmode=\"numeric\" placeholder=\"مبلغ خرید\" value=\"' +\r\n              (asset && Number(asset.cost) ? Number(asset.cost).toLocaleString('en-US') : '') +\r\n              '\" oninput=\"formatNumberInput(this)\"><\/div>' +\r\n        '<\/div>' +\r\n        '<label>هدف ارزش (اختیاری)<\/label>' +\r\n        '<input type=\"text\" id=\"pfTarget\" inputmode=\"numeric\" placeholder=\"مبلغ هدف برای این دارایی\" value=\"' +\r\n          (asset && Number(asset.target) ? Number(asset.target).toLocaleString('en-US') : '') +\r\n          '\" oninput=\"formatNumberInput(this)\">' +\r\n        '<label>تاریخ خرید<\/label>' +\r\n        '<div class=\"pf-date-row\">' +\r\n          '<select id=\"pfDay\">' + dayOptions + '<\/select>' +\r\n          '<select id=\"pfMonth\" onchange=\"pfRefreshDays()\">' + monthOptions + '<\/select>' +\r\n          '<select id=\"pfYear\" onchange=\"pfRefreshDays()\">' + yearOptions + '<\/select>' +\r\n        '<\/div>' +\r\n        '<label>یادداشت (اختیاری)<\/label>' +\r\n        '<input type=\"text\" id=\"pfNote\" placeholder=\"مثلاً خرید در صندوق طلا\" value=\"' +\r\n          escapeAttr(asset ? (asset.note || '') : '') + '\">' +\r\n        '<div class=\"pf-note\">💡 اگر «بهای تمام‌شده» را وارد کنید سود/زیان محاسبه می‌شود و با تعیین «هدف ارزش» پیشرفت هدف نمایش داده می‌شود.<\/div>' +\r\n        '<div class=\"modal-actions\">' +\r\n          '<button class=\"btn-secondary\" onclick=\"closeModal()\">انصراف<\/button>' +\r\n          '<button class=\"btn-success\" onclick=\"saveAsset(\\'' + (asset ? escapeJs(asset.id) : '') + '\\')\">💾 ذخیره<\/button>' +\r\n        '<\/div>' +\r\n      '<\/div>' +\r\n    '<\/div>';\r\n  setTimeout(function() {\r\n    const nameEl = document.getElementById('pfName');\r\n    if (nameEl) nameEl.focus();\r\n  }, 60);\r\n}\r\n\r\nfunction saveAsset(id) {\r\n  const nameEl = document.getElementById('pfName');\r\n  const name = nameEl ? nameEl.value.trim() : '';\r\n  const value = pfAmount('pfValue');\r\n  const cost = pfAmount('pfCost');\r\n  const target = pfAmount('pfTarget');\r\n  const jy = parseInt(document.getElementById('pfYear').value, 10);\r\n  const jm = parseInt(document.getElementById('pfMonth').value, 10);\r\n  const jd = parseInt(document.getElementById('pfDay').value, 10);\r\n  if (!name) { alert('نام دارایی را وارد کنید.'); return; }\r\n  if (!value || value <= 0) { alert('ارزش فعلی دارایی باید بزرگ‌تر از صفر باشد.'); return; }\r\n  if (!jy || jm < 1 || jm > 12 || jd < 1 || jd > jalaliMonthDays(jy, jm)) {\r\n    alert('تاریخ خرید معتبر نیست.');\r\n    return;\r\n  }\r\n  const typeEl = document.getElementById('pfType');\r\n  const noteEl = document.getElementById('pfNote');\r\n  const payload = {\r\n    name: name,\r\n    type: typeEl && PF_TYPES[typeEl.value] ? typeEl.value : 'other',\r\n    value: value,\r\n    cost: cost,\r\n    target: target,\r\n    date: formatJalali(jy, jm, jd),\r\n    note: noteEl ? noteEl.value.trim() : ''\r\n  };\r\n  if (id) {\r\n    const idx = pfAssets.findIndex(function(a) { return a.id === id; });\r\n    if (idx < 0) return;\r\n    payload.id = id;\r\n    pfAssets[idx] = payload;\r\n  } else {\r\n    payload.id = uid();\r\n    pfAssets.push(payload);\r\n  }\r\n  saveAssets();\r\n  closeModal();\r\n  renderPortfolioPage();\r\n  showToast(id ? '✓ دارایی به‌روزرسانی شد' : '✓ دارایی ثبت شد');\r\n}\r\n\r\nfunction deleteAsset(id) {\r\n  const asset = pfAssets.find(function(a) { return a.id === id; });\r\n  if (!asset) return;\r\n  if (!confirm('دارایی «' + asset.name + '» حذف شود؟')) return;\r\n  pfAssets = pfAssets.filter(function(a) { return a.id !== id; });\r\n  saveAssets();\r\n  renderPortfolioPage();\r\n  showToast('✓ دارایی حذف شد');\r\n}\r\n\r\n/* ---------- خلاصه سبد اقساط ---------- */\r\nfunction renderPortfolio() {\r\n  const el = document.getElementById('portfolioHero');\r\n  if (!el) return;\r\n  if (!loans.length) {\r\n    el.innerHTML = '<div class=\"portfolio-empty\"><div class=\"pe-ico\">🏦<\/div>' +\r\n      '<div><b>هنوز وامی ثبت نشده است<\/b><p>با دکمه «+» اولین وام و برنامه اقساطش را بسازید.<\/p><\/div><\/div>';\r\n    return;\r\n  }\r\n  const today = todayJalali();\r\n  let total = 0, paid = 0, remaining = 0, overdue = 0;\r\n  let paidCount = 0, totalCount = 0;\r\n  let next = null;\r\n  loans.forEach(function(loan) {\r\n    (loan.schedule || []).forEach(function(inst) {\r\n      const amount = Number(inst.amount) || 0;\r\n      totalCount++;\r\n      total += amount;\r\n      if (inst.isPaid) { paid += amount; paidCount++; }\r\n      else {\r\n        remaining += amount;\r\n        if (compareJalali(inst.date, today) < 0) overdue += amount;\r\n        else if (!next || compareJalali(inst.date, next.inst.date) < 0) next = { loan: loan, inst: inst };\r\n      }\r\n    });\r\n  });\r\n  const pct = total > 0 ? (paid / total * 100) : 0;\r\n  el.innerHTML =\r\n    '<div class=\"ph-main\">' +\r\n      '<div class=\"ph-top\"><span>کل بدهی اقساط<\/span><span class=\"ph-badge\">' + toPersianDigits(loans.length) + ' وام<\/span><\/div>' +\r\n      '<div class=\"ph-value\">' + fmt(total) + ' <small>تومان<\/small><\/div>' +\r\n      '<div class=\"ph-progress\"><div style=\"width:' + pct + '%\"><\/div><\/div>' +\r\n      '<div class=\"ph-foot\"><span>' + toPersianDigits(paidCount) + ' از ' + toPersianDigits(totalCount) + ' قسط پرداخت شده<\/span>' +\r\n        '<span>' + toPersianDigits(Math.round(pct)) + '٪<\/span><\/div>' +\r\n    '<\/div>' +\r\n    '<div class=\"ph-grid\">' +\r\n      '<div class=\"ph-stat success\"><span>پرداخت‌شده<\/span><b>' + fmt(paid) + '<\/b><\/div>' +\r\n      '<div class=\"ph-stat warning\"><span>باقی‌مانده<\/span><b>' + fmt(remaining) + '<\/b><\/div>' +\r\n      '<div class=\"ph-stat danger\"><span>معوق<\/span><b>' + fmt(overdue) + '<\/b><\/div>' +\r\n      '<div class=\"ph-stat next\"><span>قسط بعدی<\/span><b>' + (next ? faDate(next.inst.dateStr) : '—') + '<\/b>' +\r\n        '<small>' + (next ? escapeHtml(next.loan.name) : 'همه اقساط پرداخت شده') + '<\/small><\/div>' +\r\n    '<\/div>';\r\n}\r\n\r\nwindow.addEventListener('storage', function(e) {\r\n  if (!e.key) return;\r\n  if (e.key.indexOf('khariyar_') === 0) {\r\n    if (currentView === 'totalReport') renderTotalReport();\r\n  } else if (e.key === THEME_KEY) {\r\n    syncKhFrameTheme();\r\n  }\r\n});\r\n\r\nloadTheme();\r\nrenderAll();\r\nswitchView('loans');\r\n<\/script>\r\n\r\n<\/body>\r\n<\/html>",loaded:false,color:'#4f6bff'}
};
const TAB_KEY='combined_active_tab';
function syncTheme(name){
  try{
    const d=APPS[name].frame.contentDocument.documentElement.getAttribute('data-theme')||'light';
    document.documentElement.setAttribute('data-theme',d);
  }catch(e){}
}
function show(name){
  for(const k in APPS){
    const o=APPS[k], on=(k===name);
    if(on && !o.loaded){ o.frame.srcdoc=o.html; o.loaded=true; o.frame.addEventListener('load',()=>watchTheme(k)); }
    o.frame.classList.toggle('on',on);
    o.btn.classList.toggle('active',on);
  }
  document.querySelector('meta[name="theme-color"]').setAttribute('content',APPS[name].color);
  try{localStorage.setItem(TAB_KEY,name)}catch(e){}
  syncTheme(name);
}
function watchTheme(k){
  try{
    const el=APPS[k].frame.contentDocument.documentElement;
    new MutationObserver(()=>{ if(APPS[k].frame.classList.contains('on')) syncTheme(k); })
      .observe(el,{attributes:true,attributeFilter:['data-theme']});
    if(APPS[k].frame.classList.contains('on')) syncTheme(k);
  }catch(e){}
}
let last='journal';
try{ const t=localStorage.getItem(TAB_KEY); if(t&&APPS[t]) last=t; }catch(e){}
show(last);
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',(e)=>{e.preventDefault();deferredPrompt=e;document.getElementById('bInstall').style.display='flex';});
window.addEventListener('appinstalled',()=>{deferredPrompt=null;document.getElementById('bInstall').style.display='none';});
async function installApp(){
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt=null;
  document.getElementById('bInstall').style.display='none';
}
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{});});
}
