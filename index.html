  <input type=\"text\" class=\"modal-input\" id=\"habitNameInput\" placeholder=\"اسم عادت\">\n    <label class=\"modal-label\">🎨 رنگ<\/label>\n    <div class=\"color-picker-row\" id=\"habitColorPicker\"><\/div>\n    <div class=\"modal-actions\">\n      <button class=\"modal-cancel\" id=\"habitModalCancel\">انصراف<\/button>\n      <button class=\"modal-confirm\" id=\"habitModalConfirm\">ذخیره<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n\n<div class=\"modal-overlay\" id=\"listItemModalOverlay\">\n  <div class=\"modal-box\">\n    <div class=\"modal-title\" id=\"listItemModalTitle\">افزودن<\/div>\n    <input type=\"text\" class=\"modal-input\" id=\"listItemTitleInput\" placeholder=\"عنوان\">\n    <input type=\"text\" class=\"modal-input\" id=\"listItemSubInput\" placeholder=\"توضیح\">\n    <label class=\"modal-label\">📌 وضعیت<\/label>\n    <div class=\"status-picker\" id=\"statusPicker\">\n      <div class=\"status-option status-done\" data-status=\"done\">✓ انجام شد<\/div>\n      <div class=\"status-option status-progress\" data-status=\"progress\">⏳ در حال<\/div>\n      <div class=\"status-option status-wishlist\" data-status=\"wishlist\">💫 می‌خوام<\/div>\n    <\/div>\n    <div class=\"modal-actions\">\n      <button class=\"modal-cancel\" id=\"listItemModalCancel\">انصراف<\/button>\n      <button class=\"modal-confirm\" id=\"listItemModalConfirm\">ذخیره<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n\n<div class=\"shift-day-overlay\" id=\"shiftDayOverlay\">\n  <div class=\"shift-day-box\">\n    <div class=\"shift-day-title\">⏰ شیفت‌های روز<\/div>\n    <div class=\"shift-day-sub\" id=\"shiftDaySub\"><\/div>\n    <div id=\"shiftDayEditArea\"><\/div>\n    <div class=\"modal-actions\">\n      <button class=\"modal-cancel\" id=\"shiftDayCancel\">انصراف<\/button>\n      <button class=\"modal-confirm\" id=\"shiftDayConfirm\">ذخیره<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n\n<div class=\"date-picker-overlay\" id=\"datePickerOverlay\">\n  <div class=\"date-picker-box\">\n    <div class=\"date-picker-title\">📅 انتقال به کدوم تاریخ؟<\/div>\n    <div class=\"date-picker-sub\" id=\"datePickerSub\"><\/div>\n    <div class=\"date-picker-nav\">\n      <button class=\"date-nav-btn\" id=\"dpPrevMonth\">‹<\/button>\n      <div class=\"month-label\" id=\"dpMonthLabel\"><\/div>\n      <button class=\"date-nav-btn\" id=\"dpNextMonth\">›<\/button>\n    <\/div>\n    <div class=\"date-picker-weekdays\">\n      <div class=\"weekday-label\">ش<\/div>\n      <div class=\"weekday-label\">ی<\/div>\n      <div class=\"weekday-label\">د<\/div>\n      <div class=\"weekday-label\">س<\/div>\n      <div class=\"weekday-label\">چ<\/div>\n      <div class=\"weekday-label\">پ<\/div>\n      <div class=\"weekday-label\">ج<\/div>\n    <\/div>\n    <div class=\"date-picker-grid\" id=\"datePickerGrid\"><\/div>\n    <div class=\"date-picker-actions\">\n      <button class=\"dp-cancel\" id=\"datePickerCancel\">انصراف<\/button>\n      <button class=\"dp-confirm\" id=\"datePickerConfirm\">انتقال<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n\n<div class=\"toast\" id=\"toast\"><\/div>\n<div class=\"confirm-overlay\" id=\"confirmOverlay\">\n  <div class=\"confirm-box\">\n    <p id=\"confirmText\">مطمئنی؟<\/p>\n    <div class=\"confirm-actions\">\n      <button class=\"btn-cancel\" id=\"confirmCancel\">انصراف<\/button>\n      <button class=\"btn-confirm\" id=\"confirmOk\">تأیید<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n<script>\n// ==================== کلیدها ====================\nconst STORAGE_KEY = 'journal_entries_v2';\nconst WORKDAY_KEY = 'journal_workday_v1';\nconst THEME_KEY = 'journal_theme';\nconst TASK_HISTORY_KEY = 'journal_task_history_v1';\nconst GOALS_KEY = 'journal_goals_v2';\nconst JOBS_KEY = 'journal_jobs_v2';\nconst SHIFTS_KEY = 'journal_shifts_v2';\nconst HABITS_KEY = 'journal_habits_v1';\nconst HABITS_DATA_KEY = 'journal_habits_data_v1';\nconst TIMELINE_KEY = 'journal_timeline_v2';\nconst LISTS_KEY = 'journal_lists_v1';\nconst UI_STATE_KEY = 'journal_ui_state_v6';\nconst MOODS = ['😊', '😐', '😢', '😡', '😴', '🤩', '😍', '🥰'];\nconst PERSIAN_MONTHS = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];\nconst SHIFT_NAMES = { M: 'صبح', A: 'عصر', N: 'شب' };\nconst SHIFT_COLORS_DEFAULT = { M: '#ff9500', A: '#007aff', N: '#af52de' };\nconst COLOR_PALETTE = [\n  '#6C63FF', '#ff2d92', '#00c8d4', '#ff9500', '#34c759',\n  '#af52de', '#007aff', '#ff3b30', '#5dd97a', '#ff6b6b',\n  '#4da3ff', '#c77fe8', '#f0a500', '#00a0aa', '#8b5a2b',\n  '#e94c89', '#2ec4b6', '#f77f00', '#5e60ce', '#06d6a0'\n];\nconst LIST_CATEGORIES = {\n  book: { name: 'کتاب', icon: '📚', subPlaceholder: 'نویسنده' },\n  movie: { name: 'فیلم', icon: '🎬', subPlaceholder: 'کارگردان / سال' },\n  travel: { name: 'سفر', icon: '✈️', subPlaceholder: 'مقصد / تاریخ' },\n  skill: { name: 'مهارت', icon: '🎓', subPlaceholder: 'سطح' }\n};\n\nlet entries = [];\nlet workdayData = {};\nlet taskHistory = [];\nlet goals = {};\nlet jobs = [];\nlet shiftsData = {};\nlet habits = [];\nlet habitsData = {};\nlet timelineData = {};\nlet listsData = { book: [], movie: [], travel: [], skill: [] };\nlet currentView = 'all';\nlet editingId = null;\nlet selectedMood = '😐';\nlet currentWorkdayDate = null;\nlet currentTags = [];\nlet currentFilterTag = null;\nlet weekStartDate = null;\nlet selectedDayKey = null;\nlet movingTaskIndex = null;\nlet movingTaskFromDate = null;\nlet calWeekStart = null;\nlet calSelectedDay = null;\nlet dpCurrentMonth = null;\nlet dpSelectedDate = null;\nlet currentHistoryFilter = 'all';\nlet selectedMonth = null;\nlet selectedWeek = null;\nlet editingJobId = null;\nlet editingJobColor = COLOR_PALETTE[0];\nlet shiftMonth = null;\nlet editingShiftDate = null;\nlet tempShifts = {};\nlet editorDate = null;\nlet viewingEntryId = null;\nlet editingTaskTimeIndex = null;\nlet tempAlarm = false;\nlet uiState = { shiftCollapsed: false, workCollapsed: false, notesCollapsed: false, habitCollapsed: false, timelineCollapsed: false };\nlet workdayUiState = { tasks: false, successes: false, gratitudes: false, followups: false, note: false };\nlet alarmTimeouts = {};\nlet editingHabitId = null;\nlet editingHabitColor = COLOR_PALETTE[1];\nlet habitWeekStart = null;\nlet timelineDate = null;\nlet editingTimelineBlockId = null;\nlet timelineColorPickerValue = COLOR_PALETTE[0];\nlet currentListTab = 'book';\nlet editingListItemId = null;\nlet listItemStatus = 'wishlist';\nlet reviewPeriod = 'week';\nlet reviewDate = null;\nlet pendingTaskIdx = null;\n\n// ==================== توابع کمکی ====================\nfunction todayKey() {\n  const d = new Date();\n  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;\n}\nfunction dateKey(d) {\n  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;\n}\nfunction keyToDate(key) {\n  const [y, m, d] = key.split('-').map(Number);\n  return new Date(y, m - 1, d);\n}\nfunction dateKeyToPersian(key) {\n  const date = keyToDate(key);\n  return date.toLocaleDateString('fa-IR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });\n}\nfunction shortDate(key) {\n  const date = keyToDate(key);\n  const today = todayKey();\n  if (key === today) return 'امروز';\n  const yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);\n  if (key === dateKey(yesterday)) return 'دیروز';\n  const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate() + 1);\n  if (key === dateKey(tomorrow)) return 'فردا';\n  return date.toLocaleDateString('fa-IR', { month: 'short', day: 'numeric' });\n}\nfunction getDayName(ts) {\n  const d = new Date(ts);\n  const map = { 0: 'یکشنبه', 1: 'دوشنبه', 2: 'سه‌شنبه', 3: 'چهارشنبه', 4: 'پنج‌شنبه', 5: 'جمعه', 6: 'شنبه' };\n  return map[d.getDay()];\n}\nfunction getShortDayName(d) {\n  const map = { 0: 'ی', 1: 'د', 2: 'س', 3: 'چ', 4: 'پ', 5: 'ج', 6: 'ش' };\n  return map[d.getDay()];\n}\nfunction getFullPersianDate(ts) {\n  return new Date(ts).toLocaleDateString('fa-IR', { year: 'numeric', month: 'long', day: 'numeric' });\n}\nfunction getPersianYearOnly(ts) {\n  return new Date(ts).toLocaleDateString('fa-IR', { year: 'numeric' });\n}\nfunction getPersianDayNum(ts) {\n  return new Date(ts).toLocaleDateString('fa-IR', { day: 'numeric' });\n}\nfunction getTime(ts) {\n  return new Date(ts).toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });\n}\nfunction getWeekStart(date) {\n  const d = new Date(date);\n  const day = d.getDay();\n  const diff = (day === 6) ? 0 : (day + 1);\n  d.setDate(d.getDate() - diff);\n  d.setHours(0, 0, 0, 0);\n  return d;\n}\nfunction getWeekDays(startDate) {\n  const days = [];\n  for (let i = 0; i < 7; i++) {\n    const d = new Date(startDate);\n    d.setDate(d.getDate() + i);\n    days.push(d);\n  }\n  return days;\n}\nfunction getPersianFutureYear(yearsLater) {\n  const now = new Date();\n  const future = new Date(now.getFullYear() + yearsLater, now.getMonth(), now.getDate());\n  return future.toLocaleDateString('fa-IR', { year: 'numeric' });\n}\nfunction formatTimeHM(h, m) {\n  return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;\n}\nfunction timeToMinutes(h, m) { return h * 60 + m; }\nfunction addDaysToKey(key, days) {\n  const d = keyToDate(key);\n  d.setDate(d.getDate() + days);\n  return dateKey(d);\n}\nfunction escapeHtml(str) {\n  const div = document.createElement('div');\n  div.textContent = str || '';\n  return div.innerHTML;\n}\n\n// ==================== ذخیره/بازیابی ====================\nfunction loadData() {\n  try {\n    entries = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');\n    workdayData = JSON.parse(localStorage.getItem(WORKDAY_KEY) || '{}');\n    taskHistory = JSON.parse(localStorage.getItem(TASK_HISTORY_KEY) || '[]');\n    goals = JSON.parse(localStorage.getItem(GOALS_KEY) || '{}');\n    jobs = JSON.parse(localStorage.getItem(JOBS_KEY) || '[]');\n    shiftsData = JSON.parse(localStorage.getItem(SHIFTS_KEY) || '{}');\n    habits = JSON.parse(localStorage.getItem(HABITS_KEY) || '[]');\n    habitsData = JSON.parse(localStorage.getItem(HABITS_DATA_KEY) || '{}');\n    timelineData = JSON.parse(localStorage.getItem(TIMELINE_KEY) || '{}');\n    const savedLists = JSON.parse(localStorage.getItem(LISTS_KEY) || '{}');\n    listsData = { book: [], movie: [], travel: [], skill: [], ...savedLists };\n    const savedUi = JSON.parse(localStorage.getItem(UI_STATE_KEY) || '{}');\n    uiState = { shiftCollapsed: false, workCollapsed: false, notesCollapsed: false, habitCollapsed: false, timelineCollapsed: false, ...savedUi };\n    if (savedUi.workdayUiState) workdayUiState = { ...workdayUiState, ...savedUi.workdayUiState };\n  } catch (e) {\n    entries = []; workdayData = {}; taskHistory = []; goals = {}; jobs = []; shiftsData = {};\n    habits = []; habitsData = {}; timelineData = {}; listsData = { book: [], movie: [], travel: [], skill: [] };\n  }\n}\nfunction saveEntries() { localStorage.setItem(STORAGE_KEY, JSON.stringify(entries)); }\nfunction saveWorkday() { localStorage.setItem(WORKDAY_KEY, JSON.stringify(workdayData)); }\nfunction saveHistory() { localStorage.setItem(TASK_HISTORY_KEY, JSON.stringify(taskHistory)); }\nfunction saveGoals() { localStorage.setItem(GOALS_KEY, JSON.stringify(goals)); }\nfunction saveJobs() { localStorage.setItem(JOBS_KEY, JSON.stringify(jobs)); }\nfunction saveShifts() { localStorage.setItem(SHIFTS_KEY, JSON.stringify(shiftsData)); }\nfunction saveHabits() { localStorage.setItem(HABITS_KEY, JSON.stringify(habits)); }\nfunction saveHabitsData() { localStorage.setItem(HABITS_DATA_KEY, JSON.stringify(habitsData)); }\nfunction saveTimeline() { localStorage.setItem(TIMELINE_KEY, JSON.stringify(timelineData)); }\nfunction saveLists() { localStorage.setItem(LISTS_KEY, JSON.stringify(listsData)); }\nfunction saveUiState() { localStorage.setItem(UI_STATE_KEY, JSON.stringify({ ...uiState, workdayUiState })); }\n\nfunction addHistory(type, task, fromDate = null, toDate = null) {\n  taskHistory.unshift({ id: Date.now() + Math.random(), type, task, from: fromDate, to: toDate, at: Date.now() });\n  if (taskHistory.length > 500) taskHistory = taskHistory.slice(0, 500);\n  saveHistory();\n}\nfunction getJobById(id) { return jobs.find(j => j.id === id); }\nfunction getShiftJobIds(date, letter) {\n  const s = shiftsData[date];\n  if (!s) return [];\n  return Array.isArray(s[letter]) ? s[letter] : [];\n}\nfunction getHabitById(id) { return habits.find(h => h.id === id); }\nfunction isHabitDone(dateKeyValue, habitId) { return (habitsData[dateKeyValue] || []).includes(habitId); }\nfunction toggleHabit(dateKeyValue, habitId) {\n  if (!habitsData[dateKeyValue]) habitsData[dateKeyValue] = [];\n  const arr = habitsData[dateKeyValue];\n  const idx = arr.indexOf(habitId);\n  if (idx !== -1) arr.splice(idx, 1);\n  else arr.push(habitId);\n  if (arr.length === 0) delete habitsData[dateKeyValue];\n  saveHabitsData();\n}\nfunction getJobShiftRange(job, letter) {\n  if (!job.hours || !job.hours[letter]) return null;\n  const h = job.hours[letter];\n  if (h.startH === undefined || h.endH === undefined) return null;\n  const startMin = timeToMinutes(h.startH, h.startM || 0);\n  const endMin = timeToMinutes(h.endH, h.endM || 0);\n  if (startMin === endMin) return null;\n  if (endMin > startMin) return { start: startMin, end: endMin, overnight: false };\n  return { start: startMin, end: endMin + 24 * 60, overnight: true };\n}\n\n// ==================== تم ====================\nfunction loadTheme() {\n  const theme = localStorage.getItem(THEME_KEY) || 'light';\n  document.documentElement.setAttribute('data-theme', theme);\n  updateThemeUI(theme);\n}\nfunction toggleTheme() {\n  const current = document.documentElement.getAttribute('data-theme');\n  const next = current === 'dark' ? 'light' : 'dark';\n  document.documentElement.setAttribute('data-theme', next);\n  localStorage.setItem(THEME_KEY, next);\n  updateThemeUI(next);\n}\nfunction updateThemeUI(theme) {\n  const icon = theme === 'dark' ? '☀️' : '🌙';\n  const txt = theme === 'dark' ? 'حالت روشن' : 'حالت تاریک';\n  document.getElementById('themeBtn').textContent = icon;\n  document.getElementById('settingsThemeIcon').textContent = icon;\n  document.getElementById('settingsThemeLabel').textContent = txt;\n}\n\n// ==================== نوار هفتگی ====================\nfunction renderWeekStrip() {\n  if (!weekStartDate) weekStartDate = getWeekStart(new Date());\n  const days = getWeekDays(weekStartDate);\n  const container = document.getElementById('weekDays');\n  const today = todayKey();\n  container.innerHTML = days.map(d => {\n    const key = dateKey(d);\n    const isToday = key === today;\n    const isActive = key === selectedDayKey;\n    const shiftLetters = [];\n    ['M', 'A', 'N'].forEach(letter => {\n      const jobIds = getShiftJobIds(key, letter);\n      jobIds.forEach(jobId => {\n        const job = getJobById(jobId);\n        const color = job ? job.color : SHIFT_COLORS_DEFAULT[letter];\n        shiftLetters.push(`<span class=\"shift-letter\" style=\"background: ${color};\">${letter}<\/span>`);\n      });\n    });\n    return `<button class=\"week-day ${isActive ? 'active' : ''} ${isToday ? 'today' : ''}\" data-date=\"${key}\"><span class=\"day-name\">${getShortDayName(d)}<\/span><span class=\"day-num\">${getPersianDayNum(d)}<\/span>${shiftLetters.length ? `<div class=\"day-shifts\">${shiftLetters.join('')}<\/div>` : ''}<\/button>`;\n  }).join('');\n  container.querySelectorAll('.week-day').forEach(btn => btn.addEventListener('click', () => {\n    const key = btn.dataset.date;\n    if (selectedDayKey === key) selectedDayKey = null;\n    else selectedDayKey = key;\n    renderWeekStrip(); updateQuickActions(); render();\n  }));\n}\nfunction goToPrevWeek() { weekStartDate.setDate(weekStartDate.getDate() - 7); renderWeekStrip(); }\nfunction goToNextWeek() { weekStartDate.setDate(weekStartDate.getDate() + 7); renderWeekStrip(); }\nfunction updateQuickActions() {\n  const qa = document.getElementById('quickActions');\n  if (selectedDayKey) { qa.classList.add('show'); document.getElementById('quickDayLabel').textContent = '📅 ' + shortDate(selectedDayKey); }\n  else qa.classList.remove('show');\n}\nfunction setupSwipe() {\n  const main = document.getElementById('mainContent');\n  let touchStartX = 0, touchStartY = 0, touchStartTime = 0;\n  main.addEventListener('touchstart', (e) => {\n    if (!selectedDayKey) return;\n    touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY; touchStartTime = Date.now();\n  }, { passive: true });\n  main.addEventListener('touchend', (e) => {\n    if (!selectedDayKey) return;\n    const touchEndX = e.changedTouches[0].clientX;\n    const touchEndY = e.changedTouches[0].clientY;\n    const diffX = touchEndX - touchStartX;\n    const diffY = touchEndY - touchStartY;\n    const duration = Date.now() - touchStartTime;\n    if (duration > 600 || Math.abs(diffX) < 60 || Math.abs(diffY) > Math.abs(diffX)) return;\n    if (diffX > 0) { selectedDayKey = addDaysToKey(selectedDayKey, -1); main.classList.add('slide-from-left'); }\n    else { selectedDayKey = addDaysToKey(selectedDayKey, 1); main.classList.add('slide-from-right'); }\n    const newDate = keyToDate(selectedDayKey);\n    const currentWeekStart = getWeekStart(weekStartDate);\n    const newWeekStart = getWeekStart(newDate);\n    if (newWeekStart.getTime() !== currentWeekStart.getTime()) weekStartDate = newWeekStart;\n    renderWeekStrip(); updateQuickActions(); render();\n    setTimeout(() => main.classList.remove('slide-from-left', 'slide-from-right'), 350);\n  }, { passive: true });\n}\n\n// ==================== تایم‌لاین: ادغام ====================\nfunction getMergedTimelineBlocks(dateKeyValue) {\n  const rawItems = [];\n  const todayShifts = shiftsData[dateKeyValue] || {};\n  ['M', 'A', 'N'].forEach(letter => {\n    const jobIds = todayShifts[letter] || [];\n    jobIds.forEach(jobId => {\n      const job = getJobById(jobId);\n      if (!job) return;\n      const range = getJobShiftRange(job, letter);\n      if (!range) return;\n      if (!range.overnight) {\n        rawItems.push({ startMin: range.start, endMin: range.end, text: `${SHIFT_NAMES[letter]} — ${job.name}`, note: '', color: job.color || SHIFT_COLORS_DEFAULT[letter], isShift: true, letter, jobName: job.name });\n      } else {\n        rawItems.push({ startMin: range.start, endMin: 24 * 60, text: `${SHIFT_NAMES[letter]} — ${job.name} (ادامه در فردا)`, note: '', color: job.color || SHIFT_COLORS_DEFAULT[letter], isShift: true, letter, jobName: job.name, overnightPart: 1 });\n      }\n    });\n  });\n  const yesterdayKey = addDaysToKey(dateKeyValue, -1);\n  const yesterdayShifts = shiftsData[yesterdayKey] || {};\n  ['M', 'A', 'N'].forEach(letter => {\n    const jobIds = yesterdayShifts[letter] || [];\n    jobIds.forEach(jobId => {\n      const job = getJobById(jobId);\n      if (!job) return;\n      const range = getJobShiftRange(job, letter);\n      if (!range || !range.overnight) return;\n      const endMin = range.end - 24 * 60;\n      if (endMin > 0) {\n        rawItems.push({ startMin: 0, endMin: endMin, text: `${SHIFT_NAMES[letter]} — ${job.name} (ادامه از دیروز)`, note: '', color: job.color || SHIFT_COLORS_DEFAULT[letter], isShift: true, letter, jobName: job.name, overnightPart: 2 });\n      }\n    });\n  });\n  const manual = timelineData[dateKeyValue] || [];\n  manual.forEach(item => {\n    const startMin = timeToMinutes(item.startH, item.startM || 0);\n    const endMin = timeToMinutes(item.endH, item.endM || 0);\n    if (endMin <= startMin) return;\n    rawItems.push({ startMin, endMin, text: item.text, note: item.note || '', color: item.color || COLOR_PALETTE[0], isShift: false, id: item.id, fromTaskIdx: item.fromTaskIdx });\n  });\n  rawItems.sort((a, b) => a.startMin - b.startMin);\n  return rawItems;\n}\nfunction getEmptyRanges(blocks) {\n  const result = [];\n  const covered = new Array(24 * 60).fill(false);\n  blocks.forEach(b => {\n    const start = Math.max(0, b.startMin);\n    const end = Math.min(24 * 60, b.endMin);\n    for (let m = start; m < end; m++) covered[m] = true;\n  });\n  let cursor = 0;\n  while (cursor < 24 * 60) {\n    if (!covered[cursor]) {\n      let start = cursor;\n      while (cursor < 24 * 60 && !covered[cursor]) cursor++;\n      result.push({ startMin: start, endMin: cursor });\n    } else {\n      cursor++;\n    }\n  }\n  return result;\n}\n\n// ==================== تایم‌لاین: صفحه ====================\nfunction openTimelinePage(dateKeyValue = null) {\n  timelineDate = dateKeyValue || selectedDayKey || todayKey();\n  renderTimelinePage();\n  document.getElementById('timelinePage').classList.add('open');\n  document.body.style.overflow = 'hidden';\n}\nfunction closeTimelinePage() {\n  document.getElementById('timelinePage').classList.remove('open');\n  document.body.style.overflow = '';\n}\nfunction renderTimelinePage() {\n  const date = keyToDate(timelineDate);\n  document.getElementById('timelineDateLabel').textContent = date.toLocaleDateString('fa-IR', { year: 'numeric', month: 'long', day: 'numeric' });\n  document.getElementById('timelineDayName').textContent = getDayName(date);\n\n  const blocks = getMergedTimelineBlocks(timelineDate);\n  const emptyRanges = getEmptyRanges(blocks);\n  const now = new Date();\n  const nowMinutes = timeToMinutes(now.getHours(), now.getMinutes());\n  const isToday = timelineDate === todayKey();\n\n  const totalActivity = blocks.length;\n  const shiftBlocks = blocks.filter(b => b.isShift).length;\n  const manualBlocks = totalActivity - shiftBlocks;\n  let totalMinutesBusy = 0;\n  blocks.forEach(b => {\n    const duration = Math.min(b.endMin, 24*60) - Math.max(b.startMin, 0);\n    if (duration > 0) totalMinutesBusy += duration;\n  });\n  const hoursBusy = Math.round(totalMinutesBusy / 60 * 10) / 10;\n\n  document.getElementById('timelineStats').innerHTML = `\n    <div class=\"timeline-stat\"><div class=\"timeline-stat-value\">${totalActivity}<\/div><div class=\"timeline-stat-label\">بازه<\/div><\/div>\n    <div class=\"timeline-stat\"><div class=\"timeline-stat-value\">${hoursBusy}<\/div><div class=\"timeline-stat-label\">ساعت پر<\/div><\/div>\n    <div class=\"timeline-stat\"><div class=\"timeline-stat-value\">${shiftBlocks}<\/div><div class=\"timeline-stat-label\">شیفت<\/div><\/div>\n    <div class=\"timeline-stat\"><div class=\"timeline-stat-value\">${manualBlocks}<\/div><div class=\"timeline-stat-label\">دستی<\/div><\/div>\n  `;\n\n  const allItems = [];\n  blocks.forEach(b => allItems.push({ type: 'block', data: b }));\n  emptyRanges.forEach(e => allItems.push({ type: 'empty', data: e }));\n  allItems.sort((a, b) => a.data.startMin - b.data.startMin);\n\n  const container = document.getElementById('timelineHours');\n  let html = '';\n\n  allItems.forEach(item => {\n    const startH = Math.floor(item.data.startMin / 60);\n    const startM = item.data.startMin % 60;\n    const endH = Math.floor(item.data.endMin / 60);\n    const endM = item.data.endMin % 60;\n\n    if (item.type === 'empty') {\n      const isEmptyCurrent = isToday && nowMinutes >= item.data.startMin && nowMinutes < item.data.endMin;\n      html += `\n        <div class=\"timeline-empty-range\" data-add-start=\"${item.data.startMin}\" data-add-end=\"${item.data.endMin}\" style=\"${isEmptyCurrent ? 'border-color: var(--primary); background: var(--primary-soft);' : ''}\">\n          <span class=\"er-icon\">➕<\/span>\n          <span>${formatTimeHM(startH, startM)} — ${formatTimeHM(endH === 24 ? 0 : endH, endM)} (خالی)<\/span>\n        <\/div>\n      `;\n    } else {\n      const b = item.data;\n      const isCurrent = isToday && nowMinutes >= b.startMin && nowMinutes < b.endMin;\n      html += `\n        <div class=\"timeline-block has-activity ${isCurrent ? 'current' : ''}\" data-block-id=\"${b.id || ''}\" data-is-shift=\"${b.isShift}\" style=\"border-right: 4px solid ${b.color};\">\n          <div class=\"timeline-block-time\">\n            <span>${formatTimeHM(startH, startM)}<\/span>\n            <span class=\"end-time\">↓<\/span>\n            <span>${formatTimeHM(endH === 24 ? 0 : endH, endM)}<\/span>\n          <\/div>\n          <div class=\"timeline-block-body\">\n            <span class=\"timeline-block-dot\" style=\"background: ${b.color};\"><\/span>\n            <div class=\"timeline-block-activity\">\n              <div class=\"timeline-block-title\">${b.isShift ? '⏰ ' : ''}${escapeHtml(b.text)}<\/div>\n              ${b.note ? `<div class=\"timeline-block-note\">${escapeHtml(b.note)}<\/div>` : ''}\n            <\/div>\n            <div class=\"timeline-block-actions\">\n              ${!b.isShift ? `<button class=\"timeline-block-btn\" data-edit-timeline=\"${b.id}\">✏️<\/button>` : ''}\n              ${!b.isShift ? `<button class=\"timeline-block-btn\" data-delete-timeline=\"${b.id}\">✕<\/button>` : ''}\n            <\/div>\n          <\/div>\n        <\/div>\n      `;\n    }\n  });\n\n  container.innerHTML = html;\n\n  container.querySelectorAll('[data-add-start]').forEach(el => {\n    el.addEventListener('click', () => {\n      const startMin = parseInt(el.dataset.addStart);\n      const endMin = parseInt(el.dataset.addEnd);\n      openTimelineAdd(startMin, endMin);\n    });\n  });\n  container.querySelectorAll('[data-edit-timeline]').forEach(btn => {\n    btn.addEventListener('click', (e) => { e.stopPropagation(); openTimelineEdit(btn.dataset.editTimeline); });\n  });\n  container.querySelectorAll('[data-delete-timeline]').forEach(btn => {\n    btn.addEventListener('click', (e) => {\n      e.stopPropagation();\n      const id = btn.dataset.deleteTimeline;\n      showConfirm('این بازه حذف بشه؟', () => {\n        timelineData[timelineDate] = (timelineData[timelineDate] || []).filter(x => String(x.id) !== String(id));\n        if (timelineData[timelineDate].length === 0) delete timelineData[timelineDate];\n        saveTimeline(); renderTimelinePage();\n        showToast('حذف شد 🗑');\n      });\n    });\n  });\n}\n\nfunction openTimelineAdd(startMin = null, endMin = null, prefillText = '') {\n  pendingTaskIdx = null;\n  const start = startMin !== null ? startMin : timeToMinutes(9, 0);\n  const end = endMin !== null ? endMin : start + 60;\n  const sh = Math.floor(start / 60); const sm = start % 60;\n  const eh = Math.floor(end / 60); const em = end % 60;\n  document.getElementById('timelineAddTitle').textContent = '📍 افزودن به تایم‌لاین';\n  document.getElementById('timelineAddSub').textContent = dateKeyToPersian(timelineDate);\n  document.getElementById('timelineActivityAddInput').value = prefillText || '';\n  document.getElementById('timelineStartHour').value = sh;\n  document.getElementById('timelineStartMinute').value = sm;\n  document.getElementById('timelineEndHour').value = eh === 24 ? 23 : eh;\n  document.getElementById('timelineEndMinute').value = eh === 24 ? 59 : em;\n  document.getElementById('timelineNoteInput').value = '';\n  timelineColorPickerValue = COLOR_PALETTE[0];\n  renderTimelineAddColorPicker();\n  document.getElementById('timelineAddOverlay').classList.add('show');\n}\nfunction closeTimelineAdd() {\n  document.getElementById('timelineAddOverlay').classList.remove('show');\n  pendingTaskIdx = null;\n}\nfunction renderTimelineAddColorPicker() {\n  const container = document.getElementById('timelineAddColorPicker');\n  container.innerHTML = COLOR_PALETTE.map(c => `<div class=\"color-swatch ${c === timelineColorPickerValue ? 'selected' : ''}\" style=\"background: ${c};\" data-color=\"${c}\"><\/div>`).join('');\n  container.querySelectorAll('.color-swatch').forEach(el => el.addEventListener('click', () => { timelineColorPickerValue = el.dataset.color; renderTimelineAddColorPicker(); }));\n}\nfunction saveTimelineAdd() {\n  const sh = parseInt(document.getElementById('timelineStartHour').value);\n  const sm = parseInt(document.getElementById('timelineStartMinute').value) || 0;\n  const eh = parseInt(document.getElementById('timelineEndHour').value);\n  const em = parseInt(document.getElementById('timelineEndMinute').value) || 0;\n  const note = document.getElementById('timelineNoteInput').value.trim();\n  const activityText = document.getElementById('timelineActivityAddInput').value.trim();\n  \n  if (isNaN(sh) || isNaN(eh)) { showToast('ساعت‌ها رو پر کن'); return; }\n  if (sh < 0 || sh > 23 || eh < 0 || eh > 23 || sm < 0 || sm > 59 || em < 0 || em > 59) { showToast('مقادیر نامعتبر'); return; }\n  const startMin = timeToMinutes(sh, sm);\n  const endMin = timeToMinutes(eh, em);\n  if (endMin <= startMin) { showToast('ساعت پایان باید بعد از شروع باشه'); return; }\n\n  if (!timelineData[timelineDate]) timelineData[timelineDate] = [];\n  const item = {\n    id: 'tl_' + Date.now(),\n    startH: sh, startM: sm, endH: eh, endM: em,\n    text: activityText || 'فعالیت',\n    note: note,\n    color: timelineColorPickerValue\n  };\n\n  if (pendingTaskIdx !== null && currentWorkdayDate) {\n    const taskText = document.getElementById(`task${pendingTaskIdx + 1}`).value.trim();\n    if (taskText) {\n      item.text = taskText;\n      item.fromTaskIdx = pendingTaskIdx;\n    }\n  }\n\n  timelineData[timelineDate].push(item);\n  saveTimeline(); closeTimelineAdd(); renderTimelinePage();\n  if (currentWorkdayDate) updateTaskTimelineIndicators();\n  render();\n  showToast('ثبت شد ✓');\n}\n\nfunction openTimelineEdit(id) {\n  const list = timelineData[timelineDate] || [];\n  const item = list.find(x => String(x.id) === String(id));\n  if (!item) { showToast('پیدا نشد'); return; }\n  editingTimelineBlockId = id;\n  document.getElementById('timelineActivityInput').value = item.text || '';\n  document.getElementById('timelineNoteEditInput').value = item.note || '';\n  document.getElementById('timelineEditStartHour').value = item.startH;\n  document.getElementById('timelineEditStartMinute').value = item.startM || 0;\n  document.getElementById('timelineEditEndHour').value = item.endH;\n  document.getElementById('timelineEditEndMinute').value = item.endM || 0;\n  timelineColorPickerValue = item.color || COLOR_PALETTE[0];\n  renderTimelineColorPicker();\n  document.getElementById('timelineEditOverlay').classList.add('show');\n}\nfunction closeTimelineEdit() {\n  document.getElementById('timelineEditOverlay').classList.remove('show');\n  editingTimelineBlockId = null;\n}\nfunction renderTimelineColorPicker() {\n  const container = document.getElementById('timelineColorPicker');\n  container.innerHTML = COLOR_PALETTE.map(c => `<div class=\"color-swatch ${c === timelineColorPickerValue ? 'selected' : ''}\" style=\"background: ${c};\" data-color=\"${c}\"><\/div>`).join('');\n  container.querySelectorAll('.color-swatch').forEach(el => el.addEventListener('click', () => { timelineColorPickerValue = el.dataset.color; renderTimelineColorPicker(); }));\n}\nfunction saveTimelineEdit() {\n  if (!editingTimelineBlockId) return;\n  const text = document.getElementById('timelineActivityInput').value.trim();\n  if (!text) { showToast('متن رو بنویس'); return; }\n  const note = document.getElementById('timelineNoteEditInput').value.trim();\n  const sh = parseInt(document.getElementById('timelineEditStartHour').value);\n  const sm = parseInt(document.getElementById('timelineEditStartMinute').value) || 0;\n  const eh = parseInt(document.getElementById('timelineEditEndHour').value);\n  const em = parseInt(document.getElementById('timelineEditEndMinute').value) || 0;\n  if (isNaN(sh) || isNaN(eh)) { showToast('ساعت‌ها رو پر کن'); return; }\n  const startMin = timeToMinutes(sh, sm);\n  const endMin = timeToMinutes(eh, em);\n  if (endMin <= startMin) { showToast('ساعت پایان باید بعد از شروع باشه'); return; }\n  const list = timelineData[timelineDate] || [];\n  const idx = list.findIndex(x => String(x.id) === String(editingTimelineBlockId));\n  if (idx === -1) return;\n  list[idx] = { ...list[idx], text, note, startH: sh, startM: sm, endH: eh, endM: em, color: timelineColorPickerValue };\n  saveTimeline(); closeTimelineEdit(); renderTimelinePage();\n  if (currentWorkdayDate) updateTaskTimelineIndicators();\n  render();\n  showToast('ویرایش شد ✓');\n}\nfunction deleteTimelineBlock() {\n  if (!editingTimelineBlockId) return;\n  showConfirm('این بازه حذف بشه؟', () => {\n    timelineData[timelineDate] = (timelineData[timelineDate] || []).filter(x => String(x.id) !== String(editingTimelineBlockId));\n    if (timelineData[timelineDate].length === 0) delete timelineData[timelineDate];\n    saveTimeline(); closeTimelineEdit(); renderTimelinePage();\n    if (currentWorkdayDate) updateTaskTimelineIndicators();\n    render();\n    showToast('حذف شد 🗑');\n  });\n}\n\n// ==================== افزودن تسک به تایم‌لاین ====================\nfunction openTimelineFromTask(taskIdx) {\n  if (!currentWorkdayDate) { showToast('اول برنامه روز کاری رو باز کن'); return; }\n  const taskText = document.getElementById(`task${taskIdx + 1}`).value.trim();\n  if (!taskText) { showToast('اول یه کاری بنویس'); return; }\n  const existing = (timelineData[currentWorkdayDate] || []).find(x => x.fromTaskIdx === taskIdx);\n  if (existing) {\n    timelineDate = currentWorkdayDate;\n    openTimelineEdit(existing.id);\n    return;\n  }\n  pendingTaskIdx = taskIdx;\n  const sh = 9 + taskIdx * 2;\n  const start = timeToMinutes(Math.min(sh, 22), 0);\n  const end = start + 60;\n  document.getElementById('timelineAddTitle').textContent = '📍 افزودن تسک به تایم‌لاین';\n  document.getElementById('timelineAddSub').textContent = taskText;\n  document.getElementById('timelineActivityAddInput').value = taskText;\n  document.getElementById('timelineStartHour').value = Math.floor(start / 60);\n  document.getElementById('timelineStartMinute').value = 0;\n  document.getElementById('timelineEndHour').value = Math.floor(end / 60);\n  document.getElementById('timelineEndMinute').value = 0;\n  document.getElementById('timelineNoteInput').value = '';\n  timelineColorPickerValue = COLOR_PALETTE[taskIdx % COLOR_PALETTE.length];\n  renderTimelineAddColorPicker();\n  document.getElementById('timelineAddOverlay').classList.add('show');\n}\n\n// ==================== بررسی عملکرد ====================\nfunction openReviewPage() {\n  if (!reviewDate) reviewDate = new Date();\n  renderReviewPage();\n  document.getElementById('reviewPage').classList.add('open');\n  document.body.style.overflow = 'hidden';\n}\nfunction closeReviewPage() {\n  document.getElementById('reviewPage').classList.remove('open');\n  document.body.style.overflow = '';\n}\nfunction getReviewRange() {\n  const ref = new Date(reviewDate);\n  if (reviewPeriod === 'week') {\n    const start = getWeekStart(ref);\n    const days = getWeekDays(start);\n    const end = new Date(days[6]); end.setHours(23, 59, 59, 999);\n    return { start, end, days, label: `${start.toLocaleDateString('fa-IR', { month: 'long', day: 'numeric' })} تا ${days[6].toLocaleDateString('fa-IR', { month: 'long', day: 'numeric' })}` };\n  } else {\n    const end = new Date(ref); end.setHours(23, 59, 59, 999);\n    const start = new Date(ref); start.setDate(start.getDate() - 29); start.setHours(0, 0, 0, 0);\n    return { start, end, days: null, label: ref.toLocaleDateString('fa-IR', { year: 'numeric', month: 'long' }) };\n  }\n}\nfunction isInRange(dateKeyValue, start, end) {\n  const d = keyToDate(dateKeyValue);\n  return d >= start && d <= end;\n}\nfunction countFilled(data) {\n  if (!data) return 0;\n  let n = 0;\n  ['tasks', 'successes', 'gratitudes', 'followups'].forEach(k => { (data[k] || []).forEach(v => { if (v && v.trim()) n++; }); });\n  if (data.note && data.note.trim()) n++;\n  return n;\n}\nfunction renderReviewPage() {\n  document.querySelectorAll('.review-tab').forEach(tab => tab.classList.toggle('active', tab.dataset.period === reviewPeriod));\n  const range = getReviewRange();\n  document.getElementById('reviewPeriodLabel').textContent = range.label;\n\n  let totalNotes = 0, totalTasksDone = 0, totalTasksTotal = 0, totalHabitsDone = 0, totalShifts = 0, totalTimelineActivity = 0, totalWorkdayFilled = 0;\n  const dayStats = [];\n  const daysArray = reviewPeriod === 'week' ? range.days : [];\n  if (reviewPeriod === 'month') {\n    for (let i = 0; i < 30; i++) {\n      const d = new Date(range.start);\n      d.setDate(d.getDate() + i);\n      daysArray.push(d);\n    }\n  }\n  daysArray.forEach(d => {\n    const key = dateKey(d);\n    if (!isInRange(key, range.start, range.end)) return;\n    const dayNotes = entries.filter(e => dateKey(new Date(e.createdAt)) === key).length;\n    const dayWorkday = workdayData[key] || {};\n    const dayTasksDone = (dayWorkday.tasksDone || []).filter(Boolean).length;\n    const dayTasksTotal = (dayWorkday.tasks || []).filter(t => t && t.trim()).length;\n    const dayHabits = (habitsData[key] || []).length;\n    const dayShifts = ['M','A','N'].reduce((sum, l) => sum + (getShiftJobIds(key, l).length), 0);\n    const dayTimeline = (timelineData[key] || []).length;\n    totalNotes += dayNotes;\n    totalTasksDone += dayTasksDone;\n    totalTasksTotal += dayTasksTotal;\n    totalHabitsDone += dayHabits;\n    totalShifts += dayShifts;\n    totalTimelineActivity += dayTimeline;\n    totalWorkdayFilled += countFilled(dayWorkday);\n    dayStats.push({ key, day: getPersianDayNum(d), shortDay: getShortDayName(d), notes: dayNotes, tasks: dayTasksDone, habits: dayHabits });\n  });\n\n  const cardsHtml = `\n    <div class=\"review-cards\">\n      <div class=\"review-card notes\"><div class=\"rc-icon\">✍️<\/div><div class=\"rc-value\">${totalNotes}<\/div><div class=\"rc-label\">نوشته<\/div><\/div>\n      <div class=\"review-card tasks\"><div class=\"rc-icon\">✅<\/div><div class=\"rc-value\">${totalTasksDone}${totalTasksTotal > 0 ? '/' + totalTasksTotal : ''}<\/div><div class=\"rc-label\">تسک<\/div><\/div>\n      <div class=\"review-card habits\"><div class=\"rc-icon\">🎯<\/div><div class=\"rc-value\">${totalHabitsDone}<\/div><div class=\"rc-label\">عادت n}\nfunction renderStatusPicker() { document.querySelectorAll('.status-option').forEach(opt => opt.classList.toggle('selected', opt.dataset.status === listItemStatus)); }\nfunction closeListItemModal() { document.getElementById('listItemModalOverlay').classList.remove('show'); editingListItemId = null; }\nfunction saveListItem() {\n  const title = document.getElementById('listItemTitleInput').value.trim();\n  const sub = document.getElementById('listItemSubInput').value.trim();\n  if (!title) { showToast('عنوان رو بنویس'); return; }\n  if (!listsData[currentListTab]) listsData[currentListTab] = [];\n  if (editingListItemId) {\n    const idx = listsData[currentListTab].findIndex(i => i.id === editingListItemId);\n    if (idx !== -1) listsData[currentListTab][idx] = { ...listsData[currentListTab][idx], title, sub, status: listItemStatus };\n  } else {\n    listsData[currentListTab].push({ id: 'item_' + Date.now(), title, sub, status: listItemStatus, createdAt: Date.now() });\n  }\n  saveLists(); closeListItemModal(); renderListsPage();\n  showToast('ذخیره شد ✓');\n}\nfunction deleteListItem(itemId) {\n  const item = (listsData[currentListTab] || []).find(i => i.id === itemId);\n  if (!item) return;\n  showConfirm(`«${item.title}» حذف بشه؟`, () => {\n    listsData[currentListTab] = listsData[currentListTab].filter(i => i.id !== itemId);\n    saveLists(); renderListsPage();\n    showToast('حذف شد 🗑');\n  });\n}\n\n// ==================== تقویم ====================\nfunction openCalendarPage() { calWeekStart = getWeekStart(new Date()); calSelectedDay = todayKey(); renderCalendarPage(); document.getElementById('calendarPage').classList.add('open'); document.body.style.overflow = 'hidden'; }\nfunction closeCalendarPage() { document.getElementById('calendarPage').classList.remove('open'); document.body.style.overflow = ''; }\nfunction renderCalendarPage() {\n  const days = getWeekDays(calWeekStart);\n  const today = todayKey();\n  const weekStartPersian = calWeekStart.toLoc font-weight: 700; color: var(--primary);\">${dayHabits.length}<\/span><\/div><div style=\"display: flex; align-items: center; gap: 10px; padding: 8px 0; font-size: 13px; color: var(--text-soft);\"><span>🕐<\/span><span>بازه‌های تایم‌لاین<\/span><span style=\"margin-right: auto; font-weight: 700; color: var(--primary);\">${dayTimeline.length}<\/span><\/div><\/div>`;\n}\n\n// ==================== رندر اصلی ====================\nfunction getFilteredEntries() {\n  const now = new Date();\n  if (selectedDayKey) return entries.filter(e => dateKey(new Date(e.createdAt)) === selectedDayKey);\n  if (currentView === 'today') {\n    return entries.filter(e => {\n      const d = new Date(e.createdAt);\n      return d.getDate() === now.getDate() && d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();\n    });\n  }\n  return entries;\n}\nfunction getAllTags() {\n  const tagCount = {};\n  entries.forEach(e => { (e.tags || []).forEach(t => { tagCount[t] = (tagCount[t] || 0) + 1; }); });\n  return tagCount;\n}\nfunction renderEntryCard(e, showActions = true) {\n  const tags = e.tags || [];\n  const tagsHtml = tags.length ? `<div class=\"card-tags\">${tags.map(t => `<span class=\"card-tag\" data-tag=\"${escapeHtml(t)}\">${escapeHtml(t)}<\/span>`).join('')}<\/div>` : '';\n  const actionsHtml = showActions ? `<div style=\"display: flex; gap: 6px; flex-shrink: 0;\"><button style=\"width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--glass-border); background: var(--glass-bg-strong); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 15px; color: var(--text-soft); padding: 0; font-family: inherit;\" data-action=\"delete\" data-id=\"${e.id}\">🗑<\/button><\/div>` : '';\n  return `<div class=\"card\" data-id=\"${e.id}\"><div class=\"card-header\"><span class=\"card-mood\">${e.mood}<\/span><span class=\"card-title\">${escapeHtml(e.title || 'بدون عنوان')}<\/span>${actionsHtml}<\/div><div class=\"card-content\">${esca }\" data-date=\"${k}\">${shortDate(k)}<\/button>`).join('');\n  container.querySelectorAll('.history-chip').forEach(chip => chip.addEventListener('click', () => { saveCurrentWorkday(true); openWorkday(chip.dataset.date); }));\n}\nfunction updateCheckbox(index, checked) {\n  const cb = document.getElementById(`check${index + 1}`);\n  const input = document.getElementById(`task${index + 1}`);\n  const wasChecked = cb.classList.contains('checked');\n  if (checked) { cb.classList.add('checked'); input.classList.add('done'); }\n  else { cb.classList.remove('checked'); input.classList.remove('done'); }\n  if (checked && !wasChecked) { const taskText = input.value.trim(); if (taskText && currentWorkdayDate) addHistory('complete', taskText, currentWorkdayDate, null); }\n}\nfunction closeWorkday() { document.getElementById('workday').classList.remove('open'); document.body.style.overflow = ''; currentWorkdayDate = null; }\nfunction saveCurrentWorkday(silent = false) {\n  if (!currentWorkdayDate) return;\n  const existing = workdayData[currentWorkdayDate] || {};\n  const data = {\n    tasks: [document.getElementById('task1').value.trim(), document.getElementById('task2').value.trim(), document.getElementById('task3').value.trim()],\n    tasksDone: [document.getElementById('check1').classList.contains('checked'), document.getElementById('check2').classList.contains('checked'), document.getElementById('check3').classList.contains('checked')],\n    tasksTime: existing.tasksTime || [{}, {}, {}],\n    successes: [document.getElementById('success1').value.trim(), document.getElementById('success2').value.trim(), document.getElementById('success3').value.trim()],\n    gratitudes: [document.getElementById('gratitude1').value.trim(), document.getElementById('gratitude2').value.trim(), document.getElementById('gratitude3').value.trim()],\n    followups: [document.getElementById('follow1').value.trim(), document.getElementById('follow2').value.trim(), document.getElementById('follow3').value.trim()],\n    note: document.getElementById('workdayNote').value.trim(),\n    updatedAt: Date.now()\n  };\n  workdayData[currentWorkdayDate] = data;\n  saveWorkday();\n  updateWorkdaySectionCounts();\n  if (!silent) showToast('برنامه ذخیره شد 💼');\n}\nfunction saveWorkdayAndClose() { saveCurrentWorkday(); closeWorkday(); render(); renderWeekStrip(); }\nfunction openTimePicker(taskIndex) {\n  editingTaskTimeIndex = taskIndex;\n  const data = workdayData[currentWorkdayDate] || {};\n  const tasksTime = data.tasksTime || [{}, {}, {}];\n  const timeInfo = tasksTime[taskIndex] || {};\n  document.getElementById('timePickerSub').textContent = `کار ${['اول','دوم','سوم'][taskIndex]}`;\n  document.getElementById('timeHour').value = timeInfo.hour !== undefined ? timeInfo.hour : '';\n  document.getElementById('timeMinute').value = timeInfo.minute !== undefined ? timeInfo.minute : '';\n  tempAlarm = timeInfo.alarm || false;\n  updateAlarmToggleUI();\n  document.getElementById('timePickerOverlay').classList.add('show');\n}\nfunction closeTimePicker() { document.getElementById('timePickerOverlay').classList.remove('show'); editingTaskTimeIndex = null; }\nfunction updateAlarmToggleUI() { const toggle = document.getElementById('alarmToggle'); if (tempAlarm) toggle.classList.add('on'); else toggle.classList.remove('on'); }\nfunction saveTaskTime() {\n  if (editingTaskTimeIndex === null) return;\n  const h = document.getElementById('timeHour').value;\n  const m = document.getElementById('timeMinute').value;\n  if (h === '' || m === '') { showToast('ساعت و دقیقه رو وارد کن'); return; }\n  const hour = parseInt(h); const minute = parseInt(m);\n  if (hour < 0 || hour > 23 || minute < 0 || minute > 59) { showToast('ساعت 0-23 و دقیقه 0-59'); return; }\n  const data = workdayData[currentWorkdayDate] || {};\n  const tasksTime = data.tasksTime ? [...data.tasksTime] : [{}, {}, {}];\n  tasksTime[editingTaskTimeIndex] = { hour, minute, alarm: tempAlarm };\n  data.tasksTime = tasksTime;\n  workdayData[currentWorkdayDate] = data;\n  saveWorkday(); closeTimePicker(); renderTaskTimeBadges();\n  if (tempAlarm) scheduleAlarm(currentWorkdayDate, editingTaskTimeIndex, hour, minute);\n  showToast('زمان ذخیره شد ⏰');\n}\nfunction clearTaskTime() {\n  if (editingTaskTimeIndex === null) return;\n  const data = workdayData[currentWorkdayDate] || {};\n  const tasksTime = data.tasksTime ? [...data.tasksTime] : [{}, {}, {}];\n  tasksTime[editingTaskTimeIndex] = {};\n  data.tasksTime = tasksTime;\n  workdayData[currentWorkdayDate] = data;\n  saveWorkday(); closeTimePicker(); renderTaskTimeBadges();\n  showToast('زمان حذف شد');\n}\nfunction scheduleAlarm(dateKeyValue, taskIndex, hour, minute) {\n  const alarmId = `${dateKeyValue}_${taskIndex}`;\n  if (alarmTimeouts[alarmId]) { clearTimeout(alarmTimeouts[alarmId]); delete alarmTimeouts[alarmId]; }\n  if (dateKeyValue !== todayKey()) return;\n  const now = new Date();\n  const target = new Date();\n  target.setHours(hour, minute, 0, 0);\n  const diff = target.getTime() - now.getTime();\n  if (diff <= 0 || diff > 24 * 60 * 60 * 1000) return;\n  alarmTimeouts[alarmId] = setTimeout(() => {\n    const data = workdayData[dateKeyValue] || {};\n    const taskText = (data.tasks || [])[taskIndex] || 'کار';\n    notifyAlarm(taskText);\n  }, diff);\n}\n\n// ==================== ⭐ نوتیفیکیشن واقعی ====================\nfunction notifyAlarm(taskText) {\n  // ۱) نوتیفیکیشن سیستمی\n  if ('Notification' in window && Notification.permission === 'granted') {\n    try {\n      const notif = new Notification('⏰ وقت کاره!', {\n        body: taskText,\n        icon: 'icon-192.png',\n        badge: 'icon-192.png',\n        tag: 'journal-alarm-' + Date.now(),\n        requireInteraction: true,\n        vibrate: [300, 100, 300, 100, 300],\n        silent: false\n      });\n      notif.onclick = () => { window.focus(); notif.close(); };\n      setTimeout(() => notif.close(), 60000);\n    } catch (e) { console.warn('Notification error:', e); }\n  }\n\n  // ۲) نوتیفیکیشن درون‌برنامه‌ای\n  showInAppNotification('⏰ وقت کاره!', taskText);\n\n  // ۳) لرزش گوشی\n  if (navigator.vibrate) {\n    try { navigator.vibrate([300, 100, 300, 100, 300]); } catch (e) {}\n  }\n\n  // ۴) صدای آلارم\n  playAlarmSound();\n}\n\nfunction showInAppNotification(title, body) {\n  const existing = document.querySelector('.in-app-notification');\n  if (existing) existing.remove();\n\n  const notif = document.createElement('div');\n  notif.className = 'in-app-notification urgent';\n  notif.innerHTML = `\n    <span class=\"nin-icon\">🔔<\/span>\n    <div class=\"nin-content\">\n      <div class=\"nin-title\">${escapeHtml(title)}<\/div>\n      <div class=\"nin-body\">${escapeHtml(body)}<\/div>\n    <\/div>\n    <button class=\"nin-close\" aria-label=\"بستن\">✕<\/button>\n  `;\n  document.body.appendChild(notif);\n\n  const removeNotif = () => {\n    notif.style.animation = 'notifSlideIn 0.3s reverse';\n    setTimeout(() => notif.remove(), 300);\n  };\n\n  notif.querySelector('.nin-close').addEventListener('click', (e) => {\n    e.stopPropagation(); removeNotif();\n  });\n  notif.addEventListener('click', removeNotif);\n  setTimeout(removeNotif, 15000);\n}\n\nfunction playAlarmSound() {\n  try {\n    const ctx = new (window.AudioContext || window.webkitAudioContext)();\n    const playBeep = (startTime, duration, freq) => {\n      const osc = ctx.createOscillator();\n      const gain = ctx.createGain();\n      osc.connect(gain);\n      gain.connect(ctx.destination);\n      osc.type = 'sine';\n      osc.frequency.setValueAtTime(freq, startTime);\n      gain.gain.setValueAtTime(0, startTime);\n      gain.gain.linearRampToValueAtTime(0.4, startTime + 0.02);\n      gain.gain.exponentialRampToValueAtTime(0.01, startTime + duration);\n      osc.start(startTime);\n      osc.stop(startTime + duration);\n    };\n    const now = ctx.currentTime;\n    for (let i = 0; i < 4; i++) {\n      playBeep(now + i * 0.6, 0.4, 880);\n      playBeep(now + i * 0.6 + 0.2, 0.3, 1100);\n    }\n  } catch (e) { console.warn('Audio error:', e); }\n}\n\nfunction requestNotificationPermission() {\n  if (!('Notification' in window)) return;\n  if (Notification.permission === 'default') {\n    const asked = localStorage.getItem('journal_notif_asked');\n    if (!asked) {\n      setTimeout(() => {\n        Notification.requestPermission().then(perm => {\n          localStorage.setItem('journal_notif_asked', '1');\n          console.log('Notification permission:', perm);\n        });\n      }, 5000);\n    }\n  }\n}\n\n// ==================== ادامه برنامه روز کاری ====================\nfunction checkAllAlarms() {\n  const today = todayKey();\n  const data = workdayData[today];\n  if (!data) return;\n  const tasksTime = data.tasksTime || [];\n  tasksTime.forEach((timeInfo, i) => { if (timeInfo && timeInfo.hour !== undefined && timeInfo.alarm) scheduleAlarm(today, i, timeInfo.hour, timeInfo.minute); });\n}\nfunction getOverdueTasks() {\n  const today = todayKey();\n  const overdue = [];\n  Object.keys(workdayData).forEach(dateKeyValue => {\n    if (dateKeyValue >= today) return;\n    const data = workdayData[dateKeyValue];\n    const tasks = data.tasks || [];\n    const tasksDone = data.tasksDone || [];\n    tasks.forEach((task, idx) => { if (task && task.trim() && !tasksDone[idx]) overdue.push({ fromDate: dateKeyValue, task, taskIndex: idx }); });\n  });\n  overdue.sort((a, b) => a.fromDate.localeCompare(b.fromDate));\n  return overdue;\n}\nfunction renderOverdueSection() {\n  const container = document.getElementById('overdueSection');\n  if (!container) return;\n  const overdue = getOverdueTasks();\n  const relevantOverdue = overdue.filter(o => o.fromDate !== currentWorkdayDate);\n  if (relevantOverdue.length === 0) { container.style.display = 'none'; return; }\n  container.style.display = 'block';\n  container.innerHTML = `<div class=\"overdue-title\"><span>⚠️<\/span><span>تسک‌های معوق<\/span><span class=\"overdue-count\">${relevantOverdue.length}<\/span><\/div>${relevantOverdue.map(o => `<div class=\"overdue-item\"><div class=\"overdue-item-text\">${escapeHtml(o.task)}<span class=\"overdue-item-from\">از ${shortDate(o.fromDate)}<\/span><\/div><div style=\"display: flex; gap: 6px;\"><button class=\"overdue-btn today\" data-overdue-move=\"${o.fromDate}|${o.taskIndex}\">به امروز<\/button><button class=\"overdue-btn delete\" data-overdue-delete=\"${o.fromDate}|${o.taskIndex}\">حذف<\/button><\/div><\/div>`).join('')}`;\n  container.querySelectorAll('[data-overdue-move]').forEach(btn => btn.addEventListener('click', () => { const [fromDate, idxStr] = btn.dataset.overdueMove.split('|'); moveOverdueToToday(fromDate, Number(idxStr)); }));\n  container.querySelectorAll('[data-overdue-delete]').forEach(btn => btn.addEventListener('click', () => { const [fromDate, idxStr] = btn.dataset.overdueDelete.split('|'); deleteOverdueTask(fromDate, Number(idxStr)); }));\n}\nfunction moveOverdueToToday(fromDate, taskIndex) {\n  const fromData = workdayData[fromDate] || {};\n  const tasks = [...(fromData.tasks || [])];\n  const tasksDone = [...(fromData.tasksDone || [])];\n  const taskText = (tasks[taskIndex] || '').trim();\n  if (!taskText) return;\n  const today = currentWorkdayDate;\n  const destData = workdayData[today] || {};\n  const destTasks = [...(destData.tasks || ['', '', ''])];\n  const destDone = [...(destData.tasksDone || [false, false, false])];\n  let emptyIndex = destTasks.findIndex(t => !t || !t.trim());\n  if (emptyIndex === -1) { destTasks.push(taskText); destDone.push(false); }\n  else { destTasks[emptyIndex] = taskText; destDone[emptyIndex] = false; }\n  tasks[taskIndex] = ''; tasksDone[taskIndex] = false;\n  workdayData[fromDate] = { ...fromData, tasks, tasksDone };\n  workdayData[today] = { ...destData, tasks: destTasks, tasksDone: destDone };\n  addHistory('move', taskText, fromDate, today);\n  saveWorkday(); openWorkday(today); render(); renderWeekStrip();\n  showToast('تسک به امروز منتقل شد ✓')
