able>\n          <thead>\n            <tr>\n              <th>وام<\/th>\n              <th>مبلغ کل<\/th>\n              <th>پرداخت‌شده<\/th>\n              <th>باقی‌مانده<\/th>\n              <th>معوق<\/th>\n              <th>تاریخ پایان<\/th>\n              <th>پیشرفت<\/th>\n            <\/tr>\n          <\/thead>\n          <tbody id=\"overviewBody\"><\/tbody>\n        <\/table>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <div id=\"viewLoanDetail\" class=\"hidden\">\n    <button class=\"back-btn\" onclick=\"backToLoans()\">← بازگشت به لیست وام‌ها<\/button>\n\n    <div class=\"card\">\n      <h2>خلاصه: <span id=\"summaryLoanName\"><\/span><\/h2>\n      <div class=\"summary-grid\">\n        <div class=\"stat full\">\n          <div class=\"label\">مبلغ هر قسط (ثابت)<\/div>\n          <div class=\"value\" id=\"statInstallment\">-<\/div>\n        <\/div>\n        <div class=\"stat\">\n          <div class=\"label\">کل سود<\/div>\n          <div class=\"value\" id=\"statInterest\">-<\/div>\n        <\/div>\n        <div class=\"stat\">\n          <div class=\"label\">نرخ ماهانه<\/div>\n          <div class=\"value\" id=\"statMonthlyRate\">-<\/div>\n        <\/div>\n        <div class=\"stat full\">\n          <div class=\"label\">مجموع بازپرداخت<\/div>\n          <div class=\"value\" id=\"statTotal\">-<\/div>\n        <\/div>\n        <div class=\"stat\">\n          <div class=\"label\">تاریخ شروع<\/div>\n          <div class=\"value\" id=\"statStartDate\" style=\"font-size:14px;\">-<\/div>\n        <\/div>\n        <div class=\"stat\">\n          <div class=\"label\">تاریخ پایان<\/div>\n          <div class=\"value\" id=\"statEndDate\" style=\"font-size:14px;\">-<\/div>\n        <\/div>\n        <div class=\"stat full\">\n          <div class=\"label\">پیشرفت پرداخت<\/div>\n          <div class=\"value\" id=\"statProgress\">0 از 0<\/div>\n          <div class=\"progress-bar\"><div id=\"progressFill\" style=\"width:0%\"><\/div><\/div>\n        <\/div>\n      <\/div>\n      <div style=\"display:flex; gap:10px; margin-top:14px;\">\n        <button class=\"btn-warning\" style=\"flex:1;\" onclick=\"editActiveLoan()\">✏️ ویرایش<\/button>\n        <button class=\"btn-danger\" style=\"flex:1;\" onclick=\"deleteActiveLoan()\">🗑️ حذف<\/button>\n      <\/div>\n    <\/div>\n\n    <div class=\"bank-info-card\" id=\"bankInfoCard\"><\/div>\n\n    <div class=\"card\">\n      <h2>لیست اقساط<\/h2>\n      <div class=\"table-wrap\">\n        <table>\n          <thead>\n            <tr>\n              <th>#<\/th>\n              <th>تاریخ سررسید<\/th>\n              <th>مبلغ<\/th>\n              <th>سود<\/th>\n              <th>اصل<\/th>\n              <th>مانده اصل<\/th>\n              <th>وضعیت<\/th>\n            <\/tr>\n          <\/thead>\n          <tbody id=\"tableBody\">\n            <tr><td colspan=\"7\" class=\"empty\">وامی انتخاب نشده<\/td><\/tr>\n          <\/tbody>\n        <\/table>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"card hidden\" id=\"formCard\">\n    <h2 id=\"formTitle\">وام جدید<\/h2>\n    <label>نام وام (اختیاری)<\/label>\n    <input type=\"text\" id=\"loanName\" placeholder=\"مثلاً وام مسکن\">\n\n    <label>مبلغ وام (تومان)<\/label>\n    <input type=\"text\" id=\"principal\" inputmode=\"numeric\" placeholder=\"مثلاً 50,000,000\" value=\"50,000,000\" oninput=\"formatNumberInput(this)\">\n\n    <label>تعداد اقساط (ماه)<\/label>\n    <input type=\"number\" id=\"count\" placeholder=\"مثلاً 24\" value=\"24\" min=\"1\">\n\n    <label>سود سالیانه (درصد)<\/label>\n    <input type=\"number\" id=\"rate\" placeholder=\"مثلاً 18\" value=\"18\" step=\"0.1\">\n\n    <label>تاریخ شروع (شمسی)<\/label>\n    <div style=\"display:flex; gap:8px;\">\n      <input type=\"number\" id=\"startY\" placeholder=\"سال\" value=\"1404\" style=\"flex:1\">\n      <input type=\"number\" id=\"startM\" placeholder=\"ماه\" value=\"1\" min=\"1\" max=\"12\" style=\"flex:1\">\n      <input type=\"number\" id=\"startD\" placeholder=\"روز\" value=\"1\" min=\"1\" max=\"31\" style=\"flex:1\">\n    <\/div>\n\n    <button class=\"btn-full\" onclick=\"saveLoan()\" id=\"saveBtn\">💾 ذخیره وام<\/button>\n    <button class=\"btn-full btn-danger\" onclick=\"closeForm()\">انصراف<\/button>\n  <\/div>\n\n<\/div>\n\n<button class=\"fab\" onclick=\"openNewLoanForm()\" title=\"وام جدید\">+<\/button>\n\n<div class=\"toast\" id=\"toast\"><\/div>\n<div class=\"chart-tooltip\" id=\"chartTooltip\"><\/div>\n<div id=\"modalContainer\"><\/div>\n\n<script>\nconst jMonths = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];\n\nfunction isLeapJalali(jy) { return (((jy + 12) % 33) % 4) === 1; }\nfunction jalaliMonthDays(jy, jm) {\n  if (jm <= 6) return 31;\n  if (jm <= 11) return 30;\n  return isLeapJalali(jy) ? 30 : 29;\n}\nfunction jalaliToJDN(jy, jm, jd) {\n  const epBase = jy - (jy >= 0 ? 474 : 473);\n  const epYear = 474 + (epBase % 2820);\n  return jd + (jm <= 7 ? (jm - 1) * 31 : (jm - 1) * 30 + 6) +\n    Math.floor((epYear * 682 - 110) / 2816) + (epYear - 1) * 365 +\n    Math.floor(epBase / 2820) * 1029983 + (1948320 - 1);\n}\nfunction jdnToJalali(jdn) {\n  let depoch = jdn - 2121446;\n  let cycle = Math.floor(depoch / 1029983);\n  let cyear = depoch % 1029983;\n  let ycycle;\n  if (cyear === 1029982) ycycle = 2820;\n  else {\n    let aux1 = Math.floor(cyear / 366);\n    let aux2 = cyear % 366;\n    ycycle = Math.floor((2134 * aux1 + 2816 * aux2 + 2815) / 1028522) + aux1 + 1;\n  }\n  let jy = ycycle + 2820 * cycle + 474;\n  if (jy <= 0) jy--;\n  let yday = jdn - jalaliToJDN(jy, 1, 1) + 1;\n  let jm = yday <= 186 ? Math.ceil(yday / 31) : Math.ceil((yday - 6) / 30);\n  let jd = jdn - jalaliToJDN(jy, jm, 1) + 1;\n  return { jy, jm, jd };\n}\nfunction addJalaliMonths(jy, jm, jd, months) {\n  let totalMonths = (jy * 12 + (jm - 1)) + months;\n  let ny = Math.floor(totalMonths / 12);\n  let nm = (totalMonths % 12) + 1;\n  let maxDay = jalaliMonthDays(ny, nm);\n  let nd = Math.min(jd, maxDay);\n  return { jy: ny, jm: nm, jd: nd };\n}\nfunction formatJalali(y, m, d) {\n  return y + '/' + String(m).padStart(2,'0') + '/' + String(d).padStart(2,'0');\n}\nfunction compareJalali(a, b) {\n  return jalaliToJDN(a.jy, a.jm, a.jd) - jalaliToJDN(b.jy, b.jm, b.jd);\n}\nfunction todayJalali() {\n  const now = new Date();\n  const gy = now.getFullYear(), gm = now.getMonth() + 1, gd = now.getDate();\n  const a = Math.floor((14 - gm) / 12);\n  const y = gy + 4800 - a;\n  const m = gm + 12 * a - 3;\n  const jdn = gd + Math.floor((153 * m + 2) / 5) + 365 * y +\n    Math.floor(y / 4) - Math.floor(y / 100) + Math.floor(y / 400) - 32045;\n  return jdnToJalali(jdn);\n}\nfunction parseJalali(str) {\n  if (!str) return null;\n  const parts = str.split('/');\n  if (parts.length !== 3) return null;\n  return { jy: parseInt(parts[0]), jm: parseInt(parts[1]), jd: parseInt(parts[2]) };\n}\n\nconst STORAGE_KEY = 'loans_v3';\nconst THEME_KEY = 'theme_v1';\nlet loans = loadLoans();\nlet activeLoanId = null;\nlet editingLoanId = null;\nlet currentSort = 'start';\nlet currentView = 'loans';\nlet reportYear = 0;\nlet reportMonth = 0;\n\nfunction loadLoans() {\n  try {\n    const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem('loans_v2');\n    return raw ? JSON.parse(raw) : [];\n  } catch(e) { return []; }\n}\nfunction saveLoans() {\n  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(loans)); }\n  catch(e) { alert('خطا در ذخیره‌سازی: ' + e.message); }\n}\nfunction getActiveLoan() {\n  return loans.find(function(l) { return l.id === activeLoanId; }) || null;\n}\nfunction uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }\nfunction getLoanEndInfo(loan) {\n  if (!loan.schedule || loan.schedule.length === 0) return null;\n  const first = loan.schedule[0];\n  const last = loan.schedule[loan.schedule.length - 1];\n  const paidCount = loan.schedule.filter(function(x) { return x.isPaid; }).length;\n  return {\n    startDate: first.dateStr,\n    endDate: last.dateStr,\n    isFinished: paidCount === loan.N,\n    paidCount: paidCount\n  };\n}\nfunction hasBankInfo(loan) {\n  return loan && loan.bankInfo && (\n    loan.bankInfo.holder || loan.bankInfo.bank ||\n    loan.bankInfo.accountNumber || loan.bankInfo.shaba || loan.bankInfo.cardNumber\n  );\n}\n\nfunction toggleMenu() {\n  document.getElementById('menuDropdown').classList.toggle('hidden');\n}\nfunction closeMenu() {\n  document.getElementById('menuDropdown').classList.add('hidden');\n}\ndocument.addEventListener('click', function(e) {\n  const menu = document.getElementById('menuDropdown');\n  const btn = document.querySelector('.menu-btn');\n  if (menu && !menu.classList.contains('hidden') &&\n      !menu.contains(e.target) && !btn.contains(e.target)) {\n    closeMenu();\n  }\n});\n\nfunction toggleTheme() {\n  const current = document.documentElement.getAttribute('data-theme');\n  const next = current === 'dark' ? 'light' : 'dark';\n  document.documentElement.setAttribute('data-theme', next);\n  localStorage.setItem(THEME_KEY, next);\n  updateThemeMenu();\n  // رندر مجدد نمودارها با رنگ‌های جدید\n  if (currentView === 'totalReport') {\n    setTimeout(renderTotalReport, 50);\n  }\n}\nfunction updateThemeMenu() {\n  const t = document.documentElement.getAttribute('data-theme');\n  document.getElementById('themeIcon').textContent = t === 'dark' ? '☀️' : '🌙';\n  document.getElementById('themeText').textContent = t === 'dark' ? 'حالت روشن' : 'حالت تاریک';\n}\nfunction loadTheme() {\n  const t = localStorage.getItem(THEME_KEY) || 'light';\n  document.documentElement.setAttribute('data-theme', t);\n  updateThemeMenu();\n}\n\nfunction buildSchedule(P, N, annualRate, sy, sm, sd) {\n  const i = annualRate / 100 / 12;\n  let installment;\n  if (i === 0) installment = P / N;\n  else installment = P * (i * Math.pow(1 + i, N)) / (Math.pow(1 + i, N) - 1);\n\n  const schedule = [];\n  let remaining = P;\n  let totalInterest = 0;\n  for (let k = 0; k < N; k++) {\n    const interestPart = remaining * i;\n    const principalPart = installment - interestPart;\n    remaining -= principalPart;\n    totalInterest += interestPart;\n    const due = addJalaliMonths(sy, sm, sd, k);\n    schedule.push({\n      index: k + 1, date: due,\n      dateStr: formatJalali(due.jy, due.jm, due.jd),\n      amount: Math.round(installment),\n      interest: Math.round(interestPart),\n      principal: Math.round(principalPart),\n      remaining: Math.round(Math.max(remaining, 0)),\n      isPaid: false, paidDate: null\n    });\n  }\n  const last = schedule[schedule.length - 1];\n  const sumPrev = schedule.slice(0, -1).reduce(function(s, x) { return s + x.amount; }, 0);\n  last.amount = Math.round(P + totalInterest) - sumPrev;\n\n  return {\n    installment: Math.round(installment),\n    totalInterest: Math.round(totalInterest),\n    monthlyRate: i,\n    schedule: schedule\n  };\n}\n\nfunction validateLoanInput(P, N, annualRate, sy, sm, sd) {\n  if (!P || P <= 0) return 'مبلغ وام باید بزرگ‌تر از صفر باشد.';\n  if (!N || N <= 0 || N > 360) return 'تعداد اقساط باید بین ۱ تا ۳۶۰ باشد.';\n  if (isNaN(annualRate) || annualRate < 0) return 'نرخ سود نمی‌تواند منفی باشد.';\n  if (annualRate > 100) return 'نرخ سود نمی‌تواند بیش از ۱۰۰٪ باشد.';\n  if (!sy || sy < 1300 || sy > 1500) return 'سال شروع معتبر نیست.';\n  if (sm < 1 || sm > 12) return 'ماه شروع معتبر نیست.';\n  if (sd < 1 || sd > jalaliMonthDays(sy, sm)) return 'روز شروع معتبر نیست.';\n  return null;\n}\n\nfunction switchView(view) {\n  currentView = view;\n  document.getElementById('viewLoans').classList.toggle('hidden', view !== 'loans');\n  document.getElementById('viewMonthlyReport').classList.toggle('hidden', view !== 'monthlyReport');\n  document.getElementById('viewTotalReport').classList.toggle('hidden', view !== 'totalReport');\n  document.getElementById('viewLoanDetail').classList.toggle('hidden', view !== 'loanDetail');\n  document.getElementById('tabLoans').classList.toggle('active', view === 'loans' || view === 'loanDetail');\n  document.getElementById('tabReport').classList.toggle('active', view === 'monthlyReport');\n  document.getElementById('tabTotalReport').classList.toggle('active', view === 'totalReport');\n  document.querySelector('.fab').classList.toggle('hidden', view !== 'loans');\n  if (view === 'loans') renderLoansList();\n  if (view === 'monthlyReport') renderMonthlyReport();\n  if (view === 'totalReport') renderTotalReport();\n  if (view === 'loanDetail') { renderSummary(); renderBankInfo(); renderTable(); }\n}\n\nfunction openLoanDetail(loanId) {\n  activeLoanId = loanId;\n  switchView('loanDetail');\n}\n\nfunction backToLoans() {\n  activeLoanId = null;\n  switchView('loans');\n}\n\nfunction renderLoansList() {\n  const list = document.getElementById('loansList');\n  list.innerHTML = '';\n  if (loans.length === 0) {\n    list.innerHTML = '<div class=\"empty\">هنوز وامی اضافه نشده.<br>روی دکمه «+» پایین صفحه بزنید.<\/div>';\n    return;\n  }\n\n  const query = (document.getElementById('searchInput').value || '').toLowerCase();\n  let filtered = loans.filter(function(l) { return l.name.toLowerCase().indexOf(query) !== -1; });\n\n  filtered.sort(function(a, b) {\n    if (currentSort === 'start') return compareJalali(a.schedule[0].date, b.schedule[0].date);\n    if (currentSort === 'end') return compareJalali(a.schedule[a.N-1].date, b.schedule[b.N-1].date);\n    if (currentSort === 'amount') return b.P - a.P;\n    if (currentSort === 'name') return a.name.localeCompare(b.name, 'fa');\n    return 0;\n  });\n\n  if (filtered.length === 0) {\n    list.innerHTML = '<div class=\"empty\">وامی یافت نشد<\/div>';\n    return;\n  }\n\n  const today = todayJalali();\n\n  filtered.forEach(function(loan, idx) {\n    const paidCount = loan.schedule.filter(function(x) { return x.isPaid; }).length;\n    const total = loan.P + loan.totalInterest;\n    const paidAmount = loan.schedule.reduce(function(s, x) { return s + (x.isPaid ? x.amount : 0); }, 0);\n    const remainingAmount = total - paidAmount;\n    const pct = total > 0 ? (paidAmount / total * 100) : 0;\n    const info = getLoanEndInfo(loan);\n\n    let overdueAmount = 0;\n    loan.schedule.forEach(function(inst) {\n      if (!inst.isPaid && compareJalali(inst.date, today) < 0) overdueAmount += inst.amount;\n    });\n\n    let badge = '<span class=\"badge badge-active\">فعال<\/span>';\n    if (info && info.isFinished) badge = '<span class=\"badge badge-finished\">✓ تسویه شده<\/span>';\n    else if (overdueAmount > 0) badge = '<span class=\"badge badge-overdue\">⚠️ معوق<\/span>';\n\n    let bankBadge = '';\n    if (hasBankInfo(loan) && loan.bankInfo.bank) {\n      bankBadge = '<span class=\"badge badge-bank\">🏦 ' + escapeHtml(loan.bankInfo.bank) + '<\/span>';\n    } else if (!hasBankInfo(loan)) {\n      bankBadge = '<span class=\"badge badge-nobank\">بدون مشخصات واریز<\/span>';\n    }\n\n    let monthsLeftHtml = '';\n    if (info && !info.isFinished) {\n      const last = loan.schedule[loan.schedule.length - 1];\n      const ml = (last.date.jy * 12 + last.date.jm) - (today.jy * 12 + today.jm);\n      if (ml >= 0) monthsLeftHtml = ' (' + ml + ' ماه)';\n    }\n\n    const row = document.createElement('div');\n    row.className = 'loan-row';\n    row.style.animationDelay = (idx * 0.05) + 's';\n    row.onclick = (function(id) { return function() { openLoanDetail(id); }; })(loan.id);\n    row.innerHTML =\n      '<div class=\"loan-row-name\">' +\n        '<div class=\"title\">' + escapeHtml(loan.name) + '<\/div>' +\n        '<div style=\"display:flex; gap:4px; flex-wrap:wrap;\">' + badge + bankBadge + '<\/div>' +\n      '<\/div>' +\n      '<div class=\"loan-row-details\">' +\n        '<div class=\"detail-item\">' +\n          '<div class=\"lbl\">قسط ماهانه<\/div>' +\n          '<div class=\"val primary\">' + fmt(loan.installment) + '<\/div>' +\n        '<\/div>' +\n        '<div class=\"detail-item\">' +\n          '<div class=\"lbl\">کل بدهی<\/div>' +\n          '<div class=\"val\">' + fmt(total) + '<\/div>' +\n        '<\/div>' +\n        '<div class=\"detail-item\">' +\n          '<div class=\"lbl\">باقی‌مانده<\/div>' +\n          '<div class=\"val warning\">' + fmt(remainingAmount) + '<\/div>' +\n        '<\/div>' +\n        '<div class=\"detail-item\">' +\n          '<div class=\"lbl\">تاریخ پایان' + monthsLeftHtml + '<\/div>' +\n          '<div class=\"val\" style=\"font-size:12px;\">' + (info ? info.endDate : '-') + '<\/div>' +\n        '<\/div>' +\n      '<\/div>' +\n      '<div class=\"loan-row-progress\">' +\n        '<div class=\"label\">' +\n          '<span>' + paidCount + '/' + loan.N + '<\/span>' +\n          '<span>' + pct.toFixed(0) + '٪<\/span>' +\n        '<\/div>' +\n        '<div class=\"bar\"><div style=\"width:' + pct + '%\"><\/div><\/div>' +\n      '<\/div>' +\n      '<div class=\"loan-row-actions\">' +\n        '<button class=\"edit\" onclick=\"event.stopPropagation(); editLoanById(\\'' + loan.id + '\\')\" title=\"ویرایش\">✏️<\/button>' +\n        '<button class=\"del\" onclick=\"event.stopPropagation(); deleteLoan(\\'' + loan.id + '\\')\" title=\"حذف\">🗑️<\/button>' +\n      '<\/div>';\n    list.appendChild(row);\n  });\n}\n\nfunction setSort(s) {\n  currentSort = s;\n  document.querySelectorAll('#sortBar button').forEach(function(b) {\n    b.classList.toggle('active', b.dataset.sort === s);\n  });\n  renderLoansList();\n}\n\nfunction editLoanById(id) {\n  const loan = loans.find(function(l) { return l.id === id; });\n  if (!loan) return;\n  activeLoanId = id;\n  openEditForm(loan);\n}\n\nfunction openNewLoanForm() {\n  editingLoanId = null;\n  document.getElementById('formTitle').textContent = 'وام جدید';\n  document.getElementById('loanName').value = '';\n  document.getElementById('principal').value = '50,000,000';\n  document.getElementById('count').value = 24;\n  document.getElementById('rate').value = 18;\n  document.getElementById('startY').value = 1404;\n  document.getElementById('startM').value = 1;\n  document.getElementById('startD').value = 1;\n  document.getElementById('saveBtn').textContent = '💾 ذخیره وام';\n  document.getElementById('formCard').classList.remove('hidden');\n  document.getElementById('loanName').focus();\n  document.getElementById('formCard').scrollIntoView({ behavior: 'smooth' });\n}\n\nfunction openEditForm(loan) {\n  editingLoanId = loan.id;\n  document.getElementById('formTitle').textContent = 'ویرایش وام';\n  document.getElementById('loanName').value = loan.name || '';\n  document.getElementById('principal').value = loan.P.toLocaleString('en-US');\n  document.getElementById('count').value = loan.N;\n  document.getElementById('rate').value = loan.annualRate;\n  document.getElementById('startY').value = loan.sy;\n  document.getElementById('startM').value = loan.sm;\n  document.getElementById('startD').value = loan.sd;\n  document.getElementById('saveBtn').textContent = '💾 به‌روزرسانی';\n  document.getElementById('formCard').classList.remove('hidden');\n  document.getElementById('formCard').scrollIntoView({ behavior: 'smooth' });\n}\n\nfunction editActiveLoan() {\n  const loan = getActiveLoan();\n  if (loan) openEditForm(loan);\n}\n\nfunction closeForm() {\n  document.getElementById('formCard').classList.add('hidden');\n  editingLoanId = null;\n}\n\nfunction saveLoan() {\n  const name = document.getElementById('loanName').value.trim();\n  const P = parseFloat(document.getElementById('principal').value.replace(/,/g, ''));\n  const N = parseInt(document.getElementById('count').value);\n  const annualRate = parseFloat(document.getElementById('rate').value);\n  const sy = parseInt(document.getElementById('startY').value);\n  const sm = parseInt(document.getElementById('startM').value);\n  const sd = parseInt(document.getElementById('startD').value);\n\n  const err = validateLoanInput(P, N, annualRate, sy, sm, sd);\n  if (err) { alert(err); return; }\n\n  const calc = buildSchedule(P, N, annualRate, sy, sm, sd);\n\n  if (editingLoanId) {\n    const old = loans.find(function(l) { return l.id === editingLoanId; });\n    if (old && old.schedule.length === calc.schedule.length) {\n      calc.schedule.forEach(function(inst, i) {\n        inst.isPaid = !!old.schedule[i].isPaid;\n        inst.paidDate = old.schedule[i].paidDate || null;\n      });\n    }\n    const idx = loans.findIndex(function(l) { return l.id === editingLoanId; });\n    loans[idx] = {\n      id: editingLoanId, name: name || ('وام ' + (idx + 1)),\n      P: P, N: N, annualRate: annualRate, sy: sy, sm: sm, sd: sd,\n      monthlyRate: calc.monthlyRate, installment: calc.installment,\n      totalInterest: calc.totalInterest, schedule: calc.schedule,\n      bankInfo: old ? (old.bankInfo || null) : null\n    };\n    activeLoanId = editingLoanId;\n  } else {\n    const newLoan = {\n      id: uid(), name: name || ('وام ' + (loans.length + 1)),\n      P: P, N: N, annualRate: annualRate, sy: sy, sm: sm, sd: sd,\n      monthlyRate: calc.monthlyRate, installment: calc.installment,\n      totalInterest: calc.totalInterest, schedule: calc.schedule,\n      bankInfo: null\n    };\n    loans.push(newLoan);\n    activeLoanId = newLoan.id;\n  }\n  saveLoans();\n  closeForm();\n  renderAll();\n}\n\nfunction renderSummary() {\n  const loan = getActiveLoan();\n  if (!loan) return;\n  document.getElementById('summaryLoanName').textContent = loan.name;\n  document.getElementById('statInstallment').textContent = fmt(loan.installment) + ' تومان';\n  document.getElementById('statInterest').textContent = fmt(loan.totalInterest) + ' تومان';\n  document.getElementById('statMonthlyRate').textContent = (loan.monthlyRate * 100).toFixed(3) + '٪';\n  document.getElementById('statTotal').textContent = fmt(loan.P + loan.totalInterest) + ' تومان';\n  const info = getLoanEndInfo(loan);\n  document.getElementById('statStartDate').textContent = info ? info.startDate : '-';\n  document.getElementById('statEndDate').textContent = info ? info.endDate : '-';\n  const paidCount = loan.schedule.filter(function(x) { return x.isPaid; }).length;\n  document.getElementById('statProgress').textContent = paidCount + ' از ' + loan.N + ' قسط';\n  document.getElementById('progressFill').style.width = (paidCount / loan.N * 100) + '%';\n}\n\nfunction renderBankInfo() {\n  const loan = getActiveLoan();\n  const container = document.getElementById('bankInfoCard');\n  if (!loan) { container.classList.add('hidden'); return; }\n  container.classList.remove('hidden');\n\n  const bi = loan.bankInfo || {};\n  const hasAny = hasBankInfo(loan);\n\n  let bodyHtml = '';\n  let headerAction = '';\n\n  if (hasAny) {\n    headerAction = '<button class=\"edit-bank-btn\" onclick=\"openBankForm()\">✏️ ویرایش<\/button>';\n\n    const items = [];\n    if (bi.holder) {\n      items.push(\n        '<div class=\"bank-item full\">' +\n          '<div class=\"bank-item-icon orange\">' +\n            '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">' +\n              '<path d=\"M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2\"/>' +\n              '<circle cx=\"12\" cy=\"7\" r=\"4\"/>' +\n            '<\/svg>' +\n          '<\/div>' +\n          '<div class=\"bank-item-content\">' +\n            '<div class=\"bank-item-label\">صاحب حساب<\/div>' +\n            '<div class=\"bank-item-value rtl\">' + escapeHtml(bi.holder) + '<\/div>' +\n          '<\/div>' +\n          '<button class=\"copy-btn\" onclick=\"copyToClipboard(this, \\'' + escapeJs(bi.holder) + '\\')\" title=\"کپی\">' +\n            copyIconSvg() +\n          '<\/button>' +\n        '<\/div>'\n      );\n    }\n    if (bi.bank) {\n      items.push(\n        '<div class=\"bank-item full\">' +\n          '<div class=\"bank-item-icon blue\">' +\n            '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">' +\n              '<line x1=\"3\" y1=\"21\" x2=\"21\" y2=\"21\"/><line x1=\"3\" y1=\"10\" x2=\"21\" y2=\"10\"/>' +\n              '<polyline points=\"5 10 5 21\"/><polyline points=\"19 10 19 21\"/>' +\n              '<polyline points=\"9 10 9 21\"/><polyline points=\"15 10 15 21\"/>' +\n              '<polygon points=\"12 2 21 8 3 8\"/>' +\n            '<\/svg>' +\n          '<\/div>' +\n          '<div class=\"bank-item-content\">' +\n            '<div class=\"bank-item-label\">بانک<\/div>' +\n            '<div class=\"bank-item-value rtl\">' + escapeHtml(bi.bank) + '<\/div>' +\n          '<\/div>' +\n          '<button class=\"copy-btn\" onclick=\"copyToClipboard(this, \\'' + escapeJs(bi.bank) + '\\')\" title=\"کپی\">' +\n            copyIconSvg() +\n          '<\/button>' +\n        '<\/div>'\n      );\n    }\n    if (bi.accountNumber) {\n      items.push(\n        '<div class=\"bank-item\">' +\n          '<div class=\"bank-item-icon green\">' +\n            '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">' +\n              '<rect x=\"2\" y=\"6\" width=\"20\" height=\"14\" rx=\"2\"/>' +\n              '<line x1=\"2\" y1=\"11\" x2=\"22\" y2=\"11\"/>' +\n            '<\/svg>' +\n          '<\/div>' +\n          '<div class=\"bank-item-content\">' +\n            '<div class=\"bank-item-label\">شماره حساب<\/div>' +\n            '<div class=\"bank-item-value\">' + escapeHtml(bi.accountNumber) + '<\/div>' +\n          '<\/div>' +\n          '<button class=\"copy-btn\" onclick=\"copyToClipboard(this, \\'' + escapeJs(bi.accountNumber) + '\\')\" title=\"کپی\">' +\n            copyIconSvg() +\n          '<\/button>' +\n        '<\/div>'\n      );\n    }\n    if (bi.cardNumber) {\n      const formattedCard = bi.cardNumber.replace(/(.{4})/g, '$1 ').trim();\n      items.push(\n        '<div class=\"bank-item\">' +\n          '<div class=\"bank-item-icon purple\">' +\n            '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">' +\n              '<rect x=\"1\" y=\"4\" width=\"22\" height=\"16\" rx=\"2\"/>' +\n              '<line x1=\"1\" y1=\"10\" x2=\"23\" y2=\"10\"/>' +\n            '<\/svg>' +\n          '<\/div>' +\n          '<div class=\"bank-item-content\">' +\n            '<div class=\"bank-item-label\">شماره کارت<\/div>' +\n            '<div class=\"bank-item-value\">' + escapeHtml(formattedCard) + '<\/div>' +\n          '<\/div>' +\n          '<button class=\"copy-btn\" onclick=\"copyToClipboard(this, \\'' + escapeJs(bi.cardNumber) + '\\')\" title=\"کپی\">' +\n            copyIconSvg() +\n          '<\/button>' +\n        '<\/div>'\n      );\n    }\n    if (bi.shaba) {\n      const formattedShaba = bi.shaba.replace(/(IR)(\\d{2})(\\d{4})(\\d{4})(\\d{4})(\\d{4})/, '$1$2 $3 $4 $5 $6');\n      items.push(\n        '<div class=\"bank-item full\">' +\n          '<div class=\"bank-item-icon blue\">' +\n            '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">' +\n              '<line x1=\"3\" y1=\"12\" x2=\"21\" y2=\"12\"/>' +\n              '<polyline points=\"8 8 4 12 8 16\"/>' +\n              '<polyline points=\"16 8 20 12 16 16\"/>' +\n            '<\/svg>' +\n          '<\/div>' +\n          '<div class=\"bank-item-content\">' +\n            '<div class=\"bank-item-label\">شماره شبا<\/div>' +\n            '<div class=\"bank-item-value\">' + escapeHtml(formattedShaba) + '<\/div>' +\n          '<\/div>' +\n          '<button class=\"copy-btn\" onclick=\"copyToClipboard(this, \\'' + escapeJs(bi.shaba) + '\\')\" title=\"کپی\">' +\n            copyIconSvg() +\n          '<\/button>' +\n        '<\/div>'\n      );\n    }\n    bodyHtml = '<div class=\"bank-info-grid\">' + items.join('') + '<\/div>';\n  } else {\n    bodyHtml =\n      '<div class=\"bank-info-empty\">هنوز مشخصات واریزی برای این وام ثبت نشده است<\/div>' +\n      '<button class=\"add-bank-btn\" onclick=\"openBankForm()\">افزودن مشخصات واریز<\/button>';\n  }\n\n  container.innerHTML =\n    '<div class=\"bank-info-header\">' +\n      '<div class=\"bank-info-title\">مشخصات واریز<\/div>' +\n      headerAction +\n    '<\/div>' + bodyHtml;\n}\n\nfunction copyIconSvg() {\n  return '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">' +\n    '<rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"/>' +\n    '<path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"/>' +\n  '<\/svg>';\n}\n\nfunction copyToClipboard(btn, text) {\n  if (!text) return;\n  const done = function() {\n    btn.classList.add('copied');\n    btn.innerHTML = '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"/><\/svg>';\n    showToast('✓ کپی شد');\n    setTimeout(function() {\n      btn.classList.remove('copied');\n      btn.innerHTML = copyIconSvg();\n    }, 1500);\n  };\n  if (navigator.clipboard && window.isSecureContext) {\n    navigator.clipboard.writeText(text).then(done).catch(function() {\n      fallbackCopy(text, done);\n    });\n  } else {\n    fallbackCopy(text, done);\n  }\n}\n\nfunction fallbackCopy(text, cb) {\n  const textarea = document.createElement('textarea');\n  textarea.value = text;\n  textarea.style.position = 'fixed';\n  textarea.style.opacity = '0';\n  textarea.style.left = '0';\n  textarea.style.top = '0';\n  document.body.appendChild(textarea);\n  textarea.focus();\n  textarea.select();\n  try {\n    document.execCommand('copy');\n    if (cb) cb();\n  } catch(e) {\n    alert('خطا در کپی: ' + text);\n  }\n  document.body.removeChild(textarea);\n}\n\nfunction showToast(msg) {\n  const t = document.getElementById('toast');\n  t.textContent = msg;\n  t.classList.add('show');\n  clearTimeout(window._toastTimer);\n  window._toastTimer = setTimeout(function() {\n    t.classList.remove('show');\n  }, 1800);\n}\n\nfunction openBankForm() {\n  const loan = getActiveLoan();\n  if (!loan) return;\n  const bi = loan.bankInfo || {};\n  document.getElementById('modalContainer').innerHTML =\n    '<div class=\"modal-overlay\" onclick=\"if(event.target===this) closeModal()\">' +\n      '<div class=\"modal\">' +\n        '<h3>🏦 مشخصات واریز<\/h3>' +\n        '<label>صاحب حساب<\/label>' +\n        '<input type=\"text\" id=\"bankHolder\" placeholder=\"مثلاً علی رضایی\" value=\"' + escapeAttr(bi.holder || '') + '\">' +\n        '<label>بانک<\/label>' +\n        '<input type=\"text\" id=\"bankName\" placeholder=\"مثلاً بانک ملی\" value=\"' + escapeAttr(bi.bank || '') + '\">' +\n        '<label>شماره حساب<\/label>' +\n        '<input type=\"text\" id=\"bankAccount\" inputmode=\"numeric\" placeholder=\"مثلاً 1234567890\" value=\"' + escapeAttr(bi.accountNumber || '') + '\">' +\n        '<label>شماره کارت (۱۶ رقم)<\/label>' +\n        '<input type=\"text\" id=\"bankCard\" inputmode=\"numeric\" placeholder=\"6037XXXXXXXXXXXX\" value=\"' + escapeAttr(bi.cardNumber || '') + '\" maxlength=\"16\">' +\n        '<label>شماره شبا (با IR)<\/label>' +\n        '<input type=\"text\" id=\"bankShaba\" placeholder=\"IRXXXXXXXXXXXXXXXXXXXX\" value=\"' + escapeAttr(bi.shaba || '') + '\" style=\"direction:ltr; text-align:left;\">' +\n        '<div class=\"modal-actions\">' +\n          '<button class=\"btn-secondary\" onclick=\"closeModal()\">انصراف<\/button>' +\n          '<button class=\"btn-success\" onclick=\"saveBankInfo()\">ذخیره<\/button>' +\n        '<\/div>' +\n      '<\/div>' +\n    '<\/div>';\n}\n\nfunction saveBankInfo() {\n  const loan = getActiveLoan();\n  if (!loan) return;\n  const holder = document.getElementById('bankHolder').value.trim();\n  const bank = document.getElementById('bankName').value.trim();\n  let accountNumber = document.getElementById('bankAccount').value.trim().replace(/\\s/g, '');\n  let cardNumber = document.getElementById('bankCard').value.trim().replace(/\\s/g, '');\n  let shaba = document.getElementById('bankShaba').value.trim().replace(/\\s/g, '').toUpperCase();\n\n  if (cardNumber && !/^\\d{16}$/.test(cardNumber)) {\n    alert('شماره کارت باید ۱۶ رقم باشد.');\n    return;\n  }\n  if (shaba && !/^IR\\d{24}$/.test(shaba)) {\n    alert('شماره شبا باید با IR شروع شده و ۲۴ رقم بعد از آن باشد.');\n    return;\n  }\n\n  const allEmpty = !holder && !bank && !accountNumber && !cardNumber && !shaba;\n  if (allEmpty) {\n    loan.bankInfo = null;\n  } else {\n    loan.bankInfo = {\n      holder: holder || null,\n      bank: bank || null,\n      accountNumber: accountNumber || null,\n      cardNumber: cardNumber || null,\n      shaba: shaba || null\n    };\n  }\n  saveLoans();\n  closeModal();\n  renderBankInfo();\n  renderLoansList();\n  showToast('✓ ذخیره شد');\n}\n\nfunction renderTable() {\n  const tbody = document.getElementById('tableBody');\n  const loan = getActiveLoan();\n  if (!loan) {\n    tbody.innerHTML = '<tr><td colspan=\"7\" class=\"empty\">وامی انتخاب نشده<\/td><\/tr>';\n    return;\n  }\n  const today = todayJalali();\n  tbody.innerHTML = '';\n  loan.schedule.forEach(function(inst, i) {\n    const tr = document.createElement('tr');\n    if (inst.isPaid) tr.classList.add('paid');\n    else if (compareJalali(inst.date, today) < 0) tr.classList.add('overdue');\n    const paidDateHtml = inst.isPaid && inst.paidDate\n      ? '<div class=\"paid-date-small\">' + inst.paidDate + '<\/div>' : '';\n    tr.innerHTML =\n      '<td>' + inst.index + '<\/td>' +\n      '<td>' + inst.dateStr + '<\/td>' +\n      '<td>' + fmt(inst.amount) + '<\/td>' +\n      '<td>' + fmt(inst.interest) + '<\/td>' +\n      '<td>' + fmt(inst.principal) + '<\/td>' +\n      '<td>' + fmt(inst.remaining) + '<\/td>' +\n      '<td><button class=\"toggle-btn ' + (inst.isPaid ? 'paid' : '') + '\" onclick=\"togglePaid(' + i + ')\">' +\n        (inst.isPaid ? '✓' : 'پرداخت') + '<\/button>' + paidDateHtml + '<\/td>';\n    tbody.appendChild(tr);\n  });\n}\n\nfunction togglePaid(i) {\n  const loan = getActiveLoan();\n  if (!loan) return;\n  const inst = loan.schedule[i];\n  if (inst.isPaid) {\n    if (!confirm('پرداخت قسط ' + inst.index + ' لغو شود؟')) return;\n    inst.isPaid = false;\n    inst.paidDate = null;\n    saveLoans();\n    renderSummary();\n    renderTable();\n    renderAlert();\n  } else {\n    showPaymentDateModal(loan.id, i);\n  }\n}\n\nfunction showPaymentDateModal(loanId, scheduleIndex) {\n  const today = todayJalali();\n  const defaultDate = formatJalali(today.jy, today.jm, today.jd);\n  document.getElementById('modalContainer').innerHTML =\n    '<div class=\"modal-overlay\" onclick=\"if(event.target===this) closeModal()\">' +\n      '<div class=\"modal\">' +\n        '<h3>📅 تاریخ پرداخت<\/h3>' +\n        '<p style=\"color:var(--muted);font-size:13px;margin-bottom:14px;\">تاریخ پرداخت این قسط را وارد کنید<\/p>' +\n        '<input type=\"text\" id=\"paymentDateInput\" value=\"' + defaultDate + '\" placeholder=\"1404/01/15\">' +\n        '<div class=\"modal-actions\">' +\n          '<button class=\"btn-secondary\" onclick=\"closeModal()\">انصراف<\/button>' +\n          '<button class=\"btn-success\" onclick=\"confirmPayment(\\'' + loanId + '\\',' + scheduleIndex + ')\">تایید<\/button>' +\n        '<\/div>' +\n      '<\/div>' +\n    '<\/div>';\n  setTimeout(function() {\n    const inp = document.getElementById('paymentDateInput');\n    if (inp) { inp.focus(); inp.select(); }\n  }, 50);\n}\n\nfunction confirmPayment(loanId, scheduleIndex) {\n  const val = document.getElementById('paymentDateInput').value.trim();\n  const parsed = parseJalali(val);\n  if (!parsed || isNaN(parsed.jy) || isNaN(parsed.jm) || isNaN(parsed.jd) ||\n      parsed.jm < 1 || parsed.jm > 12 || parsed.jd < 1 || parsed.jd > jalaliMonthDays(parsed.jy, parsed.jm)) {\n    alert('تاریخ معتبر نیست. فرمت: 1404/01/15');\n    return;\n  }\n  const loan = loans.find(function(l) { return l.id === loanId; });\n  if (!loan) return;\n  loan.schedule[scheduleIndex].isPaid = true;\n  loan.schedule[scheduleIndex].paidDate = val;\n  saveLoans();\n  closeModal();\n  if (currentView === 'loanDetail') { renderSummary(); renderTable(); }\n  if (currentView === 'monthlyReport') renderMonthlyReport();\n  renderAlert();\n}\n\nfunction closeModal() {\n  document.getElementById('modalContainer').innerHTML = '';\n}\n\nfunction deleteLoan(id) {\n  const loan = loans.find(function(l) { return l.id === id; });\n  if (!loan) return;\n  if (!confirm('وام «' + loan.name + '» و همه پرداخت‌هایش حذف شود؟')) return;\n  loans = loans.filter(function(l) { return l.id !== id; });\n  if (activeLoanId === id) activeLoanId = null;\n  saveLoans();\n  renderAll();\n}\n\nfunction deleteActiveLoan() {\n  if (activeLoanId) {\n    deleteLoan(activeLoanId);\n    backToLoans();\n  }\n}\n\nfunction renderAlert() {\n  const container = document.getElementById('alertContainer');\n  const today = todayJalali();\n  let upcoming = [];\n  loans.forEach(function(loan) {\n    loan.schedule.forEach(function(inst) {\n      if (inst.isPaid) return;\n      const daysLeft = jalaliToJDN(inst.date.jy, inst.date.jm, inst.date.jd) -\n                       jalaliToJDN(today.jy, today.jm, today.jd);\n      if (daysLeft >= 0 && daysLeft <= 7) upcoming.push({ loan: loan, inst: inst, daysLeft: daysLeft });\n    });\n  });\n  if (upcoming.length === 0) { container.innerHTML = ''; return; }\n  upcoming.sort(function(a, b) { return a.daysLeft - b.daysLeft; });\n  const total = upcoming.reduce(function(s, x) { return s + x.inst.amount; }, 0);\n  container.innerHTML =\n    '<div class=\"alert-banner\">' +\n      '<div>⚠️ ' + upcoming.length + ' قسط در ۷ روز آینده — ' + fmt(total) + ' تومان<\/div>' +\n      '<button class=\"btn-sm\" onclick=\"showUpcomingDetails()\">جزئیات<\/button>' +\n    '<\/div>';\n}\n\nfunction showUpcomingDetails() {\n  const today = todayJalali();\n  let upcoming = [];\n  loans.forEach(function(loan) {\n    loan.schedule.forEach(function(inst) {\n      if (inst.isPaid) return;\n      const daysLeft = jalaliToJDN(inst.date.jy, inst.date.jm, inst.date.jd) -\n                       jalaliToJDN(today.jy, today.jm, today.jd);\n      if (daysLeft >= 0 && daysLeft <= 7) upcoming.push({ loan: loan, inst: inst, daysLeft: daysLeft });\n    });\n  });\n  upcoming.sort(function(a, b) { return a.daysLeft - b.daysLeft; });\n  const rows = upcoming.map(function(x) {\n    const status = x.daysLeft === 0 ? 'امروز' : x.daysLeft + ' روز دیگر';\n    return '<div style=\"padding:12px;border-bottom:1px solid var(--border);\">' +\n      '<strong>' + escapeHtml(x.loan.name) + '<\/strong> — قسط ' + x.inst.index +\n      '<br><span style=\"font-size:12px;color:var(--muted);\">' + x.inst.dateStr + ' (' + status + ') — ' + fmt(x.inst.amount) + ' تومان<\/span>' +\n    '<\/div>';\n  }).join('');\n  document.getElementById('modalContainer').innerHTML =\n    '<div class=\"modal-overlay\" onclick=\"if(event.target===this) closeModal()\">' +\n      '<div class=\"modal\" style=\"max-width:500px;\">' +\n        '<h3>⚠️ اقساط نزدیک<\/h3>' + rows +\n        '<div class=\"modal-actions\"><button class=\"btn-secondary\" onclick=\"closeModal()\">بستن<\/button><\/div>' +\n      '<\/div>' +\n    '<\/div>';\n}\n\nfunction computeDebtStats() {\n  const today = todayJalali();\n  let totalDebt = 0, totalPrincipal = 0, totalInterest = 0;\n  let paidAmount = 0, paidPrincipal = 0, paidInterest = 0;\n  let remainingAmount = 0, remainingPrincipal = 0, remainingInterest = 0;\n  let overdueAmount = 0, overdueCount = 0;\n  let paidCount = 0, totalCount = 0, upcomingCount = 0;\n  let monthlyDueAmount = 0;\n  let nextInst = null;\n  const monthlyLimit = jalaliToJDN(today.jy, today.jm, today.jd) + 30;\n\n  loans.forEach(function(loan) {\n    totalPrincipal += loan.P || 0;\n    totalInterest += loan.totalInterest || 0;\n    totalDebt += (loan.P || 0) + (loan.totalInterest || 0);\n    (loan.schedule || []).forEach(function(inst) {\n      totalCount++;\n      if (inst.isPaid) {\n        paidCount++;\n        paidAmount += inst.amount || 0;\n        paidPrincipal += inst.principal || 0;\n        paidInterest += inst.interest || 0;\n      } else {\n        remainingAmount += inst.amount || 0;\n        remainingPrincipal += inst.principal || 0;\n        remainingInterest += inst.interest || 0;\n        const instJdn = jalaliToJDN(inst.date.jy, inst.date.jm, inst.date.jd);\n        const todayJdn = jalaliToJDN(today.jy, today.jm, today.jd);\n        if (instJdn < todayJdn) { overdueAmount += inst.amount || 0; overdueCount++; }\n        else {\n          upcomingCount++;\n          if (instJdn <= monthlyLimit) monthlyDueAmount += inst.amount || 0;\n          if (!nextInst || compareJalali(inst.date, nextInst.inst.date) < 0) {\n            nextInst = { loan: loan, inst: inst };\n          }\n        }\n      }\n    });\n  });\n\n  return {\n    totalDebt, totalPrincipal, totalInterest,\n    paidAmount, paidPrincipal, paidInterest,\n    remainingAmount, remainingPrincipal, remainingInterest,\n    overdueAmount, overdueCount,\n    paidCount, totalCount, upcomingCount,\n    monthlyDueAmount, nextInst\n  };\n}\n\nfunction renderTotalReport() {\n  try {\n    const s = computeDebtStats();\n    const today = todayJalali();\n\n    document.getElementById('debtHero').innerHTML =\n      '<div class=\"hero-card total\"><div class=\"hero-label\">کل بدهی (اصل + سود)<\/div>' +\n        '<div class=\"hero-value\">' + fmt(s.totalDebt) + '<\/div>' +\n        '<div class=\"hero-sub\">' + loans.length + ' وام • ' + s.totalCount + ' قسط<\/div><\/div>' +\n      '<div class=\"hero-card paid\"><div class=\"hero-label\">پرداخت‌شده<\/div>' +\n        '<div class=\"hero-value\">' + fmt(s.paidAmount) + '<\/div>' +\n        '<div class=\"hero-sub\">' + s.paidCount + ' قسط<\/div><\/div>' +\n      '<div class=\"hero-card remaining\"><div class=\"hero-label\">باقی‌مانده<\/div>' +\n        '<div class=\"hero-value\">' + fmt(s.remainingAmount) + '<\/div>' +\n        '<div class=\"hero-sub\">' + (s.totalCount - s.paidCount) + ' قسط<\/div><\/div>' +\n      '<div class=\"hero-card overdue\"><div class=\"hero-label\">معوق<\/div>' +\n        '<div class=\"hero-value\">' + fmt(s.overdueAmount) + '<\/div>' +\n        '<div class=\"hero-sub\">' + s.overdueCount + ' قسط<\/div><\/div>' +\n      '<div class=\"hero-card monthly\"><div class=\"hero-label\">قسط ۳۰ روز آینده<\/div>' +\n        '<div class=\"hero-value\">' + fmt(s.monthlyDueAmount) + '<\/div>' +\n        '<div class=\"hero-sub\">' + s.upcomingCount + ' قسط پیش‌رو<\/div><\/div>';\n\n    let nearestEnd = null, furthestEnd = null;\n    loans.forEach(function(loan) {\n      if (!loan.schedule || loan.schedule.length === 0) return;\n      const last = loan.schedule[loan.schedule.length - 1];\n      const pc = loan.schedule.filter(function(x) { return x.isPaid; }).length;\n      if (pc === loan.N) return;\n      if (!nearestEnd || compareJalali(last.date, nearestEnd) < 0) nearestEnd = last.date;\n      if (!furthestEnd || compareJalali(last.date, furthestEnd) > 0) furthestEnd = last.date;\n    });\n\n    let nextHtml = '';\n    if (s.nextInst) {\n      nextHtml = '<div class=\"detail-card\"><div class=\"label\">نزدیک‌ترین قسط<\/div>' +\n        '<div class=\"value\" style=\"font-size:14px;\">' + escapeHtml(s.nextInst.loan.name) + '<\/div>' +\n        '<div style=\"font-size:11px;color:var(--muted);margin-top:2px;\">' + s.nextInst.inst.dateStr + '<\/div><\/div>';\n    }\n    let endHtml = '';\n    if (nearestEnd) endHtml += '<div class=\"detail-card\"><div class=\"label\">نزدیک‌ترین پایان<\/div>' +\n      '<div class=\"value\" style=\"font-size:14px;\">' + formatJalali(nearestEnd.jy, nearestEnd.jm, nearestEnd.jd) + '<\/div><\/div>';\n    if (furthestEnd) endHtml += '<div class=\"detail-card\"><div class=\"label\">دورترین پایان<\/div>' +\n      '<div class=\"value\" style=\"font-size:14px;\">' + formatJalali(furthestEnd.jy, furthestEnd.jm, furthestEnd.jd) + '<\/div><\/div>';\n\n    document.getElementById('debtDetails').innerHTML =\n      '<div class=\"detail-card\"><div class=\"label\">اصل کل<\/div><div class=\"value\">' + fmt(s.totalPrincipal) + '<\/div><\/div>' +\n      '<div class=\"detail-card\"><div class=\"label\">سود کل<\/div><div class=\"value\">' + fmt(s.totalInterest) + '<\/div><\/div>' +\n      '<div class=\"detail-card\"><div class=\"label\">اصل پرداخت‌شده<\/div><div class=\"value\">' + fmt(s.paidPrincipal) + '<\/div><\/div>' +\n      '<div class=\"detail-card\"><div class=\"label\">سود پرداخت‌شده<\/div><div class=\"value\">' + fmt(s.paidInterest) + '<\/div><\/div>' +\n      '<div class=\"detail-card\"><div class=\"label\">اصل باقی‌مانده<\/div><div class=\"value\">' + fmt(s.remainingPrincipal) + '<\/div><\/div>' +\n      '<div class=\"detail-card\"><div class=\"label\">سود باقی‌مانده<\/div><div class=\"value\">' + fmt(s.remainingInterest) + '<\/div><\/div>' +\n      nextHtml + endHtml;\n\n    const pct = s.totalDebt > 0 ? (s.paidAmount / s.totalDebt * 100) : 0;\n    document.getElementById('bigProgress').innerHTML =\n      '<div class=\"top\"><span>پیشرفت کلی پرداخت<\/span><span>' + pct.toFixed(1) + '٪<\/span><\/div>' +\n      '<div class=\"bar\"><div style=\"width:' + pct + '%\"><\/div><\/div>' +\n      '<div style=\"display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:8px;font-weight:600;\">' +\n        '<span>' + fmt(s.paidAmount) + ' تومان پرداخت‌شده<\/span>' +\n        '<span>' + fmt(s.remainingAmount) + ' تومان باقی‌مانده<\/span><\/div>';\n\n    // نمودارها\n    document.getElementById('chartYearLabel').textContent = toPersianDigits(today.jy);\n    renderMonthlyBarChart(today.jy);\n    renderCumulativeLineChart();\n    renderLoanBars(today);\n    renderPieChart();\n    renderOverviewTable(today);\n  } catch(err) {\n    console.error(err);\n  }\n}\n\n/* ========== ابزار نمودارها ========== */\nfunction toPersianDigits(n) {\n  return String(n).replace(/\\d/g, function(d) { return '۰۱۲۳۴۵۶۷۸۹'[d]; });\n}\n\nfunction compactFmt(n) {\n  if (n >= 1000000000) return (n / 1000000000).toFixed(1) + ' میلیارد';\n  if (n >= 1000000) return (n / 1000000).toFixed(0) + ' م';\n  if (n >= 1000) return (n / 1000).toFixed(0) + ' هـ';\n  return String(Math.round(n));\n}\n\nfunction getThemeColors() {\n  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';\n  return {\n    text: isDark ? '#f1f5f9' : '#1e293b',\n    textSecondary: isDark ? '#cbd5e1' : '#475569',\n    muted: isDark ? '#94a3b8' : '#94a3b8',\n    grid: isDark ? '#334155' : '#e2e8f0',\n    bg: isDark ? '#1e293b' : '#ffffff',\n    primary: '#4f6bff',\n    success: '#10b981',\n    successLight: '#34d399',\n    warning: '#f59e0b',\n    warningLight: '#fbbf24',\n    danger: '#ef4444',\n    purple: '#8b5cf6'\n  };\n}\n\n/* ========== نمودار ۱: ستونی جمع اقساط ماهیانه ========== */\nfunction renderMonthlyBarChart(year) {\n  const svg = document.getElementById('monthlyChart');\n  const colors = getThemeColors();\n\n  // جمع‌آوری داده\n  const data = [];\n  for (let m = 1; m <= 12; m++) {\n    data.push({ jm: m, paid: 0, unpaid: 0, overdue: 0, count: 0 });\n  }\n  const today = todayJalali();\n\n  loans.forEach(function(loan) {\n    (loan.schedule || []).forEach(function(inst) {\n      if (inst.date.jy === year) {\n        const item = data[inst.date.jm - 1];\n        item.count++;\n        if (inst.isPaid) {\n          item.paid += inst.amount;\n        } else if (compareJalali(inst.date, today) < 0) {\n          item.overdue += inst.amount;\n        } else {\n          item.unpaid += inst.amount;\n        }\n      }\n    });\n  });\n\n  const maxValue = Math.max.apply(null, data.map(function(d) {\n    return d.paid + d.unpaid + d.overdue;\n  }).concat([1]));\n\n  const W = 800, H = 340;\n  const padding = { top: 30, right: 20, bottom: 60, left: 60 };\n  const plotW = W - padding.left - padding.right;\n  const plotH = H - padding.top - padding.bottom;\n  const barWidth = (plotW / 12) * 0.65;\n  const gap = (plotW / 12) * 0.35;\n\n  let svgContent = '';\n\n  // خطوط شبکه افقی\n  for (let i = 0; i <= 4; i++) {\n    const y = padding.top + (plotH / 4) * i;\n    const val = maxValue * (1 - i / 4);\n    svgContent += '<line x1=\"' + padding.left + '\" y1=\"' + y + '\" x2=\"' + (W - padding.right) + '\" y2=\"' + y +\n      '\" stroke=\"' + colors.grid + '\" stroke-width=\"1\" stroke-dasharray=\"' + (i === 4 ? '0' : '4,4') + '\"/>';\n    svgContent += '<text x=\"' + (padding.left - 8) + '\" y=\"' + (y + 4) + '\" text-anchor=\"end\" font-size=\"10\" fill=\"' +\n      colors.muted + '\" font-family=\"Vazirmatn\" font-weight=\"600\">' + compactFmt(val) + '<\/text>';\n  }\n\n  // میله‌ها (از راست به چپ)\n  data.forEach(function(d, i) {\n    const x = W - padding.right - (i + 1) * (plotW / 12) + gap / 2;\n    const total = d.paid + d.unpaid + d.overdue;\n\n    // ستون پرداخت‌شده (پایین)\n    const paidH = (d.paid / maxValue) * plotH;\n    if (paidH > 0) {\n      svgContent += '<rect x=\"' + x + '\" y=\"' + (padding.top + plotH - paidH) + '\" width=\"' + barWidth +\n        '\" height=\"' + paidH + '\" fill=\"url(#gradPaid)\" rx=\"3\"/>';\n    }\n\n    // ستون پرداخت‌نشده (روی پرداخت‌شده)\n    const unpaidH = (d.unpaid / maxValue) * plotH;\n    if (unpaidH > 0) {\n      svgContent += '<rect x=\"' + x + '\" y=\"' + (padding.top + plotH - paidH - unpaidH) + '\" width=\"' + barWidth +\n        '\" height=\"' + unpaidH + '\" fill=\"url(#gradUnpaid)\" rx=\"3\"/>';\n    }\n\n    // ستون معوق (روی همه)\n    const overdueH = (d.overdue / maxValue) * plotH;\n    if (overdueH > 0) {\n      svgContent += '<rect x=\"' + x + '\" y=\"' + (padding.top + plotH - paidH - unpaidH - overdueH) + '\" width=\"' + barWidth +\n        '\" height=\"' + overdueH + '\" fill=\"url(#gradOverdue)\" rx=\"3\"/>';\n    }\n\n    // مقدار بالای میله\n    if (total > 0) {\n      svgContent += '<text x=\"' + (x + barWidth / tion(loan) {\n    (loan.schedule || []).forEach(function(inst) {\n      const jdn = jalaliToJDN(inst.date.jy, inst.date.jm, inst.date.jd);\n      if (minDate === null || jdn < minDate) minDate = jdn;\n      if (maxDate === null || jdn > maxDate) maxDate = jdn;\n    });\n  });\n\n  if (minDate === null) {\n    svg.innerHTML = '<text x=\"400\" y=\"170\" text-anchor=\"middle\" font-size=\"14\" fill=\"' +\n      colors.muted + '\" font-family=\"Vazirmatn\">داده‌ای برای نمایش نیست<\/text>';\n    return;\n  }\n\n  const todayJdn = jalaliToJDN(today.jy, today.jm, today.jd);\n  maxDate = Math.max(maxDate, todayJdn);\n\n  // جمع ماه به ماه\n  const monthlyData = {}; // key: jy*12+jm\n  loans.forEach(function(loan) {\n    (loan.schedule || []).forEach(function(inst) {\n      const key = inst.date.jy * 12 + inst.date.jm;\n      if (!monthlyData[key]) monthlyData[key] = { paid: 0, planned: 0 };\n      monthlyData[key].planned += inst.amount;\n      if (inst.isPaid) monthlyData[key].paid += inst.amount;\n    });\n  });\n\n  // ساخت آرایه زمانی\n  const minJl = jdnToJalali(minDate);\n  const maxJl = jdnToJalali(maxDate);\n  const startKey = minJl.jy * 12 + minJl.jm;\n  const endKey = maxJl.jy * 12 + maxJl.jm;\n\n  const labels = [];\n  const cumulativePaid = [];\n  const cumulativePlanned = [];\n  let sumPaid = 0, sumPlanned = 0;\n\n  for (let k = startKey; k <= endKey; k++) {\n    const d = monthlyData[k] || { paid: 0, planned: 0 };\n    sumPaid += d.paid;\n    sumPlanned += d.planned;\n    cumulativePaid.push(sumPaid);\n    cumulativePlanned.push(sumPlanned);\n    const y = Math.floor(k / 12);\n    const m = (k % 12) + 1;\n    labels.push({ jy: y, jm: m });\n  }\n\n  const maxVal = Math.max(sumPlanned, sumPaid, 1);\n  const W = 800, H = 340;\n  const padding = { top: 30, right: 20, bottom: 60, left: 60 };\n  const plotW = W - padding.left - padding.right;\n  const plotH = H - padding.top - padding.bottom;\n\n  let svgContent = '';\n\n  // خطوط شبکه\n  for (let i = 0; i <= 4; i+ class=\"loan-bar-remaining\" style=\"width:' + remainPct + '%\"><\/div>' : '') +\n      '<\/div>' +\n      '<div class=\"loan-bar-labels\">' +\n        '<span style=\"color:var(--success);\">✓ ' + fmt(paidAmt) + '<\/span>' +\n        (overdueAmt > 0 ? '<span style=\"color:var(--danger);\">⚠ ' + fmt(overdueAmt) + '<\/span>' : '') +\n        '<span style=\"color:var(--warning);\">⏳ ' + fmt(remainAmt) + '<\/span>' +\n      '<\/div>';\n    container.appendChild(item);\n  });\n}\n\nfunction renderPieChart() {\n  if (loans.length === 0) {\n    document.getElementById('pieChart').style.background = 'var(--bg)';\n    document.getElementById('pieLegend').innerHTML = '<div style=\"color:var(--muted);\">وامی وجود ندارد<\/div>';\n    return;\n  }\n  const colors = ['#4f6bff','#10b981','#f59e0b','#ef4444','#8b5cf6','#06b6d4','#ec4899','#84cc16','#f97316','#6366f1'];\n  const total = loans.reduce(function(s, l) { return s + (l.P + l.totalInterest); }, 0);\n  let cumulative = 0;\n  const stops = [];\n  let legendHtml = '';\n  loans.forEach(function(loan, i) {\n    const amt = loan.P + loan.totalInterest;\n    const pct = total > 0 ? (amt / total * 100) : 0;\n    const startDeg = cumulative * 3.6;\n    const endDeg = (cumulative + pct) * 3.6;\n    const color = colors[i % colors.length];\n    stops.push(color + ' ' + startDeg + 'deg ' + endDeg + 'deg');\n    cumulative += pct;\n    legendHtml += '<div class=\"pie-legend-item\">' +\n      '<div class=\"pie-legend-color\" style=\"background:' + color + ';\"><\/div>' +\n      '<span>' + escapeHtml(loan.name) + ' — ' + pct.toFixed(1) + '٪<\/span><\/div>';\n  });\n  document.getElementById('pieChart').style.background = 'conic-gradient(' + stops.join(', ') + ')';\n  document.getElementById('pieLegend').innerHTML = legendHtml;\n}\n\nfunction renderOverviewTable(today) {\n  const ov = document.getElementById('overviewBody');\n  ov.innerHTML = '';\n  if (loans.length === 0) {\n    ov.innerHTML = '<tr><td colspan=\"7\" class=\"empty\">هیچ وامی وجود ندارد<\/td><\/tr>';\n    return;\n  }\n  loans.forEach(function(loan) {\n    let loanPaid = 0, loanOverdue = 0;\n    (loan.schedule || []).forEach(function(inst) {\n      if (inst.isPaid) loanPaid += inst.amount || 0;\n      else if (compareJalali(inst.date, today) < 0) loanOverdue += inst.amount || 0;\n    });\n    const total = (loan.P || 0) + (loan.totalInterest || 0);\n    const remaining = total - loanPaid;\n    const pct = total > 0 ? (loanPaid / total * 100) : 0;\n    const info = getLoanEndInfo(loan);\n    let monthsLeftHtml = '';\n    if (info && !info.isFinished) {\n      const last = loan.schedule[loan.schedule.length - 1];\n      const ml = (last.date.jy * 12 + last.date.jm) - (today.jy * 12 + today.jm);\n      if (ml >= 0) monthsLeftHtml = ' <span style=\"font-size:11px;color:var(--muted);\">(' + ml + ' ماه)<\/span>';\n    }\n    const endHtml = info\n      ? '<div style=\"font-size:12px;\">' + info.endDate + monthsLeftHtml + '<\/div>' +\n        (info.isFinished ? '<div style=\"font-size:11px;color:var(--success);font-weight:700;\">✓ تسویه<\/div>' : '')\n      : '-';\n    const tr = document.createElement('tr');\n    tr.innerHTML =\n      '<td><strong>' + escapeHtml(loan.name) + '<\/strong><\/td>' +\n      '<td>' + fmt(total) + '<\/td>' +\n      '<td style=\"color:var(--success);font-weight:700;\">' + fmt(loanPaid) + '<\/td>' +\n      '<td style=\"color:var(--warning);font-weight:700;\">' + fmt(remaining) + '<\/td>' +\n      '<td style=\"color:' + (loanOverdue > 0 ? 'var(--danger)' : 'var(--muted)') + ';font-weight:700;\">' + fmt(loanOverdue) + '<\/td>' +\n      '<td>' + endHtml + '<\/td>' +\n      '<td><span style=\"font-size:11px;font-weight:700;\">' + pct.toFixed(0) + '٪<\/span>' +\n        '<div class=\"mini-progress\"><div style=\"width:' + pct + '%\"><\/div><\/div><\/td>';\n    ov.appendChild(tr);\n  });\n}\n\nfunction getAvailableMonths() {\n  const months = {};\n  loans.forEach(function(loan) {\n    (loan.schedule || []).forEach(function(inst) {\n      const key = inst.date.jy * 12 + inst.date.jm;\n      if (!months[key]) months[key] = { jy: inst.date.jy, jm: inst.date.jm };\n    });\n  });\n  return Object.keys(months).map(function(k) { return months[k]; })\n    .sort(function(a, b) { return (a.jy*12 + a.jm) - (b.jy*12 + b.jm); });\n}\nfunction initReportMonth() {\n  if (reportYear === 0) {\n    const t = todayJalali();\n    reportYear = t.jy; reportMonth = t.jm;\n  }\n}\nfunction onReportMonthChange() {\n  const val = document.getElementById('reportMonthSelect').value;\n  if (!val) return;\n  const p = val.split('-');\n  reportYear = parseInt(p[0]);\n  reportMonth = parseInt(p[1]);\n  renderMonthlyReport();\n}\nfunction changeReportMonth(dir) {\n  initReportMonth();\n  let m = reportMonth + dir, y = reportYear;\n  if (m > 12) { m = 1; y++; }\n  if (m < 1) { m = 12; y--; }\n  reportMonth = m; reportYear = y;\n  renderMonthlyReport();\n}\nfunction renderMonthlyReport() {\n  initReportMonth();\n  const sel = document.getElementById('reportMonthSelect');\n  const available = getAvailableMonths();\n  let found = false, html = '';\n  available.forEach(function(m) {\n    const s = (m.jy === reportYear && m.jm === reportMonth);\n    if (s) found = true;\n    html += '<option value=\"' + m.jy + '-' + m.jm + '\"' + (s ? ' selected' : '') + '>' +\n      jMonths[m.jm-1] + ' ' + m.jy + '<\/option>';\n  });\n  if (!found) html = '<option value=\"' + reportYear + '-' + reportMonth + '\" selected>' +\n    jMonths[reportMonth-1] + ' ' + reportYear + '<\/option>' + html;\n  sel.innerHTML = html;\n\n  const items = [];\n  loans.forEach(function(loan) {\n    (loan.schedule || []).forEach(function(inst, idx) {\n      if (inst.date.jy === reportYear && inst.date.jm === reportMonth) {\n        const today = todayJalali();\n        const overdue = !inst.isPaid && compareJalali(inst.date, today) < 0;\n        items.push({ loan: loan, inst: inst, scheduleIndex: idx, overdue: overdue });\n      }\n    });\n  });\n  items.sort(function(a, b) { return a.inst.date.jd - b.inst.date.jd; });\n\n  let totalAmount = 0, totalPaid = 0, totalUnpaid = 0, totalOverdue = 0;\n  let pc = 0, uc = 0, oc = 0;\n  items.forEach(function(x) {\n    totalAmount += x.inst.amount;\n    if (x.inst.isPaid) { totalPaid += x.inst.amount; pc++; }\n    else {\n      totalUnpaid += x.inst.amount; uc++;\n      if (x.overdue) { totalOverdue += x.inst.amount; oc++; }\n    }\n  });\n  document.getElementById('monthSummary').innerHTML =\n    '<div class=\"month-stat total\"><div class=\"label\">جمع کل<\/div><div class=\"value\">' + fmt(totalAmount) + '<\/div><\/div>' +\n    '<div class=\"month-stat paid\"><div class=\"label\">پرداخت‌شده (' + pc + ')<\/div><div class=\"value\">' + fmt(totalPaid) + '<\/div><\/div>' +\n    '<div class=\"month-stat unpaid\"><div class=\"label\">پرداخت‌نشده (' + uc + ')<\/div><div class=\"value\">' + fmt(totalUnpaid) + '<\/div><\/div>' +\n    '<div class=\"month-stat overdue\"><div class=\"label\">معوق (' + oc + ')<\/div><div class=\"value\">' + fmt(totalOverdue) + '<\/div><\/div>' +\n    '<div class=\"month-stat count\"><div class=\"label\">تعداد اقساط<\/div><div class=\"value\">' + items.length + '<\/div><\/div>';\n\n  const container = document.getElementById('monthInstallments');\n  if (items.length === 0) {\n    container.innerHTML = '<div class=\"month-empty\">در این ماه قسطی وجود ندارد<\/div>';\n    return;\n  }\n  container.innerHTML = items.map(function(item) {\n    const cls = item.inst.isPaid ? 'paid' : (item.overdue ? 'overdue' : 'pending');\n    const status = item.inst.isPaid ? '✓ پرداخت شده' : (item.overdue ? '⚠️ معوق' : 'در انتظار');\n    const pd = (item.inst.isPaid && item.inst.paidDate)\n      ? '<div class=\"paid-date\">تاریخ پرداخت: ' + item.inst.paidDate + '<\/div>' : '';\n    return '<div class=\"installment-row ' + cls + '\">' +\n      '<div class=\"installment-info\"><div class=\"title\">' + escapeHtml(item.loan.name) + ' — قسط ' + item.inst.index + '<\/div>' +\n        '<div class=\"meta\">سررسید: ' + item.inst.dateStr + ' • ' + status + '<\/div>' + pd + '<\/div>' +\n      '<div class=\"installment-amount\">' + fmt(item.inst.amount) + ' تومان<\/div>' +\n      '<button class=\"toggle-btn ' + (item.inst.isPaid ? 'paid' : '') +\n        '\" onclick=\"toggleMonthPaid(\\'' + item.loan.id + '\\',' + item.scheduleIndex + ')\">' +\n        (item.inst.isPaid ? '✓' : 'پرداخت') + '<\/button><\/div>';\n  }).join('');\n}\nfunction toggleMonthPaid(loanId, scheduleIndex) {\n  const loan = loans.find(function(l) { return l.id === loanId; });\n  if (!loan) return;\n  const inst = loan.schedule[scheduleIndex];\n  if (inst.isPaid) {\n    if (!confirm('پرداخت قسط ' + inst.index + ' لغو شود؟')) return;\n    inst.isPaid = false;\n    inst.paidDate = null;\n    saveLoans();\n    renderMonthlyReport();\n    renderAlert();\n  } else {\n    showPaymentDateModal(loanId, scheduleIndex);\n  }\n}\n\nfunction exportData() {\n  const data = { version: 3, exportDate: new Date().toISOString(), loans: loans };\n  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });\n  const url = URL.createObjectURL(blob);\n  const a = document.createElement('a');\n  const today = todayJalali();\n  a.href = url;\n  a.download = 'loans-backup-' + formatJalali(today.jy, today.jm, today.jd).replace(/\\//g, '-') + '.json';\n  document.body.appendChild(a);\n  a.click();\n  document.body.removeChild(a);\n  URL.revokeObjectURL(url);\n}\n\nfunction importData() {\n  const input = document.createElement('input');\n  input.type = 'file';\n  input.accept = '.json,application/json';\n  input.onchange = function(e) {\n    const file = e.target.files[0];\n    if (!file) return;\n    const reader = new FileReader();\n    reader.onload = function(ev) {\n      try {\n        const data = JSON.parse(ev.target.result);\n        const importedLoans = data.loans || data;\n        if (!Array.isArray(importedLoans)) throw new Error('ساختار فایل معتبر نیست');\n        if (importedLoans.length === 0) throw new Error('فایل حاوی وامی نیست');\n        const mode = confirm('داده‌ها ادغام شوند؟\\n\\nتایید = ادغام\\nانصراف = جایگزینی کامل');\n        if (mode) {\n          importedLoans.forEach(function(il) {\n            const existing = loans.findIndex(function(l) { return l.id === il.id; });\n            if (existing >= 0) loans[existing] = il;\n            else { if (!il.id) il.id = uid(); loans.push(il); }\n          });\n        } else {\n          loans = importedLoans.map(function(l) { if (!l.id) l.id = uid(); return l; });\n        }\n        saveLoans();\n        renderAll();\n        alert('✓ ' + importedLoans.length + ' وام بارگذاری شد.');\n      } catch(err) {\n        alert('خطا در خواندن فایل: ' + err.message);\n      }\n    };\n    reader.readAsText(file);\n  };\n  input.click();\n}\n\nfunction fmt(n) {\n  if (n === null || n === undefined || isNaN(n)) return '0';\n  return Math.round(n).toLocaleString('en-US');\n}\nfunction formatNumberInput(el) {\n  const raw = el.value.replace(/[^\\d]/g, '');\n  if (raw === '') { el.value = ''; return; }\n  el.value = parseInt(raw, 10).toLocaleString('en-US');\n  el.setSelectionRange(el.value.length, el.value.length);\n}\nfunction escapeHtml(s) {\n  return String(s).replace(/[&<>\"']/g, function(c) {\n    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '\"':'&quot;', \"'\":'&#39;' }[c];\n  });\n}\nfunction escapeAttr(s) {\n  return escapeHtml(s).replace(/'/g, '&#39;');\n}\nfunction escapeJs(s) {\n  return String(s).replace(/\\\\/g, '\\\\\\\\').replace(/'/g, \"\\\\'\").replace(/\"/g, '\\\\\"').replace(/\\n/g, '\\\\n');\n}\n\nfunction renderAll() {\n  renderLoansList();\n  renderAlert();\n  if (currentView === 'loanDetail') { renderSummary(); renderBankInfo(); renderTable(); }\n  if (currentView === 'monthlyReport') renderMonthlyReport();\n  if (currentView === 'totalReport') renderTotalReport();\n}\n\nloadTheme();\nrenderAll();\nswitchView('loans');\n<\/script>\n\n<\/body>\n<\/html>",loaded:false,color:'#4f6bff'}
};
const TAB_KEY='combined_active_tab';
function syncTheme(name){
  try{
    const d=APPS[name].frame.contentDocument.documentElement.getAttribute('data-theme')||'light';
    document.documentElement.setAttribute('data-theme',d);
  }catch(e){}
}
function show(name){
  for(const k in APPS){
    const o=APPS[k], on=(k===name);
    if(on && !o.loaded){ o.frame.srcdoc=o.html; o.loaded=true; o.frame.addEventListener('load',()=>watchTheme(k)); }
    o.frame.classList.toggle('on',on);
    o.btn.classList.toggle('active',on);
  }
  document.querySelector('meta[name="theme-color"]').setAttribute('content',APPS[name].color);
  try{localStorage.setItem(TAB_KEY,name)}catch(e){}
  syncTheme(name);
}
function watchTheme(k){
  try{
    const el=APPS[k].frame.contentDocument.documentElement;
    new MutationObserver(()=>{ if(APPS[k].frame.classList.contains('on')) syncTheme(k); })
      .observe(el,{attributes:true,attributeFilter:['data-theme']});
    if(APPS[k].frame.classList.contains('on')) syncTheme(k);
  }catch(e){}
}
let last='journal';
try{ const t=localStorage.getItem(TAB_KEY); if(t&&APPS[t]) last=t; }catch(e){}
show(last);
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',(e)=>{e.preventDefault();deferredPrompt=e;document.getElementById('bInstall').style.display='flex';});
window.addEventListener('appinstalled',()=>{deferredPrompt=null;document.getElementById('bInstall').style.display='none';});
async function installApp(){
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt=null;
  document.getElementById('bInstall').style.display='none';
}
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{});});
}
