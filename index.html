    <p id=\"confirmText\">مطمئنی؟<\/p>\n    <div class=\"confirm-actions\">\n      <button type=\"button\" class=\"btn-cancel\" id=\"confirmCancel\">انصراف<\/button>\n      <button type=\"button\" class=\"btn-confirm\" id=\"confirmOk\">حذف<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n\n<script>\n// ==================== کلیدها ====================\nconst STORAGE_KEY = 'journal_entries_v2';\nconst WORKDAY_KEY = 'journal_workday_v1';\nconst THEME_KEY = 'journal_theme';\nconst TASK_HISTORY_KEY = 'journal_task_history_v1';\nconst GOALS_KEY = 'journal_goals_v2';\nconst JOBS_KEY = 'journal_jobs_v2';\nconst SHIFTS_KEY = 'journal_shifts_v2';\nconst HABITS_KEY = 'journal_habits_v1';\nconst HABITS_DATA_KEY = 'journal_habits_data_v1';\nconst TIMELINE_KEY = 'journal_timeline_v2';\nconst LISTS_KEY = 'journal_lists_v1';\nconst UI_STATE_KEY = 'journal_ui_state_v6';\nconst PLANNER_KEY = 'journal_planner_v1';\nconst STORAGE_KEYS = [STORAGE_KEY, WORKDAY_KEY, THEME_KEY, TASK_HISTORY_KEY, GOALS_KEY, JOBS_KEY, SHIFTS_KEY, HABITS_KEY, HABITS_DATA_KEY, TIMELINE_KEY, LISTS_KEY, UI_STATE_KEY, PLANNER_KEY];\nconst MOODS = ['شاد', 'آرام', 'ناراحت', 'عصبانی', 'خسته', 'هیجان‌زده', 'مضطرب', 'قدردان'];\nconst LEGACY_MOOD_LABELS = { '😊': 'شاد', '😐': 'آرام', '😢': 'ناراحت', '😡': 'عصبانی', '😴': 'خسته', '🤩': 'هیجان‌زده', '😍': 'شاد', '🥰': 'قدردان' };\nconst PERSIAN_MONTHS = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];\nconst SHIFT_NAMES = { M: 'صبح', A: 'عصر', N: 'شب' };\nconst SHIFT_COLORS_DEFAULT = { M: '#ff9500', A: '#007aff', N: '#af52de' };\nconst COLOR_PALETTE = [\n  '#6C63FF', '#ff2d92', '#00c8d4', '#ff9500', '#34c759',\n  '#af52de', '#007aff', '#ff3b30', '#5dd97a', '#ff6b6b',\n  '#4da3ff', '#c77fe8', '#f0a500', '#00a0aa', '#8b5a2b',\n  '#e94c89', '#2ec4b6', '#f77f00', '#5e60ce', '#06d6a0'\n];\nconst LIST_CATEGORIES = {\n  book: { name: 'کتاب', icon: '📚', subPlaceholder: 'نویسنده' },\n  movie: { name: 'فیلم', icon: '🎬', subPlaceholder: 'کارگردان / سال' },\n  travel: { name: 'سفر', icon: '✈️', subPlaceholder: 'مقصد / تاریخ' },\n  skill: { name: 'مهارت', icon: '🎓', subPlaceholder: 'سطح' }\n};\n\nlet entries = [];\nlet workdayData = {};\nlet taskHistory = [];\nlet jobs = [];\nlet shiftsData = {};\nlet timelineData = {};\nlet listsData = { book: [], movie: [], travel: [], skill: [] };\nlet currentView = 'all';\nlet editingId = null;\nlet selectedMood = 'آرام';\nlet currentWorkdayDate = null;\nlet currentTags = [];\nlet currentImages = [];\nlet currentFilterTag = null;\nlet weekStartDate = null;\nlet selectedDayKey = null;\nlet movingTaskIndex = null;\nlet movingTaskFromDate = null;\nlet calWeekStart = null;\nlet calSelectedDay = null;\nlet dpCurrentMonth = null;\nlet dpSelectedDate = null;\nlet currentHistoryFilter = 'all';\nlet editingJobId = null;\nlet editingJobColor = COLOR_PALETTE[0];\nlet shiftMonth = null;\nlet editingShiftDate = null;\nlet tempShifts = {};\nlet editorDate = null;\nlet viewingEntryId = null;\nlet editingTaskTimeIndex = null;\nlet tempAlarm = false;\nlet uiState = { shiftCollapsed: true, workCollapsed: true, notesCollapsed: true, habitCollapsed: true, timelineCollapsed: true };\nlet workdayUiState = { tasks: true, successes: true, gratitudes: true, followups: true, note: true };\nlet alarmTimeouts = {};\nlet timelineDate = null;\nlet editingTimelineBlockId = null;\nlet timelineColorPickerValue = COLOR_PALETTE[0];\nlet currentListTab = 'book';\nlet editingListItemId = null;\nlet listItemStatus = 'wishlist';\nlet reviewPeriod = 'week';\nlet reviewDate = null;\nlet pendingTaskIdx = null;\nlet clockHourInput = null;\nlet clockMinuteInput = null;\nlet clockMode = 'hour';\nlet clockValue = 0;\nlet clockPendingHour = null;\nlet clockPendingMinute = null;\nlet clockPointerStartMode = null;\n\n// ==================== توابع کمکی ====================\nfunction todayKey() {\n  const d = new Date();\n  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;\n}\nfunction dateKey(d) {\n  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;\n}\nfunction keyToDate(key) {\n  const [y, m, d] = key.split('-').map(Number);\n  return new Date(y, m - 1, d);\n}\nfunction dateKeyToPersian(key) {\n  const date = keyToDate(key);\n  return date.toLocaleDateString('fa-IR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });\n}\nfunction shortDate(key) {\n  const date = keyToDate(key);\n  const today = todayKey();\n  if (key === today) return 'امروز';\n  const yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);\n  if (key === dateKey(yesterday)) return 'دیروز';\n  const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate() + 1);\n  if (key === dateKey(tomorrow)) return 'فردا';\n  return date.toLocaleDateString('fa-IR', { month: 'short', day: 'numeric' });\n}\nfunction getDayName(ts) {\n  const d = new Date(ts);\n  const map = { 0: 'یکشنبه', 1: 'دوشنبه', 2: 'سه‌شنبه', 3: 'چهارشنبه', 4: 'پنج‌شنبه', 5: 'جمعه', 6: 'شنبه' };\n  return map[d.getDay()];\n}\nfunction getShortDayName(d) {\n  const map = { 0: 'ی', 1: 'د', 2: 'س', 3: 'چ', 4: 'پ', 5: 'ج', 6: 'ش' };\n  return map[d.getDay()];\n}\nfunction getFullPersianDate(ts) {\n  return new Date(ts).toLocaleDateString('fa-IR', { year: 'numeric', month: 'long', day: 'numeric' });\n}\nfunction getPersianYearOnly(ts) {\n  return new Date(ts).toLocaleDateString('fa-IR', { year: 'numeric' });\n}\nfunction getPersianDayNum(ts) {\n  return new Date(ts).toLocaleDateString('fa-IR', { day: 'numeric' });\n}\nfunction getTime(ts) {\n  return new Date(ts).toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });\n}\nfunction getWeekStart(date) {\n  const d = new Date(date);\n  const day = d.getDay();\n  const diff = (day === 6) ? 0 : (day + 1);\n  d.setDate(d.getDate() - diff);\n  d.setHours(0, 0, 0, 0);\n  return d;\n}\nfunction getWeekDays(startDate) {\n  const days = [];\n  for (let i = 0; i < 7; i++) {\n    const d = new Date(startDate);\n    d.setDate(d.getDate() + i);\n    days.push(d);\n  }\n  return days;\n}\nfunction formatTimeHM(h, m) {\n  return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;\n}\nfunction timeToMinutes(h, m) { return h * 60 + m; }\nfunction addDaysToKey(key, days) {\n  const d = keyToDate(key);\n  d.setDate(d.getDate() + days);\n  return dateKey(d);\n}\n\n// ==================== ذخیره/بازیابی ====================\nconst STORAGE_DB_NAME = 'journal-app-storage';\nconst STORAGE_DB_VERSION = 1;\nconst STORAGE_STORE_NAME = 'keyValue';\nconst storageCache = new Map();\nlet storageDatabase = null;\n\nfunction readLegacyStorageValue(key) {\n  try { return localStorage.getItem(key); }\n  catch (error) { return null; }\n}\nfunction readDatabaseValue(database, key) {\n  return new Promise((resolve, reject) => {\n    const request = database.transaction(STORAGE_STORE_NAME, 'readonly').objectStore(STORAGE_STORE_NAME).get(key);\n    request.onsuccess = () => resolve(request.result ? request.result.value : undefined);\n    request.onerror = () => reject(request.error);\n  });\n}\nfunction writeDatabaseValue(database, key, value) {\n  return new Promise((resolve, reject) => {\n    const transaction = database.transaction(STORAGE_STORE_NAME, 'readwrite');\n    transaction.objectStore(STORAGE_STORE_NAME).put({ key, value });\n    transaction.oncomplete = resolve;\n    transaction.onerror = () => reject(transaction.error);\n    transaction.onabort = () => reject(transaction.error || new Error('IndexedDB transaction aborted'));\n  });\n}\nfunction openStorageDatabase() {\n  if (!('indexedDB' in window)) return Promise.resolve(null);\n  return new Promise(resolve => {\n    const request = indexedDB.open(STORAGE_DB_NAME, STORAGE_DB_VERSION);\n    request.onupgradeneeded = () => {\n      const database = request.result;\n      if (!database.objectStoreNames.contains(STORAGE_STORE_NAME)) database.createObjectStore(STORAGE_STORE_NAME, { keyPath: 'key' });\n    };\n    request.onsuccess = () => {\n      request.result.onversionchange = () => request.result.close();\n      resolve(request.result);\n    };\n    request.onerror = () => {\n      console.warn('IndexedDB در دسترس نیست؛ ذخیره‌سازی محلی استفاده می‌شود.', request.error);\n      resolve(null);\n    };\n  });\n}\nasync function initializeAppStorage() {\n  storageDatabase = await openStorageDatabase();\n  for (const key of STORAGE_KEYS) {\n    let value;\n    if (storageDatabase) {\n      try { value = await readDatabaseValue(storageDatabase, key); }\n      catch (error) { console.warn('خواندن از IndexedDB ناموفق بود.', error); }\n    }\n    if (value === undefined || value === null) {\n      value = readLegacyStorageValue(key);\n      if (value !== null && storageDatabase) {\n        try {\n          await writeDatabaseValue(storageDatabase, key, value);\n          try { localStorage.removeItem(key); } catch (error) {}\n        }\n        catch (error) { console.warn('مهاجرت داده به IndexedDB ناموفق بود.', error); }\n      }\n    }\n    if (value !== undefined && value !== null) storageCache.set(key, value);\n  }\n}\nfunction appStorageGetItem(key) {\n  if (storageCache.has(key)) return storageCache.get(key);\n  return storageDatabase ? null : readLegacyStorageValue(key);\n}\nfunction appStorageSetItem(key, value) {\n  const stringValue = String(value);\n  storageCache.set(key, stringValue);\n  if (storageDatabase) {\n    writeDatabaseValue(storageDatabase, key, stringValue).catch(error => {\n      console.error('ذخیره در IndexedDB ناموفق بود.', error);\n      try { localStorage.setItem(key, stringValue); } catch (fallbackError) {}\n    });\n    return;\n  }\n  try { localStorage.setItem(key, stringValue); }\n  catch (error) { console.error('ذخیره‌سازی محلی در دسترس نیست.', error); }\n}\n\nfunction isStoredRecord(value) {\n  return value !== null && typeof value === 'object' && !Array.isArray(value);\n}\nfunction readStoredValue(key, fallback, isValid) {\n  try {\n    const raw = appStorageGetItem(key);\n    if (raw === null) return fallback;\n    const value = JSON.parse(raw);\n    return isValid(value) ? value : fallback;\n  } catch (error) {\n    return fallback;\n  }\n}\nfunction loadData() {\n  entries = readStoredValue(STORAGE_KEY, [], Array.isArray);\n  workdayData = readStoredValue(WORKDAY_KEY, {}, isStoredRecord);\n  taskHistory = readStoredValue(TASK_HISTORY_KEY, [], Array.isArray);\n  jobs = readStoredValue(JOBS_KEY, [], Array.isArray);\n  shiftsData = readStoredValue(SHIFTS_KEY, {}, isStoredRecord);\n  timelineData = readStoredValue(TIMELINE_KEY, {}, isStoredRecord);\n  const savedLists = readStoredValue(LISTS_KEY, {}, isStoredRecord);\n  listsData = { book: [], movie: [], travel: [], skill: [], ...savedLists };\n  const savedUi = readStoredValue(UI_STATE_KEY, {}, isStoredRecord);\n  uiState = { shiftCollapsed: true, workCollapsed: true, notesCollapsed: true, habitCollapsed: true, timelineCollapsed: true, ...savedUi };\n  ['shiftCollapsed', 'workCollapsed', 'notesCollapsed', 'habitCollapsed', 'timelineCollapsed'].forEach(key => { uiState[key] = true; });\n  if (isStoredRecord(savedUi.workdayUiState)) workdayUiState = { ...workdayUiState, ...savedUi.workdayUiState };\n  Object.keys(workdayUiState).forEach(key => { workdayUiState[key] = true; });\n}\nfunction saveEntries() { appStorageSetItem(STORAGE_KEY, JSON.stringify(entries)); }\nfunction saveWorkday() { appStorageSetItem(WORKDAY_KEY, JSON.stringify(workdayData)); }\nfunction saveHistory() { appStorageSetItem(TASK_HISTORY_KEY, JSON.stringify(taskHistory)); }\nfunction saveJobs() { appStorageSetItem(JOBS_KEY, JSON.stringify(jobs)); }\nfunction saveShifts() { appStorageSetItem(SHIFTS_KEY, JSON.stringify(shiftsData)); }\nfunction saveTimeline() { appStorageSetItem(TIMELINE_KEY, JSON.stringify(timelineData)); }\nfunction saveLists() { appStorageSetItem(LISTS_KEY, JSON.stringify(listsData)); }\nfunction saveUiState() { appStorageSetItem(UI_STATE_KEY, JSON.stringify({ ...uiState, workdayUiState })); }\n\nfunction addHistory(type, task, fromDate = null, toDate = null) {\n  taskHistory.unshift({ id: Date.now() + Math.random(), type, task, from: fromDate, to: toDate, at: Date.now() });\n  if (taskHistory.length > 500) taskHistory = taskHistory.slice(0, 500);\n  saveHistory();\n}\nfunction getJobById(id) { return jobs.find(j => j.id === id); }\nfunction getShiftJobIds(date, letter) {\n  const s = shiftsData[date];\n  if (!s) return [];\n  return Array.isArray(s[letter]) ? s[letter] : [];\n}\nfunction getJobShiftRange(job, letter) {\n  if (!job.hours || !job.hours[letter]) return null;\n  const h = job.hours[letter];\n  if (h.startH === undefined || h.endH === undefined) return null;\n  const startMin = timeToMinutes(h.startH, h.startM || 0);\n  const endMin = timeToMinutes(h.endH, h.endM || 0);\n  if (startMin === endMin) return null;\n  if (endMin > startMin) return { start: startMin, end: endMin, overnight: false };\n  return { start: startMin, end: endMin + 24 * 60, overnight: true };\n}\n\n// ==================== تم ====================\nfunction loadTheme() {\n  const theme = appStorageGetItem(THEME_KEY) || 'light';\n  document.documentElement.setAttribute('data-theme', theme);\n  updateThemeUI(theme);\n}\nfunction toggleTheme() {\n  const current = document.documentElement.getAttribute('data-theme');\n  const next = current === 'dark' ? 'light' : 'dark';\n  document.documentElement.setAttribute('data-theme', next);\n  appStorageSetItem(THEME_KEY, next);\n  updateThemeUI(next);\n}\nfunction updateThemeUI(theme) {\n  const icon = theme === 'dark' ? '☀️' : '🌙';\n  const txt = theme === 'dark' ? 'حالت روشن' : 'حالت تاریک';\n  document.getElementById('themeBtn').textContent = icon;\n  document.getElementById('settingsThemeIcon').textContent = icon;\n  document.getElementById('settingsThemeLabel').textContent = txt;\n}\n\n// ==================== نوار هفتگی ====================\nfunction renderWeekStrip() {\n  if (!weekStartDate) weekStartDate = getWeekStart(new Date());\n  const days = getWeekDays(weekStartDate);\n  const container = document.getElementById('weekDays');\n  const today = todayKey();\n  container.innerHTML = days.map(d => {\n    const key = dateKey(d);\n    const isToday = key === today;\n    const isActive = key === selectedDayKey;\n    const shiftLetters = [];\n    ['M', 'A', 'N'].forEach(letter => {\n      const jobIds = getShiftJobIds(key, letter);\n      jobIds.forEach(jobId => {\n        const job = getJobById(jobId);\n        const color = job ? job.color : SHIFT_COLORS_DEFAULT[letter];\n        shiftLetters.push(`<span class=\"shift-letter\" style=\"background: ${color};\">${letter}<\/span>`);\n      });\n    });\n    return `<button class=\"week-day ${isActive ? 'active' : ''} ${isToday ? 'today' : ''}\" data-date=\"${key}\"><span class=\"day-name\">${getShortDayName(d)}<\/span><span class=\"day-num\">${getPersianDayNum(d)}<\/span>${shiftLetters.length ? `<div class=\"day-shifts\">${shiftLetters.join('')}<\/div>` : ''}<\/button>`;\n  }).join('');\n  container.querySelectorAll('.week-day').forEach(btn => btn.addEventListener('click', () => {\n    const key = btn.dataset.date;\n    if (selectedDayKey === key) selectedDayKey = null;\n    else selectedDayKey = key;\n    renderWeekStrip(); updateQuickActions(); render();\n  }));\n}\nfunction goToPrevWeek() { weekStartDate.setDate(weekStartDate.getDate() - 7); renderWeekStrip(); }\nfunction goToNextWeek() { weekStartDate.setDate(weekStartDate.getDate() + 7); renderWeekStrip(); }\nfunction updateQuickActions() {\n  const qa = document.getElementById('quickActions');\n  qa.classList.add('show');\n  qa.classList.toggle('show-day-actions', Boolean(selectedDayKey));\n  document.getElementById('quickDayLabel').textContent = selectedDayKey ? '📅 ' + shortDate(selectedDayKey) : '📅 امروز';\n}\nfunction setupSwipe() {\n  const main = document.getElementById('mainContent');\n  let touchStartX = 0, touchStartY = 0, touchStartTime = 0;\n  main.addEventListener('touchstart', (e) => {\n    if (!selectedDayKey) return;\n    touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY; touchStartTime = Date.now();\n  }, { passive: true });\n  main.addEventListener('touchend', (e) => {\n    if (!selectedDayKey) return;\n    const touchEndX = e.changedTouches[0].clientX;\n    const touchEndY = e.changedTouches[0].clientY;\n    const diffX = touchEndX - touchStartX;\n    const diffY = touchEndY - touchStartY;\n    const duration = Date.now() - touchStartTime;\n    if (duration > 600 || Math.abs(diffX) < 60 || Math.abs(diffY) > Math.abs(diffX)) return;\n    if (diffX > 0) { selectedDayKey = addDaysToKey(selectedDayKey, -1); main.classList.add('slide-from-left'); }\n    else { selectedDayKey = addDaysToKey(selectedDayKey, 1); main.classList.add('slide-from-right'); }\n    const newDate = keyToDate(selectedDayKey);\n    const currentWeekStart = getWeekStart(weekStartDate);\n    const newWeekStart = getWeekStart(newDate);\n    if (newWeekStart.getTime() !== currentWeekStart.getTime()) weekStartDate = newWeekStart;\n    renderWeekStrip(); updateQuickActions(); render();\n    setTimeout(() => main.classList.remove('slide-from-left', 'slide-from-right'), 350);\n  }, { passive: true });\n}\n\n// ==================== تایم‌لاین: ادغام ====================\nfunction getMergedTimelineBlocks(dateKeyValue) {\n  const rawItems = [];\n\n  // ۱) شیفت‌های امروز\n  const todayShifts = shiftsData[dateKeyValue] || {};\n  ['M', 'A', 'N'].forEach(letter => {\n    const jobIds = todayShifts[letter] || [];\n    jobIds.forEach(jobId => {\n      const job = getJobById(jobId);\n      if (!job) return;\n      const range = getJobShiftRange(job, letter);\n      if (!range) return;\n      if (!range.overnight) {\n        rawItems.push({ startMin: range.start, endMin: range.end, text: `${SHIFT_NAMES[letter]} — ${job.name}`, note: '', color: job.color || SHIFT_COLORS_DEFAULT[letter], isShift: true, letter, jobName: job.name });\n      } else {\n        rawItems.push({ startMin: range.start, endMin: 24 * 60, text: `${SHIFT_NAMES[letter]} — ${job.name} (ادامه در فردا)`, note: '', color: job.color || SHIFT_COLORS_DEFAULT[letter], isShift: true, letter, jobName: job.name, overnightPart: 1 });\n      }\n    });\n  });\n\n  // ۲) شیفت‌های دیروز که تا امروز ادامه دارن\n  const yesterdayKey = addDaysToKey(dateKeyValue, -1);\n  const yesterdayShifts = shiftsData[yesterdayKey] || {};\n  ['M', 'A', 'N'].forEach(letter => {\n    const jobIds = yesterdayShifts[letter] || [];\n    jobIds.forEach(jobId => {\n      const job = getJobById(jobId);\n      if (!job) return;\n      const range = getJobShiftRange(job, letter);\n      if (!range || !range.overnight) return;\n      const endMin = range.end - 24 * 60;\n      if (endMin > 0) {\n        rawItems.push({ startMin: 0, endMin: endMin, text: `${SHIFT_NAMES[letter]} — ${job.name} (ادامه از دیروز)`, note: '', color: job.color || SHIFT_COLORS_DEFAULT[letter], isShift: true, letter, jobName: job.name, overnightPart: 2 });\n      }\n    });\n  });\n\n  // ۳) فعالیت‌های دستی\n  const manual = timelineData[dateKeyValue] || [];\n  manual.forEach(item => {\n    const startMin = timeToMinutes(item.startH, item.startM || 0);\n    const endMin = timeToMinutes(item.endH, item.endM || 0);\n    if (endMin <= startMin) return;\n    rawItems.push({ startMin, endMin, text: item.text, note: item.note || '', color: item.color || COLOR_PALETTE[0], isShift: false, id: item.id, fromTaskIdx: item.fromTaskIdx });\n  });\n\n  // مرتب‌سازی بر اساس زمان شروع\n  rawItems.sort((a, b) => a.startMin - b.startMin);\n\n  // به جای ادغام، همه را برمی‌گردانیم\n  return rawItems;\n}\nfunction getEmptyRanges(blocks) {\n  const result = [];\n  const covered = new Array(24 * 60).fill(false);\n  blocks.forEach(b => {\n    const start = Math.max(0, b.startMin);\n    const end = Math.min(24 * 60, b.endMin);\n    for (let m = start; m < end; m++) covered[m] = true;\n  });\n  let cursor = 0;\n  while (cursor < 24 * 60) {\n    if (!covered[cursor]) {\n      let start = cursor;\n      while (cursor < 24 * 60 && !covered[cursor]) cursor++;\n      result.push({ startMin: start, endMin: cursor });\n    } else {\n      cursor++;\n    }\n  }\n  return result;\n}\n\n// ==================== تایم‌لاین: صفحه ====================\nfunction openTimelinePage(dateKeyValue = null) {\n  timelineDate = dateKeyValue || selectedDayKey || todayKey();\n  renderTimelinePage();\n  document.getElementById('timelinePage').classList.add('open');\n  document.body.style.overflow = 'hidden';\n}\nfunction closeTimelinePage() {\n  document.getElementById('timelinePage').classList.remove('open');\n  document.body.style.overflow = '';\n}\nfunction renderTimelinePage() {\n  const date = keyToDate(timelineDate);\n  document.getElementById('timelineDateLabel').textContent = date.toLocaleDateString('fa-IR', { year: 'numeric', month: 'long', day: 'numeric' });\n  document.getElementById('timelineDayName').textContent = getDayName(date);\n\n  const blocks = getMergedTimelineBlocks(timelineDate);\n  const emptyRanges = getEmptyRanges(blocks);\n  const now = new Date();\n  const nowMinutes = timeToMinutes(now.getHours(), now.getMinutes());\n  const isToday = timelineDate === todayKey();\n\n  const totalActivity = blocks.length;\n  const shiftBlocks = blocks.filter(b => b.isShift).length;\n  const manualBlocks = totalActivity - shiftBlocks;\n  let totalMinutesBusy = 0;\n  blocks.forEach(b => {\n    const duration = Math.min(b.endMin, 24*60) - Math.max(b.startMin, 0);\n    if (duration > 0) totalMinutesBusy += duration;\n  });\n  const hoursBusy = Math.round(totalMinutesBusy / 60 * 10) / 10;\n\n  document.getElementById('timelineStats').innerHTML = `\n    <div class=\"timeline-stat\"><div class=\"timeline-stat-value\">${totalActivity}<\/div><div class=\"timeline-stat-label\">بازه<\/div><\/div>\n    <div class=\"timeline-stat\"><div class=\"timeline-stat-value\">${hoursBusy}<\/div><div class=\"timeline-stat-label\">ساعت پر<\/div><\/div>\n    <div class=\"timeline-stat\"><div class=\"timeline-stat-value\">${shiftBlocks}<\/div><div class=\"timeline-stat-label\">شیفت<\/div><\/div>\n    <div class=\"timeline-stat\"><div class=\"timeline-stat-value\">${manualBlocks}<\/div><div class=\"timeline-stat-label\">دستی<\/div><\/div>\n  `;\n\n  const allItems = [];\n  blocks.forEach(b => allItems.push({ type: 'block', data: b }));\n  emptyRanges.forEach(e => allItems.push({ type: 'empty', data: e }));\n  allItems.sort((a, b) => a.data.startMin - b.data.startMin);\n\n  const container = document.getElementById('timelineHours');\n  let html = '';\n\n  allItems.forEach(item => {\n    const startH = Math.floor(item.data.startMin / 60);\n    const startM = item.data.startMin % 60;\n    const endH = Math.floor(item.data.endMin / 60);\n    const endM = item.data.endMin % 60;\n\n    if (item.type === 'empty') {\n      const isEmptyCurrent = isToday && nowMinutes >= item.data.startMin && nowMinutes < item.data.endMin;\n      html += `\n        <div class=\"timeline-empty-range\" data-add-start=\"${item.data.startMin}\" data-add-end=\"${item.data.endMin}\" style=\"${isEmptyCurrent ? 'border-color: var(--primary); background: var(--primary-soft);' : ''}\">\n          <span class=\"er-icon\">➕<\/span>\n          <span>${formatTimeHM(startH, startM)} — ${formatTimeHM(endH === 24 ? 0 : endH, endM)} (خالی)<\/span>\n        <\/div>\n      `;\n    } else {\n      const b = item.data;\n      const isCurrent = isToday && nowMinutes >= b.startMin && nowMinutes < b.endMin;\n      html += `\n        <div class=\"timeline-block has-activity ${isCurrent ? 'current' : ''}\" data-block-id=\"${b.id || ''}\" data-is-shift=\"${b.isShift}\" style=\"border-right: 4px solid ${b.color};\">\n          <div class=\"timeline-block-time\">\n            <span>${formatTimeHM(startH, startM)}<\/span>\n            <span class=\"end-time\">↓<\/span>\n            <span>${formatTimeHM(endH === 24 ? 0 : endH, endM)}<\/span>\n          <\/div>\n          <div class=\"timeline-block-body\">\n            <span class=\"timeline-block-dot\" style=\"background: ${b.color};\"><\/span>\n            <div class=\"timeline-block-activity\">\n              <div class=\"timeline-block-title\">${b.isShift ? '⏰ ' : ''}${escapeHtml(b.text)}<\/div>\n              ${b.note ? `<div class=\"timeline-block-note\">${escapeHtml(b.note)}<\/div>` : ''}\n            <\/div>\n            <div class=\"timeline-block-actions\">\n              ${!b.isShift ? `<button class=\"timeline-block-btn\" data-edit-timeline=\"${b.id}\">✏️<\/button>` : ''}\n              ${!b.isShift ? `<button class=\"timeline-block-btn\" data-delete-timeline=\"${b.id}\">✕<\/button>` : ''}\n            <\/div>\n          <\/div>\n        <\/div>\n      `;\n    }\n  });\n\n  container.innerHTML = html;\n\n  container.querySelectorAll('[data-add-start]').forEach(el => {\n    el.addEventListener('click', () => {\n      const startMin = parseInt(el.dataset.addStart);\n      const endMin = parseInt(el.dataset.addEnd);\n      openTimelineAdd(startMin, endMin);\n    });\n  });\n  container.querySelectorAll('[data-edit-timeline]').forEach(btn => {\n    btn.addEventListener('click', (e) => { e.stopPropagation(); openTimelineEdit(btn.dataset.editTimeline); });\n  });\n  container.querySelectorAll('[data-delete-timeline]').forEach(btn => {\n    btn.addEventListener('click', (e) => {\n      e.stopPropagation();\n      const id = btn.dataset.deleteTimeline;\n      showConfirm('این بازه حذف بشه؟', () => {\n        timelineData[timelineDate] = (timelineData[timelineDate] || []).filter(x => String(x.id) !== String(id));\n        if (timelineData[timelineDate].length === 0) delete timelineData[timelineDate];\n        saveTimeline(); renderTimelinePage();\n        showToast('حذف شد 🗑');\n      });\n    });\n  });\n}\n\nfunction openTimelineAdd(startMin = null, endMin = null, prefillText = '') {\n  pendingTaskIdx = null;\n  const start = startMin !== null ? startMin : timeToMinutes(9, 0);\n  const end = endMin !== null ? endMin : start + 60;\n  const sh = Math.floor(start / 60); const sm = start % 60;\n  const eh = Math.floor(end / 60); const em = end % 60;\n  document.getElementById('timelineAddTitle').textContent = '📍 افزودن به تایم‌لاین';\n  document.getElementById('timelineAddSub').textContent = dateKeyToPersian(timelineDate);\n  document.getElementById('timelineActivityAddInput').value = prefillText || '';\n  document.getElementById('timelineStartHour').value = sh;\n  document.getElementById('timelineStartMinute').value = sm;\n  document.getElementById('timelineEndHour').value = eh === 24 ? 23 : eh;\n  document.getElementById('timelineEndMinute').value = eh === 24 ? 59 : em;\n  document.getElementById('timelineNoteInput').value = '';\n  timelineColorPickerValue = COLOR_PALETTE[0];\n  renderTimelineAddColorPicker();\n  document.getElementById('timelineAddOverlay').classList.add('show');\n}\nfunction closeTimelineAdd() {\n  document.getElementById('timelineAddOverlay').classList.remove('show');\n  pendingTaskIdx = null;\n}\nfunction renderTimelineAddColorPicker() {\n  const container = document.getElementById('timelineAddColorPicker');\n  container.innerHTML = COLOR_PALETTE.map(c => `<div class=\"color-swatch ${c === timelineColorPickerValue ? 'selected' : ''}\" style=\"background: ${c};\" data-color=\"${c}\"><\/div>`).join('');\n  container.querySelectorAll('.color-swatch').forEach(el => el.addEventListener('click', () => { timelineColorPickerValue = el.dataset.color; renderTimelineAddColorPicker(); }));\n}\nfunction saveTimelineAdd() {\n  const sh = parseInt(document.getElementById('timelineStartHour').value);\n  const sm = parseInt(document.getElementById('timelineStartMinute').value) || 0;\n  const eh = parseInt(document.getElementById('timelineEndHour').value);\n  const em = parseInt(document.getElementById('timelineEndMinute').value) || 0;\n  const note = document.getElementById('timelineNoteInput').value.trim();\n  const activityText = document.getElementById('timelineActivityAddInput').value.trim();\n  \n  if (isNaN(sh) || isNaN(eh)) { showToast('ساعت‌ها رو پر کن'); return; }\n  if (sh < 0 || sh > 23 || eh < 0 || eh > 23 || sm < 0 || sm > 59 || em < 0 || em > 59) { showToast('مقادیر نامعتبر'); return; }\n  const startMin = timeToMinutes(sh, sm);\n  const endMin = timeToMinutes(eh, em);\n  if (endMin <= startMin) { showToast('ساعت پایان باید بعد از شروع باشه'); return; }\n\n  if (!timelineData[timelineDate]) timelineData[timelineDate] = [];\n  const item = {\n    id: 'tl_' + Date.now(),\n    startH: sh, startM: sm, endH: eh, endM: em,\n    text: activityText || 'فعالیت',\n    note: note,\n    color: timelineColorPickerValue\n  };\n\n  if (pendingTaskIdx !== null && currentWorkdayDate) {\n    const taskText = document.getElementById(`task${pendingTaskIdx + 1}`).value.trim();\n    if (taskText) {\n      item.text = taskText;\n      item.fromTaskIdx = pendingTaskIdx;\n    }\n  }\n\n  timelineData[timelineDate].push(item);\n  saveTimeline(); closeTimelineAdd(); renderTimelinePage();\n  if (currentWorkdayDate) updateTaskTimelineIndicators();\n  render();\n  showToast('ثبت شد ✓');\n}\n\nfunction openTimelineEdit(id) {\n  const list = timelineData[timelineDate] || [];\n  const item = list.find(x => String(x.id) === String(id));\n  if (!item) { showToast('پیدا نشد'); return; }\n  editingTimelineBlockId = id;\n  document.getElementById('timelineActivityInput').value = item.text || '';\n  document.getElementById('timelineNoteEditInput').value = item.note || '';\n  document.getElementById('timelineEditStartHour').value = item.startH;\n  document.getElementById('timelineEditStartMinute').value = item.startM || 0;\n  document.getElementById('timelineEditEndHour').value = item.endH;\n  document.getElementById('timelineEditEndMinute').value = item.endM || 0;\n  timelineColorPickerValue = item.color || COLOR_PALETTE[0];\n  renderTimelineColorPicker();\n  document.getElementById('timelineEditOverlay').classList.add('show');\n}\nfunction closeTimelineEdit() {\n  document.getElementById('timelineEditOverlay').classList.remove('show');\n  editingTimelineBlockId = null;\n}\nfunction renderTimelineColorPicker() {\n  const container = document.getElementById('timelineColorPicker');\n  container.innerHTML = COLOR_PALETTE.map(c => `<div class=\"color-swatch ${c === timelineColorPickerValue ? 'selected' : ''}\" style=\"background: ${c};\" data-color=\"${c}\"><\/div>`).join('');\n  container.querySelectorAll('.color-swatch').forEach(el => el.addEventListener('click', () => { timelineColorPickerValue = el.dataset.color; renderTimelineColorPicker(); }));\n}\nfunction saveTimelineEdit() {\n  if (!editingTimelineBlockId) return;\n  const text = document.getElementById('timelineActivityInput').value.trim();\n  if (!text) { showToast('متن رو بنویس'); return; }\n  const note = document.getElementById('timelineNoteEditInput').value.trim();\n  const sh = parseInt(document.getElementById('timelineEditStartHour').value);\n  const sm = parseInt(document.getElementById('timelineEditStartMinute').value) || 0;\n  const eh = parseInt(document.getElementById('timelineEditEndHour').value);\n  const em = parseInt(document.getElementById('timelineEditEndMinute').value) || 0;\n  if (isNaN(sh) || isNaN(eh)) { showToast('ساعت‌ها رو پر کن'); return; }\n  const startMin = timeToMinutes(sh, sm);\n  const endMin = timeToMinutes(eh, em);\n  if (endMin <= startMin) { showToast('ساعت پایان باید بعد از شروع باشه'); return; }\n  const list = timelineData[timelineDate] || [];\n  const idx = list.findIndex(x => String(x.id) === String(editingTimelineBlockId));\n  if (idx === -1) return;\n  list[idx] = { ...list[idx], text, note, startH: sh, startM: sm, endH: eh, endM: em, color: timelineColorPickerValue };\n  saveTimeline(); closeTimelineEdit(); renderTimelinePage();\n  if (currentWorkdayDate) updateTaskTimelineIndicators();\n  render();\n  showToast('ویرایش شد ✓');\n}\nfunction deleteTimelineBlock() {\n  if (!editingTimelineBlockId) return;\n  showConfirm('این بازه حذف بشه؟', () => {\n    timelineData[timelineDate] = (timelineData[timelineDate] || []).filter(x => String(x.id) !== String(editingTimelineBlockId));\n    if (timelineData[timelineDate].length === 0) delete timelineData[timelineDate];\n    saveTimeline(); closeTimelineEdit(); renderTimelinePage();\n    if (currentWorkdayDate) updateTaskTimelineIndicators();\n    render();\n    showToast('حذف شد 🗑');\n  });\n}\n\n// ==================== افزودن تسک به تایم‌لاین ====================\nfunction openTimelineFromTask(taskIdx) {\n  if (!currentWorkdayDate) { showToast('اول روز کاری رو باز کن'); return; }\n  const taskText = document.getElementById(`task${taskIdx + 1}`).value.trim();\n  if (!taskText) { showToast('اول یه کاری بنویس'); return; }\n  const existing = (timelineData[currentWorkdayDate] || []).find(x => x.fromTaskIdx === taskIdx);\n  if (existing) {\n    timelineDate = currentWorkdayDate;\n    openTimelineEdit(existing.id);\n    return;\n  }\n  pendingTaskIdx = taskIdx;\n  const sh = 9 + taskIdx * 2;\n  const start = timeToMinutes(Math.min(sh, 22), 0);\n  const end = start + 60;\n  document.getElementById('timelineAddTitle').textContent = '📍 افزودن تسک به تایم‌لاین';\n  document.getElementById('timelineAddSub').textContent = taskText;\n  document.getElementById('timelineActivityAddInput').value = taskText;\n  document.getElementById('timelineStartHour').value = Math.floor(start / 60);\n  document.getElementById('timelineStartMinute').value = 0;\n  document.getElementById('timelineEndHour').value = Math.floor(end / 60);\n  document.getElementById('timelineEndMinute').value = 0;\n  document.getElementById('timelineNoteInput').value = '';\n  timelineColorPickerValue = COLOR_PALETTE[taskIdx % COLOR_PALETTE.length];\n  renderTimelineAddColorPicker();\n  document.getElementById('timelineAddOverlay').classList.add('show');\n}\n\n// ==================== بررسی عملکرد ====================\nfunction openReviewPage() {\n  if (!reviewDate) reviewDate = new Date();\n  renderReviewPage();\n  document.getElementById('reviewPage').classList.add('open');\n  document.body.style.overflow = 'hidden';\n}\nfunction closeReviewPage() {\n  document.getElementById('reviewPage').classList.remove('open');\n  document.body.style.overflow = '';\n}\nfunction getReviewRange() {\n  const ref = new Date(reviewDate);\n  if (reviewPeriod === 'week') {\n    const start = getWeekStart(ref);\n    const days = getWeekDays(start);\n    const end = new Date(days[6]); end.setHours(23, 59, 59, 999);\n    return { start, end, days, label: `${start.toLocaleDateString('fa-IR', { month: 'long', day: 'numeric' })} تا ${days[6].toLocaleDateString('fa-IR', { month: 'long', day: 'numeric' })}` };\n  } else {\n    const end = new Date(ref); end.setHours(23, 59, 59, 999);\n    const start = new Date(ref); start.setDate(start.getDate() - 29); start.setHours(0, 0, 0, 0);\n    return { start, end, days: null, label: ref.toLocaleDateString('fa-IR', { year: 'numeric', month: 'long' }) };\n  }\n}\nfunction isInRange(dateKeyValue, start, end) {\n  const d = keyToDate(dateKeyValue);\n  return d >= start && d <= end;\n}\nfunction renderReviewPage() {\n  document.querySelectorAll('.review-tab').forEach(tab => tab.classList.toggle('active', tab.dataset.period === reviewPeriod));\n  const range = getReviewRange();\n  document.getElementById('reviewPeriodLabel').textContent = range.label;\n\n  let totalNotes = 0, totalTasksDone = 0, totalTasksTotal = 0, totalShifts = 0, totalTimelineActivity = 0, totalWorkdayFilled = 0;\n  const notesByDate = new Map();\n  entries.forEach(entry => {\n    const key = dateKey(new Date(entry.createdAt));\n    notesByDate.set(key, (notesByDate.get(key) || 0) + 1);\n  });\n  const dayStats = [];\n  const daysArray = reviewPeriod === 'week' ? range.days : [];\n  if (reviewPeriod === 'month') {\n    for (let i = 0; i < 30; i++) {\n      const d = new Date(range.start);\n      d.setDate(d.getDate() + i);\n      daysArray.push(d);\n    }\n  }\n  daysArray.forEach(d => {\n    const key = dateKey(d);\n    if (!isInRange(key, range.start, range.end)) return;\n    const dayNotes = notesByDate.get(key) || 0;\n    const dayWorkday = workdayData[key] || {};\n    const dayTasksDone = (dayWorkday.tasksDone || []).filter(Boolean).length;\n    const dayTasksTotal = (dayWorkday.tasks || []).filter(t => t && t.trim()).length;\n    const dayShifts = ['M','A','N'].reduce((sum, l) => sum + (getShiftJobIds(key, l).length), 0);\n    const dayTimeline = (timelineData[key] || []).length;\n    totalNotes += dayNotes;\n    totalTasksDone += dayTasksDone;\n    totalTasksTotal += dayTasksTotal;\n    totalShifts += dayShifts;\n    totalTimelineActivity += dayTimeline;\n    totalWorkdayFilled += countFilled(dayWorkday);\n    dayStats.push({ key, day: getPersianDayNum(d), shortDay: getShortDayName(d), notes: dayNotes, tasks: dayTasksDone });\n  });\n\n  const cardsHtml = `\n    <div class=\"review-cards\">\n      <div class=\"review-card notes\"><div class=\"rc-icon\">✍️<\/div><div class=\"rc-value\">${totalNotes}<\/div><div class=\"rc-label\">نوشته<\/div><\/div>\n      <div class=\"review-card tasks\"><div class=\"rc-icon\">✅<\/div><div class=\"rc-value\">${totalTasksDone}${totalTasksTotal > 0 ? '/' + totalTasksTotal : ''}<\/div><div class=\"rc-label\">تسک<\/div><\/div>\n      <div class=\"review-card shifts\"><div class=\"rc-icon\">⏰<\/div><div class=\"rc-value\">${totalShifts}<\/div><div class=\"rc-label\">شیفت<\/div><\/div>\n      <div class=\"review-card timeline\"><div class=\"rc-icon\">🕐<\/div><div class=\"rc-value\">${totalTimelineActivity}<\/div><div class=\"rc-label\">بازه تایم‌لاین<\/div><\/div>\n      <div class=\"review-card workday\"><div class=\"rc-icon\">💼<\/div><div class=\"rc-value\">${totalWorkdayFilled}<\/div><div class=\"rc-label\">مورد<\/div><\/div>\n    <\/div>\n  `;\n\n  const maxVal = Math.max(1, ...dayStats.map(s => Math.max(s.note = () => URL.revokeObjectURL(objectUrl);\n  }\n  const scale = Math.min(1, 960 / Math.max(image.width, image.height));\n  const canvas = document.createElement('canvas');\n  canvas.width = Math.max(1, Math.round(image.width * scale));\n  canvas.height = Math.max(1, Math.round(image.height * scale));\n  const context = canvas.getContext('2d');\n  context.fillStyle = '#ffffff';\n  context.fillRect(0, 0, canvas.width, canvas.height);\n  context.drawImage(image, 0, 0, canvas.width, canvas.height);\n  releaseImage();\n  const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.72));\n  if (!blob) throw new Error('تصویر قابل فشرده‌سازی نیست');\n  return await new Promise((resolve, reject) => {\n    const reader = new FileReader();\n    reader.onload = () => resolve(reader.result);\n    reader.onerror = reject;\n    reader.readAsDataURL(blob);\n  });\n}\nfunction renderImagePreviews() {\n  const preview = document.getElementById('entryImagePreview');\n  preview.innerHTML = currentImages.map((src, index) => `<div class=\"entry-image-thumb\"><img src=\"${src}\" alt=\"پیش‌نمایش عکس ${index + 1}\"><button type=\"button\" class=\"entry-image-remove\" data-remove-image=\"${index}\" aria-label=\"حذف عکس\">×<\/button><\/div>`).join('');\n  preview.querySelectorAll('[data-remove-image]').forEach(button => button.addEventListener('click', () => {\n    currentImages.splice(Number(button.dataset.removeImage), 1);\n    renderImagePreviews();\n  }));\n}\nasync function addImagesFromInput(event) {\n  const input = event.currentTarget;\n  const files = Array.from(input.files || []);\n  const available = Math.max(0, 3 - currentImages.length);\n  if (files.length > available) showToast('حداکثر ۳ عکس برای هر نوشته می‌توانی اضافه کنی');\n  for (const file of files.slice(0, available)) {\n    if (!file.type.startsWith('image/')) continue;\n    try {\n      currentImages.push(await compressNoteImage(file));\n      renderImagePreviews();\n    } catch (error) {\n      showToast('خواندن این عکس ممکن نشد');\n    }\n  }\n  input.value = '';\n}\nfunction openEditor(id = null, dateForNew = null) {\n  editingId = id;\n  const titleEl = document.getElementById('entryTitle');\n  const contentEl = document.getElementById('entryContent');\n  const editorTitle = document.getElementById('editorTitle');\n  const deleteBtn = document.getElementById('editorDeleteBtn');\n  editorDate = dateForNew;\n  const now = Date.now();\n  const entryTime = id ? (entries.find(e => e.id === id)?.createdAt || now) : (dateForNew ? keyToDate(dateForNew).getTime() : now);\n  document.getElementById('autoDateFull').textContent = getFullPersianDate(entryTime) + ' · ' + (dateForNew && !id ? '' : getTime(entryTime));\n  document.getElementById('autoDayName').textContent = getDayName(entryTime);\n  if (id) {\n    const entry = entries.find(e => e.id === id);\n    if (!entry) return;\n    titleEl.value = entry.title; contentEl.value = entry.content;\n    selectedMood = normalizeMood(entry.mood); currentTags = [...(entry.tags || [])];\n    currentImages = Array.isArray(entry.images) ? [...entry.images] : [];\n    editorTitle.textContent = 'ویرایش نوشته'; deleteBtn.classList.remove('hidden');\n  } else {\n    titleEl.value = ''; contentEl.value = ''; selectedMood = 'آرام'; currentTags = []; currentImages = [];\n    editorTitle.textContent = dateForNew ? 'نوشته جدید برای این روز' : 'نوشته جدید';\n    deleteBtn.classList.add('hidden');\n  }\n  renderMoodPicker(); renderTagsChosen(); renderTagSuggestions(); renderImagePreviews();\n  document.getElementById('tagInput').value = '';\n  document.getElementById('editor').classList.add('open');\n  document.body.style.overflow = 'hidden';\n  setTimeout(() => titleEl.focus(), 300);\n}\nfunction closeEditor() { document.getElementById('editor').classList.remove('open'); document.body.style.overflow = ''; editingId = null; currentTags = []; currentImages = []; editorDate = null; }\nfunction saveEntry() {\n  const title = document.getElemen  id=\\\"dlg\\\">\\n  <div class=\\\"dh\\\" id=\\\"dt\\\"><\\/div>\\n  <div class=\\\"lbl\\\">عنوان هدف<\\/div>\\n  <input type=\\\"text\\\" id=\\\"tt\\\" maxlength=\\\"90\\\" placeholder=\\\"مثلاً: یاد گرفتن زبان انگلیسی\\\">\\n  <div class=\\\"lbl\\\">شرح (اختیاری)<\\/div>\\n  <textarea id=\\\"ta\\\" maxlength=\\\"180\\\" placeholder=\\\"چند جمله درباره‌ی این هدف…\\\"><\\/textarea>\\n\\n  <div id=\\\"repbox\\\" hidden>\\n    <div class=\\\"lbl\\\">تکرار<\\/div>\\n    <div class=\\\"row2\\\">\\n      <select id=\\\"rep\\\">\\n        <option value=\\\"none\\\">بدون تکرار (یک‌باره)<\\/option>\\n        <option value=\\\"daily\\\">روزانه<\\/option>\\n        <option value=\\\"weekly\\\">هفتگی<\\/option>\\n        <option value=\\\"custom\\\">روزهای انتخابی<\\/option>\\n      <\\/select>\\n      <select id=\\\"target\\\" title=\\\"هدف تعداد تکرار\\\">\\n        <option value=\\\"7\\\">هدف: ۷ بار<\\/option>\\n        <option value=\\\"21\\\">هدف: ۲۱ بار<\\/option>\\n        <option value=\\\"30\\\" selected>هدف: ۳۰ بار<\\/option>\\n        <option value=\\\"66\\\">هدف: ۶۶ بار<\\/option>\\n        <option value=\\\"90\\\">هدف: ۹۰ بار<\\/option>\\n      <\\/select>\\n    <\\/div>\\n    <div class=\\\"days\\\" id=\\\"days\\\"><\\/div>\\n  <\\/div>\\n\\n  <label class=\\\"chk\\\" id=\\\"dl\\\"><input type=\\\"checkbox\\\" id=\\\"dc\\\"> انجام شد<\\/label>\\n  <div class=\\\"da\\\"><button class=\\\"btn pri\\\" id=\\\"ds\\\">ذخیره<\\/button><button class=\\\"btn\\\" id=\\\"dx\\\">انصراف<\\/button><\\/div>\\n<\\/dialog>\\n\\n<script>\\nconst C=[\\\"#f2a65a\\\",\\\"#e56b6f\\\",\\\"#c0728f\\\",\\\"#9d8cff\\\",\\\"#6fa8ff\\\",\\\"#4ecdc4\\\",\\\"#7bd88f\\\",\\\"#d4d86a\\\"];\\nconst DAYS=[\\\"ی\\\",\\\"د\\\",\\\"س\\\",\\\"چ\\\",\\\"پ\\\",\\\"ج\\\",\\\"ش\\\"];\\nconst pos=[[0,0],[0,1],[0,2],[1,2],[2,2],[2,1],[2,0],[1,0]];\\nconst ri=(r,c)=>pos.findIndex(p=>p[0]===r&&p[1]===c);\\nconst HZ=[\\\"۱۰ سال\\\",\\\"۵ سال\\\",\\\"۱ سال\\\",\\\"۱ ماه\\\"];\\nconst HINT=[\\n \\\"هدف ۱۰ ساله را وسط بنویس و هشت زیرهدف دورش. روی هر کدام بزنی وارد پنجره ۵ ساله‌اش می‌شوی.\\\",\\n \\\"هشت هدف ۵ ساله برای این زیرهدف. روی هر کدام بزن تا وارد پنجره ۱ ساله‌اش شوی.\\\",\\n \\\"هشت هدف ۱ ساله. هر کدام یک پنجره ۱ ماهه دارد.\\\",\\n \\\"هشت هدف/عادت برای ۱ ماه آینده. روی هر کدام بزن و تکرارش را روزانه، هفتگی یا انتخابی کن.\\\"];\\nconst KEY=\\\"mandala-goals-v5\\\";\\nconst DEPTH=4; // عمق برگ: ۱ ماه\\n\\nconst pad2=n=>String(n).padStart(2,\\\"0\\\");\\nconst fmtD=d=>d.getFullYear()+\\\"-\\\"+pad2(d.getMonth()+1)+\\\"-\\\"+pad2(d.getDate());\\nconst pd=s=>{const[y,m,d]=s.split(\\\"-\\\").map(Number);return new Date(y,m-1,d)};\\nconst todayStr=()=>fmtD(new Date());\\nconst addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return fmtD(d)};\\n\\nconst mk=()=>({t:\\\"\\\",s:\\\"\\\",d:0,c:null,rep:\\\"none\\\",days:[],target:30,log:[],streak:0,best:0});\\n\\nlet R=null,path=[],tab=\\\"m\\\",cur=null;\\ntry{R=JSON.parse(localStorage.getItem(KEY))}catch(e){}\\nif(!R||typeof R.t!==\\\"string\\\")R=mk();\\nconst save=()=>{try{localStorage.setItem(KEY,JSON.stringify(R))}catch(e){}};\\nconst kids=n=>n.c||(n.c=Array.from({length:8},mk));\\nconst at=p=>{let n=R;for(const i of p)n=kids(n)[i];return n};\\nconst fa=n=>Number(n).toLocaleString(\\\"fa-IR\\\");\\nconst esc=s=>String(s||\\\"\\\").replace(/[&<>\\\"]/g,c=>({\\\"&\\\":\\\"&amp;\\\",\\\"<\\\":\\\"&lt;\\\",\\\">\\\":\\\"&gt;\\\",'\\\"':\\\"&quot;\\\"}[c]));\\nconst short=(s,n=12)=>s.length>n?s.slice(0,n)+\\\"…\\\":s;\\nconst parse=s=>s===\\\"r\\\"?[]:s.split(\\\".\\\").map(Number);\\nconst $=s=>document.querySelector(s);\\nconst isHabit=n=>n.rep&&n.rep!==\\\"none\\\";\\nconst isDue=(n,ds=todayStr())=>{\\n  if(!isHabit(n))return false;\\n  const wd=pd(ds).getDay(); // 0=Sun..6=Sat\\n  if(n.rep===\\\"daily\\\")return true;\\n  if(n.rep===\\\"weekly\\\")return (n.days||[]).includes(wd);\\n  if(n.rep===\\\"custom\\\")return (n.days||[]).includes(wd);\\n  return false;\\n};\\n\\n/* ---------- streak / log ---------- */\\nfunction calcStreak(n){\\n  if(!n.log||!n.log.length){n.streak=0;return}\\n  const set=new Set(n.log);\\n  let s=0,d=todayStr();\\n  if(!set.has(d))d=addDays(d,-1);\\n  while(set.has(d)){s++;d=addDays(d,-1)}\\n  n.streak=s;\\n  n.best=Math.max(n.best||0,s);\\n}\\nfunction markHabit(n,ds=todayStr()){\\n  n.log=n.log||[];\\n  const i=n.log.indexOf(ds);\\n  if(i>=0)n.log.splice(i,1); else n.log.push(ds);\\n  calcStreak(n);\\n  if(n.log.length>=(n.target||1))n.d=1; else n.d=0;\\n}\\n\\n/* ---------- stats ---------- */\\nfunction stat(n,d){\\n  if(d===DEPTH)return n.t?[1,n.d?1:0]:[0,0];\\n  let f=0,x=0;(n.c||[]).forEach(c=>{const s=stat(c,d+1);f+=s[0];x+=s[1]});return[f,x];\\n}\\nconst has=n=>!!(n.t||(n.c&&n.c.some(has)));\\n\\n/* ---------- mandala ---------- */\\nfunction repBadge(n){\\n  if(!isHabit(n))return\\\"\\\";\\n  const map={daily:\\\"روزانه\\\",weekly:\\\"هفتگی\\\",custom:\\\"انتخابی\\\"};\\n  return `<em class=\\\"badge\\\">${map[n.rep]}${n.streak?` · ${fa(n.streak)}`:\\\"\\\"}<\\/em>`;\\n}\\nfunction cellHtml(n,p,ctr){\\n  const L=path.length,d=p.length;\\n  const cls=ctr?(L?\\\"sub-c\\\":\\\"goal\\\"):(L?\\\"act\\\":\\\"sub-c\\\");\\n  const ph=ctr?(L?\\\"هدف\\\":\\\"هدف اصلی\\\"):(L?\\\"+\\\":\\\"زیرهدف \\\"+fa(p[d-1]+1));\\n  const done=d===DEPTH&&n.d;\\n  const title=n.t?`<b>${esc(n.t)}<\\/b>`:\\\"\\\";\\n  const desc=n.s?`<span>${esc(n.s)}<\\/span>`:\\\"\\\";\\n  let sm=\\\"\\\";\\n  if(!ctr&&L<DEPTH-1){const s=stat(n,d);if(s[0])sm=`<small>${fa(s[1])} از ${fa(s[0])}<\\/small>`}\\n  return `<button class=\\\"cell ${cls}${n.t?\\\"\\\":\\\" empty\\\"}${done?\\\" done\\\":\\\"\\\"}\\\" data-p=\\\"${d?p.join(\\\".\\\"):\\\"r\\\"}\\\"${ctr?' data-ctr=\\\"1\\\"':\\\"\\\"} data-ph=\\\"${ph}\\\"${d?` style=\\\"--c:${C[p[0]]}\\\"`:\\\"\\\"}>${repBadge(n)}${title}${desc}${sm}<\\/button>`;\\n}\\nfunction mandala(){\\n  const L=path.length,P=at(path),k=kids(P);\\n  const chips=`<button class=\\\"pc${L?\\\"\\\":\\\" on\\\"}\\\" data-go=\\\"0\\\">هدف اصلی<\\/button>`+path.map((_,q)=>{\\n    const n=at(path.slice(0,q+1));\\n    return `<button class=\\\"pc${q+1===L?\\\" on\\\":\\\"\\\"}\\\" data-go=\\\"${q+1}\\\" style=\\\"--c:${C[path[0]]}\\\">${esc(short(n.t)||HZ[q])}<\\/button>`;\\n  }).join(\\\"\\\");\\n  let h=`<div class=\\\"crumb\\\"><b>${HZ[L]}<\\/b>${L?`<button class=\\\"back\\\" data-go=\\\"${L-1}\\\">› بازگشت<\\/button>`:`<span>پنجره وسط<\\/span>`}<\\/div><div class=\\\"path\\\">${chips}<\\/div><div class=\\\"blk${L?\\\"\\\":\\\" mid\\\"}\\\">`;\\n  for(let r=0;r<3;r++)for(let c=0;c<3;c++){\\n    const m=r===1&&c===1;\\n    h+=m?cellHtml(P,path,1):cellHtml(k[ri(r,c)],path.concat(ri(r,c)),0);\\n  }\\n  $(\\\"#mandala\\\").innerHTML=h+\\\"<\\/div>\\\";\\n}\\n\\n/* ---------- today (فقط عادت‌ها) ---------- */\\nfunction collectDue(root){\\n  const out=[];\\n  (function walk(n,p){\\n    if(n.t&&isDue(n))out.push({n,p});\\n    (n.c||[]).forEach((c,i)=>walk(c,p.concat(i)));\\n  })(root,[]);\\n  return out;\\n}\\nfunction pathOf(n){\\n  let found=null;\\n  (function walk(x,p){\\n    if(x===n){found=p;return}\\n    (x.c||[]).forEach((c,i)=>walk(c,p.concat(i)));\\n  })(R,[]);\\n  return found?found.join(\\\".\\\"):\\\"r\\\";\\n}\\nfunction todayView(){\\n  const ds=todayStr();\\n  const habits=collectDue(R);\\n\\n  let h=`<div class=\\\"tsec\\\"><h2>عادت‌های امروز <em>${fa(habits.length)} مورد<\\/em><\\/h2>`;\\n  if(!habits.length)h+=`<div class=\\\"empty-t\\\">عادتی برای امروز تعیین نشده. در ماندالا روی یک هدف «۱ ماه» بزن و تکرارش را روزانه یا هفتگی کن.<\\/div>`;\\n  else habits.forEach(({n})=>{\\n    const on=(n.log||[]).includes(ds);\\n    const map={daily:\\\"روزانه\\\",weekly:\\\"هفتگی\\\",custom:\\\"انتخابی\\\"};\\n    h+=`<div class=\\\"titem${on?\\\" on\\\":\\\"\\\"}\\\" data-path=\\\"${pathOf(n)}\\\">\\n      <div class=\\\"box\\\">${on?\\\"✓\\\":\\\"\\\"}<\\/div>\\n      <div class=\\\"tx\\\"><b>${esc(n.t)}<\\/b>${n.s?`<span>${esc(n.s)}<\\/span>`:\\\"\\\"}<\\/div>\\n      <div class=\\\"meta\\\"><b>${fa(n.streak||0)}<\\/b>${map[n.rep]||\\\"\\\"} · زنجیره<\\/div>\\n    <\\/div>`;\\n  });\\n  h+=\\\"<\\/div>\\\";\\n  $(\\\"#today\\\").innerHTML=h;\\n}\\n\\n/* ---------- heatmap ---------- */\\nfunction heatView(){\\n  const habits=[];\\n  (function walk(n,p){\\n    if(isHabit(n)&&n.t)habits.push({n,p});\\n    (n.c||[]).forEach((c,i)=>walk(c,p.concat(i)));\\n  })(R,[]);\\n\\n  if(!habits.length){\\n    $(\\\"#heat\\\").innerHTML=`<div class=\\\"empty-t\\\">هنوز عادتی تعریف نکرده‌ای. در ماندالا روی یک هدف «۱ ماه» بزن و تکرارش را مشخص کن.<\\/div>`;\\n    return;\\n  }\\n  const weeks=18;\\n  const today=todayStr();\\n  const todayWd=pd(today).getDay();\\n  let h=\\\"\\\";\\n  habits.forEach(({n})=>{\\n    const set=new Set(n.log||[]);\\n    const start=addDays(today,-((weeks-1)*7+todayWd));\\n    let cells=\\\"\\\";\\n    for(let w=0;w<weeks;w++){\\n      for(let d=0;d<7;d++){\\n        const ds=addDays(start,w*7+d);\\n        const future=ds>today;\\n        const due=isDue(n,ds);\\n        let cls=\\\"hcell\\\";\\n        if(future)cls+=\\\" future\\\";\\n        else if(due&&set.has(ds))cls+=\\\" l3\\\";\\n        else if(due)cls+=\\\" miss\\\";\\n        cells+=`<div class=\\\"${cls}\\\" title=\\\"${ds}\\\"><\\/div>`;\\n      }\\n    }\\n    const pct=n.target?Math.min(100,Math.round((n.log||[]).length/n.target*100)):0;\\n    h+=`<div class=\\\"hcard\\\">\\n      <div class=\\\"hhead\\\">\\n        <b>${esc(n.t)}<\\/b>\\n        <span>${n.rep===\\\"daily\\\"?\\\"روزانه\\\":n.rep===\\\"weekly\\\"?\\\"هفتگی\\\":\\\"انتخابی\\\"} · ${fa((n.log||[]).length)} تکرار · ${fa(pct)}٪ هدف<\\/span>\\n        <span class=\\\"streak\\\">🔥 ${fa(n.streak||0)} · بهترین ${fa(n.best||0)}<\\/span>\\n      <\\/div>\\n      <div class=\\\"hgrid\\\">${cells}<\\/div>\\n    <\\/div>`;\\n  });\\n  h+=`<div class=\\\"legend\\\"><span>■ انجام‌شده<\\/span><span style=\\\"color:var(--bad)\\\">■ از دست رفته<\\/span><span>■ غیرموعد / آینده<\\/span><\\/div>`;\\n  $(\\\"#heat\\\").innerHTML=h;\\n}\\n\\n/* ---------- progress / hint ---------- */\\nfunction progress(){\\n  const[f,x]=stat(R,0);\\n  $(\\\"#pt\\\").textContent=f?`${fa(x)} از ${fa(f)} هدف ۱ ماهه انجام شد`:\\\"هنوز هدف ۱ ماهه‌ای ننوشته‌ای\\\";\\n  $(\\\"#pb\\\").style.width=f?(x/f*100)+\\\"%\\\":\\\"0\\\";\\n}\\nfunction hint(){\\n  if(tab===\\\"t\\\")$(\\\"#hint\\\").textContent=\\\"عادت‌های امروز را تیک بزن. عادت‌ها در سطح «۱ ماه» ماندالا تعریف می‌شوند.\\\";\\n  else if(tab===\\\"h\\\")$(\\\"#hint\\\").textContent=\\\"هر عادت یک نقشه حرارتی ۱۸ هفته‌ای دارد؛ ستون‌ها هفته و ردیف‌ها روزهای هفته‌اند.\\\";\\n  else $(\\\"#hint\\\").textContent=HINT[path.length];\\n}\\nfunction render(){\\n  if(tab===\\\"m\\\")mandala();\\n  if(tab===\\\"t\\\")todayView();\\n  if(tab===\\\"h\\\")heatView();\\n  progress();hint();\\n}\\n\\n/* ---------- editor ---------- */\\nconst dlg=$(\\\"#dlg\\\"),tt=$(\\\"#tt\\\"),ta=$(\\\"#ta\\\"),dc=$(\\\"#dc\\\"),rep=$(\\\"#rep\\\"),target=$(\\\"#target\\\"),daysEl=$(\\\"#days\\\");\\nlet daysSel=new Set();\\nfunction renderDays(){\\n  daysEl.innerHTML=DAYS.map((l,i)=>`<label class=\\\"${daysSel.has(i)?\\\"on\\\":\\\"\\\"}\\\"><input type=\\\"checkbox\\\" data-day=\\\"${i}\\\" ${daysSel.has(i)?\\\"checked\\\":\\\"\\\"}>${l}<\\/label>`).join(\\\"\\\");\\n  daysEl.querySelectorAll(\\\"input\\\").forEach(inp=>inp.onchange=()=>{\\n    const d=+inp.dataset.day;\\n    if(inp.checked)daysSel.add(d);else daysSel.delete(d);\\n    renderDays();\\n  });\\n}\\nrep.onchange=()=>{\\n  daysEl.hidden=!(rep.value===\\\"custom\\\"||rep.value===\\\"weekly\\\");\\n  if(rep.value===\\\"weekly\\\"&&!daysSel.size)daysSel=new Set([5]); // پیش‌فرض جمعه\\n  renderDays();\\n};\\n\\nfunction edit(p,go){\\n  cur={p,go};\\n  const n=at(p),d=p.length,par=d?at(p.slice(0,-1)).t:\\\"\\\";\\n  $(\\\"#dt\\\").textContent=d?`هدف ${HZ[d-1]}`+(par?` برای «${short(par,16)}»`:\\\"\\\"):`هدف اصلی (${HZ[0]})`;\\n  tt.value=n.t||\\\"\\\";ta.value=n.s||\\\"\\\";dc.checked=!!n.d;\\n  rep.value=n.rep||\\\"none\\\";\\n  target.value=String(n.target||30);\\n  daysSel=new Set(n.days||[]);\\n  $(\\\"#repbox\\\").hidden=d!==DEPTH;\\n  daysEl.hidden=!(rep.value===\\\"custom\\\"||rep.value===\\\"weekly\\\");\\n  renderDays();\\n  $(\\\"#dl\\\").hidden=d!==DEPTH||isHabit(n);\\n  dlg.showModal();tt.focus();\\n}\\nfunction commit(){\\n  const title=tt.value.trim().replace(/\\\\s+/g,\\\" \\\");\\n  const desc=ta.value.trim().replace(/\\\\s+/g,\\\" \\\");\\n  const{p}=cur,n=at(p);\\n  n.t=title;n.s=desc;\\n  if(p.length===DEPTH){\\n    n.rep=rep.value;\\n    n.target=+target.value||30;\\n    n.days=[...daysSel];\\n    if(isHabit(n)){\\n      n.d=n.log&&n.log.length>=n.target?1:0;\\n      calcStreak(n);\\n    }else{\\n      n.d=title&&dc.checked?1:0;\\n    }\\n  }\\n  save();\\n  if(cur.go&&title)path=p;\\n  render();dlg.close();\\n}\\ndocument.addEventListener(\\\"click\\\",e=>{\\n  if(dlg.open)return;\\n  const g=e.target.closest(\\\"[data-go]\\\");\\n  if(g){path=path.slice(0,+g.dataset.go);tab=\\\"m\\\";show(\\\"m\\\");return}\\n  const t=e.target.closest(\\\"[data-p]\\\");\\n  if(t){\\n    const p=parse(t.dataset.p);\\n    if(t.closest(\\\"#mandala\\\")&&!t.dataset.ctr&&p.length<DEPTH){\\n      if(at(p).t){path=p;render()}else edit(p,true);\\n    }else edit(p);\\n    return;\\n  }\\n  const hb=e.target.closest(\\\"[data-path]\\\");\\n  if(hb){\\n    const p=parse(hb.dataset.path);\\n    const n=at(p);\\n    markHabit(n);\\n    save();todayView();progress();\\n    return;\\n  }\\n});\\n$(\\\"#ds\\\").onclick=commit;$(\\\"#dx\\\").onclick=()=>dlg.close();\\ntt.addEventListener(\\\"keydown\\\",e=>{if(e.key===\\\"Enter\\\"){e.preventDefault();ta.focus()}});\\n\\n/* ---------- tabs ---------- */\\nfunction show(t){\\n  tab=t;\\n  document.querySelectorAll(\\\"[data-tab]\\\").forEach(x=>x.setAttribute(\\\"aria-selected\\\",x.dataset.tab===t));\\n  $(\\\"#vm\\\").hidden=t!==\\\"m\\\";$(\\\"#vt\\\").hidden=t!==\\\"t\\\";$(\\\"#vh\\\").hidden=t!==\\\"h\\\";\\n  render();\\n}\\ndocument.querySelectorAll(\\\"[data-tab]\\\").forEach(b=>b.onclick=()=>show(b.dataset.tab));\\n\\n/* ---------- reset ---------- */\\nlet rt=null;\\n$(\\\"#reset\\\").onclick=function(){\\n  if(rt){clearTimeout(rt);rt=null;R=mk();path=[];save();render();this.textContent=\\\"پاک کردن همه\\\";return}\\n  this.textContent=\\\"مطمئنی؟ دوباره بزن\\\";\\n  rt=setTimeout(()=>{rt=null;this.textContent=\\\"پاک کردن همه\\\"},3000);\\n};\\n\\n/* API برای صفحه امروز ژورنال */\\nwindow.MandalaAPI={\\n  todayHabits(){const ds=todayStr();return collectDue(R).map(({n,p})=>({path:p.length?p.join(\\\".\\\"):\\\"r\\\",title:n.t,sub:n.s||\\\"\\\",rep:n.rep,done:(n.log||[]).includes(ds),streak:n.streak||0}))},\\n  toggle(ps){const n=at(parse(ps));markHabit(n);save();if(tab===\\\"t\\\")todayView();if(tab===\\\"h\\\")heatView();progress()}\\n};\\nrender();\\n<\\/script>\\n<\\/body>\\n<\\/html>\";\nlet appStarted = false;\nfunction initMandalaFrame() {\n  const frame = document.getElementById('mandalaFrame');\n  if (!frame || frame.dataset.ready) return;\n  frame.dataset.ready = '1';\n  frame.addEventListener('load', () => { if (appStarted) render(); });\n  frame.srcdoc = MANDALA_HTML;\n}\nfunction getMandalaApi() {\n  try {\n    const frame = document.getElementById('mandalaFrame');\n    return frame && frame.contentWindow && frame.contentWindow.MandalaAPI ? frame.contentWindow.MandalaAPI : null;\n  } catch (error) { return null; }\n}\nfunction renderMandalaHabitSection() {\n  const api = getMandalaApi();\n  if (!api) return '';\n  let items = [];\n  try { items = api.todayHabits() || []; } catch (error) { return ''; }\n  const doneCount = items.filter(h => h.done).length;\n  const collapsed = uiState.habitCollapsed;\n  let html = `<div class=\"section-header habit ${collapsed ? 'collapsed' : ''}\" data-toggle-section=\"habit\"><span class=\"sh-icon\">🎯<\/span><span class=\"sh-title\">عادت<\/span>${items.length ? `<span class=\"sh-count\">${doneCount}/${items.length}<\/span>` : ''}<span class=\"sh-arrow\">▾<\/span><\/div>`;\n  html += `<div class=\"collapsible-content ${collapsed ? 'collapsed' : ''}\">`;\n  if (!items.length) {\n    html += `<div class=\"empty-section\"><span class=\"es-icon\">🎯<\/span>برای امروز عادتی تعریف نشده<br><small>از منوی «اهداف»، یک هدف ۱ ماهه بساز و تکرارش رو مشخص کن<\/small><\/div>`;\n  } else {\n    html += `<div class=\"card\" style=\"cursor: default;\">`;\n    html += items.map(h => `<div class=\"task-item mh-item ${h.done ? 'mh-done' : ''}\" style=\"cursor: pointer;\" role=\"checkbox\" aria-checked=\"${h.done ? 'true' : 'false'}\" data-mandala-toggle=\"${escapeHtml(h.path)}\"><div class=\"checkbox ${h.done ? 'checked' : ''}\">✓<\/div><div style=\"flex: 1; min-width: 0;\"><div class=\"mh-title\">${escapeHtml(h.title)}<\/div>${h.sub ? `<div class=\"mh-sub\">${escapeHtml(h.sub)}<\/div>` : ''}<\/div>${h.streak > 0 ? `<span class=\"mh-streak\">🔥 ${h.streak}<\/span>` : ''}<\/div>`).join('');\n    html += `<\/div>`;\n  }\n  html += `<\/div>`;\n  return html;\n}\nfunction toggleMandalaHabit(pathStr) {\n  const api = getMandalaApi();\n  if (!api) return;\n  try { api.toggle(pathStr); }\n  catch (error) { showToast('ثبت عادت انجام نشد'); return; }\n  render();\n}\nfunction openGoalsPage() { document.getElementById('goalsPage').classList.add('open'); document.body.style.overflow = 'hidden'; }\nfunction closeGoalsPage() { document.getElementById('goalsPage').classList.remove('open'); document.body.style.overflow = ''; render(); }\nfunction openShiftsPage() { renderJobsList(); if (!shiftMonth) shiftMonth = new Date(); shiftMonth.setDate(1); renderShiftCalendar(); document.getElementById('shiftsPage').classList.add('open'); document.body.style.overflow = 'hidden'; }\nfunction closeShiftsPage() { document.getElementById('shiftsPage').classList.remove('open'); document.body.style.overflow = ''; }\nfunction renderJobsList() {\n  const container = document.getElementById('jobsList');\n  if (jobs.length === 0) { container.innerHTML = `<div class=\"empty-section\"><span cla
