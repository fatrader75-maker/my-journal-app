tElementById('modalText').textContent = text;\\r\\n    pendingConfirmAction = onConfirm;\\r\\n    document.getElementById('confirmModal').classList.add('show');\\r\\n  }\\r\\n  function closeModal() {\\r\\n    document.getElementById('confirmModal').classList.remove('show');\\r\\n    pendingConfirmAction = null;\\r\\n  }\\r\\n  document.getElementById('modalConfirmBtn').addEventListener('click', () => {\\r\\n    const fn = pendingConfirmAction;\\r\\n    closeModal();\\r\\n    if (fn) fn();\\r\\n  });\\r\\n  document.getElementById('confirmModal').addEventListener('click', (e) => {\\r\\n    if (e.target.id === 'confirmModal') closeModal();\\r\\n  });\\r\\n\\r\\n  function openTxForm(type) {\\r\\n    closeTransferForm();\\r\\n    currentTxType = type;\\r\\n    const card = document.getElementById('txFormCard');\\r\\n    card.classList.add('show');\\r\\n    card.classList.remove('expense-form', 'income-form');\\r\\n    card.classList.add(type === 'income' ? 'income-form' : 'expense-form');\\r\\n    applyTxTypeUI();\\r\\n    populateSourceSelect();\\r\\n    updateSourceHint();\\r\\n    card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });\\r\\n    setTimeout(() => document.getElementById('txTitle').focus(), 300);\\r\\n  }\\r\\n  function closeTxForm() {\\r\\n    document.getElementById('txFormCard').classList.remove('show');\\r\\n  }\\r\\n  function switchTxType(type) {\\r\\n    currentTxType = type;\\r\\n    applyTxTypeUI();\\r\\n  }\\r\\n  function applyTxTypeUI() {\\r\\n    const isIncome = currentTxType === 'income';\\r\\n    document.getElementById('tabExpenseBtn').className = 'tx-type-tab' + (!isIncome ? ' active-expense' : '');\\r\\n    document.getElementById('tabIncomeBtn').className = 'tx-type-tab' + (isIncome ? ' active-income' : '');\\r\\n    document.getElementById('txCategoryGroup').style.display = isIncome ? 'none' : 'block';\\r\\n    document.getElementById('txIncomeCategoryGroup').style.display = isIncome ? 'block' : 'none';\\r\\n    const saveBtn = document.getElementById('txSaveBtn');\\r\\n    saveBtn.className = 'btn ' + (isIncome ? 'btn-income' : 'btn-expense');\\r\\n    saveBtn.textContent = isIncome ? 'ثبت درآمد' : 'ثبت هزینه';\\r\\n  }\\r\\n\\r\\n  function populateSourceSelect() {\\r\\n    const sel = document.getElementById('txSource');\\r\\n    if (!sel) return;\\r\\n    sel.innerHTML = sources.map(s => {\\r\\n      const bal = getSourceBalance(s.id);\\r\\n      const typeName = s.type === 'cash' ? 'نقدی' : 'کارت';\\r\\n      return `<option value=\\\"${s.id}\\\">${escapeHtml(s.name)} (${typeName}) — ${formatMoney(bal)}<\\/option>`;\\r\\n    }).join('');\\r\\n  }\\r\\n\\r\\n  function updateSourceHint() {\\r\\n    const sel = document.getElementById('txSource');\\r\\n    const hint = document.getElementById('txSourceHint');\\r\\n    if (!sel || !hint) return;\\r\\n    const src = getSourceById(sel.value);\\r\\n    if (src) {\\r\\n      const bal = getSourceBalance(src.id);\\r\\n      hint.textContent = 'موجودی فعلی: ' + formatMoney(bal);\\r\\n      hint.style.color = bal < 0 ? 'var(--danger-600)' : 'var(--text-light)';\\r\\n    } else hint.textContent = '';\\r\\n  }\\r\\n  document.getElementById('txSource')?.addEventListener('change', updateSourceHint);\\r\\n\\r\\n  function saveTransaction() {\\r\\n    const titleEl = document.getElementById('txTitle');\\r\\n    const amountEl = document.getElementById('txAmount');\\r\\n    const srcEl = document.getElementById('txSource');\\r\\n    const isIncome = currentTxType === 'income';\\r\\n    const title = titleEl.value.trim();\\r\\n    const amount = parseMoney(amountEl.value);\\r\\n    const sourceId = srcEl.value;\\r\\n\\r\\n    if (!title) { showToast('عنوان را وارد کنید', 'error'); titleEl.focus(); return; }\\r\\n    if (!amount || amount <= 0) { showToast('مبلغ معتبر وارد کنید', 'error'); amountEl.focus(); return; }\\r\\n    if (!sourceId) { showToast('منبع را انتخاب کنید', 'error'); return; }\\r\\n\\r\\n    const src = getSourceById(sourceId);\\r\\n    if (!src) { showToast('منبع یافت نشد', 'error'); return; }\\r\\n\\r\\n    const category = isIncome\\r\\n      ? document.getElementById('txIncomeCategory').value\\r\\n      : document.getElementById('txCategory').value;\\r\\n\\r\\n    if (!isIncome) {\\r\\n      const balance = getSourceBalance(sourceId);\\r\\n      const data = { title, amount, category, sourceId, type: 'expense' };\\r\\n      const afterBalance = () => {\\r\\n        const w = checkBudgetWarning(category, amount);\\r\\n        if (w) showConfirm('هشدار بودجه', w, () => doSaveTransaction(data));\\r\\n        else doSaveTransaction(data);\\r\\n      };\\r\\n      if (amount > balance) {\\r\\n        showConfirm('موجودی کافی نیست',\\r\\n          `موجودی «${src.name}» برابر ${formatMoney(balance)} است. آیا با موجودی منفی ثبت شود؟`, afterBalance);\\r\\n        return;\\r\\n      }\\r\\n      afterBalance();\\r\\n      return;\\r\\n    }\\r\\n    doSaveTransaction({ title, amount, category, sourceId, type: isIncome ? 'income' : 'expense' });\\r\\n  }\\r\\n\\r\\n  function checkBudgetWarning(category, amount) {\\r\\n    const monthKey = getMonthKey();\\r\\n    const b = budgets[monthKey];\\r\\n    if (!b) return null;\\r\\n    const warnings = [];\\r\\n    if (b.total) {\\r\\n      const spent = transactions.filter(t => t.type === 'expense' && isInCurrentMonth(t.timestamp))\\r\\n        .reduce((s, t) => s + t.amount, 0);\\r\\n      if (spent <= b.total && spent + amount > b.total) {\\r\\n        warnings.push(`بودجه کل ماه (${formatMoney(b.total)}) رد می‌شود.`);\\r\\n      }\\r\\n    }\\r\\n    if (b.categories && b.categories[category]) {\\r\\n      const limit = b.categories[category];\\r\\n      const spent = transactions.filter(t => t.type === 'expense' && t.category === category && isInCurrentMonth(t.timestamp))\\r\\n        .reduce((s, t) => s + t.amount, 0);\\r\\n      if (spent <= limit && spent + amount > limit) {\\r\\n        warnings.push(`بودجه «${expenseCategoryNames[category]}» (${formatMoney(limit)}) رد می‌شود.`);\\r\\n      }\\r\\n    }\\r\\n    return warnings.length > 0 ? warnings.join(' ') + ' آیا ادامه می‌دهید؟' : null;\\r\\n  }\\r\\n\\r\\n  function doSaveTransaction(data) {\\r\\n    transactions.unshift({ id: Date.now(), ...data, timestamp: Date.now() });\\r\\n    persistTransactions();\\r\\n    renderHome();\\r\\n    renderStats();\\r\\n    document.getElementById('txTitle').value = '';\\r\\n    document.getElementById('txAmount').value = '';\\r\\n    closeTxForm();\\r\\n    showToast(data.type === 'income' ? 'درآمد ثبت شد' : 'هزینه ثبت شد', 'success');\\r\\n  }\\r\\n\\r\\n  function openTransferForm() {\\r\\n    closeTxForm();\\r\\n    const card = document.getElementById('transferFormCard');\\r\\n    card.classList.add('show');\\r\\n    const fromSel = document.getElementById('transferFrom');\\r\\n    const toSel = document.getElementById('transferTo');\\r\\n    const opts = sources.map(s => {\\r\\n      const typeName = s.type === 'cash' ? 'نقدی' : 'کارت';\\r\\n      return `<option value=\\\"${s.id}\\\">${escapeHtml(s.name)} (${typeName})<\\/option>`;\\r\\n    }).join('');\\r\\n    fromSel.innerHTML = opts;\\r\\n    toSel.innerHTML = opts;\\r\\n    if (sources.length > 1) toSel.value = sources[1].id;\\r\\n    updateTransferHint();\\r\\n    card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });\\r\\n    setTimeout(() => document.getElementById('transferAmount').focus(), 300);\\r\\n  }\\r\\n  function closeTransferForm() {\\r\\n    document.getElementById('transferFormCard').classList.remove('show');\\r\\n  }\\r\\n  function updateTransferHint() {\\r\\n    const fromSel = document.getElementById('transferFrom');\\r\\n    const hint = document.getElementById('transferFromHint');\\r\\n    if (!fromSel || !hint) return;\\r\\n    const src = getSourceById(fromSel.value);\\r\\n    if (src) {\\r\\n      const bal = getSourceBalance(src.id);\\r\\n      hint.textContent = 'موجودی فعلی: ' + formatMoney(bal);\\r\\n      hint.style.color = bal < 0 ? 'var(--danger-600)' : 'var(--text-light)';\\r\\n    } else hint.textContent = '';\\r\\n  }\\r\\n  document.getElementById('transferFrom')?.addEventListener('change', updateTransferHint);\\r\\n\\r\\n  function saveTransfer() {\\r\\n    const fromId = document.getElementById('transferFrom').value;\\r\\n    const toId = document.getElementById('transferTo').value;\\r\\n    const amount = parseMoney(document.getElementById('transferAmount').value);\\r\\n    if (!fromId || !toId) { showToast('منبع مبدأ و مقصد را انتخاب کنید', 'error'); return; }\\r\\n    if (fromId === toId) { showToast('منبع مبدأ و مقصد نباید یکی باشند', 'error'); return; }\\r\\n    if (!amount || amount <= 0) { showToast('مبلغ معتبر وارد کنید', 'error'); return; }\\r\\n    const fromSrc = getSourceById(fromId);\\r\\n    const toSrc = getSourceById(toId);\\r\\n    const bal = getSourceBalance(fromId);\\r\\n    if (amount > bal) {\\r\\n      showConfirm('موجودی کافی نیست',\\r\\n        `موجودی «${fromSrc.name}» برابر ${formatMoney(bal)} است. آیا با موجودی منفی انتقال انجام شود؟`,\\r\\n        () => doSaveTransfer(fromId, toId, amount, fromSrc, toSrc));\\r\\n      return;\\r\\n    }\\r\\n    doSaveTransfer(fromId, toId, amount, fromSrc, toSrc);\\r\\n  }\\r\\n  function doSaveTransfer(fromId, toId, amount, fromSrc, toSrc) {\\r\\n    transactions.unshift({\\r\\n      id: Date.now(), type: 'transfer',\\r\\n      title: `انتقال از ${fromSrc.name} به ${toSrc.name}`,\\r\\n      amount, fromSourceId: fromId, toSourceId: toId,\\r\\n      timestamp: Date.now()\\r\\n    });\\r\\n    persistTransactions();\\r\\n    renderHome();\\r\\n    renderStats();\\r\\n    document.getElementById('transferAmount').value = '';\\r\\n    closeTransferForm();\\r\\n    showToast('انتقال انجام شد', 'success');\\r\\n  }\\r\\n\\r\\n  function deleteTransaction(id) {\\r\\n    const tx = transactions.find(t => t.id === id);\\r\\n    if (!tx) return;\\r\\n    const typeLabel = tx.type === 'income' ? 'درآمد' : tx.type === 'expense' ? 'هزینه' : 'انتقال';\\r\\n    showConfirm(`حذف ${typeLabel}`,\\r\\n      `آیا «${tx.title}» به مبلغ ${formatMoney(tx.amount)} حذف شود؟ اثر آن بر موجودی برگشت داده می‌شود.`,\\r\\n      () => {\\r\\n        transactions = transactions.filter(t => t.id !== id);\\r\\n        persistTransactions();\\r\\n        renderHome();\\r\\n        renderStats();\\r\\n        showToast('تراکنش حذف شد');\\r\\n      });\\r\\n  }\\r\\n\\r\\n  function toggleSourceForm() {\\r\\n    const card = document.getElementById('sourceFormCard');\\r\\n    const btn = document.getElementById('toggleSourceBtnText');\\r\\n    const showing = card.classList.contains('show');\\r\\n    if (showing) {\\r\\n      card.classList.remove('show');\\r\\n      btn.textContent = 'افزودن منبع مالی';\\r\\n    } else {\\r\\n      card.classList.add('show');\\r\\n      btn.textContent = 'بستن فرم';\\r\\n      setTimeout(() => document.getElementById('sourceNameInput').focus(), 100);\\r\\n    }\\r\\n  }\\r\\n  function selectSourceType(type) {\\r\\n    currentSourceType = type;\\r\\n    document.getElementById('bankFields').style.display = type === 'bank' ? 'block' : 'none';\\r\\n    document.querySelectorAll('.type-option').forEach(opt => {\\r\\n      opt.classList.toggle('selected', opt.dataset.type === type);\\r\\n    });\\r\\n  }\\r\\n  function saveSource() {\\r\\n    const nameEl = document.getElementById('sourceNameInput');\\r\\n    const balEl = document.getElementById('sourceBalanceInput');\\r\\n    const name = nameEl.value.trim();\\r\\n    const balance = parseMoney(balEl.value);\\r\\n    if (!name) { showToast('نام منبع را وارد کنید', 'error'); nameEl.focus(); return; }\\r\\n    if (isNaN(balance) || balance < 0) { showToast('موجودی اولیه معتبر وارد کنید', 'error'); balEl.focus(); return; }\\r\\n    const src = { id: 'src_' + Date.now(), name, type: currentSourceType, initialBalance: balance };\\r\\n    if (currentSourceType === 'bank') {\\r\\n      const card = normDigits(document.getElementById('sourceCardNumber').value).replace(/\\\\D/g, '');\\r\\n      const sheba = document.getElementById('sourceSheba').value.toUpperCase().replace(/[^0-9]/g, '');\\r\\n      if (card && card.length !== 16) { showToast('شماره کارت باید ۱۶ رقم باشد', 'error'); document.getElementById('sourceCardNumber').focus(); return; }\\r\\n      if (sheba && sheba.length !== 24) { showToast('شماره شبا باید IR و ۲۴ رقم باشد', 'error'); document.getElementById('sourceSheba').focus(); return; }\\r\\n      src.bankName = document.getElementById('sourceBankName').value;\\r\\n      src.cardNumber = card;\\r\\n      src.sheba = sheba ? 'IR' + sheba : '';\\r\\n      src.holder = document.getElementById('sourceHolder').value.trim();\\r\\n    }\\r\\n    sources.push(src);\\r\\n    persistSources();\\r\\n    renderSources();\\r\\n    populateSourceSelect();\\r\\n    nameEl.value = '';\\r\\n    balEl.value = '';\\r\\n    ['sourceBankName', 'sourceCardNumber', 'sourceSheba', 'sourceHolder'].forEach(id => { document.getElementById(id).value = ''; });\\r\\n    nameEl.focus();\\r\\n    showToast('منبع مالی اضافه شد', 'success');\\r\\n  }\\r\\n  function deleteSource(id) {\\r\\n    const src = getSourceById(id);\\r\\n    if (!src) return;\\r\\n    const related = transactions.filter(t =>\\r\\n      t.sourceId === id || t.fromSourceId === id || t.toSourceId === id\\r\\n    );\\r\\n    if (related.length > 0) {\\r\\n      showToast('ابتدا تراکنش‌های این منبع را حذف کنید', 'error');\\r\\n      return;\\r\\n    }\\r\\n    if (sources.length <= 1) {\\r\\n      showToast('حداقل یک منبع باید باقی بماند', 'error');\\r\\n      return;\\r\\n    }\\r\\n    showConfirm('حذف منبع', `آیا «${src.name}» حذف شود؟`, () => {\\r\\n      sources = sources.filter(s => s.id !== id);\\r\\n      persistSources();\\r\\n      renderSources();\\r\\n      populateSourceSelect();\\r\\n      showToast('منبع حذف شد');\\r\\n    });\\r\\n  }\\r\\n\\r\\n  document.getElementById('filterChips').addEventListener('click', (e) => {\\r\\n    const chip = e.target.closest('.chip');\\r\\n    if (!chip) return;\\r\\n    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));\\r\\n    chip.classList.add('active');\\r\\n    currentFilter = chip.dataset.filter;\\r\\n    renderTransactions();\\r\\n  });\\r\\n\\r\\n  function renderHomeSummary() {\\r\\n    let inc = 0, exp = 0;\\r\\n    transactions.forEach(t => {\\r\\n      if (!isInCurrentMonth(t.timestamp)) return;\\r\\n      if (t.type === 'income') inc += t.amount; else if (t.type === 'expense') exp += t.amount;\\r\\n    });\\r\\n    const net = inc - exp;\\r\\n    const totalBalance = sources.reduce((sum, src) => sum + getSourceBalance(src.id), 0);\\r\\n    document.getElementById('homeMonthLabel').textContent = getMonthLabel();\\r\\n    document.getElementById('hmBalance').textContent = formatMoneyShort(totalBalance);\\r\\n    document.getElementById('hmIncome').textContent = formatMoneyShort(inc);\\r\\n    document.getElementById('hmExpense').textContent = formatMoneyShort(exp);\\r\\n    const n = document.getElementById('hmNet');\\r\\n    n.textContent = (net < 0 ? '−' : '') + formatMoneyShort(Math.abs(net));\\r\\n    n.className = net < 0 ? 'neg' : 'pos';\\r\\n  }\\r\\n\\r\\n  function renderHome() {\\r\\n    renderHomeSummary();\\r\\n    renderTransactions();\\r\\n    populateSourceSelect();\\r\\n  }\\r\\n\\r\\n  function renderTransactions(animate = true) {\\r\\n    let filtered = transactions;\\r\\n    if (currentFilter === 'today') {\\r\\n      const today = new Date().toDateString();\\r\\n      filtered = transactions.filter(t => new Date(t.timestamp).toDateString() === today);\\r\\n    } else if (['income','expense','transfer'].includes(currentFilter)) {\\r\\n      filtered = transactions.filter(t => t.type === currentFilter);\\r\\n    }\\r\\n\\r\\n    const q = (document.getElementById('txSearch')?.value || '').trim().toLowerCase();\\r\\n    if (q) {\\r\\n      filtered = filtered.filter(t => {\\r\\n        const s1 = getSourceById(t.sourceId), s2 = getSourceById(t.fromSourceId), s3 = getSourceById(t.toSourceId);\\r\\n        const cat = incomeCategoryNames[t.category] || expenseCategoryNames[t.category] || '';\\r\\n        return [t.title, cat, s1 && s1.name, s2 && s2.name, s3 && s3.name].join(' ').toLowerCase().includes(q);\\r\\n      });\\r\\n    }\\r\\n    const countBadge = document.getElementById('txCountBadge');\\r\\n    if (countBadge) countBadge.textContent = toPersianNum(filtered.length);\\r\\n\\r\\n    const list = document.getElementById('transactionsList');\\r\\n    if (filtered.length === 0) {\\r\\n      list.innerHTML = `\\r\\n        <div class=\\\"empty-state\\\">\\r\\n          <div class=\\\"empty-mark\\\">${icon('wallet')}<\\/div>\\r\\n          <div>${transactions.length === 0\\r\\n            ? '<strong>هنوز تراکنشی ثبت نکرده‌اید<\\/strong><br>با دکمه + شروع کنید'\\r\\n            : 'موردی یافت نشد'}<\\/div>\\r\\n        <\\/div>`;\\r\\n      return;\\r\\n    }\\r\\n\\r\\n    const groups = [];\\r\\n    const byDay = new Map();\\r\\n    filtered.forEach(t => {\\r\\n      const date = new Date(t.timestamp);\\r\\n      const key = date.toDateString();\\r\\n      if (!byDay.has(key)) {\\r\\n        const group = { date, items: [] };\\r\\n        byDay.set(key, group);\\r\\n        groups.push(group);\\r\\n      }\\r\\n      byDay.get(key).items.push(t);\\r\\n    });\\r\\n\\r\\n    let index = 0;\\r\\n    list.innerHTML = groups.map(group => {\\r\\n      const net = group.items.reduce((sum, t) => {\\r\\n        if (t.type === 'income') return sum + t.amount;\\r\\n        if (t.type === 'expense') return sum - t.amount;\\r\\n        return sum;\\r\\n      }, 0);\\r\\n      const netHtml = net === 0 ? '' :\\r\\n        `<span class=\\\"day-net ${net > 0 ? 'pos' : 'neg'}\\\">${net > 0 ? '+' : '−'}${formatMoneyShort(Math.abs(net))}<\\/span>`;\\r\\n      const items = group.items.map(t => transactionItemHtml(t, index++, animate)).join('');\\r\\n      return `<div class=\\\"day-group\\\">\\r\\n        <div class=\\\"day-head\\\"><span class=\\\"day-name\\\">${dayGroupLabel(group.date)}<\\/span>${netHtml}<\\/div>\\r\\n        ${items}\\r\\n      <\\/div>`;\\r\\n    }).join('');\\r\\n  }\\r\\n\\r\\n  function transactionItemHtml(t, index, animate = true) {\\r\\n    const delay = Math.min(index, 14) * 26;\\r\\n    const animCls = animate ? '' : ' no-anim';\\r\\n    if (t.type === 'transfer') {\\r\\n      const fromSrc = getSourceById(t.fromSourceId);\\r\\n      const toSrc = getSourceById(t.toSourceId);\\r\\n      return `\\r\\n        <div class=\\\"transaction-item transfer${animCls}\\\" style=\\\"animation-delay:${delay}ms\\\">\\r\\n          <div class=\\\"transaction-marker transfer\\\">${icon('swap')}<\\/div>\\r\\n          <div class=\\\"transaction-info\\\">\\r\\n            <div class=\\\"transaction-title\\\">${escapeHtml(t.title)}<\\/div>\\r\\n            <div class=\\\"transaction-meta\\\">\\r\\n              <span class=\\\"source-badge transfer\\\">${fromSrc ? escapeHtml(fromSrc.name) : '؟'} ← ${toSrc ? escapeHtml(toSrc.name) : '؟'}<\\/span>\\r\\n              <span class=\\\"meta-sep\\\"><\\/span>\\r\\n              <span>${formatTime(t.timestamp)}<\\/span>\\r\\n            <\\/div>\\r\\n          <\\/div>\\r\\n          <div class=\\\"tx-side\\\">\\r\\n            <div class=\\\"transaction-amount transfer\\\">${formatMoney(t.amount)}<\\/div>\\r\\n            <button class=\\\"delete-btn\\\" onclick=\\\"deleteTransaction(${t.id})\\\" aria-label=\\\"حذف\\\">${icon('trash')}<\\/button>\\r\\n          <\\/div>\\r\\n        <\\/div>`;\\r\\n    }\\r\\n\\r\\n    const isIncome = t.type === 'income';\\r\\n    const src = getSourceById(t.sourceId);\\r\\n    const srcType = src ? src.type : 'cash';\\r\\n    const srcName = src ? escapeHtml(src.name) : 'نامشخص';\\r\\n    const catName = isIncome\\r\\n      ? (incomeCategoryNames[t.category] || 'درآمد')\\r\\n      : (expenseCategoryNames[t.category] || 'سایر');\\r\\n\\r\\n    return `\\r\\n      <div class=\\\"transaction-item ${t.type}${animCls}\\\" style=\\\"animation-delay:${delay}ms\\\">\\r\\n        <div class=\\\"transaction-marker ${t.type}\\\">${icon(categoryIcon(t.category))}<\\/div>\\r\\n        <div class=\\\"transaction-info\\\">\\r\\n          <div class=\\\"transaction-title\\\">${escapeHtml(t.title)}<\\/div>\\r\\n          <div class=\\\"transaction-meta\\\">\\r\\n            <span class=\\\"source-badge ${srcType}\\\">${srcName}<\\/span>\\r\\n            <span class=\\\"meta-sep\\\"><\\/span>\\r\\n            <span>${catName}<\\/span>\\r\\n            <span class=\\\"meta-sep\\\"><\\/span>\\r\\n            <span>${formatTime(t.timestamp)}<\\/span>\\r\\n          <\\/div>\\r\\n        <\\/div>\\r\\n        <div class=\\\"tx-side\\\">\\r\\n          <div class=\\\"transaction-amount ${t.type}\\\">${isIncome ? '+' : '−'}${formatMoney(t.amount)}<\\/div>\\r\\n          <button class=\\\"delete-btn\\\" onclick=\\\"deleteTransaction(${t.id})\\\" aria-label=\\\"حذف\\\">${icon('trash')}<\\/button>\\r\\n        <\\/div>\\r\\n      <\\/div>`;\\r\\n  }\\r\\n\\r\\n  function renderSources() {\\r\\n    const list = document.getElementById('sourcesList');\\r\\n    const countEl = document.getElementById('sourcesCount');\\r\\n    const totalEl = document.getElementById('sourcesTotal');\\r\\n    if (countEl) countEl.textContent = toPersianNum(sources.length) + ' منبع';\\r\\n    if (totalEl) {\\r\\n      const total = sources.reduce((sum, src) => sum + getSourceBalance(src.id), 0);\\r\\n      totalEl.textContent = formatMoney(total);\\r\\n    }\\r\\n\\r\\n    if (sources.length === 0) {\\r\\n      list.innerHTML = `<div class=\\\"empty-state\\\" style=\\\"padding:20px\\\"><div class=\\\"empty-mark\\\">${icon('wallet')}<\\/div>هنوز منبعی اضافه نشده<\\/div>`;\\r\\n      return;\\r\\n    }\\r\\n\\r\\n    list.innerHTML = sources.map(s => {\\r\\n      const bal = getSourceBalance(s.id);\\r\\n      const isCash = s.type === 'cash';\\r\\n      const typeName = isCash ? 'نقدی' : 'کارت بانکی';\\r\\n      const balClass = bal >= 0 ? 'positive' : 'negative';\\r\\n      return `\\r\\n        <div class=\\\"resource-item ${s.type}\\\">\\r\\n          <div class=\\\"resource-mark ${s.type}\\\">${icon(isCash ? 'cash' : 'card')}<\\/div>\\r\\n          <div class=\\\"resource-info\\\">\\r\\n            <div class=\\\"resource-name\\\">${escapeHtml(s.name)}<\\/div>\\r\\n            <div class=\\\"resource-type\\\">${typeName} • اولیه: ${formatMoney(s.initialBalance)}<\\/div>\\r\\n            ${bankInfoHtml(s)}\\r\\n          <\\/div>\\r\\n          <div class=\\\"resource-right\\\">\\r\\n            <div class=\\\"resource-balance ${balClass}\\\">${formatMoney(bal)}<\\/div>\\r\\n            <button class=\\\"resource-delete\\\" onclick=\\\"deleteSource('${s.id}')\\\" aria-label=\\\"حذف\\\">${icon('trash')}<\\/button>\\r\\n          <\\/div>\\r\\n        <\\/div>`;\\r\\n    }).join('');\\r\\n  }\\r\\n\\r\\n  function renderStats() {\\r\\n    let totalIncome = 0, totalExpense = 0;\\r\\n    let todayIncome = 0, todayExpense = 0;\\r\\n    const today = new Date().toDateString();\\r\\n    const expenseByCat = {};\\r\\n    const incomeByCat = {};\\r\\n\\r\\n    transactions.forEach(t => {\\r\\n      if (t.type === 'income') {\\r\\n        totalIncome += t.amount;\\r\\n        incomeByCat[t.category] = (incomeByCat[t.category] || 0) + t.amount;\\r\\n      } else if (t.type === 'expense') {\\r\\n        totalExpense += t.amount;\\r\\n        expenseByCat[t.category] = (expenseByCat[t.category] || 0) + t.amount;\\r\\n      }\\r\\n      if (new Date(t.timestamp).toDateString() === today) {\\r\\n        if (t.type === 'income') todayIncome += t.amount;\\r\\n        else if (t.type === 'expense') todayExpense += t.amount;\\r\\n      }\\r\\n    });\\r\\n\\r\\n    const cash = sources.filter(s => s.type === 'cash').reduce((s, r) => s + getSourceBalance(r.id), 0);\\r\\n    const bank = sources.filter(s => s.type === 'bank').reduce((s, r) => s + getSourceBalance(r.id), 0);\\r\\n    const total = cash + bank;\\r\\n\\r\\n    document.getElementById('statIncome').textContent = formatMoneyShort(totalIncome);\\r\\n    document.getElementById('statExpense').textContent = formatMoneyShort(totalExpense);\\r\\n    document.getElementById('statBalance').textContent = formatMoney(total);\\r\\n    document.getElementById('statCash').textContent = formatMoney(cash);\\r\\n    document.getElementById('statBank').textContent = formatMoney(bank);\\r\\n    document.getElementById('statTodayExpense').textContent = formatMoney(todayExpense);\\r\\n    document.getElementById('statTodayIncome').textContent = formatMoney(todayIncome);\\r\\n    document.getElementById('statCount').textContent = toPersianNum(transactions.length);\\r\\n\\r\\n    renderChart('categoryChart', expenseByCat, expenseCategoryNames, totalExpense, '#e0524a');\\r\\n    renderChart('incomeChart', incomeByCat, incomeCategoryNames, totalIncome, '#2fa56f');\\r\\n\\r\\n    renderBudget();\\r\\n    renderStatsSources();\\r\\n  }\\r\\n\\r\\n  function renderStatsSources() {\\r\\n    const el = document.getElementById('statsSourcesList');\\r\\n    if (sources.length === 0) {\\r\\n      el.innerHTML = `<div style=\\\"font-size:13px;color:var(--text-light);padding:10px 0\\\">منبعی تعریف نشده<\\/div>`;\\r\\n      return;\\r\\n    }\\r\\n    el.innerHTML = sources.map(s => {\\r\\n      const bal = getSourceBalance(s.id);\\r\\n      return `\\r\\n        <div class=\\\"summary-row\\\" style=\\\"padding:10px 0\\\">\\r\\n          <span class=\\\"summary-label\\\">${escapeHtml(s.name)}<\\/span>\\r\\n          <span class=\\\"summary-value ${bal >= 0 ? 'positive' : 'negative'}\\\">${formatMoney(bal)}<\\/span>\\r\\n        <\\/div>`;\\r\\n    }).join('');\\r\\n  }\\r\\n\\r\\n  function renderBudget() {\\r\\n    const monthKey = getMonthKey();\\r\\n    const b = budgets[monthKey] || { total: 0, categories: {} };\\r\\n    const labelEl = document.getElementById('budgetMonthLabel');\\r\\n    if (labelEl) labelEl.textContent = getMonthLabel();\\r\\n\\r\\n    const monthExpenses = transactions.filter(t => t.type === 'expense' && isInCurrentMonth(t.timestamp));\\r\\n    const totalSpent = monthExpenses.reduce((s, t) => s + t.amount, 0);\\r\\n\\r\\n    const content = document.getElementById('budgetContent');\\r\\n    let html = '';\\r\\n\\r\\n    if (b.total > 0) {\\r\\n      const pct = Math.min(100, Math.round((totalSpent / b.total) * 100));\\r\\n      let statusCls = 'safe';\\r\\n      if (pct >= 100) statusCls = 'danger';\\r\\n      else if (pct >= 80) statusCls = 'warning';\\r\\n      const remaining = b.total - totalSpent;\\r\\n      html += `\\r\\n        <div class=\\\"budget-item\\\">\\r\\n          <div class=\\\"budget-header\\\">\\r\\n            <div class=\\\"budget-label\\\">بودجه کل ماه<\\/div>\\r\\n            <button class=\\\"budget-edit-btn\\\" onclick=\\\"openBudgetModal('total', null)\\\">ویرایش<\\/button>\\r\\n          <\\/div>\\r\\n          <div class=\\\"budget-track\\\">\\r\\n            <div class=\\\"budget-fill ${statusCls}\\\" style=\\\"width:${pct}%\\\"><\\/div>\\r\\n          <\\/div>\\r\\n          <div style=\\\"display:flex; justify-content:space-between; align-items:center; gap:8px\\\">\\r\\n            <div class=\\\"budget-amounts\\\">\\r\\n              خرج شده: <strong>${formatMoney(totalSpent)}<\\/strong> از ${formatMoney(b.total)}\\r\\n            <\\/div>\\r\\n            <div class=\\\"budget-status ${statusCls}\\\">\\r\\n              ${remaining >= 0 ? 'باقی: ' + formatMoney(remaining) : 'اضافه: ' + formatMoney(-remaining)}\\r\\n            <\\/div>\\r\\n          <\\/div>\\r\\n        <\\/div>`;\\r\\n    } else {\\r\\n      html += `\\r\\n        <div class=\\\"budget-empty\\\">\\r\\n          بودجه‌ای تنظیم نشده.\\r\\n          <button class=\\\"budget-edit-btn\\\" style=\\\"margin-top:12px;display:block;margin-left:auto;margin-right:auto;padding:10px 18px;background:var(--brand-50);border-radius:var(--radius);font-size:13px\\\" onclick=\\\"openBudgetModal('total', null)\\\">تعیین بودجه کل ماه<\\/button>\\r\\n        <\\/div>`;\\r\\n    }\\r\\n\\r\\n    if (b.total > 0 || Object.keys(b.categories || {}).length > 0) {\\r\\n      html += `<div style=\\\"margin-top:8px; font-size:12px; font-weight:700; color:var(--text-light); padding:12px 0 6px\\\">بودجه دسته‌ها:<\\/div>`;\\r\\n    }\\r\\n\\r\\n    Object.keys(expenseCategoryNames).forEach(cat => {\\r\\n      const limit = (b.categories || {})[cat] || 0;\\r\\n      const spent = monthExpenses.filter(t => t.category === cat).reduce((s, t) => s + t.amount, 0);\\r\\n      if (limit === 0 && spent === 0) return;\\r\\n      const pct = limit > 0 ? Math.min(100, Math.round((spent / limit) * 100)) : 0;\\r\\n      let statusCls = 'safe';\\r\\n      if (limit > 0 && pct >= 100) statusCls = 'danger';\\r\\n      else if (limit > 0 && pct >= 80) statusCls = 'warning';\\r\\n      html += `\\r\\n        <div class=\\\"budget-item\\\">\\r\\n          <div class=\\\"budget-header\\\">\\r\\n            <div class=\\\"budget-label\\\">${expenseCategoryNames[cat]}<\\/div>\\r\\n            <button class=\\\"budget-edit-btn\\\" onclick=\\\"openBudgetModal('category', '${cat}')\\\">ویرایش<\\/button>\\r\\n          <\\/div>\\r\\n          <div class=\\\"budget-track\\\">\\r\\n            <div class=\\\"budget-fill ${statusCls}\\\" style=\\\"width:${limit > 0 ? pct : 0}%\\\"><\\/div>\\r\\n          <\\/div>\\r\\n          <div style=\\\"display:flex; justify-content:space-between; align-items:center; gap:8px\\\">\\r\\n            <div class=\\\"budget-amounts\\\">\\r\\n              ${limit > 0 ? `خرج شده: <strong>${formatMoney(spent)}<\\/strong> از ${formatMoney(limit)}` : `خرج شده: <strong>${formatMoney(spent)}<\\/strong> (بدون سقف)`}\\r\\n            <\\/div>\\r\\n            ${limit > 0 ? `<div class=\\\"budget-status ${statusCls}\\\">${limit - spent >= 0 ? 'باقی: ' + formatMoney(limit - spent) : 'اضافه: ' + formatMoney(spent - limit)}<\\/div>` : ''}\\r\\n          <\\/div>\\r\\n        <\\/div>`;\\r\\n    });\\r\\n\\r\\n    content.innerHTML = html;\\r\\n  }\\r\\n\\r\\n  function openBudgetModal(type, category) {\\r\\n    budgetModalTarget = { type, category };\\r\\n    const b = budgets[getMonthKey()] || { total: 0, categories: {} };\\r\\n    const titleEl = document.getElementById('budgetModalTitle');\\r\\n    const descEl = document.getElementById('budgetModalDesc');\\r\\n    const inputEl = document.getElementById('budgetLimitInput');\\r\\n    if (type === 'total') {\\r\\n      titleEl.textContent = 'بودجه کل ماه';\\r\\n      descEl.textContent = 'سقف کل هزینه‌های این ماه را تعیین کنید (۰ = حذف)';\\r\\n      inputEl.value = b.total ? fmtNum(b.total) : '';\\r\\n    } else {\\r\\n      titleEl.textContent = `بودجه ${expenseCategoryNames[category]}`;\\r\\n      descEl.textContent = `سقف هزینه دسته «${expenseCategoryNames[category]}» در این ماه (۰ = حذف)`;\\r\\n      inputEl.value = (b.categories && b.categories[category]) ? fmtNum(b.categories[category]) : '';\\r\\n    }\\r\\n    document.getElementById('budgetModal').classList.add('show');\\r\\n    setTimeout(() => inputEl.focus(), 100);\\r\\n  }\\r\\n  function closeBudgetModal() {\\r\\n    document.getElementById('budgetModal').classList.remove('show');\\r\\n  }\\r\\n  document.getElementById('budgetModal').addEventListener('click', (e) => {\\r\\n    if (e.target.id === 'budgetModal') closeBudgetModal();\\r\\n  });\\r\\n  function saveBudget() {\\r\\n    const val = parseMoney(document.getElementById('budgetLimitInput').value) || 0;\\r\\n    const monthKey = getMonthKey();\\r\\n    if (!budgets[monthKey]) budgets[monthKey] = { total: 0, categories: {} };\\r\\n    if (!budgets[monthKey].categories) budgets[monthKey].categories = {};\\r\\n    if (budgetModalTarget.type === 'total') {\\r\\n      budgets[monthKey].total = val;\\r\\n    } else if (budgetModalTarget.type === 'category' && budgetModalTarget.category) {\\r\\n      if (val > 0) budgets[monthKey].categories[budgetModalTarget.category] = val;\\r\\n      else delete budgets[monthKey].categories[budgetModalTarget.category];\\r\\n    }\\r\\n    persistBudgets();\\r\\n    renderBudget();\\r\\n    closeBudgetModal();\\r\\n    showToast('بودجه به‌روزرسانی شد', 'success');\\r\\n  }\\r\\n\\r\\n  function renderChart(elId, dataObj, names, total, bg) {\\r\\n    const el = document.getElementById(elId);\\r\\n    const entries = Object.entries(dataObj).sort((a,b) => b[1]-a[1]);\\r\\n    if (entries.length === 0) {\\r\\n      el.innerHTML = `<div style=\\\"font-size:13px;color:var(--text-light);padding:16px 0;text-align:center;font-weight:500\\\">داده‌ای موجود نیست<\\/div>`;\\r\\n      return;\\r\\n    }\\r\\n    el.innerHTML = entries.map(([cat, amt]) => {\\r\\n      const pct = total > 0 ? Math.round((amt / total) * 100) : 0;\\r\\n      return `\\r\\n        <div class=\\\"chart-bar\\\">\\r\\n          <div class=\\\"chart-label\\\">${names[cat] || 'سایر'}<\\/div>\\r\\n          <div class=\\\"chart-track\\\">\\r\\n            <div class=\\\"chart-fill\\\" style=\\\"width:${Math.max(pct, 8)}%; background:${bg}\\\">${pct}٪<\\/div>\\r\\n          <\\/div>\\r\\n          <div class=\\\"chart-value\\\">${formatMoneyShort(amt)}<\\/div>\\r\\n        <\\/div>`;\\r\\n    }).join('');\\r\\n  }\\r\\n\\r\\n  function downloadFile(content, filename, mime = 'text/csv;charset=utf-8;') {\\r\\n    const BOM = '\\\\uFEFF';\\r\\n    const blob = new Blob([BOM + content], { type: mime });\\r\\n    const url = URL.createObjectURL(blob);\\r\\n    const a = document.createElement('a');\\r\\n    a.href = url;\\r\\n    a.download = filename;\\r\\n    document.body.appendChild(a);\\r\\n    a.click();\\r\\n    document.body.removeChild(a);\\r\\n    URL.revokeObjectURL(url);\\r\\n  }\\r\\n  function csvEscape(val) {\\r\\n    if (val == null) return '';\\r\\n    const s = String(val).replace(/\\\"/g, '\\\"\\\"');\\r\\n    return /[\\\",\\\\n\\\\r]/.test(s) ? `\\\"${s}\\\"` : s;\\r\\n  }\\r\\n  function exportCSV(scope) {\\r\\n    let list = transactions;\\r\\n    if (scope === 'month') list = transactions.filter(t => isInCurrentMonth(t.timestamp));\\r\\n    if (list.length === 0) { showToast('تراکنشی برای خروجی وجود ندارد', 'error'); return; }\\r\\n    const headers = ['تاریخ', 'نوع', 'عنوان', 'مبلغ (تومان)', 'دسته‌بندی', 'منبع/از', 'به', 'توضیح'];\\r\\n    const rows = [headers.map(csvEscape).join(',')];\\r\\n    list.forEach(t => {\\r\\n      const dateStr = new Date(t.timestamp).toLocaleString('fa-IR');\\r\\n      if (t.type === 'transfer') {\\r\\n        const fromSrc = getSourceById(t.fromSourceId);\\r\\n        const toSrc = getSourceById(t.toSourceId);\\r\\n        rows.push([dateStr, 'انتقال', t.title, t.amount, 'انتقال',\\r\\n          fromSrc ? fromSrc.name : '', toSrc ? toSrc.name : '', 'انتقال بین منابع'].map(csvEscape).join(','));\\r\\n      } else if (t.type === 'income') {\\r\\n        const src = getSourceById(t.sourceId);\\r\\n        rows.push([dateStr, 'درآمد', t.title, t.amount,\\r\\n          incomeCategoryNames[t.category] || 'سایر', src ? src.name : '', '',\\r\\n          incomeCategoryNames[t.category] || ''].map(csvEscape).join(','));\\r\\n      } else {\\r\\n        const src = getSourceById(t.sourceId);\\r\\n        rows.push([dateStr, 'هزینه', t.title, t.amount,\\r\\n          expenseCategoryNames[t.category] || 'سایر', src ? src.name : '', '',\\r\\n          expenseCategoryNames[t.category] || ''].map(csvEscape).join(','));\\r\\n      }\\r\\n    });\\r\\n    const filename = scope === 'month'\\r\\n      ? `khariyar-month-${getMonthKey()}.csv`\\r\\n      : `khariyar-all-${Date.now()}.csv`;\\r\\n    downloadFile(rows.join('\\\\n'), filename);\\r\\n    showToast('فایل CSV دانلود شد', 'success');\\r\\n  }\\r\\n  function exportSourcesCSV() {\\r\\n    if (sources.length === 0) { showToast('منبعی برای خروجی وجود ندارد', 'error'); return; }\\r\\n    const headers = ['نام منبع', 'نوع', 'موجودی اولیه (تومان)', 'موجودی فعلی (تومان)', 'تعداد تراکنش'];\\r\\n    const rows = [headers.map(csvEscape).join(',')];\\r\\n    sources.forEach(s => {\\r\\n      const bal = getSourceBalance(s.id);\\r\\n      const txCount = transactions.filter(t =>\\r\\n        t.sourceId === s.id || t.fromSourceId === s.id || t.toSourceId === s.id\\r\\n      ).length;\\r\\n      rows.push([s.name, s.type === 'cash' ? 'نقدی' : 'کارت بانکی',\\r\\n        s.initialBalance, bal, txCount].map(csvEscape).join(','));\\r\\n    });\\r\\n    downloadFile(rows.join('\\\\n'), `khariyar-sources-${Date.now()}.csv`);\\r\\n    showToast('گزارش منابع دانلود شد', 'success');\\r\\n  }\\r\\n\\r\\n  document.getElementById('txSearch').addEventListener('input', () => renderTransactions(false));\\r\\n\\r\\n  const PAL = {\\r\\n    categoryChart: ['#f43f5e', '#fb923c', '#f59e0b', '#8b5cf6', '#6366f1', '#0ea5e9', '#94a3b8'],\\r\\n    incomeChart: ['#10b981', '#0ea5e9', '#6366f1', '#8b5cf6', '#f59e0b', '#94a3b8']\\r\\n  };\\r\\n  function fmtCompact(n) {\\r\\n    n = Math.round(n);\\r\\n    const f = (v, u) => toPersianNum((Math.round(v * 10) / 10).toString().replace('.', '٫')) + ' ' + u;\\r\\n    if (n >= 1e9) return f(n / 1e9, 'میلیارد');\\r\\n    if (n >= 1e6) return f(n / 1e6, 'میلیون');\\r\\n    if (n >= 1e3) return f(n / 1e3, 'هزار');\\r\\n    return toPersianNum(n);\\r\\n  }\\r\\n  const EMPTY = `<div class=\\\"chart-empty\\\">${icon('chart')}<span>داده‌ای موجود نیست<\\/span><\\/div>`;\\r\\n\\r\\n  function renderChart(elId, dataObj, names, total) {\\r\\n    const el = document.getElementById(elId);\\r\\n    const entries = Object.entries(dataObj).sort((a, b) => b[1] - a[1]);\\r\\n    if (!entries.length || total <= 0) { el.innerHTML = EMPTY; return; }\\r\\n    const pal = PAL[elId] || PAL.categoryChart;\\r\\n    const C = 2 * Math.PI * 44;\\r\\n    let cum = 0;\\r\\n    const segs = entries.map(([k, v], i) => {\\r\\n      const len = v / total * C;\\r\\n      const c = `<circle class=\\\"seg\\\" cx=\\\"60\\\" cy=\\\"60\\\" r=\\\"44\\\" fill=\\\"none\\\" stroke=\\\"${pal[i % pal.length]}\\\" stroke-width=\\\"13\\\" stroke-linecap=\\\"round\\\" stroke-dasharray=\\\"${Math.max(len - 2, 0.5)} ${C}\\\" stroke-dashoffset=\\\"${-cum}\\\" transform=\\\"rotate(-90 60 60)\\\" style=\\\"animation-delay:${i * 0.08}s\\\"><title>${names[k] || 'سایر'}: ${formatMoney(v)}<\\/title><\\/circle>`;\\r\\n      cum += len;\\r\\n      return c;\\r\\n    }).join('');\\r\\n    const legend = entries.map(([k, v], i) => `\\r\\n      <div class=\\\"legend-row\\\"><i style=\\\"background:${pal[i % pal.length]}\\\"><\\/i>\\r\\n        <span class=\\\"n\\\">${names[k] || 'سایر'}<\\/span>\\r\\n        <span class=\\\"p\\\">${toPersianNum(Math.round(v / total * 100))}٪<\\/span>\\r\\n        <span class=\\\"a\\\">${fmtCompact(v)}<\\/span><\\/div>`).join('');\\r\\n    el.innerHTML = `<div class=\\\"donut-wrap\\\">\\r\\n      <svg class=\\\"chart-svg\\\" viewBox=\\\"0 0 120 120\\\">\\r\\n        <circle cx=\\\"60\\\" cy=\\\"60\\\" r=\\\"44\\\" fill=\\\"none\\\" stroke=\\\"#eef1f7\\\" stroke-width=\\\"13\\\"/>\\r\\n        ${segs}\\r\\n        <text class=\\\"d-total\\\" x=\\\"60\\\" y=\\\"59\\\" text-anchor=\\\"middle\\\">${fmtCompact(total)}<\\/text>\\r\\n        <text x=\\\"60\\\" y=\\\"73\\\" text-anchor=\\\"middle\\\">تومان<\\/text>\\r\\n      <\\/svg>\\r\\n      <div class=\\\"legend\\\">${legend}<\\/div><\\/div>`;\\r\\n  }\\r\\n\\r\\n  function renderMonthlyChart() {\\r\\n    const el = document.getElementById('monthlyChart');\\r\\n    if (!el) return;\\r\\n    const keys = [], info = {};\\r\\n    let d = new Date();\\r\\n    for (let i = 0; i < 40 && keys.length < 6; i++) {\\r\\n      const k = getMonthKey(d);\\r\\n      if (!info[k]) { info[k] = { inc: 0, exp: 0, date: new Date(d) }; keys.push(k); }\\r\\n      d = new Date(d.getTime() - 15 * 864e5);\\r\\n    }\\r\\n    transactions.forEach(t => {\\r\\n      const k = getMonthKey(new Date(t.timestamp));\\r\\n      if (!info[k]) return;\\r\\n      if (t.type === 'income') info[k].inc += t.amount;\\r\\n      else if (t.type === 'expense') info[k].exp += t.amount;\\r\\n    });\\r\\n    keys.reverse();\\r\\n    const max = Math.max(1, ...keys.map(k => Math.max(info[k].inc, info[k].exp)));\\r\\n    if (keys.every(k => info[k].inc === 0 && info[k].exp === 0)) { el.innerHTML = EMPTY; return; }\\r\\n    const W = 320, base = 140, ph = 120, gw = W / keys.length;\\r\\n    const grid = [0.5, 1].map(f => `<line class=\\\"grid\\\" x1=\\\"0\\\" x2=\\\"${W}\\\" y1=\\\"${base - ph * f}\\\" y2=\\\"${base - ph * f}\\\"/>`).join('') +\\r\\n      `<line class=\\\"grid\\\" x1=\\\"0\\\" x2=\\\"${W}\\\" y1=\\\"${base}\\\" y2=\\\"${base}\\\"/>` +\\r\\n      `<text x=\\\"0\\\" y=\\\"${base - ph - 4}\\\" style=\\\"text-anchor:start\\\">${fmtCompact(max)}<\\/text>`;\\r\\n    const groups = keys.map((k, j) => {\\r\\n      const gx = W - (j + 0.5) * gw;\\r\\n      const hi = info[k].inc / max * ph, he = info[k].exp / max * ph;\\r\\n      let lab = '';\\r\\n      try { lab = new Intl.DateTimeFormat('fa-IR', { month: 'long' }).format(info[k].date); } catch (e) { lab = k; }\\r\\n      return `\\r\\n        ${hi > 0 ? `<rect class=\\\"bar\\\" x=\\\"${gx - 14}\\\" y=\\\"${base - hi}\\\" width=\\\"13\\\" height=\\\"${hi}\\\" rx=\\\"3\\\" fill=\\\"url(#barIncome)\\\" style=\\\"animation-delay:${j * 0.06}s\\\"><title>درآمد: ${formatMoney(info[k].inc)}<\\/title><\\/rect>` : ''}\\r\\n        ${he > 0 ? `<rect class=\\\"bar\\\" x=\\\"${gx + 1}\\\" y=\\\"${base - he}\\\" width=\\\"13\\\" height=\\\"${he}\\\" rx=\\\"3\\\" fill=\\\"url(#barExpense)\\\" style=\\\"animation-delay:${j * 0.06 + 0.03}s\\\"><title>هزینه: ${formatMoney(info[k].exp)}<\\/title><\\/rect>` : ''}\\r\\n        <text x=\\\"${gx}\\\" y=\\\"${base + 16}\\\" text-anchor=\\\"middle\\\">${lab}<\\/text>`;\\r\\n    }).join('');\\r\\n    el.innerHTML = `<svg class=\\\"chart-svg\\\" viewBox=\\\"0 0 ${W} 160\\\">\\r\\n        <defs>\\r\\n          <linearGradient id=\\\"barIncome\\\" x1=\\\"0\\\" y1=\\\"0\\\" x2=\\\"0\\\" y2=\\\"1\\\"><stop offset=\\\"0\\\" stop-color=\\\"#34d399\\\"/><stop offset=\\\"1\\\" stop-color=\\\"#059669\\\"/><\\/linearGradient>\\r\\n          <linearGradient id=\\\"barExpense\\\" x1=\\\"0\\\" y1=\\\"0\\\" x2=\\\"0\\\" y2=\\\"1\\\"><stop offset=\\\"0\\\" stop-color=\\\"#fb7185\\\"/><stop offset=\\\"1\\\" stop-color=\\\"#e11d48\\\"/><\\/linearGradient>\\r\\n        <\\/defs>\\r\\n        ${grid}${groups}<\\/svg>\\r\\n      <div class=\\\"chart-legend\\\"><span><i style=\\\"background:#10b981\\\"><\\/i>درآمد<\\/span><span><i style=\\\"background:#f43f5e\\\"><\\/i>هزینه<\\/span><\\/div>`;\\r\\n  }\\r\\n\\r\\n  function renderTrendChart() {\\r\\n    const el = document.getElementById('trendChart');\\r\\n    if (!el) return;\\r\\n    const N = 30, now = new Date();\\r\\n    now.setHours(0, 0, 0, 0);\\r\\n    const sums = {};\\r\\n    transactions.forEach(t => {\\r\\n      if (t.type !== 'expense') return;\\r\\n      const ds = new Date(t.timestamp).toDateString();\\r\\n      sums[ds] = (sums[ds] || 0) + t.amount;\\r\\n    });\\r\\n    const days = [];\\r\\n    for (let i = N - 1; i >= 0; i--) {\\r\\n      const dd = new Date(now); dd.setDate(dd.getDate() - i);\\r\\n      days.push({ date: dd, v: sums[dd.toDateString()] || 0 });\\r\\n    }\\r\\n    const total = days.reduce((s, x) => s + x.v, 0);\\r\\n    if (total === 0) { el.innerHTML = EMPTY; return; }\\r\\n    const max = Math.max(...days.map(x => x.v));\\r\\n    const W = 320, L = 8, R = 8, top = 18, base = 120;\\r\\n    const X = i => W - R - (i / (N - 1)) * (W - L - R);\\r\\n    const Y = v => base - (v / max) * (base - top);\\r\\n    const pts = days.map((x, i) => [X(i), Y(x.v)]);\\r\\n    const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');\\r\\n    const area = line + ` L${X(N - 1).toFixed(1)} ${base} L${X(0).toFixed(1)} ${base} Z`;\\r\\n    const pk = days.findIndex(x => x.v === max);\\r\\n    const dl = dt => { try { return new Intl.DateTimeFormat('fa-IR', { month: 'short', day: 'numeric' }).format(dt); } catch (e) { return ''; } };\\r\\n    const dots = days.map((x, i) => x.v > 0 ? `<circle cx=\\\"${pts[i][0].toFixed(1)}\\\" cy=\\\"${pts[i][1].toFixed(1)}\\\" r=\\\"2.4\\\" fill=\\\"#fff\\\" stroke=\\\"#f43f5e\\\" stroke-width=\\\"1.5\\\"><title>${dl(x.date)}: ${formatMoney(x.v)}<\\/title><\\/circle>` : '').join('');\\r\\n    el.innerHTML = `<svg class=\\\"chart-svg\\\" viewBox=\\\"0 0 ${W} 144\\\">\\r\\n        <defs><linearGradient id=\\\"trendGrad\\\" x1=\\\"0\\\" y1=\\\"0\\\" x2=\\\"0\\\" y2=\\\"1\\\"><stop offset=\\\"0\\\" stop-color=\\\"#f43f5e\\\" stop-opacity=\\\".24\\\"/><stop offset=\\\"1\\\" stop-color=\\\"#f43f5e\\\" stop-opacity=\\\"0\\\"/><\\/linearGradient><\\/defs>\\r\\n        <line class=\\\"grid\\\" x1=\\\"0\\\" x2=\\\"${W}\\\" y1=\\\"${top}\\\" y2=\\\"${top}\\\"/><line class=\\\"grid\\\" x1=\\\"0\\\" x2=\\\"${W}\\\" y1=\\\"${(top + base) / 2}\\\" y2=\\\"${(top + base) / 2}\\\"/><line class=\\\"grid\\\" x1=\\\"0\\\" x2=\\\"${W}\\\" y1=\\\"${base}\\\" y2=\\\"${base}\\\"/>\\r\\n        <path class=\\\"area\\\" d=\\\"${area}\\\" fill=\\\"url(#trendGrad)\\\"/>\\r\\n        <path class=\\\"line\\\" pathLength=\\\"1\\\" d=\\\"${line}\\\" fill=\\\"none\\\" stroke=\\\"#f43f5e\\\" stroke-width=\\\"2.2\\\" stroke-linecap=\\\"round\\\" stroke-linejoin=\\\"round\\\"/>\\r\\n        ${dots}\\r\\n        <text x=\\\"${W - R}\\\" y=\\\"${base + 16}\\\" text-anchor=\\\"end\\\">${dl(days[0].date)}<\\/text>\\r\\n        <text x=\\\"${W / 2}\\\" y=\\\"${base + 16}\\\" text-anchor=\\\"middle\\\">${dl(days[Math.floor(N / 2)].date)}<\\/text>\\r\\n        <text x=\\\"${L}\\\" y=\\\"${base + 16}\\\" text-anchor=\\\"start\\\">امروز<\\/text>\\r\\n      <\\/svg>\\r\\n      <div class=\\\"trend-meta\\\">\\r\\n        <div><small>میانگین روزانه<\\/small><b>${fmtCompact(total / N)} تومان<\\/b><\\/div>\\r\\n        <div><small>پرخرج‌ترین روز (${dl(days[pk].date)})<\\/small><b>${fmtCompact(max)} تومان<\\/b><\\/div>\\r\\n      <\\/div>`;\\r\\n  }\\r\\n\\r\\n  const _renderStatsBase = renderStats;\\r\\n  renderStats = function () { _renderStatsBase(); renderMonthlyChart(); renderTrendChart(); };\\r\\n\\r\\n  function bankInfoHtml(s) {\\r\\n    if (s.type !== 'bank' || !(s.bankName || s.cardNumber || s.sheba || s.holder)) return '';\\r\\n    const head = [s.bankName ? 'بانک ' + escapeHtml(s.bankName) : '', s.holder ? escapeHtml(s.holder) : ''].filter(Boolean).join(' • ');\\r\\n    const masked = s.cardNumber ? `<span class=\\\"masked\\\">•••• •••• •••• ${s.cardNumber.slice(-4)}<\\/span>` : '';\\r\\n    const btns = [];\\r\\n    if (s.cardNumber) btns.push(`<button type=\\\"button\\\" onclick=\\\"copySourceField('${s.id}','cardNumber')\\\">کپی شماره کارت<\\/button>`);\\r\\n    if (s.sheba) btns.push(`<button type=\\\"button\\\" onclick=\\\"copySourceField('${s.id}','sheba')\\\">کپی شبا<\\/button>`);\\r\\n    return `<div class=\\\"bank-info\\\">${head ? '<div>' + head + '<\\/div>' : ''}${masked ? '<div>' + masked + '<\\/div>' : ''}${btns.length ? '<div class=\\\"bank-actions\\\">' + btns.join('') + '<\\/div>' : ''}<\\/div>`;\\r\\n  }\\r\\n  function copySourceField(id, field) {\\r\\n    const s = getSourceById(id);\\r\\n    if (!s || !s[field]) return;\\r\\n    const text = s[field];\\r\\n    const done = () => showToast(field === 'sheba' ? 'شماره شبا کپی شد' : 'شماره کارت کپی شد', 'success');\\r\\n    const fallback = () => {\\r\\n      const ta = document.createElement('textarea');\\r\\n      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';\\r\\n      document.body.appendChild(ta); ta.select();\\r\\n      try { document.execCommand('copy'); done(); } catch (e) { showToast('کپی انجام نشد', 'error'); }\\r\\n      document.body.removeChild(ta);\\r\\n    };\\r\\n    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);\\r\\n    else fallback();\\r\\n  }\\r\\n  document.getElementById('sourceCardNumber').addEventListener('input', e => {\\r\\n    const d = normDigits(e.target.value).replace(/\\\\D/g, '').slice(0, 16);\\r\\n    e.target.value = d.replace(/(\\\\d{4})(?=\\\\d)/g, '$1 ');\\r\\n  });\\r\\n  document.getElementById('sourceSheba').addEventListener('input', e => {\\r\\n    const d = e.target.value.toUpperCase().replace(/[^0-9]/g, '').slice(0, 24);\\r\\n    e.target.value = d ? 'IR' + d : '';\\r\\n  });\\r\\n\\r\\n  function normDigits(s) {\\r\\n    return String(s).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));\\r\\n  }\\r\\n  function fmtNum(n) { return String(n).replace(/\\\\B(?=(\\\\d{3})+(?!\\\\d))/g, ','); }\\r\\n  function parseMoney(v) {\\r\\n    const d = normDigits(v).replace(/\\\\D/g, '');\\r\\n    return d ? parseInt(d, 10) : NaN;\\r\\n  }\\r\\n  document.querySelectorAll('.money-input').forEach(inp => {\\r\\n    inp.addEventListener('input', () => {\\r\\n      const raw = normDigits(inp.value);\\r\\n      const pos = inp.selectionStart == null ? raw.length : inp.selectionStart;\\r\\n      const digitsBefore = raw.slice(0, pos).replace(/\\\\D/g, '').length;\\r\\n      const digits = raw.replace(/\\\\D/g, '').replace(/^0+(?=\\\\d)/, '');\\r\\n      const out = digits ? fmtNum(digits) : '';\\r\\n      inp.value = out;\\r\\n      let c = 0, i = 0;\\r\\n      while (i < out.length && c < digitsBefore) { if (/\\\\d/.test(out[i])) c++; i++; }\\r\\n      try { inp.setSelectionRange(i, i); } catch (e) {}\\r\\n    });\\r\\n  });\\r\\n\\r\\n  function exportBackup() {\\r\\n    const data = { app: 'khariyar', version: 1, exportedAt: new Date().toISOString(), sources, transactions, budgets };\\r\\n    downloadFile(JSON.stringify(data), `khariyar-backup-${Date.now()}.json`, 'application/json;charset=utf-8;');\\r\\n    showToast('فایل پشتیبان ذخیره شد', 'success');\\r\\n  }\\r\\n  function importBackup(e) {\\r\\n    const file = e.target.files && e.target.files[0];\\r\\n    e.target.value = '';\\r\\n    if (!file) return;\\r\\n    const reader = new FileReader();\\r\\n    reader.onload = () => {\\r\\n      try {\\r\\n        const d = JSON.parse(String(reader.result).replace(/^\\\\uFEFF/, ''));\\r\\n        if (!d || !Array.isArray(d.sources) || !Array.isArray(d.transactions) || d.sources.length === 0) throw new Error('bad');\\r\\n        showConfirm('بازیابی اطلاعات', `${toPersianNum(d.transactions.length)} تراکنش و ${toPersianNum(d.sources.length)} منبع بازیابی می‌شود و اطلاعات فعلی حذف خواهد شد. ادامه می‌دهید؟`, () => {\\r\\n          sources = d.sources;\\r\\n          transactions = d.transactions.sort((a, b) => b.timestamp - a.timestamp);\\r\\n          budgets = d.budgets && typeof d.budgets === 'object' ? d.budgets : {};\\r\\n          persistSources(); persistTransactions(); persistBudgets();\\r\\n          renderHome(); renderStats(); renderSources();\\r\\n          showToast('اطلاعات بازیابی شد', 'success');\\r\\n        });\\r\\n      } catch (err) { showToast('فایل پشتیبان معتبر نیست', 'error'); }\\r\\n    };\\r\\n    reader.readAsText(file);\\r\\n  }\\r\\n  function resetAllData() {\\r\\n    showConfirm('پاک‌کردن همه اطلاعات', 'همه تراکنش‌ها، منابع و بودجه‌ها حذف می‌شوند. این کار قابل بازگشت نیست.', () => {\\r\\n      transactions = []; budgets = {};\\r\\n      sources = [\\r\\n        { id: 'cash-default', name: 'نقدی', type: 'cash', initialBalance: 0 },\\r\\n        { id: 'bank-default', name: 'کارت بانکی', type: 'bank', initialBalance: 0 }\\r\\n      ];\\r\\n      persistSources(); persistTransactions(); persistBudgets();\\r\\n      renderHome(); renderStats(); renderSources();\\r\\n      showToast('همه اطلاعات پاک شد');\\r\\n    });\\r\\n  }\\r\\n\\r\\n  renderHome();\\r\\n  renderSources();\\r\\n  document.getElementById('page-home').classList.add('page-in');\\r\\n<\\/script>\\r\\n\\r\\n<\\/body>\\r\\n<\\/html>\";\nconst jMonths = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];\r\nconst jMonthsShort = ['فرو','ارد','خرد','تیر','مرد','شهر','مهر','آبا','آذر','دی','بهم','اسف'];\r\n\r\nfunction isLeapJalali(jy) { return (((jy + 12) % 33) % 4) === 1; }\r\nfunction jalaliMonthDays(jy, jm) {\r\n  if (jm <= 6) return 31;\r\n  if (jm <= 11) return 30;\r\n  return isLeapJalali(jy) ? 30 : 29;\r\n}\r\nfunction jalaliToJDN(jy, jm, jd) {\r\n  const epBase = jy - (jy >= 0 ? 474 : 473);\r\n  const epYear = 474 + (epBase % 2820);\r\n  return jd + (jm <= 7 ? (jm - 1) * 31 : (jm - 1) * 30 + 6) +\r\n    Math.floor((epYear * 682 - 110) / 2816) + (epYear - 1) * 365 +\r\n    Math.floor(epBase / 2820) * 1029983 + (1948320 - 1);\r\n}\r\nfunction jdnToJalali(jdn) {\r\n  let depoch = jdn - 2121446;\r\n  let cycle = Math.floor(depoch / 1029983);\r\n  let cyear = depoch % 1029983;\r\n  let ycycle;\r\n  if (cyear === 1029982) ycycle = 2820;\r\n  else {\r\n    let aux1 = Math.floor(cyear / 366);\r\n    let aux2 = cyear % 366;\r\n    ycycle = Math.floor((2134 * aux1 + 2816 * aux2 + 2815) / 1028522) + aux1 + 1;\r\n  }\r\n  let jy = ycycle + 2820 * cycle + 474;\r\n  if (jy <= 0) jy--;\r\n  let yday = jdn - jalaliToJDN(jy, 1, 1) + 1;\r\n  let jm = yday <= 186 ? Math.ceil(yday / 31) : Math.ceil((yday - 6) / 30);\r\n  let jd = jdn - jalaliToJDN(jy, jm, 1) + 1;\r\n  return { jy, jm, jd };\r\n}\r\nfunction addJalaliMonths(jy, jm, jd, months) {\r\n  let totalMonths = (jy * 12 + (jm - 1)) + months;\r\n  let ny = Math.floor(totalMonths / 12);\r\n  let nm = (totalMonths % 12) + 1;\r\n  let maxDay = jalaliMonthDays(ny, nm);\r\n  let nd = Math.min(jd, maxDay);\r\n  return { jy: ny, jm: nm, jd: nd };\r\n}\r\nfunction formatJalali(y, m, d) {\r\n  return y + '/' + String(m).padStart(2,'0') + '/' + String(d).padStart(2,'0');\r\n}\r\nfunction compareJalali(a, b) {\r\n  return jalaliToJDN(a.jy, a.jm, a.jd) - jalaliToJDN(b.jy, b.jm, b.jd);\r\n}\r\nfunction todayJalali() {\r\n  const now = new Date();\r\n  const gy = now.getFullYear(), gm = now.getMonth() + 1, gd = now.getDate();\r\n  const a = Math.floor((14 - gm) / 12);\r\n  const y = gy + 4800 - a;\r\n  const m = gm + 12 * a - 3;\r\n  const jdn = gd + Math.floor((153 * m + 2) / 5) + 365 * y +\r\n    Math.floor(y / 4) - Math.floor(y / 100) + Math.floor(y / 400) - 32045;\r\n  return jdnToJalali(jdn);\r\n}\r\nfunction parseJalali(str) {\r\n  if (!str) return null;\r\n  const parts = str.split('/');\r\n  if (parts.length !== 3) return null;\r\n  return { jy: parseInt(parts[0]), jm: parseInt(parts[1]), jd: parseInt(parts[2]) };\r\n}\r\n\r\nconst STORAGE_KEY = 'loans_v3';\r\nconst THEME_KEY = 'theme_v1';\r\nconst PAY_SOURCE_KEY = 'finance_pay_source_v1';\r\nlet loans = loadLoans();\r\nlet activeLoanId = null;\r\nlet editingLoanId = null;\r\nlet currentSort = 'start';\r\nlet currentView = 'loans';\r\nlet reportYear = 0;\r\nlet reportMonth = 0;\r\n\r\nfunction loadLoans() {\r\n  try {\r\n    const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem('loans_v2');\r\n    return raw ? JSON.parse(raw) : [];\r\n  } catch(e) { return []; }\r\n}\r\nfunction saveLoans() {\r\n  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(loans)); }\r\n  catch(e) { alert('خطا در ذخیره‌سازی: ' + e.message); }\r\n}\r\nfunction getActiveLoan() {\r\n  return loans.find(function(l) { return l.id === activeLoanId; }) || null;\r\n}\r\nfunction uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }\r\nfunction getLoanEndInfo(loan) {\r\n  if (!loan.schedule || loan.schedule.length === 0) return null;\r\n  const first = loan.schedule[0];\r\n  const last = loan.schedule[loan.schedule.length - 1];\r\n  const paidCount = loan.schedule.filter(function(x) { return x.isPaid; }).length;\r\n  return {\r\n    startDate: first.dateStr,\r\n    endDate: last.dateStr,\r\n    isFinished: paidCount === loan.N,\r\n    paidCount: paidCount\r\n  };\r\n}\r\nfunction hasBankInfo(loan) {\r\n  return loan && loan.bankInfo && (\r\n    loan.bankInfo.holder || loan.bankInfo.bank ||\r\n    loan.bankInfo.accountNumber || loan.bankInfo.shaba || loan.bankInfo.cardNumber\r\n  );\r\n}\r\n\r\nfunction toggleMenu() {\r\n  document.getElementById('menuDropdown').classList.toggle('hidden');\r\n}\r\nfunction closeMenu() {\r\n  document.getElementById('menuDropdown').classList.add('hidden');\r\n}\r\ndocument.addEventListener('click', function(e) {\r\n  const menu = document.getElementById('menuDropdown');\r\n  const btn = document.querySelector('.menu-btn');\r\n  if (menu && !menu.classList.contains('hidden') &&\r\n      !menu.contains(e.target) && !btn.contains(e.target)) {\r\n    closeMenu();\r\n  }\r\n});\r\n\r\nfunction toggleTheme() {\r\n  const current = document.documentElement.getAttribute('data-theme');\r\n  const next = current === 'dark' ? 'light' : 'dark';\r\n  document.documentElement.setAttribute('data-theme', next);\r\n  localStorage.setItem(THEME_KEY, next);\r\n  updateThemeMenu();\r\n  syncKhFrameTheme();\r\n  // رندر مجدد نمودارها با رنگ‌های جدید\r\n  if (currentView === 'totalReport') {\r\n    setTimeout(renderTotalReport, 50);\r\n  }\r\n}\r\nfunction updateThemeMenu() {\r\n  const t = document.documentElement.getAttribute('data-theme');\r\n  document.getElementById('themeIcon').textContent = t === 'dark' ? '☀️' : '🌙';\r\n  document.getElementById('themeText').textContent = t === 'dark' ? 'حالت روشن' : 'حالت تاریک';\r\n}\r\nfunction loadTheme() {\r\n  const t = localStorage.getItem(THEME_KEY) || 'light';\r\n  document.documentElement.setAttribute('data-theme', t);\r\n  updateThemeMenu();\r\n}\r\n\r\nfunction buildSchedule(P, N, annualRate, sy, sm, sd, startIndex) {\r\n  const firstIndex = Math.min(Math.max(parseInt(startIndex, 10) || 1, 1), N);\r\n  const i = annualRate / 100 / 12;\r\n  let installment;\r\n  if (i === 0) installment = P / N;\r\n  else installment = P * (i * Math.pow(1 + i, N)) / (Math.pow(1 + i, N) - 1);\r\n\r\n  const schedule = [];\r\n  let remaining = P;\r\n  let totalInterest = 0;\r\n  for (let k = 0; k < N; k++) {\r\n    const index = k + 1;\r\n    const interestPart = remaining * i;\r\n    const principalPart = installment - interestPart;\r\n    remaining -= principalPart;\r\n    totalInterest += interestPart;\r\n    const due = addJalaliMonths(sy, sm, sd, k - (firstIndex - 1));\r\n    schedule.push({\r\n      index: index, date: due,\r\n      dateStr: formatJalali(due.jy, due.jm, due.jd),\r\n      amount: Math.round(installment),\r\n      interest: Math.round(interestPart),\r\n      principal: Math.round(principalPart),\r\n      remaining: Math.round(Math.max(remaining, 0)),\r\n      isPaid: index < firstIndex,\r\n      paidDate: null,\r\n      prepaid: index < firstIndex\r\n    });\r\n  }\r\n  const last = schedule[schedule.length - 1];\r\n  const sumPrev = schedule.slice(0, -1).reduce(function(s, x) { return s + x.amount; }, 0);\r\n  last.amount = Math.round(P + totalInterest) - sumPrev;\r\n\r\n  return {\r\n    installment: Math.round(installment),\r\n    totalInterest: Math.round(totalInterest),\r\n    monthlyRate: i,\r\n    schedule: schedule\r\n  };\r\n}\r\n\r\nfunction validateLoanInput(P, N, annualRate, sy, sm, sd, startIndex) {\r\n  if (!P || P <= 0) return 'مبلغ وام باید بزرگ‌تر از صفر باشد.';\r\n  if (!N || N <= 0 || N > 360) return 'تعداد اقساط باید بین ۱ تا ۳۶۰ باشد.';\r\n  if (!startIndex || startIndex < 1 || startIndex > N) return 'شماره قسط شروع باید بین ۱ و ' + toPersianDigits(N) + ' باشد.';\r\n  if (isNaN(annualRate) || annualRate < 0) return 'نرخ سود نمی‌تواند منفی باشد.';\r\n  if (annualRate > 100) return 'نرخ سود نمی‌تواند بیش از ۱۰۰٪ باشد.';\r\n  if (!sy || sy < 1300 || sy > 1500) return 'سال شروع معتبر نیست.';\r\n  if (sm < 1 || sm > 12) return 'ماه شروع معتبر نیست.';\r\n  if (sd < 1 || sd > jalaliMonthDays(sy, sm)) return 'روز شروع معتبر نیست.';\r\n  return null;\r\n}\r\n\r\nfunction switchView(view) {\r\n  currentView = view;\r\n  document.getElementById('viewLoans').classList.toggle('hidden', view !== 'loans');\r\n  document.getElementById('viewKhariyar').classList.toggle('hidden', view !== 'khariyar');\r\n  document.getElementById('viewPortfolio').classList.toggle('hidden', view !== 'portfolio');\r\n  document.getElementById('viewTotalReport').classList.toggle('hidden', view !== 'totalReport');\r\n  document.getElementById('viewLoanDetail').classList.toggle('hidden', view !== 'loanDetail');\r\n  document.getElementById('tabLoans').classList.toggle('active', view === 'loans' || view === 'loanDetail');\r\n  document.getElementById('tabKhariyar').classList.toggle('active', view === 'khariyar');\r\n  document.getElementById('tabPortfolio').classList.toggle('active', view === 'portfolio');\r\n  document.getElementById('tabTotalReport').classList.toggle('active', view === 'totalReport');\r\n  const fab = document.getElementById('loanFab');\r\n  if (fab) fab.classList.toggle('hidden', view !== 'loans');\r\n  const pfFab = document.getElementById('pfFab');\r\n  if (pfFab) pfFab.classList.toggle('hidden', view !== 'portfolio');\r\n  if (view === 'loans') { renderLoansList(); renderPortfolio(); }\r\n  if (view === 'portfolio') renderPortfolioPage();\r\n  if (view === 'khariyar') initKhFrame();\r\n  if (view === 'totalReport') renderTotalReport();\r\n  if (view === 'loanDetail') { renderSummary(); renderBankInfo(); renderDeductions(); renderTable(); }\r\n  window.scrollTo({ top: 0, behavior: 'smooth' });\r\n}\r\n\r\nfunction openLoanDetail(loanId) {\r\n  activeLoanId = loanId;\r\n  switchView('loanDetail');\r\n}\r\n\r\nfunction backToLoans() {\r\n  activeLoanId = null;\r\n  switchView('loans');\r\n}\r\n\r\nfunction renderLoansList() {\r\n  const list = document.getElementById('loansList');\r\n  list.innerHTML = '';\r\n  if (loans.length === 0) {\r\n    list.innerHTML = '<div class=\"empty\">هنوز وامی اضافه نشده.<br>روی دکمه «+» پایین صفحه بزنید.<\/div>';\r\n    return;\r\n  }\r\n\r\n  const query = (document.getElementById('searchInput').value || '').toLowerCase();\r\n  let filtered = loans.filter(function(l) { return l.name.toLowerCase().indexOf(query) !== -1; });\r\n\r\n  filtered.sort(function(a, b) {\r\n    if (currentSort === 'start') return compareJalali(a.schedule[0].date, b.schedule[0].date);\r\n    if (currentSort === 'end') return compareJalali(a.schedule[a.N-1].date, b.schedule[b.N-1].date);\r\n    if (currentSort === 'amount') return b.P - a.P;\r\n    if (currentSort === 'name') return a.name.localeCompare(b.name, 'fa');\r\n    return 0;\r\n  });\r\n\r\n  if (filtered.length === 0) {\r\n    list.innerHTML = '<div class=\"empty\">وامی یافت نشد<\/div>';\r\n    return;\r\n  }\r\n\r\n  const today = todayJalali();\r\n\r\n  filtered.forEach(function(loan, idx) {\r\n    const paidCount = loan.schedule.filter(function(x) { return x.isPaid; }).length;\r\n    const total = loan.P + loan.totalInterest;\r\n    const paidAmount = loan.schedule.reduce(function(s, x) { return s + (x.isPaid ? x.amount : 0); }, 0);\r\n    const remainingAmount = total - paidAmount;\r\n    const pct = total > 0 ? (paidAmount / total * 100) : 0;\r\n    const info = getLoanEndInfo(loan);\r\n\r\n    let overdueAmount = 0;\r\n    loan.schedule.forEach(function(inst) {\r\n      if (!inst.isPaid && compareJalali(inst.date, today) < 0) overdueAmount += inst.amount;\r\n    });\r\n\r\n    let badge = '<span class=\"badge badge-active\">فعال<\/span>';\r\n    if (info && info.isFinished) badge = '<span class=\"badge badge-finished\">✓ تسویه شده<\/span>';\r\n    else if (overdueAmount > 0) badge = '<span class=\"badge badge-overdue\">⚠️ معوق<\/span>';\r\n\r\n    let bankBadge = '';\r\n    if (hasBankInfo(loan) && loan.bankInfo.bank) {\r\n      bankBadge = '<span class=\"badge badge-bank\">🏦 ' + escapeHtml(loan.bankInfo.bank) + '<\/span>';\r\n    } else if (!hasBankInfo(loan)) {\r\n      bankBadge = '<span class=\"badge badge-nobank\">بدون مشخصات واریز<\/span>';\r\n    }\r\n\r\n    const dedTotal = loanDeductionTotal(loan);\r\n    const dedBadge = dedTotal > 0\r\n      ? '<span class=\"badge badge-deduction\">💸 کسورات ' + fmt(dedTotal) + '<\/span>' : '';\r\n\r\n    let monthsLeftHtml = '';\r\n    if (info && !info.isFinished) {\r\n      const last = loan.schedule[loan.schedule.length - 1];\r\n      const ml = (last.date.jy * 12 + last.date.jm) - (today.jy * 12 + today.jm);\r\n      if (ml >= 0) monthsLeftHtml = ' (' + toPersianDigits(ml) + ' ماه)';\r\n    }\r\n\r\n    const row = document.createElement('div');\r\n    row.className = 'loan-row';\r\n    row.style.animationDelay = (idx * 0.05) + 's';\r\n    row.onclick = (function(id) { return function() { openLoanDetail(id); }; })(loan.id);\r\n    row.innerHTML =\r\n      '<div class=\"loan-row-name\">' +\r\n        '<div class=\"title\">' + escapeHtml(loan.name) + '<\/div>' +\r\n        '<div style=\"display:flex; gap:4px; flex-wrap:wrap;\">' + badge + bankBadge + dedBadge + '<\/div>' +\r\n      '<\/div>' +\r\n      '<div class=\"loan-row-details\">' +\r\n        '<div class=\"detail-item\">' +\r\n          '<div class=\"lbl\">قسط ماهانه<\/div>' +\r\n          '<div class=\"val primary\">' + fmt(loan.installment) + '<\/div>' +\r\n        '<\/div>' +\r\n        '<div class=\"detail-item\">' +\r\n          '<div class=\"lbl\">کل بدهی<\/div>' +\r\n          '<div class=\"val\">' + fmt(total) + '<\/div>' +\r\n        '<\/div>' +\r\n        '<div class=\"detail-item\">' +\r\n          '<div class=\"lbl\">باقی‌مانده<\/div>' +\r\n          '<div class=\"val warning\">' + fmt(remainingAmount) + '<\/div>' +\r\n        '<\/div>' +\r\n        '<div class=\"detail-item\">' +\r\n          '<div class=\"lbl\">تاریخ پایان' + monthsLeftHtml + '<\/div>' +\r\n          '<div class=\"val\" style=\"font-size:12px;\">' + (info ? faDate(info.endDate) : '-') + '<\/div>' +\r\n        '<\/div>' +\r\n      '<\/div>' +\r\n      '<div class=\"loan-row-progress\">' +\r\n        '<div class=\"label\">' +\r\n          '<span>' + toPersianDigits(paidCount) + '/' + toPersianDigits(loan.N) + '<\/span>' +\r\n          '<span>' + toPersianDigits(Math.round(pct)) + '٪<\/span>' +\r\n        '<\/div>' +\r\n        '<div class=\"bar\"><div style=\"width:' + pct + '%\"><\/div><\/div>' +\r\n      '<\/div>' +\r\n      '<div class=\"loan-row-actions\">' +\r\n        '<button class=\"edit\" onclick=\"event.stopPropagation(); editLoanById(\\'' + loan.id + '\\')\" title=\"ویرایش\">✏️<\/button>' +\r\n        '<button class=\"del\" onclick=\"event.stopPropagation(); deleteLoan(\\'' + loan.id + '\\')\" title=\"حذف\">🗑️<\/button>' +\r\n      '<\/div>';\r\n    list.appendChild(row);\r\n  });\r\n}\r\n\r\nfunction setSort(s) {\r\n  currentSort = s;\r\n  document.querySelectorAll('#sortBar button').forEach(function(b) {\r\n    b.classList.toggle('active', b.dataset.sort === s);\r\n  });\r\n  renderLoansList();\r\n}\r\n\r\nfunction editLoanById(id) {\r\n  const loan = loans.find(function(l) { return l.id === id; });\r\n  if (!loan) return;\r\n  activeLoanId = id;\r\n  openEditForm(loan);\r\n}\r\n\r\nfunction loanDeductions(loan) {\r\n  return loan && Array.isArray(loan.deductions) ? loan.deductions : [];\r\n}\r\nfunction loanDeductionTotal(loan) {\r\n  return loanDeductions(loan).reduce(function(s, d) { return s + (Number(d.amount) || 0); }, 0);\r\n}\r\nfunction loanNetReceived(loan) {\r\n  return Math.max(0, (Number(loan && loan.P) || 0) - loanDeductionTotal(loan));\r\n}\r\n\r\nfunction addDeductionRow(title, amount) {\r\n  const wrap = document.getElementById('deductionRows');\r\n  if (!wrap) return;\r\n  const row = document.createElement('div');\r\n  row.className = 'deduction-row';\r\n  const amt = Number(amount) > 0 ? Number(amount).toLocaleString('en-US') : '';\r\n  row.innerHTML =\r\n    '<input type=\"text\" class=\"ded-title\" placeholder=\"عنوان (مثلاً کارمزد)\" value=\"' + escapeAttr(title || '') + '\">' +\r\n    '<input type=\"text\" class=\"ded-amount\" inputmode=\"numeric\" placeholder=\"مبلغ\" value=\"' + amt + '\" oninput=\"formatNumberInput(this); updateDeductionSummary();\">' +\r\n    '<button type=\"button\" class=\"ded-remove\" title=\"حذف\" onclick=\"this.parentElement.remove(); updateDeductionSummary();\">✕<\/button>';\r\n  row.querySelector('.ded-title').addEventListener('input', updateDeductionSummary);\r\n  wrap.appendChild(row);\r\n  updateDeductionSummary();\r\n}\r\nfunction collectDeductions() {\r\n  const rows = Array.prototype.slice.call(document.querySelectorAll('#deductionRows .deduction-row'));\r\n  return rows.map(function(row) {\r\n    const title = row.querySelector('.ded-title').value.trim();\r\n    const amount = parseInt(String(row.querySelector('.ded-amount').value).replace(/[^\\d]/g, ''), 10) || 0;\r\n    return { title: title || 'کسورات', amount: amount };\r\n  }).filter(function(d) { return d.amount > 0; });\r\n}\r\nfunction updateDeductionSummary() {\r\n  const el = document.getElementById('deductionSummary');\r\n  if (!el) return;\r\n  const sum = collectDeductions().reduce(function(s, d) { return s + d.amount; }, 0);\r\n  const principalEl = document.getElementById('principal');\r\n  const P = parseFloat(String(principalEl ? principalEl.value : '').replace(/,/g, '')) || 0;\r\n  const net = Math.max(P - sum, 0);\r\n  el.innerHTML = '<span>مجموع کسورات: <b>' + fmt(sum) + '<\/b> تومان<\/span>' +\r\n    '<span>خالص دریافتی: <b class=\"net\">' + fmt(net) + '<\/b> تومان<\/span>';\r\n  updateLoanPreview();\r\n}\r\nfunction fillDeductionRows(list) {\r\n  const wrap = document.getElementById('deductionRows');\r\n  if (!wrap) return;\r\n  wrap.innerHTML = '';\r\n  const rows = Array.isArray(list) && list.length ? list : [{ title: '', amount: 0 }];\r\n  rows.forEach(function(d) { addDeductionRow(d.title, d.amount); });\r\n  updateDeductionSummary();\r\n}\r\n\r\nconst LOAN_PRESETS = {\r\n  home:     { label: 'وام مسکن', amount: 800000000, count: 120, rate: 18 },\r\n  car:      { label: 'وام خودرو', amount: 300000000, count: 60, rate: 23 },\r\n  marriage: { label: 'وام ازدواج', amount: 200000000, count: 120, rate: 4 },\r\n  staff:    { label: 'وام کارمندی', amount: 100000000, count: 36, rate: 12 },\r\n  qarz:     { label: 'وام قرض‌الحسنه', amount: 50000000, count: 24, rate: 4 },\r\n  biz:      { label: 'وام سرمایه در گردش', amount: 200000000, count: 24, rate: 18 }\r\n};\r\n\r\nfunction setActivePreset(key) {\r\n  document.querySelectorAll('#loanPresetChips .form-chip').forEach(function(chip) {\r\n    chip.classList.toggle('active', chip.dataset.preset === key);\r\n  });\r\n}\r\nfunction applyLoanPreset(key) {\r\n  const preset = LOAN_PRESETS[key];\r\n  if (!preset) return;\r\n  document.getElementById('loanName').value = preset.label;\r\n  document.getElementById('principal').value = preset.amount.toLocaleString('en-US');\r\n  document.getElementById('count').value = preset.count;\r\n  document.getElementById('rate').value = preset.rate;\r\n  setActivePreset(key);\r\n  updateDeductionSummary();\r\n  updateLoanPreview();\r\n}\r\nfunction setLoanAmount(amount) {\r\n  document.getElementById('principal').value = Number(amount).toLocaleString('en-US');\r\n  setActivePreset(null);\r\n  updateDeductionSummary();\r\n  updateLoanPreview();\r\n}\r\nfunction setLoanCount(count) {\r\n  document.getElementById('count').value = count;\r\n  setActivePreset(null);\r\n  updateLoanPreview();\r\n}\r\nfunction setLoanRate(rate) {\r\n  document.getElementById('rate').value = rate;\r\n  setActivePreset(null);\r\n  updateLoanPreview();\r\n}\r\n\r\nfunction fillLoanDateSelects(jy, jm, jd) {\r\n  const yearSel = document.getElementById('startY');\r\n  const monSel = document.getElementById('startM');\r\n  if (!yearSel || !monSel) return;\r\n  const from = Math.min(1390, jy - 2);\r\n  const to = Math.max(1420, jy + 2);\r\n  let years = '';\r\n  for (let y = from; y <= to; y++) {\r\n    years += '<option value=\"' + y + '\">' + toPersianDigits(y) + '<\/option>';\r\n  }\r\n  yearSel.innerHTML = years;\r\n  monSel.innerHTML = jMonths.map(function(m, i) {\r\n    return '<option value=\"' + (i + 1) + '\">' + m + '<\/option>';\r\n  }).join('');\r\n  yearSel.value = String(jy);\r\n  monSel.value = String(jm);\r\n  syncLoanDayOptions(jd);\r\n}\r\nfunction syncLoanDayOptions(preferredDay) {\r\n  const daySel = document.getElementById('startD');\r\n  if (!daySel) return;\r\n  const y = parseInt(document.getElementById('startY').value, 10) || 1405;\r\n  const m = parseInt(document.getElementById('startM').value, 10) || 1;\r\n  const cur = parseInt(preferredDay, 10) || parseInt(daySel.value, 10) || 1;\r\n  const max = jalaliMonthDays(y, m);\r\n  let days = '';\r\n  for (let d = 1; d <= max; d++) {\r\n    days += '<option value=\"' + d + '\">' + toPersianDigits(d) + '<\/option>';\r\n  }\r\n  daySel.innerHTML = days;\r\n  daySel.value = String(Math.min(cur, max));\r\n}\r\n\r\nfunction readStartIndex() {\r\n  const raw = String(document.getElementById('startIndex').value || '').trim();\r\n  if (!raw) return 1;\r\n  return parseInt(raw, 10);\r\n}\r\n\r\nfunction updateLoanPreview() {\r\n  const el = document.getElementById('loanPreview');\r\n  if (!el) return;\r\n  const P = parseInt(String(document.getElementById('principal').value).replace(/[^\\d]/g, ''), 10) || 0;\r\n  const N = parseInt(document.getElementById('count').value, 10) || 0;\r\n  const startIndex = readStartIndex();\r\n  const rate = parseFloat(String(document.getElementById('rate').value).replace(/[^\\d.]/g, ''));\r\n  const dedTotal = collectDeductions().reduce(function(s, d) { return s + d.amount; }, 0);\r\n\r\n  const validStart = startIndex >= 1 && (!N || startIndex <= N);\r\n  const dateLabel = document.getElementById('startDateLabel');\r\n  const dateHint = document.getElementById('startDateHint');\r\n  if (dateLabel && dateHint) {\r\n    if (startIndex > 1) {\r\n      dateLabel.textContent = 'تاریخ قسط شماره ' + toPersianDigits(startIndex) + ' (شمسی)';\r\n      dateHint.textContent = 'اقساط ۱ تا ' + toPersianDigits(startIndex - 1) +\r\n        ' خودکار پرداخت‌شده ثبت می‌شوند؛ سررسید قسط ' + toPersianDigits(startIndex) + ' همان تاریخ انتخاب‌شده است.';\r\n    } else {\r\n      dateLabel.textContent = 'تاریخ اولین قسط (شمسی)';\r\n      dateHint.textContent = 'اقساط بعدی هر ماه یک عدد جلو می‌روند؛ مثلاً از ۱۴ آبان به ۱۴ آذر.';\r\n    }\r\n  }\r\n  const startHint = document.getElementById('startIndexHint');\r\n  if (startHint) {\r\n    if (!validStart) {\r\n      startHint.textContent = '⚠️ شماره قسط باید بین ۱ و ' + toPersianDigits(N || 1) + ' باشد.';\r\n      startHint.style.color = 'var(--danger)';\r\n    } else {\r\n      startHint.textContent = 'اگر وام را از وسط شروع می‌کنید، شماره قسط جاری را وارد کنید؛ تعداد کل اقساط را کامل بنویسید تا اقساط قبلی خودکار «پرداخت‌شده» ثبت شوند.';\r\n      startHint.style.color = '';\r\n    }\r\n  }\r\n\r\n  if (!P || P <= 0 || !N || N <= 0 || isNaN(rate)) {\r\n    el.innerHTML = '<div class=\"loan-preview-empty\">💡 مبلغ وام، تعداد اقساط و نرخ سود را وارد کنید تا قسط ماهانه، مجموع سود و خالص دریافتی همین‌جا محاسبه شود.<\/div>';\r\n    return;\r\n  }\r\n  if (N > 360 || rate < 0 || rate > 100) {\r\n    el.innerHTML = '<div class=\"loan-preview-empty\">⚠️ تعداد اقساط باید بین ۱ تا ۳۶۰ ماه و نرخ سود بین ۰ تا ۱۰۰٪ باشد.<\/div>';\r\n    return;\r\n  }\r\n  if (!validStart) {\r\n    el.innerHTML = '<div class=\"loan-preview-empty\">⚠️ شماره قسط شروع باید بین ۱ و ' + toPersianDigits(N) + ' باشد.<\/div>';\r\n    return;\r\n  }\r\n\r\n  const i = rate / 100 / 12;\r\n  const inst = i === 0 ? P / N : P * (i * Math.pow(1 + i, N)) / (Math.pow(1 + i, N) - 1);\r\n  const instR = Math.round(inst);\r\n  const total = instR * N;\r\n  const interest = Math.max(total - P, 0);\r\n  const net = Math.max(P - dedTotal, 0);\r\n  const interestPct = P > 0 ? Math.round(interest / P * 100) : 0;\r\n\r\n  el.innerHTML =\r\n    '<div class=\"lp-head\"><b>🧮 پیش‌نمایش محاسبه<\/b><span>' +\r\n      toPersianDigits(N) + ' قسط • نرخ ' + toPersianDigits(rate) + '٪ سالیانه' +\r\n      (startIndex > 1 ? ' • از قسط ' + toPersianDigits(startIndex) : '') + '<\/span><\/div>' +\r\n    '<div class=\"lp-grid\">' +\r\n      '<div class=\"lp-item main\"><div class=\"lbl\">قسط ماهانه<\/div><div class=\"val\">' + fmt(instR) + '<\/div><\/div>' +\r\n      '<div class=\"lp-item\"><div class=\"lbl\">مجموع سود<\/div><div class=\"val\">' + fmt(interest) + '<\/div><\/div>' +\r\n      '<div class=\"lp-item\"><div class=\"lbl\">مجموع بازپرداخت<\/div><div class=\"val\">' + fmt(total) + '<\/div><\/div>' +\r\n      '<div class=\"lp-item\"><div class=\"lbl\">خالص دریافتی<\/div><div class=\"val net\">' + fmt(net) + '<\/div><\/div>' +\r\n    '<\/div>' +\r\n    '<div class=\"lp-note\">سود حدوداً ' + toPersianDigits(interestPct) + '٪ مبلغ وام است' +\r\n      (dedTotal > P ? ' • ⚠️ مجموع کسورات از مبلغ وام بیشتر است' : '') +\r\n      (startIndex > 1 ? ' • ' + toPersianDigits(startIndex - 1) + ' قسط اول خودکار پرداخت‌شده ثبت می‌شود' : '') +\r\n      ' • مبلغ قسط آخر ممکن است چند تومان تفاوت داشته باشد.<\/div>';\r\n}\r\n\r\nfunction addSuggestedDeduction(title) {\r\n  const wrap = document.getElementById('deductionRows');\r\n  if (!wrap) return;\r\n  let row = null;\r\n  Array.prototype.slice.call(wrap.querySelectorAll('.deduction-row')).some(function(r) {\r\n    const t = r.querySelector('.ded-title').value.trim();\r\n    const a = r.querySelector('.ded-amount').value.replace(/[^\\d]/g, '');\r\n    if (!t && !a) { row = r; return true; }\r\n    return false;\r\n  });\r\n  if (!row) {\r\n    addDeductionRow(title, 0);\r\n    row = wrap.lastElementChild;\r\n  } else {\r\n    row.querySelector('.ded-title').value = title;\r\n  }\r\n  row.querySelector('.ded-amount').focus();\r\n}\r\n\r\nfunction openNewLoanForm() {\r\n  editingLoanId = null;\r\n  const today = todayJalali();\r\n  document.getElementById('formTitle').textContent = 'وام جدید';\r\n  document.getElementById('formSub').textContent = 'نوع وام را انتخاب کنید یا مبلغ و شرایط را خودتان وارد کنید؛ قسط و سود خودکار محاسبه می‌شود.';\r\n  document.getElementById('loanName').value = '';\r\n  document.getElementById('principal').value = '50,000,000';\r\n  document.getElementById('count').value = 24;\r\n  document.getElementById('startIndex').value = 1;\r\n  document.getElementById('rate').value = 18;\r\n  fillLoanDateSelects(today.jy, today.jm, today.jd);\r\n  fillDeductionRows([]);\r\n  setActivePreset(null);\r\n  document.getElementById('saveBtn').textContent = '💾 ذخیره وام';\r\n  document.getElementById('formCard').classList.remove('hidden');\r\n  document.getElementById('loanFab').classList.add('hidden');\r\n  updateLoanPreview();\r\n  document.getElementById('loanName').focus();\r\n  document.getElementById('formCard').scrollIntoView({ behavior: 'smooth' });\r\n}\r\n\r\nfunction openEditForm(loan) {\r\n  editingLoanId = loan.id;\r\n  document.getElementById('formTitle').textContent = 'ویرایش وام';\r\n  document.getElementById('formSub').textContent = 'شرایط وام را تغییر دهید؛ اقساط پرداخت‌شده حفظ می‌شوند.';\r\n  document.getElementById('loanName').value = loan.name || '';\r\n  document.getElementById('principal').value = loan.P.toLocaleString('en-US');\r\n  document.getElementById('count').value = loan.N;\r\n  document.getElementById('startIndex').value = loan.startIndex || 1;\r\n  document.getElementById('rate').value = loan.annualRate;\r\n  fillLoanDateSelects(loan.sy, loan.sm, loan.sd);\r\n  fillDeductionRows(loanDeductions(loan));\r\n  setActivePreset(null);\r\n  document.getElementById('saveBtn').textContent = '💾 به‌روزرسانی';\r\n  document.getElementById('formCard').classList.remove('hidden');\r\n  document.getElementById('loanFab').classList.add('hidden');\r\n  updateLoanPreview();\r\n  document.getElementById('formCard').scrollIntoView({ behavior: 'smooth' });\r\n}\r\n\r\nfunction editActiveLoan() {\r\n  const loan = getActiveLoan();\r\n  if (loan) openEditForm(loan);\r\n}\r\n\r\nfunction closeForm() {\r\n  document.getElementById('formCard').classList.add('hidden');\r\n  const fab = document.getElementById('loanFab');\r\n  if (fab && currentView === 'loans') fab.classList.remove('hidden');\r\n  editingLoanId = null;\r\n}\r\n\r\nfunction saveLoan() {\r\n
