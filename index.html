ction jalCal(jy) {\n  const bl = J_BREAKS.length, gy = jy + 621;\n  let leapJ = -14, jp = J_BREAKS[0], jm, jump = 0, n;\n  for (let i = 1; i < bl; i++) {\n    jm = J_BREAKS[i]; jump = jm - jp;\n    if (jy < jm) break;\n    leapJ += jDiv(jump, 33) * 8 + jDiv(jMod(jump, 33), 4);\n    jp = jm;\n  }\n  n = jy - jp;\n  leapJ += jDiv(n, 33) * 8 + jDiv(jMod(n, 33) + 3, 4);\n  if (jMod(jump, 33) === 4 && jump - n === 4) leapJ++;\n  const leapG = jDiv(gy, 4) - jDiv((jDiv(gy, 100) + 1) * 3, 4) - 150;\n  const march = 20 + leapJ - leapG;\n  if (jump - n < 6) n = n - jump + jDiv(jump + 4, 33) * 33;\n  let leap = jMod(jMod(n + 1, 33) - 1, 4);\n  if (leap === -1) leap = 4;\n  return { leap, gy, march };\n}\nfunction g2d(gy, gm, gd) {\n  let d = jDiv((gy + jDiv(gm - 8, 6) + 100100) * 1461, 4) + jDiv(153 * jMod(gm + 9, 12) + 2, 5) + gd - 34840408;\n  d = d - jDiv(jDiv(gy + 100100 + jDiv(gm - 8, 6), 100) * 3, 4) + 752;\n  return d;\n}\nfunction d2g(jdn) {\n  let j = 4 * jdn + 139361631;\n  j = j + jDiv(jDiv(4 * jdn + 183187720, 146097) * 3, 4) * 4 - 3908;\n  const i = jDiv(jMod(j, 1461), 4) * 5 + 308;\n  const gd = jDiv(jMod(i, 153), 5) + 1;\n  const gm = jMod(jDiv(i, 153), 12) + 1;\n  const gy = jDiv(j, 1461) - 100100 + jDiv(8 - gm, 6);\n  return { gy, gm, gd };\n}\nfunction j2d(jy, jm, jd) {\n  const r = jalCal(jy);\n  return g2d(r.gy, 3, r.march) + (jm - 1) * 31 - jDiv(jm, 7) * (jm - 7) + jd - 1;\n}\nfunction d2j(jdn) {\n  const gy = d2g(jdn).gy;\n  let jy = gy - 621;\n  const r = jalCal(jy);\n  const jdn1f = j2d(jy, 1, 1);\n  let k = jdn - jdn1f, jm, jd;\n  if (k >= 0) {\n    if (k <= 185) { jm = 1 + jDiv(k, 31); jd = jMod(k, 31) + 1; return { jy, jm, jd }; }\n    k -= 186;\n  } else {\n    jy -= 1; k += 179;\n    if (r.leap === 1) k += 1;\n  }\n  jm = 7 + jDiv(k, 30); jd = jMod(k, 30) + 1;\n  return { jy, jm, jd };\n}\nfunction jMonthLen(jy, jm) { if (jm <= 6) return 31; if (jm <= 11) return 30; return jalCal(jy).leap === 0 ? 30 : 29; }\nfunction jToKey(jy, jm, jd) { const g = d2g(j2d(jy, jm, jd)); return `${g.gy}-${pad2(g.gm)}-${pad2(g.gd)}`; }\nfunction keyToJ(key) { const m = /^(\\d{4})-(\\d{2})-(\\d{2})/.exec(key || ''); return m ? d2j(g2d(+m[1], +m[2], +m[3])) : null; }\nfunction todayJ() { const d = new Date(); return d2j(g2d(d.getFullYear(), d.getMonth() + 1, d.getDate())); }\nconst jDateText = j => `${faN(j.jd)} ${J_MONTH_NAMES[j.jm - 1]} ${faN(j.jy)}`;\n\nfunction getShortDayName(d) {\n  const map = { 0: 'ی', 1: 'د', 2: 'س', 3: 'چ', 4: 'پ', 5: 'ج', 6: 'ش' };\n  return map[d.getDay()];\n}\nfunction getFullPersianDate(ts) {\n  return new Date(ts).toLocaleDateString('fa-IR', { year: 'numeric', month: 'long', day: 'numeric' });\n}\nfunction getPersianYearOnly(ts) {\n  return new Date(ts).toLocaleDateString('fa-IR', { year: 'numeric' });\n}\nfunction getPersianDayNum(ts) {\n  return new Date(ts).toLocaleDateString('fa-IR', { day: 'numeric' });\n}\nfunction getTime(ts) {\n  return new Date(ts).toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });\n}\nfunction getWeekStart(date) {\n  const d = new Date(date);\n  const day = d.getDay();\n  const diff = (day === 6) ? 0 : (day + 1);\n  d.setDate(d.getDate() - diff);\n  d.setHours(0, 0, 0, 0);\n  return d;\n}\nfunction getWeekDays(startDate) {\n  const days = [];\n  for (let i = 0; i < 7; i++) {\n    const d = new Date(startDate);\n    d.setDate(d.getDate() + i);\n    days.push(d);\n  }\n  return days;\n}\nfunction formatTimeHM(h, m) {\n  return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;\n}\nfunction timeToMinutes(h, m) { return h * 60 + m; }\nfunction addDaysToKey(key, days) {\n  const d = keyToDate(key);\n  d.setDate(d.getDate() + days);\n  return dateKey(d);\n}\n\n// ==================== ذخیره/بازیابی ====================\nconst STORAGE_DB_NAME = 'journal-app-storage';\nconst STORAGE_DB_VERSION = 1;\nconst STORAGE_STORE_NAME = 'keyValue';\nconst storageCache = new Map();\nlet storageDatabase = null;\n\nfunction readLegacyStorageValue(key) {\n  try { return localStorage.getItem(key); }\n  catch (error) { return null; }\n}\nfunction readDatabaseValue(database, key) {\n  return new Promise((resolve, reject) => {\n    const request = database.transaction(STORAGE_STORE_NAME, 'readonly').objectStore(STORAGE_STORE_NAME).get(key);\n    request.onsuccess = () => resolve(request.result ? request.result.value : undefined);\n    request.onerror = () => reject(request.error);\n  });\n}\nfunction writeDatabaseValue(database, key, value) {\n  return new Promise((resolve, reject) => {\n    const transaction = database.transaction(STORAGE_STORE_NAME, 'readwrite');\n    transaction.objectStore(STORAGE_STORE_NAME).put({ key, value });\n    transaction.oncomplete = resolve;\n    transaction.onerror = () => reject(transaction.error);\n    transaction.onabort = () => reject(transaction.error || new Error('IndexedDB transaction aborted'));\n  });\n}\nfunction openStorageDatabase() {\n  if (!('indexedDB' in window)) return Promise.resolve(null);\n  return new Promise(resolve => {\n    const request = indexedDB.open(STORAGE_DB_NAME, STORAGE_DB_VERSION);\n    request.onupgradeneeded = () => {\n      const database = request.result;\n      if (!database.objectStoreNames.contains(STORAGE_STORE_NAME)) database.createObjectStore(STORAGE_STORE_NAME, { keyPath: 'key' });\n    };\n    request.onsuccess = () => {\n      request.result.onversionchange = () => request.result.close();\n      resolve(request.result);\n    };\n    request.onerror = () => {\n      console.warn('IndexedDB در دسترس نیست؛ ذخیره‌سازی محلی استفاده می‌شود.', request.error);\n      resolve(null);\n    };\n  });\n}\nasync function initializeAppStorage() {\n  storageDatabase = await openStorageDatabase();\n  for (const key of STORAGE_KEYS) {\n    let value;\n    if (storageDatabase) {\n      try { value = await readDatabaseValue(storageDatabase, key); }\n      catch (error) { console.warn('خواندن از IndexedDB ناموفق بود.', error); }\n    }\n    if (value === undefined || value === null) {\n      value = readLegacyStorageValue(key);\n      if (value !== null && storageDatabase) {\n        try {\n          await writeDatabaseValue(storageDatabase, key, value);\n          try { localStorage.removeItem(key); } catch (error) {}\n        }\n        catch (error) { console.warn('مهاجرت داده به IndexedDB ناموفق بود.', error); }\n      }\n    }\n    if (value !== undefined && value !== null) storageCache.set(key, value);\n  }\n}\nfunction appStorageGetItem(key) {\n  if (storageCache.has(key)) return storageCache.get(key);\n  return storageDatabase ? null : readLegacyStorageValue(key);\n}\nfunction appStorageSetItem(key, value) {\n  const stringValue = String(value);\n  storageCache.set(key, stringValue);\n  if (storageDatabase) {\n    writeDatabaseValue(storageDatabase, key, stringValue).catch(error => {\n      console.error('ذخیره در IndexedDB ناموفق بود.', error);\n      try { localStorage.setItem(key, stringValue); } catch (fallbackError) {}\n    });\n    return;\n  }\n  try { localStorage.setItem(key, stringValue); }\n  catch (error) { console.error('ذخیره‌سازی محلی در دسترس نیست.', error); }\n}\n\nfunction isStoredRecord(value) {\n  return value !== null && typeof value === 'object' && !Array.isArray(value);\n}\nfunction readStoredValue(key, fallback, isValid) {\n  try {\n    const raw = appStorageGetItem(key);\n    if (raw === null) return fallback;\n    const value = JSON.parse(raw);\n    return isValid(value) ? value : fallback;\n  } catch (error) {\n    return fallback;\n  }\n}\nfunction loadData() {\n  entries = readStoredValue(STORAGE_KEY, [], Array.isArray);\n  workdayData = readStoredValue(WORKDAY_KEY, {}, isStoredRecord);\n  taskHistory = readStoredValue(TASK_HISTORY_KEY, [], Array.isArray);\n  jobs = readStoredValue(JOBS_KEY, [], Array.isArray);\n  shiftsData = readStoredValue(SHIFTS_KEY, {}, isStoredRecord);\n  timelineData = readStoredValue(TIMELINE_KEY, {}, isStoredRecord);\n  miscTasksData = readStoredValue(MISC_KEY, {}, isStoredRecord);\n  const savedLists = readStoredValue(LISTS_KEY, {}, isStoredRecord);\n  listsData = { book: [], movie: [], travel: [], skill: [], ...savedLists };\n  const savedShopping = readStoredValue(SHOPPING_KEY, {}, isStoredRecord);\n  shoppingData = { items: [], history: [], routines: [], ...savedShopping };\n  if (!Array.isArray(shoppingData.items)) shoppingData.items = [];\n  if (!Array.isArray(shoppingData.history)) shoppingData.history = [];\n  if (!Array.isArray(shoppingData.routines)) shoppingData.routines = [];\n  const savedAlarms = readStoredValue(ALARMS_KEY, {}, isStoredRecord);\n  alarmsData = {\n    morning: { ...ALARM_DEFAULTS.morning, ...(isStoredRecord(savedAlarms.morning) ? savedAlarms.morning : {}) },\n    midday: { ...ALARM_DEFAULTS.midday, ...(isStoredRecord(savedAlarms.midday) ? savedAlarms.midday : {}) },\n    night: { ...ALARM_DEFAULTS.night, ...(isStoredRecord(savedAlarms.night) ? savedAlarms.night : {}) },\n    log: isStoredRecord(savedAlarms.log) ? savedAlarms.log : {}\n  };\n  const savedSms = readStoredValue(SMS_KEY, {}, isStoredRecord);\n  smsData = { items: [], lastNumber: '', ...savedSms };\n  if (!Array.isArray(smsData.items)) smsData.items = [];\n  smsData.items = smsData.items.filter(item => item && typeof item === 'object' && item.number && item.time);\n  const savedUi = readStoredValue(UI_STATE_KEY, {}, isStoredRecord);\n  uiState = { shiftCollapsed: true, workCollapsed: true, notesCollapsed: true, habitCollapsed: true, timelineCollapsed: true, followupCollapsed: false, trackerCollapsed: false, ...savedUi };\n  ['shiftCollapsed', 'workCollapsed', 'notesCollapsed', 'habitCollapsed', 'timelineCollapsed'].forEach(key => { uiState[key] = true; });\n  if (isStoredRecord(savedUi.workdayUiState)) workdayUiState = { ...workdayUiState, ...savedUi.workdayUiState };\n  Object.keys(workdayUiState).forEach(key => { workdayUiState[key] = true; });\n  loadTokenData();\n}\nfunction saveEntries() { appStorageSetItem(STORAGE_KEY, JSON.stringify(entries)); }\nfunction saveWorkday() { appStorageSetItem(WORKDAY_KEY, JSON.stringify(workdayData)); }\nfunction saveHistory() { appStorageSetItem(TASK_HISTORY_KEY, JSON.stringify(taskHistory)); }\nfunction saveJobs() { appStorageSetItem(JOBS_KEY, JSON.stringify(jobs)); }\nfunction saveShifts() { appStorageSetItem(SHIFTS_KEY, JSON.stringify(shiftsData)); }\nfunction saveTimeline() { appStorageSetItem(TIMELINE_KEY, JSON.stringify(timelineData)); }\nfunction saveMiscTasks() { appStorageSetItem(MISC_KEY, JSON.stringify(miscTasksData)); }\nfunction saveLists() { appStorageSetItem(LISTS_KEY, JSON.stringify(listsData)); }\nfunction saveShopping() { appStorageSetItem(SHOPPING_KEY, JSON.stringify(shoppingData)); }\nfunction saveSms() { appStorageSetItem(SMS_KEY, JSON.stringify(smsData)); }\nfunction saveAlarms() {\n  const cutoff = addDaysToKey(todayKey(), -7);\n  Object.keys(alarmsData.log || {}).forEach(day => { if (day < cutoff) delete alarmsData.log[day]; });\n  appStorageSetItem(ALARMS_KEY, JSON.stringify(alarmsData));\n}\nfunction saveUiState() { appStorageSetItem(UI_STATE_KEY, JSON.stringify({ ...uiState, workdayUiState })); }\n\nfunction addHistory(type, task, fromDate = null, toDate = null, reason = '') {\n  taskHistory.unshift({ id: Date.now() + Math.random(), type, task, from: fromDate, to: toDate, reason, at: Date.now() });\n  if (taskHistory.length > 500) taskHistory = taskHistory.slice(0, 500);\n  saveHistory();\n}\nfunction getJobById(id) { return jobs.find(j => j.id === id); }\nfunction getShiftJobIds(date, letter) {\n  const s = shiftsData[date];\n  if (!s) return [];\n  return Array.isArray(s[letter]) ? s[letter] : [];\n}\nfunction getJobShiftRange(job, letter) {\n  if (!job.hours || !job.hours[letter]) return null;\n  const h = job.hours[letter];\n  if (h.startH === undefined || h.endH === undefined) return null;\n  const startMin = timeToMinutes(h.startH, h.startM || 0);\n  const endMin = timeToMinutes(h.endH, h.endM || 0);\n  if (startMin === endMin) return null;\n  if (endMin > startMin) return { start: startMin, end: endMin, overnight: false };\n  return { start: startMin, end: endMin + 24 * 60, overnight: true };\n}\n\n// ==================== تم ====================\nfunction loadTheme() {\n  const theme = appStorageGetItem(THEME_KEY) || 'light';\n  document.documentElement.setAttribute('data-theme', theme);\n  updateThemeUI(theme);\n}\nfunction toggleTheme() {\n  const current = document.documentElement.getAttribute('data-theme');\n  const next = current === 'dark' ? 'light' : 'dark';\n  document.documentElement.setAttribute('data-theme', next);\n  appStorageSetItem(THEME_KEY, next);\n  updateThemeUI(next);\n}\nfunction updateThemeUI(theme) {\n  const txt = theme === 'dark' ? 'روشن' : 'تیره';\n  document.getElementById('themeBtn').textContent = txt;\n  const icon = document.getElementById('settingsThemeIcon');\n  if (icon) icon.textContent = '';\n  document.getElementById('settingsThemeLabel').textContent = theme === 'dark' ? 'حالت روشن' : 'حالت تاریک';\n}\n\n// ==================== نوار هفتگی ====================\nfunction renderWeekStrip() {\n  if (!weekStartDate) weekStartDate = getWeekStart(new Date());\n  const days = getWeekDays(weekStartDate);\n  const container = document.getElementById('weekDays');\n  const today = todayKey();\n  container.innerHTML = days.map(d => {\n    const key = dateKey(d);\n    const isToday = key === today;\n    const isActive = key === selectedDayKey;\n    const shiftLetters = [];\n    ['M', 'A', 'N'].forEach(letter => {\n      const jobIds = getShiftJobIds(key, letter);\n      jobIds.forEach(jobId => {\n        const job = getJobById(jobId);\n        const color = job ? job.color : SHIFT_COLORS_DEFAULT[letter];\n        shiftLetters.push(`<span class=\"shift-letter\" style=\"background: ${color};\">${letter}<\/span>`);\n      });\n    });\n    return `<button class=\"week-day ${isActive ? 'active' : ''} ${isToday ? 'today' : ''}\" data-date=\"${key}\"><span class=\"day-name\">${getShortDayName(d)}<\/span><span class=\"day-num\">${getPersianDayNum(d)}<\/span>${shiftLetters.length ? `<div class=\"day-shifts\">${shiftLetters.join('')}<\/div>` : ''}<\/button>`;\n  }).join('');\n  container.querySelectorAll('.week-day').forEach(btn => btn.addEventListener('click', () => {\n    selectedDayKey = btn.dataset.date;\n    renderWeekStrip(); render();\n  }));\n}\nfunction goToPrevWeek() { weekStartDate.setDate(weekStartDate.getDate() - 7); renderWeekStrip(); }\nfunction goToNextWeek() { weekStartDate.setDate(weekStartDate.getDate() + 7); renderWeekStrip(); }\nfunction setupSwipe() {\n  const main = document.getElementById('mainContent');\n  let touchStartX = 0, touchStartY = 0, touchStartTime = 0;\n  main.addEventListener('touchstart', (e) => {\n    if (!selectedDayKey) return;\n    touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY; touchStartTime = Date.now();\n  }, { passive: true });\n  main.addEventListener('touchend', (e) => {\n    if (!selectedDayKey) return;\n    const touchEndX = e.changedTouches[0].clientX;\n    const touchEndY = e.changedTouches[0].clientY;\n    const diffX = touchEndX - touchStartX;\n    const diffY = touchEndY - touchStartY;\n    const duration = Date.now() - touchStartTime;\n    if (duration > 600 || Math.abs(diffX) < 60 || Math.abs(diffY) > Math.abs(diffX)) return;\n    if (diffX > 0) { selectedDayKey = addDaysToKey(selectedDayKey, -1); main.classList.add('slide-from-left'); }\n    else { selectedDayKey = addDaysToKey(selectedDayKey, 1); main.classList.add('slide-from-right'); }\n    const newDate = keyToDate(selectedDayKey);\n    const currentWeekStart = getWeekStart(weekStartDate);\n    const newWeekStart = getWeekStart(newDate);\n    if (newWeekStart.getTime() !== currentWeekStart.getTime()) weekStartDate = newWeekStart;\n    renderWeekStrip(); render();\n    setTimeout(() => main.classList.remove('slide-from-left', 'slide-from-right'), 350);\n  }, { passive: true });\n}\n\n// ==================== تایم‌لاین: ادغام ====================\nconst GOAL_TIMELINE_COLOR = '#8b83ff';\nconst FOLLOWUP_TIMELINE_COLOR = '#f2a65a';\nfunction goalTasksForDay(dateKeyValue) {\n  const api = getGoalsApi();\n  if (!api) return [];\n  try {\n    if (typeof api.tasksOn === 'function') return api.tasksOn(dateKeyValue) || [];\n    if (dateKeyValue === todayKey() && typeof api.todayTasks === 'function') return api.todayTasks() || [];\n    return [];\n  } catch (error) { return []; }\n}\nfunction goalFollowupsForDay(dateKeyValue) {\n  const api = getGoalsApi();\n  if (!api) return [];\n  if (dateKeyValue > todayKey()) return [];\n  try {\n    let items = [];\n    if (typeof api.followupsFor === 'function') items = api.followupsFor(dateKeyValue) || [];\n    else if (dateKeyValue === todayKey() && typeof api.overdueTasks === 'function') items = api.overdueTasks() || [];\n    return items.filter(item => !item.isRecurring);\n  } catch (error) { return []; }\n}\nfunction getGoalTimelineData(dateKeyValue) {\n  const timed = [];\n  const allDay = [];\n  goalTasksForDay(dateKeyValue).forEach(item => {\n    if (item.time) {\n      const startMin = timeToMinutes(parseInt(item.time.slice(0, 2), 10) || 0, parseInt(item.time.slice(3, 5), 10) || 0);\n      const duration = Math.max(15, Math.min(Number(item.mins) || 30, 8 * 60));\n      timed.push({\n        startMin,\n        endMin: Math.min(24 * 60, startMin + duration),\n        text: item.title,\n        note: `کار · ${item.sub || ''}`,\n        color: GOAL_TIMELINE_COLOR,\n        isShift: false,\n        isGoalTask: true,\n        taskId: item.path,\n        done: !!item.done,\n        mins: duration\n      });\n    } else if (!item.isRecurring) {\n      allDay.push({ kind: 'task', data: item });\n    }\n  });\n  goalFollowupsForDay(dateKeyValue).forEach(item => {\n    allDay.push({ kind: 'followup', data: item });\n  });\n  return { timed, allDay };\n}\nfunction getMergedTimelineBlocks(dateKeyValue) {\n  const rawItems = [];\n\n  // ۱) شیفت‌های امروز\n  const todayShifts = shiftsData[dateKeyValue] || {};\n  ['M', 'A', 'N'].forEach(letter => {\n    const jobIds = todayShifts[letter] || [];\n    jobIds.forEach(jobId => {\n      const job = getJobById(jobId);\n      if (!job) return;\n      const range = getJobShiftRange(job, letter);\n      if (!range) return;\n      if (!range.overnight) {\n        rawItems.push({ startMin: range.start, endMin: range.end, text: `${SHIFT_NAMES[letter]} — ${job.name}`, note: '', color: job.color || SHIFT_COLORS_DEFAULT[letter], isShift: true, letter, jobName: job.name });\n      } else {\n        rawItems.push({ startMin: range.start, endMin: 24 * 60, text: `${SHIFT_NAMES[letter]} — ${job.name} (ادامه در فردا)`, note: '', color: job.color || SHIFT_COLORS_DEFAULT[letter], isShift: true, letter, jobName: job.name, overnightPart: 1 });\n      }\n    });\n  });\n\n  // ۲) شیفت‌های دیروز که تا امروز ادامه دارن\n  const yesterdayKey = addDaysToKey(dateKeyValue, -1);\n  const yesterdayShifts = shiftsData[yesterdayKey] || {};\n  ['M', 'A', 'N'].forEach(letter => {\n    const jobIds = yesterdayShifts[letter] || [];\n    jobIds.forEach(jobId => {\n      const job = getJobById(jobId);\n      if (!job) return;\n      const range = getJobShiftRange(job, letter);\n      if (!range || !range.overnight) return;\n      const endMin = range.end - 24 * 60;\n      if (endMin > 0) {\n        rawItems.push({ startMin: 0, endMin: endMin, text: `${SHIFT_NAMES[letter]} — ${job.name} (ادامه از دیروز)`, note: '', color: job.color || SHIFT_COLORS_DEFAULT[letter], isShift: true, letter, jobName: job.name, overnightPart: 2 });\n      }\n    });\n  });\n\n  // ۳) فعالیت‌های دستی\n  const manual = timelineData[dateKeyValue] || [];\n  manual.forEach(item => {\n    const startMin = timeToMinutes(item.startH, item.startM || 0);\n    const endMin = timeToMinutes(item.endH, item.endM || 0);\n    if (endMin <= startMin) return;\n    rawItems.push({ startMin, endMin, text: item.text, note: item.note || '', color: item.color || COLOR_PALETTE[0], isShift: false, id: item.id, fromTaskIdx: item.fromTaskIdx });\n  });\n\n  // ۴) کارهای اهداف برای این روز\n  getGoalTimelineData(dateKeyValue).timed.forEach(item => rawItems.push(item));\n\n  // مرتب‌سازی بر اساس زمان شروع\n  rawItems.sort((a, b) => a.startMin - b.startMin);\n\n  // به جای ادغام، همه را برمی‌گردانیم\n  return rawItems;\n}\n// ==================== تایم‌لاین: صفحه ====================\nfunction openTimelinePage(dateKeyValue = null) {\n  timelineDate = dateKeyValue || selectedDayKey || todayKey();\n  renderTimelinePage();\n  document.getElementById('timelinePage').classList.add('open');\n  document.body.style.overflow = 'hidden';\n  requestAnimationFrame(() => {\n    const body = document.querySelector('.timeline-page-body');\n    const grid = document.getElementById('tl24');\n    if (!body || !grid) return;\n    const gridTop = grid.getBoundingClientRect().top - body.getBoundingClientRect().top + body.scrollTop;\n    const now = new Date();\n    const focusMin = timelineDate === todayKey() ? timeToMinutes(now.getHours(), now.getMinutes()) : 8 * 60;\n    body.scrollTop = Math.max(0, gridTop + (focusMin / 1440) * grid.offsetHeight - body.clientHeight / 2);\n  });\n}\nfunction closeTimelinePage() {\n  document.getElementById('timelinePage').classList.remove('open');\n  document.body.style.overflow = '';\n}\nfunction allDayMetaText(item, dayKey) {\n  const d = item.data;\n  if (item.kind === 'followup') {\n    if (d.done) return d.doneText ? `بعداً انجام شد · ${d.doneText}` : 'بعداً انجام شد';\n    if (!d.due) return 'بدون موعد';\n    const dueDay = d.due.slice(0, 10);\n    const lateDays = Math.max(0, Math.round((keyToDate(dayKey) - keyToDate(dueDay)) / 86400000));\n    return `موعد اصلی ${d.dueText || ''}` + (lateDays > 0 ? ` · ${faN(lateDays)} روز گذشته` : '');\n  }\n  if (d.done) return d.doneText ? `انجام شد · ${d.doneText}` : 'انجام شد';\n  return 'بدون ساعت';\n}\nfunction renderAllDayMiniRows(items, dayKey) {\n  if (!items.length) return '';\n  return items.map(item => {\n    const d = item.data;\n    const isFollow = item.kind === 'followup';\n    const color = isFollow ? FOLLOWUP_TIMELINE_COLOR : GOAL_TIMELINE_COLOR;\n    const tag = isFollow ? 'پیگیری' : 'تمام‌روز';\n    const meta = allDayMetaText(item, dayKey);\n    return `<div class=\"workday-mini-row timeline-allday-mini${d.done ? ' done-text' : ''}\"><span class=\"timeline-block-dot\" style=\"background: ${color};\"><\/span><span class=\"allday-mini-tag ${isFollow ? 'followup' : 'task'}\">${tag}<\/span><span class=\"allday-mini-title\">${escapeHtml(d.title)}<\/span>${meta ? `<span class=\"allday-mini-meta\">${escapeHtml(meta)}<\/span>` : ''}<\/div>`;\n  }).join('');\n}\nfunction renderTimelineAllDay(dateKeyValue) {\n  const container = document.getElementById('timelineAllDay');\n  if (!container) return;\n  const items = getGoalTimelineData(dateKeyValue).allDay;\n  if (!items.length) { container.innerHTML = ''; container.classList.remove('show'); return; }\n  container.classList.add('show');\n  container.innerHTML = `<div class=\"timeline-allday-card\">\n    <div class=\"timeline-allday-head\"><span>تمام‌روز · کارها و پیگیری‌ها<\/span><span class=\"timeline-allday-count\">${faN(items.length)} مورد<\/span><\/div>\n    <div class=\"timeline-allday-list\">${items.map(item => {\n      const d = item.data;\n      const isFollow = item.kind === 'followup';\n      const color = isFollow ? FOLLOWUP_TIMELINE_COLOR : GOAL_TIMELINE_COLOR;\n      return `<div class=\"timeline-allday-row${d.done ? ' is-done' : ''}\">\n        <span class=\"allday-bar\" style=\"background: ${color};\"><\/span>\n        <div class=\"allday-main\"><div class=\"allday-title\">${escapeHtml(d.title)}<\/div><div class=\"allday-sub\">${escapeHtml(d.sub || '')}<\/div><\/div>\n        <div class=\"allday-meta\"><span class=\"allday-tag ${isFollow ? 'followup' : 'task'}\" style=\"color: ${color}; border-color: ${color}55;\">${isFollow ? 'پیگیری' : 'کار'}<\/span><span class=\"allday-meta-text\">${escapeHtml(allDayMetaText(item, dateKeyValue))}<\/span><\/div>\n      <\/div>`;\n    }).join('')}<\/div>\n  <\/div>`;\n}\nfunction layoutTimelineLanes(blocks) {\n  const items = blocks.slice().sort((a, b) => a.startMin - b.startMin || b.endMin - a.endMin).map(b => ({ b, lane: 0, lanes: 1 }));\n  let cluster = [];\n  let laneEnds = [];\n  let clusterEnd = -1;\n  const flush = () => {\n    const lanes = Math.max(1, cluster.reduce((max, it) => Math.max(max, it.lane + 1), 0));\n    cluster.forEach(it => { it.lanes = lanes; });\n    cluster = []; laneEnds = []; clusterEnd = -1;\n  };\n  items.forEach(it => {\n    const start = Math.max(0, it.b.startMin);\n    if (cluster.length && start >= clusterEnd) flush();\n    let lane = 0;\n    while (lane < laneEnds.length && laneEnds[lane] > start) lane++;\n    laneEnds[lane] = Math.min(1440, it.b.endMin);\n    it.lane = lane;\n    cluster.push(it);\n    clusterEnd = Math.max(clusterEnd, Math.min(1440, it.b.endMin));\n  });\n  flush();\n  return items;\n}\nfunction formatTimelineDuration(mins) {\n  const h = Math.floor(mins / 60);\n  const m = mins % 60;\n  if (h && m) return `${faN(h)} ساعت و ${faN(m)} دقیقه`;\n  if (h) return `${faN(h)} ساعت`;\n  return `${faN(m)} دقیقه`;\n}\nfunction renderTimelinePage() {\n  const date = keyToDate(timelineDate);\n  document.getElementById('timelineDateLabel').textContent = date.toLocaleDateString('fa-IR', { year: 'numeric', month: 'long', day: 'numeric' });\n  document.getElementById('timelineDayName').textContent = getDayName(date);\n\n  const blocks = getMergedTimelineBlocks(timelineDate);\n  const goalTimeline = getGoalTimelineData(timelineDate);\n  const now = new Date();\n  const nowMinutes = timeToMinutes(now.getHours(), now.getMinutes());\n  const isToday = timelineDate === todayKey();\n\n  const shiftBlocks = blocks.filter(b => b.isShift).length;\n  const goalBlocks = blocks.filter(b => b.isGoalTask).length;\n  const manualBlocks = blocks.length - shiftBlocks - goalBlocks;\n  let totalMinutesBusy = 0;\n  blocks.forEach(b => {\n    const duration = Math.min(b.endMin, 24 * 60) - Math.max(b.startMin, 0);\n    if (duration > 0) totalMinutesBusy += duration;\n  });\n  const hoursBusy = Math.round(totalMinutesBusy / 60 * 10) / 10;\n\n  document.getElementById('timelineStats').innerHTML = `\n    <div class=\"timeline-stat\"><div class=\"timeline-stat-value\">${faN(blocks.length)}<\/div><div class=\"timeline-stat-label\">بازه<\/div><\/div>\n    <div class=\"timeline-stat\"><div class=\"timeline-stat-value\">${faN(hoursBusy)}<\/div><div class=\"timeline-stat-label\">ساعت پر<\/div><\/div>\n    <div class=\"timeline-stat\"><div class=\"timeline-stat-value\">${faN(goalBlocks)}<\/div><div class=\"timeline-stat-label\">کار<\/div><\/div>\n    <div class=\"timeline-stat\"><div class=\"timeline-stat-value\">${faN(goalTimeline.allDay.length)}<\/div><div class=\"timeline-stat-label\">تمام‌روز<\/div><\/div>\n    <div class=\"timeline-stat\"><div class=\"timeline-stat-value\">${faN(shiftBlocks)}<\/div><div class=\"timeline-stat-label\">شیفت<\/div><\/div>\n    <div class=\"timeline-stat\"><div class=\"timeline-stat-value\">${faN(manualBlocks)}<\/div><div class=\"timeline-stat-label\">دستی<\/div><\/div>\n  `;\n\n  renderTimelineAllDay(timelineDate);\n\n  let gridHtml = '';\n  for (let h = 0; h < 24; h++) {\n    gridHtml += `<div class=\"tl24-row\" data-tl-add-hour=\"${h}\" style=\"top: calc(${h} * var(--tl-h)); height: var(--tl-h);\"><span class=\"tl24-hour\">${faN(pad2(h))}:۰۰<\/span><\/div>`;\n  }\n  gridHtml += '<div class=\"tl24-lanes\">';\n  layoutTimelineLanes(blocks).forEach(it => {\n    const b = it.b;\n    const color = b.color || '#6C63FF';\n    const startMin = Math.max(0, Math.min(1440, b.startMin));\n    const endMin = Math.max(startMin, Math.min(1440, b.endMin));\n    const duration = endMin - startMin;\n    if (duration <= 0) return;\n    const top = (startMin / 1440) * 100;\n    const height = (duration / 1440) * 100;\n    const widthPct = 100 / it.lanes;\n    const rightPct = it.lane * widthPct;\n    const sh = Math.floor(startMin / 60); const sm = startMin % 60;\n    const eh = Math.floor(endMin / 60); const em = endMin % 60;\n    const timeText = `${faN(formatTimeHM(sh, sm))} تا ${faN(formatTimeHM(eh === 24 ? 0 : eh, em))}`;\n    const compact = duration < 45;\n    const manual = !b.isShift && !b.isGoalTask;\n    const cls = ['tl24-block'];\n    if (compact) cls.push('compact');\n    if (b.isGoalTask) cls.push('is-goal');\n    if (b.isShift) cls.push('is-shift');\n    const style = `top:${top.toFixed(4)}%;height:${height.toFixed(4)}%;right:calc(${rightPct.toFixed(4)}% + 2px);width:calc(${widthPct.toFixed(4)}% - 4px);background:${color}22;border-right-color:${color};`;\n    const titleAttr = escapeHtml(`${timeText} · ${formatTimelineDuration(duration)} — ${b.text}`).replace(/\"/g, '&quot;');\n    gridHtml += `<div class=\"${cls.join(' ')}\"${manual ? ` data-tl-edit=\"${b.id}\"` : ''} title=\"${escapeHtml(titleAttr)}\" style=\"${style}\">${compact\n      ? `<span class=\"tl24-block-title\">${escapeHtml(b.text)}<\/span>`\n      : `<div class=\"tl24-block-title\">${escapeHtml(b.text)}<\/div><div class=\"tl24-block-meta\"><span class=\"tl24-time\">${timeText}<\/span> · ${formatTimelineDuration(duration)}<\/div>`}<\/div>`;\n  });\n  gridHtml += '<\/div>';\n  if (isToday) {\n    gridHtml += `<div class=\"tl24-now\" style=\"top:${(nowMinutes / 1440 * 100).toFixed(4)}%;\"><span class=\"tl24-now-label\">${faN(formatTimeHM(now.getHours(), now.getMinutes()))}<\/span><span class=\"tl24-now-dot\"><\/span><\/div>`;\n  }\n\n  const container = document.getElementById('timelineHours');\n  container.innerHTML = `<div class=\"tl24-wrap\"><div class=\"tl24\" id=\"tl24\">${gridHtml}<\/div><\/div>`;\n\n  container.querySelectorAll('[data-tl-add-hour]').forEach(row => {\n    row.addEventListener('click', () => {\n      const hour = parseInt(row.dataset.tlAddHour, 10);\n      openTimelineAdd(hour * 60, Math.min(1440, hour * 60 + 60));\n    });\n  });\n  container.querySelectorAll('[data-tl-edit]').forEach(el => {\n    el.addEventListener('click', (event) => {\n      event.stopPropagation();\n      openTimelineEdit(el.dataset.tlEdit);\n    });\n  });\n}\nfunction openTimelineAdd(startMin = null, endMin = null, prefillText = '') {\n  pendingTaskIdx = null;\n  const start = startMin !== null ? startMin : timeToMinutes(9, 0);\n  const end = endMin !== null ? endMin : start + 60;\n  const sh = Math.floor(start / 60); const sm = start % 60;\n  const eh = Math.floor(end / 60); const em = end % 60;\n  document.getElementById('timelineAddTitle').textContent = 'افزودن به تایم‌لاین';\n  document.getElementById('timelineAddSub').textContent = dateKeyToPersian(timelineDate);\n  document.getElementById('timelineActivityAddInput').value = prefillText || '';\n  document.getElementById('timelineStartHour').value = sh;\n  document.getElementById('timelineStartMinute').value = sm;\n  document.getElementById('timelineEndHour').value = eh === 24 ? 23 : eh;\n  document.getElementById('timelineEndMinute').value = eh === 24 ? 59 : em;\n  document.getElementById('timelineNoteInput').value = '';\n  timelineColorPickerValue = COLOR_PALETTE[0];\n  renderTimelineAddColorPicker();\n  document.getElementById('timelineAddOverlay').classList.add('show');\n}\nfunction closeTimelineAdd() {\n  document.getElementById('timelineAddOverlay').classList.remove('show');\n  pendingTaskIdx = null;\n}\nfunction renderTimelineAddColorPicker() {\n  const container = document.getElementById('timelineAddColorPicker');\n  container.innerHTML = COLOR_PALETTE.map(c => `<div class=\"color-swatch ${c === timelineColorPickerValue ? 'selected' : ''}\" style=\"background: ${c};\" data-color=\"${c}\"><\/div>`).join('');\n  container.querySelectorAll('.color-swatch').forEach(el => el.addEventListener('click', () => { timelineColorPickerValue = el.dataset.color; renderTimelineAddColorPicker(); }));\n}\nfunction saveTimelineAdd() {\n  const sh = parseInt(document.getElementById('timelineStartHour').value);\n  const sm = parseInt(document.getElementById('timelineStartMinute').value) || 0;\n  const eh = parseInt(document.getElementById('timelineEndHour').value);\n  const em = parseInt(document.getElementById('timelineEndMinute').value) || 0;\n  const note = document.getElementById('timelineNoteInput').value.trim();\n  const activityText = document.getElementById('timelineActivityAddInput').value.trim();\n  \n  if (isNaN(sh) || isNaN(eh)) { showToast('ساعت‌ها رو پر کن'); return; }\n  if (sh < 0 || sh > 23 || eh < 0 || eh > 23 || sm < 0 || sm > 59 || em < 0 || em > 59) { showToast('مقادیر نامعتبر'); return; }\n  const startMin = timeToMinutes(sh, sm);\n  const endMin = timeToMinutes(eh, em);\n  if (endMin <= startMin) { showToast('ساعت پایان باید بعد از شروع باشه'); return; }\n\n  if (!timelineData[timelineDate]) timelineData[timelineDate] = [];\n  const item = {\n    id: 'tl_' + Date.now(),\n    startH: sh, startM: sm, endH: eh, endM: em,\n    text: activityText || 'فعالیت',\n    note: note,\n    color: timelineColorPickerValue\n  };\n\n  if (pendingTaskIdx !== null && currentWorkdayDate) {\n    const taskText = document.getElementById(`task${pendingTaskIdx + 1}`).value.trim();\n    if (taskText) {\n      item.text = taskText;\n      item.fromTaskIdx = pendingTaskIdx;\n    }\n  }\n\n  timelineData[timelineDate].push(item);\n  saveTimeline(); closeTimelineAdd(); renderTimelinePage();\n  if (currentWorkdayDate) updateTaskTimelineIndicators();\n  render();\n  showToast('ثبت شد');\n}\n\nfunction openTimelineEdit(id) {\n  const list = timelineData[timelineDate] || [];\n  const item = list.find(x => String(x.id) === String(id));\n  if (!item) { showToast('پیدا نشد'); return; }\n  editingTimelineBlockId = id;\n  document.getElementById('timelineActivityInput').value = item.text || '';\n  document.getElementById('timelineNoteEditInput').value = item.note || '';\n  document.getElementById('timelineEditStartHour').value = item.startH;\n  document.getElementById('timelineEditStartMinute').value = item.startM || 0;\n  document.getElementById('timelineEditEndHour').value = item.endH;\n  document.getElementById('timelineEditEndMinute').value = item.endM || 0;\n  timelineColorPickerValue = item.color || COLOR_PALETTE[0];\n  renderTimelineColorPicker();\n  document.getElementById('timelineEditOverlay').classList.add('show');\n}\nfunction closeTimelineEdit() {\n  document.getElementById('timelineEditOverlay').classList.remove('show');\n  editingTimelineBlockId = null;\n}\nfunction renderTimelineColorPicker() {\n  const container = document.getElementById('timelineColorPicker');\n  container.innerHTML = COLOR_PALETTE.map(c => `<div class=\"color-swatch ${c === timelineColorPickerValue ? 'selected' : ''}\" style=\"background: ${c};\" data-color=\"${c}\"><\/div>`).join('');\n  container.querySelectorAll('.color-swatch').forEach(el => el.addEventListener('click', () => { timelineColorPickerValue = el.dataset.color; renderTimelineColorPicker(); }));\n}\nfunction saveTimelineEdit() {\n  if (!editingTimelineBlockId) return;\n  const text = document.getElementById('timelineActivityInput').value.trim();\n  if (!text) { showToast('متن رو بنویس'); return; }\n  const note = document.getElementById('timelineNoteEditInput').value.trim();\n  const sh = parseInt(document.getElementById('timelineEditStartHour').value);\n  const sm = parseInt(document.getElementById('timelineEditStartMinute').value) || 0;\n  const eh = parseInt(document.getElementById('timelineEditEndHour').value);\n  const em = parseInt(document.getElementById('timelineEditEndMinute').value) || 0;\n  if (isNaN(sh) || isNaN(eh)) { showToast('ساعت‌ها رو پر کن'); return; }\n  const startMin = timeToMinutes(sh, sm);\n  const endMin = timeToMinutes(eh, em);\n  if (endMin <= startMin) { showToast('ساعت پایان باید بعد از شروع باشه'); return; }\n  const list = timelineData[timelineDate] || [];\n  const idx = list.findIndex(x => String(x.id) === String(editingTimelineBlockId));\n  if (idx === -1) return;\n  list[idx] = { ...list[idx], text, note, startH: sh, startM: sm, endH: eh, endM: em, color: timelineColorPickerValue };\n  saveTimeline(); closeTimelineEdit(); renderTimelinePage();\n  if (currentWorkdayDate) updateTaskTimelineIndicators();\n  render();\n  showToast('ویرایش شد');\n}\nfunction deleteTimelineBlock() {\n  if (!editingTimelineBlockId) return;\n  showConfirm('این بازه حذف بشه؟', () => {\n    timelineData[timelineDate] = (timelineData[timelineDate] || []).filter(x => String(x.id) !== String(editingTimelineBlockId));\n    if (timelineData[timelineDate].length === 0) delete timelineData[timelineDate];\n    saveTimeline(); closeTimelineEdit(); renderTimelinePage();\n    if (currentWorkdayDate) updateTaskTimelineIndicators();\n    render();\n    showToast('حذف شد');\n  });\n}\n\n// ==================== افزودن تسک به تایم‌لاین ====================\nfunction openTimelineFromTask(taskIdx) {\n  if (!currentWorkdayDate) { showToast('اول روز کاری رو باز کن'); return; }\n  const taskText = document.getElementById(`task${taskIdx + 1}`).value.trim();\n  if (!taskText) { showToast('اول یه کاری بنویس'); return; }\n  const existing = (timelineData[currentWorkdayDate] || []).find(x => x.fromTaskIdx === taskIdx);\n  if (existing) {\n    timelineDate = currentWorkdayDate;\n    openTimelineEdit(existing.id);\n    return;\n  }\n  pendingTaskIdx = taskIdx;\n  const sh = 9 + taskIdx * 2;\n  const start = timeToMinutes(Math.min(sh, 22), 0);\n  const end = start + 60;\n  document.getElementById('timelineAddTitle').textContent = 'افزودن تسک به تایم‌لاین';\n  document.getElementById('timelineAddSub').textContent = taskText;\n  document.getElementById('timelineActivityAddInput').value = taskText;\n  document.getElementById('timelineStartHour').value = Math.floor(start / 60);\n  document.getElementById('timelineStartMinute').value = 0;\n  document.getElementById('timelineEndHour').value = Math.floor(end / 60);\n  document.getElementById('timelineEndMinute').value = 0;\n  document.getElementById('timelineNoteInput').value = '';\n  timelineColorPickerValue = COLOR_PALETTE[taskIdx % COLOR_PALETTE.length];\n  renderTimelineAddColorPicker();\n  document.getElementById('timelineAddOverlay').classList.add('show');\n}\n\n// ==================== بررسی عملکرد ====================\nfunction openReviewPage() {\n  if (!reviewDate) reviewDate = new Date();\n  renderReviewPage();\n  document.getElementById('reviewPage').classList.add('open');\n  document.body.style.overflow = 'hidden';\n}\nfunction closeReviewPage() {\n  document.getElementById('reviewPage').classList.remove('open');\n  document.body.style.overflow = '';\n}\nfunction getReviewRange() {\n  const ref = new Date(reviewDate);\n  if (reviewPeriod === 'week') {\n    const start = getWeekStart(ref);\n    const days = getWeekDays(start);\n    const end = new Date(days[6]); end.setHours(23, 59, 59, 999);\n    return { start, end, days, label: `${start.toLocaleDateString('fa-IR', { month: 'long', day: 'numeric' })} تا ${days[6].toLocaleDateString('fa-IR', { month: 'long', day: 'numeric' })}` };\n  } else {\n    const end = new Date(ref); end.setHours(23, 59, 59, 999);\n    const start = new Date(ref); start.setDate(start.getDate() - 29); start.setHours(0, 0, 0, 0);\n    return { start, end, days: null, label: ref.toLocaleDateString('fa-IR', { year: 'numeric', month: 'long' }) };\n  }\n}\nfunction isInRange(dateKeyValue, start, end) {\n  const d = keyToDate(dateKeyValue);\n  return d >= start && d <= end;\n}\nfunction renderReviewPage() {\n  document.querySelectorAll('.review-tab').forEach(tab => tab.classList.toggle('active', tab.dataset.period === reviewPeriod));\n  const range = getReviewRange();\n  document.getElementById('reviewPeriodLabel').textContent = range.label;\n\n  let totalNotes = 0, totalTasksDone = 0, totalShifts = 0, totalTimelineActivity = 0;\n  const goalsApi = getGoalsApi();\n  const successOn = (key) => {\n    if (!goalsApi || typeof goalsApi.completedOn !== 'function') return 0;\n    try { return (goalsApi.completedOn(key) || []).length; } catch (error) { return 0; }\n  };\n  const notesByDate = new Map();\n  entries.forEach(entry => {\n    const key = dateKey(new Date(entry.createdAt));\n    notesByDate.set(key, (notesByDate.get(key) || 0) + 1);\n  });\n  const dayStats = [];\n  const daysArray = reviewPeriod === 'week' ? range.days : [];\n  if (reviewPeriod === 'month') {\n    for (let i = 0; i < 30; i++) {\n      const d = new Date(range.start);\n      d.setDate(d.getDate() + i);\n      daysArray.push(d);\n    }\n  }\n  daysArray.forEach(d => {\n    const key = dateKey(d);\n    if (!isInRange(key, range.start, range.end)) return;\n    const dayNotes = notesByDate.get(key) || 0;\n    const dayTasksDone = successOn(key);\n    const dayShifts = ['M','A','N'].reduce((sum, l) => sum + (getShiftJobIds(key, l).length), 0);\n    const dayTimeline = (timelineData[key] || []).length;\n    totalNotes += dayNotes;\n    totalTasksDone += dayTasksDone;\n    totalShifts += dayShifts;\n    totalTimelineActivity += dayTimeline;\n    dayStats.push({ key, day: getPersianDayNum(d), shortDay: getShortDayName(d), notes: dayNotes, tasks: dayTasksDone });\n  });\n\n  const cardsHtml = `\n    <div class=\"review-cards\">\n      <div class=\"review-card notes\"><div class=\"rc-value\">${totalNotes}<\/div><div class=\"rc-label\">نوشته<\/div><\/div>\n      <div class=\"review-card tasks\"><div class=\"rc-value\">${totalTasksDone}<\/div><div class=\"rc-label\">کار موفق<\/div><\/div>\n      <div class=\"review-card shifts\"><div class=\"rc-value\">${totalShifts}<\/div><div class=\"rc-label\">شیفت<\/div><\/div>\n      <div class=\"review-card timeline\"><div class=\"rc-value\">${totalTimelineActivity}<\/div><div class=\"rc-label\">بازه تایم‌لاین<\/div><\/div>\n    <\/div>\n  `;\n\n  const maxVal = Math.max(1, ...dayStats.map(s => Math.max(s.notes, s.tasks)));\n  let chartHtml = `<div class=\"review-section\"><div class=\"review-section-title\"><span>روند روزانه<\/span><\/div>`;\n  chartHtml += `<div class=\"review-chart-legend\"><span class=\"review-legend-item\"><span class=\"review-legend-dot\" style=\"background: #1d9bf0;\"><\/span>نوشته<\/span><span class=\"review-legend-item\"><span class=\"review-legend-dot\" style=\"background: #22a06b;\"><\/span>کار موفق<\/span><\/div>`;\n  chartHtml += `<div class=\"review-chart-bars grouped\">`;\n  dayStats.forEach((s, i) => {\n    const showLabel = reviewPeriod === 'week' || i % 3 === 0;\n    const bar = (type, value) => `<span class=\"review-series-bar ${type}\" style=\"height: ${value ? Math.max(4, value / maxVal * 100) : 0}%;\" title=\"${value}\" aria-label=\"${value}\"><\/span>`;\n    chartHtml += `<div class=\"review-day-wrap\" title=\"${s.shortDay}\"><div class=\"review-day-bars\">${bar('notes', s.notes)}${bar('tasks', s.tasks)}<\/div><div class=\"review-day-label\">${showLabel ? s.day : ''}<\/div><\/div>`;\n  });\n  chartHtml += `<\/div><\/div>`;\n\n  let listHtml = `<div class=\"review-section\"><div class=\"review-section-title\"><span>جزئیات<\/span><\/div><div class=\"review-list\">`;\n  listHtml += `<div class=\"review-list-row\"><div class=\"rlr-text\">نوشته‌ها<\/div><div class=\"rlr-value\">${totalNotes}<\/div><\/div>`;\n  listHtml += `<div class=\"review-list-row\"><div class=\"rlr-text\">کارهای موفق<\/div><div class=\"rlr-value\">${totalTasksDone}<\/div><\/div>`;\n  listHtml += `<div class=\"review-list-row\"><div class=\"rlr-text\">شیفت‌ها<\/div><div class=\"rlr-value\">${totalShifts}<\/div><\/div>`;\n  listHtml += `<div class=\"review-list-row\"><div class=\"rlr-text\">بازه‌های تایم‌لاین<\/div><div class=\"rlr-value\">${totalTimelineActivity}<\/div><\/div>`;\n  listHtml += `<\/div><\/div>`;\n\n  document.getElementById('reviewContent').innerHTML = cardsHtml + chartHtml + listHtml;\n}\n\n// ==================== لیست‌ها ====================\nfunction openListsPage() { currentListTab = 'book'; renderListsPage(); document.getElementById('listsPage').classList.add('open'); document.body.style.overflow = 'hidden'; }\nfunction closeListsPage() { document.getElementById('listsPage').classList.remove('open'); document.body.style.overflow = ''; }\nfunction renderListsPage() {\n  document.querySelectorAll('.list-tab').forEach(tab => tab.classList.toggle('active', tab.dataset.tab === currentListTab));\n  const container = document.getElementById('listItemsContainer');\n  const items = listsData[currentListTab] || [];\n  const cat = LIST_CATEGORIES[currentListTab];\n  let html = '';\n  if (items.length === 0) html += `<div class=\"empty-section\">هنوز ${cat.name}ی اضافه نکردی<\/div>`;\n  else html += items.map(item => {\n    const statusInfo = getStatusInfo(item.status);\n    return `<div class=\"list-item item-${currentListTab}\"><div class=\"list-item-content\"><div class=\"list-item-title\">${escapeHtml(item.title)}<\/div>${item.sub ? `<div class=\"list-item-sub\">${escapeHtml(item.sub)}<\/div>` : ''}<\/div><div class=\"list-item-status status-${item.status}\">${statusInfo.label}<\/div><div class=\"list-item-actions\"><button class=\"list-item-btn\" data-edit-item=\"${item.id}\">ویرایش<\/button><button class=\"list-item-btn\" data-delete-item=\"${item.id}\">حذف<\/button><\/div><\/div>`;\n  }).join('');\n  html += `<button class=\"add-list-item-btn\" id=\"addListItemBtn\">افزودن ${cat.name} جدید<\/button>`;\n  container.innerHTML = html;\n  container.querySelectorAll('[data-edit-item]').forEach(btn => btn.addEventListener('click', () => openListItemModal(btn.dataset.editItem)));\n  container.querySelectorAll('[data-delete-item]').forEach(btn => btn.addEventListener('click', () => deleteListItem(btn.dataset.deleteItem)));\n  const addBtn = document.getElementById('addListItemBtn');\n  if (addBtn) addBtn.addEventListener('click', () => openListItemModal(null));\n}\nfunction getStatusInfo(status) {\n  if (status === 'done') return { label: 'انجام شد' };\n  if (status === 'progress') return { label: 'در حال' };\n  return { label: 'می‌خوام' };\n}\nfunction openListItemModal(itemId = null) {\n  editingListItemId = itemId;\n  const cat = LIST_CATEGORIES[currentListTab];\n  const item = itemId ? (listsData[currentListTab] || []).find(i => i.id === itemId) : null;\n  document.getElementById('listItemModalTitle').textContent = item ? `ویرایش ${cat.name}` : `افزودن ${cat.name}`;\n  document.getElementById('listItemTitleInput').placeholder = cat.name;\n  document.getElementById('listItemSubInput').placeholder = cat.subPlaceholder;\n  document.getElementById('listItemTitleInput').value = item ? item.title : '';\n  document.getElementById('listItemSubInput').value = item ? (item.sub || '') : '';\n  listItemStatus = item ? item.status : 'wishlist';\n  renderStatusPicker();\n  document.getElementById('listItemModalOverlay').classList.add('show');\n}\nfunction renderStatusPicker() { document.querySelectorAll('.status-option').forEach(opt => opt.classList.toggle('selected', opt.dataset.status === listItemStatus)); }\nfunction closeListItemModal() { document.getElementById('listItemModalOverlay').classList.remove('show'); editingListItemId = null; }\nfunction saveListItem() {\n  const title = document.getElementById('listItemTitleInput').value.trim();\n  const sub = document.getElementById('listItemSubInput').value.trim();\n  if (!title) { showToast('عنوان رو بنویس'); return; }\n  if (!listsData[currentListTab]) listsData[currentListTab] = [];\n  if (editingListItemId) {\n    const idx = listsData[currentListTab].findIndex(i => i.id === editingListItemId);\n    if (idx !== -1) listsData[currentListTab][idx] = { ...listsData[currentListTab][idx], title, sub, status: listItemStatus };\n  } else {\n    listsData[currentListTab].push({ id: 'item_' + Date.now(), title, sub, status: listItemStatus, createdAt: Date.now() });\n  }\n  saveLists(); closeListItemModal(); renderListsPage();\n  showToast('ذخیره شد');\n}\nfunction deleteListItem(itemId) {\n  const item = (listsData[currentListTab] || []).find(i => i.id === itemId);\n  if (!item) return;\n  showConfirm(`«${item.title}» حذف بشه؟`, () => {\n    listsData[currentListTab] = listsData[currentListTab].filter(i => i.id !== itemId);\n    saveLists(); renderListsPage();\n    showToast('حذف شد');\n  });\n}\n\n// ==================== خرید منزل ====================\nfunction faMoney(value) {\n  const num = Math.max(0, Math.round(Number(value) || 0));\n  return faN(num.toLocaleString('en-US')).replace(/,/g, '٬');\n}\nfunction faMoneyShort(value) {\n  const num = Math.max(0, Math.round(Number(value) || 0));\n  if (num >= 1000000) return `${faN((num / 1000000).toFixed(1).replace('.', '٫'))} میلیون`;\n  if (num >= 1000) return `${faN(Math.round(num / 1000).toLocaleString('en-US')).replace(/,/g, '٬')} هزار`;\n  return faN(num);\n}\nfunction shopItemPrice(item) {\n  const price = Number(item && item.price);\n  return Number.isFinite(price) && price > 0 ? Math.round(price) : 0;\n}\nfunction shopItemQty(item) {\n  const qty = Number(item && item.qty);\n  return Number.isFinite(qty) && qty > 0 ? qty : 1;\n}\nfunction shopItemQtyText(item) {\n  const qty = shopItemQty(item);\n  const qtyText = Number.isInteger(qty) ? faN(qty) : faN(String(qty).replace('.', '٫'));\n  return `${qtyText} ${(item && item.unit) || 'عدد'}`;\n}\nfunction shopUniqueHistory(limit = 10) {\n  const seen = new Set();\n  const result = [];\n  (shoppingData.history || []).forEach(entry => {\n    const key = `${entry.title}|${entry.unit || 'عدد'}`;\n    if (seen.has(key)) return;\n    seen.add(key);\n    result.push(entry);\n  });\n  return result.slice(0, limit);\n}\nfunction getShopStats() {\n  const items = shoppingData.items || [];\n  const done = items.filter(item => item.done).length;\n  const total = items.length;\n  const remaining = total - done;\n  const remainingPrice = items.filter(item => !item.done).reduce((sum, item) => sum + shopItemPrice(item), 0);\n  const percent = total ? Math.round((done / total) * 100) : 0;\n  const priorityLeft = items.filter(item => !item.done && item.priority === 'high').length;\n  return { items, done, total, remaining, remainingPrice, percent, priorityLeft };\n}\nfunction populateShopControls() {\n  const unitSelect = document.getElementById('shopItemUnitSelect');\n  if (unitSelect && !unitSelect.options.length) {\n    unitSelect.innerHTML = SHOP_UNITS.map(unit => `<option value=\"${unit}\">${unit}<\/option>`).join('');\n  }\n}\nfunction shopCatalogItem(catId, index) {\n  const list = SHOP_CATALOG[catId] || [];\n  return list[index] || null;\n}\nfunction shopPendingCatalogMatch(catId, title) {\n  return (shoppingData.items || []).find(item => !item.done && item.category === catId && item.title === title);\n}\nfunction toggleShopCatalogItem(catId, index) {\n  const entry = shopCatalogItem(catId, index);\n  if (!entry) return;\n  const existing = shopPendingCatalogMatch(catId, entry.name);\n  if (existing) {\n    shoppingData.items = shoppingData.items.filter(item => item !== existing);\n    saveShopping();\n    renderShoppingPage();\n    showToast(`«${entry.name}» از لیست حذف شد`);\n    return;\n  }\n  shoppingData.items.push({\n    id: 'sp' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5),\n    title: entry.name, category: catId, qty: 1, unit: entry.unit || 'عدد', price: 0,\n    priority: 'normal', note: '', done: false, createdAt: Date.now(),\n    catalogId: `${catId}:${index}`\n  });\n  saveShopping();\n  renderShoppingPage();\n  showToast(`«${entry.name}» به لیست اضافه شد`);\n}\nfunction renderShopCatalog() {\n  const tabs = document.getElementById('shopCatTabs');\n  const chips = document.getElementById('shopCatalogChips');\n  if (!tabs || !chips) return;\n  tabs.innerHTML = SHOP_CATEGORIES.map(cat => `<button type=\"button\" class=\"shop-cat-tab ${shopCatalogCat === cat.id ? 'active' : ''}\" data-shop-cat-tab=\"${cat.id}\"><span>${cat.icon}<\/span>${cat.short}<\/button>`).join('');\n  const list = SHOP_CATALOG[shopCatalogCat] || [];\n  chips.innerHTML = list.map((entry, idx) => {\n    const active = !!shopPendingCatalogMatch(shopCatalogCat, entry.name);\n    return `<button type=\"button\" class=\"shop-catalog-chip ${active ? 'on' : ''}\" data-shop-catalog=\"${shopCatalogCat}:${idx}\">\n      <span class=\"n\">${escapeHtml(entry.name)}<\/span>\n      <span class=\"u\">${entry.unit || 'عدد'}<\/span>\n      <span class=\"mark\">${active ? '✓' : ''}<\/span>\n    <\/button>`;\n  }).join('');\n  const count = document.getElementById('shopCatalogCount');\n  if (count) count.textContent = faN((shoppingData.items || []).filter(item => !item.done).length);\n  const addBtn = document.getElementById('shopAddToTasksBtn');\n  if (addBtn) addBtn.disabled = !(shoppingData.items || []).some(item => !item.done);\n}\nfunction shopRoutineItems(routine) {\n  return Array.isArray(routine && routine.items) ? routine.items : [];\n}\nfunction shopRoutineNextDue(routine) {\n  const last = Number(routine && routine.lastRun) || 0;\n  const days = Math.max(1, parseInt(routine && routine.intervalDays, 10) || 1);\n  return last ? last + days * 86400000 : Date.now();\n}\nfunction shopRoutineDue(routine) {\n  return Date.now() >= shopRoutineNextDue(routine);\n}\nfunction shopRoutineDateText(ts) {\n  const key = dateKey(new Date(ts));\n  const j = keyToJ(key);\n  return j ? jDateText(j) : shortDate(key);\n}\nfunction getDueShopRoutines() {\n  return (shoppingData.routines || []).filter(routine => routine && routine.enabled !== false && shopRoutineDue(routine));\n}\nfunction addRoutineItemsToShopping(routine) {\n  if (!Array.isArray(shoppingData.items)) shoppingData.items = [];\n  let added = 0;\n  shopRoutineItems(routine).forEach(entry => {\n    const title = String(entry.title || '').trim();\n    if (!title) return;\n    if (shoppingData.items.some(item => !item.done && item.title === title && item.category === entry.category)) return;\n    shoppingData.items.push({\n      id: 'sp' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5),\n      title, category: SHOP_CAT_MAP[entry.category] ? entry.category : 'other',\n      qty: Number(entry.qty) > 0 ? Number(entry.qty) : 1, unit: entry.unit || 'عدد',\n      price: Number(entry.price) > 0 ? Math.round(Number(entry.price)) : 0,\n      note: entry.note || '', priority: entry.priority === 'high' ? 'high' : 'normal',\n      done: false, createdAt: Date.now(), routineId: routine.id\n    });\n    added++;\n  });\n  routine.lastRun = Date.now();\n  return added;\n}\nfunction autoRunDueShopRoutines() {\n  const due = getDueShopRoutines().filter(routine => routine.auto !== false);\n  if (!due.length) return;\n  let added = 0;\n  due.forEach(routine => { added += addRoutineItemsToShopping(routine); });\n  saveShopping();\n  if (added) showToast(`${faN(added)} قلم از خرید ادواری اضافه شد`);\n}\nfunction runShopRoutine(routineId, silent = false) {\n  const routine = (shoppingData.routines || []).find(r => String(r.id) === String(routineId));\n  if (!routine) return 0;\n  const added = addRoutineItemsToShopping(routine);\n  saveShopping();\n  renderShoppingPage();\n  if (!silent) showToast(added ? `${faN(added)} قلم از «${routine.name}» اضافه شد` : 'اقلام این لیست از قبل موجودند');\n  return added;\n}\nfunction renderShopRoutines() {\n  const box = document.getElementById('shopRoutineList');\n  if (!box) return;\n  const routines = shoppingData.routines || [];\n  if (!routines.length) {\n    box.innerHTML = '<div class=\"shop-routine-empty\">لیست ادواری نداری<br><small>مثلاً «خرید هفتگی» با تکرار هر ۷ روز بساز<\/small><\/div>';\n    return;\n  }\n  box.innerHTML = routines.map(routine => {\n    const due = shopRoutineDue(routine) && routine.enabled !== false;\n    const items = shopRoutineItems(routine);\n    const auto = routine.auto !== false;\n    const preview = items.slice(0, 4).map(item => item.title).join('، ') + (items.length > 4 ? ` و ${faN(items.length - 4)} قلم دیگر` : '');\n    return `<div class=\"shop-routine-card ${due ? 'due' : ''}\">\n      <div class=\"shop-routine-top\">\n        <div class=\"shop-routine-main\">\n          <div class=\"shop-routine-name\">${escapeHtml(routine.name || 'لیست ادواری')}<span class=\"shop-routine-badge\">${due ? 'موعد رسیده' : (auto ? 'خودکار' : 'دستی')}<\/span><\/div>\n          <div class=\"shop-routine-meta\">هر ${faN(Math.max(1, parseInt(routine.intervalDays, 10) || 1))} روز · ${faN(items.length)} قلم · ${due ? 'همین حالا' : 'موعد بعدی: ' + shopRoutineDateText(shopRoutineNextDue(routine))}<\/div>\n          <div class=\"shop-routine-preview\">${escapeHtml(preview || 'بدون قلم')}<\/div>\n        <\/div>\n      <\/div>\n      <div class=\"shop-routine-actions\">\n        <button type=\"button\" class=\"run\" data-shop-routine-run=\"${escapeHtml(routine.id)}\">افزودن به لیست<\/button>\n        <button type=\"button\" data-shop-routine-edit=\"${escapeHtml(routine.id)}\">ویرایش<\/button>\n        <button type=\"button\" class=\"del\" data-shop-routine-delete=\"${escapeHtml(routine.id)}\">حذف<\/button>\n      <\/div>\n    <\/div>`;\n  }).join('');\n}\nfunction openShopRoutineModal(routineId = null) {\n  const routine = routineId ? (shoppingData.routines || []).find(r => String(r.id) === String(routineId)) : null;\n  editingShopRoutineId = routine ? routine.id : null;\n  const items = routine ? shopRoutineItems(routine).map(item => ({ ...item })) : [];\n  shopRoutineDraft = {\n    name: routine ? (routine.name || '') : '',\n    intervalDays: routine ? Math.max(1, parseInt(routine.intervalDays, 10) || 7) : 7,\n    auto: routine ? routine.auto !== false : true,\n    items\n  };\n  shopRoutineCat = (items.length && SHOP_CAT_MAP[items[0].category]) ? items[0].category : 'produce';\n  document.getElementById('shopRoutineModalTitle').textContent = routine ? 'ویرایش لیست ادواری' : 'لیست ادواری جدید';\n  document.getElementById('shopRoutineNameInput').value = shopRoutineDraft.name;\n  document.getElementById('shopRoutineIntervalInput').value = shopRoutineDraft.intervalDays;\n  document.getElementById('shopRoutineAutoSwitch').classList.toggle('on', shopRoutineDraft.auto);\n  renderShopRoutinePresets();\n  renderShopRoutineModal();\n  document.getElementById('shopRoutineModalOverlay').classList.add('show');\n  setTimeout(() => document.getElementById('shopRoutineNameInput').focus(), 60);\n}\nfunction closeShopRoutineModal() {\n  document.getElementById('shopRoutineModalOverlay').classList.remove('show');\n  editingShopRoutineId = null;\n}\nfunction renderShopRoutinePresets() {\n  document.querySelectorAll('[data-routine-days]').forEach(btn => {\n    btn.classList.toggle('active', Number(btn.dataset.routineDays) === Number(shopRoutineDraft.intervalDays));\n  });\n}\nfunction renderShopRoutineModal() {\n  const catPicker = document.getElementById('shopRoutineCatPicker');\n  const chips = document.getElementById('shopRoutineChips');\n  const selected = document.getElementById('shopRoutineSelected');\n  if (!catPicker || !chips || !selected) return;\n  catPicker.innerHTML = SHOP_CATEGORIES.map(cat => `<button type=\"button\" class=\"shop-cat-option ${shopRoutineCat === cat.id ? 'selected' : ''}\" data-routine-cat-pick=\"${cat.id}\">${cat.icon} ${cat.name}<\/button>`).join('');\n  const list = SHOP_CATALOG[shopRoutineCat] || [];\n  chips.innerHTML = list.map((entry, idx) => {\n    const active = shopRoutineDraft.items.some(item => item.category === shopRoutineCat && item.title === entry.name);\n    return `<button type=\"button\" class=\"shop-catalog-chip ${active ? 'on' : ''}\" data-routine-catalog=\"${shopRoutineCat}:${idx}\">\n      <span class=\"n\">${escapeHtml(entry.name)}<\/span>\n      <span class=\"u\">${entry.unit || 'عدد'}<\/span>\n      <span class=\"mark\">${active ? '✓' : ''}<\/span>\n    <\/button>`;\n  }).join('');\n  selected.innerHTML = shopRoutineDraft.items.length\n    ? shopRoutineDraft.items.map((entry, idx) => `<button type=\"button\" class=\"shop-routine ;\n  renderShoppingPage();\n  document.getElementById('shoppingPage').classList.add('open');\n  document.body.style.overflow = 'hidden';\n}\nfunction closeShoppingPage() {\n  document.getElementById('shoppingPage').classList.remove('open');\n  document.body.style.overflow = '';\n}\nfunction shopItemMatches(item) {\n  if (shopFilter === 'todo' && item.done) return false;\n  if (shopFilter === 'done' && !item.done) return false;\n  if (shopSearch) {\n    const haystack = `${item.title || ''} ${item.note || ''}`.toLowerCase();\n    if (!haystack.includes(shopSearch)) return false;\n  }\n  return true;\n}\nfunction sortShopItems(a, b) {\n  if (!!a.done !== !!b.done) return a.done ? 1 : -1;\n  const pa = a.priority === 'high' ? 0 : 1;\n  const pb = b.priority === 'high' ? 0 : 1;\n  if (pa !== pb) return pa - pb;\n  return (a.createdAt || 0) - (b.createdAt || 0);\n}\nfunction renderShoppingPage() {\n  renderShopSummary();\n  renderShopRoutines();\n  renderShopCatalog();\n  renderShopGroups();\n  renderShopHistory();\n  document.querySelectorAll('[data-shop-filter]').forEach(chip => chip.classList.toggle('active', chip.dataset.shopFilter === shopFilter));\n  const searchInput = document.getElementById('shopSearchInput');\n  if (searchInput && searchInput.value !== shopSearch) searchInput.value = shopSearch;\n  const toolbar = document.getElementById('shopToolbar');\n  if (toolbar) toolbar.hidden = (shoppingData.items || []).length < 3;\n}\nfunction renderShopSummary() {\n  const box = document.getElementById('shopSummary');\n  if (!box) return;\n  const stats = getShopStats();\n  let title = `${faN(stats.remaining)} قلم مانده`;\n  if (!stats.total) title = 'لیست خریدت خالیه';\n  else if (!stats.remaining) title = 'همه‌چیز خریداری شد';\n  const footParts = [];\n  if (stats.done) footParts.push(`${faN(stats.done)} خریداری‌شده`);\n  if (stats.remainingPrice) footParts.push(`حدود ${faMoneyShort(stats.remainingPrice)} تومان`);\n  const dueRoutines = getDueShopRoutines().filter( ment.getElementById('shopItemUnitSelect').value = item && SHOP_UNITS.includes(item.unit) ? item.unit : 'عدد';\n  renderShopModalCategories();\n  renderShopPriorityPicker();\n  document.getElementById('shopItemModalOverlay').classList.add('show');\n  setTimeout(() => document.getElementById('shopItemNameInput').focus(), 60);\n}\nfunction closeShopItemModal() {\n  document.getElementById('shopItemModalOverlay').classList.remove('show');\n  editingShopItemId = null;\n}\nfunction renderShopModalCategories() {\n  const box = document.getElementById('shopCatPicker');\n  if (!box) return;\n  box.innerHTML = SHOP_CATEGORIES.map(cat => `<button type=\"button\" class=\"shop-cat-option ${shopDraftCategory === cat.id ? 'selected' : ''}\" data-shop-cat-pick=\"${cat.id}\">${cat.icon} ${cat.name}<\/button>`).join('');\n}\nfunction renderShopPriorityPicker() {\n  document.querySelectorAll('[data-shop-priority]').forEach(btn => btn.classList.toggle('selected', btn.dataset.shopPriority === shopDraftPriority));\n}\nfunction saveShopItem() {\n  const nameInput = document.getElementById('shopItemNameInput');\n  const title = (nameInput.value || '').trim();\n  if (!title) { showToast('اسم کالا را بنویس'); nameInput.focus(); return; }\n  const qtyRaw = Number(document.getElementById('shopItemQtyInput').value);\n  const qty = Number.isFinite(qtyRaw) && qtyRaw > 0 ? qtyRaw : 1;\n  const priceRaw = Number(document.getElementById('shopItemPriceInput').value);\n  const price = Number.isFinite(priceRaw) && priceRaw > 0 ? Math.round(priceRaw) : 0;\n  const unit = document.getElementById('shopItemUnitSelect').value || 'عدد';\n  const note = (document.getElementById('shopItemNoteInput').value || '').trim();\n  const wasEditing = !!editingShopItemId;\n  if (wasEditing) {\n    const item = (shoppingData.items || []).find(entry => String(entry.id) === String(editingShopItemId));\n    if (item) Object.assign(item, { title, category: shopDraftCategory, qty, unit, price, note, priority: shopDraftPriority });\n  } else {\n    shoppingData.items.push({\n      id: 'sp' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5),\n      title, category: shopDraftCategory, qty, unit, price, note,\n      priority: shopDraftPriority, done: false, createdAt: Date.now()\n    });\n  }\n  saveShopping();\n  closeShopItemModal();\n  renderShoppingPage();\n  showToast(wasEditing ? 'کالا ویرایش شد' : 'کالا اضافه شد');\n}\nfunction recordShopPurchase(item) {\n  shoppingData.history.unshift({\n    id: 'sh' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5),\n    sourceId: item.id, title: item.title, category: item.category,\n    qty: shopItemQty(item), unit: item.unit || 'عدد', price: shopItemPrice(item),\n    note: item.note || '', at: Date.now()\n  });\n  if (shoppingData.history.length > 200) shoppingData.history = shoppingData.history.slice(0, 200);\n}\nfunction toggleShopItem(itemId) {\n  const item = (shoppingData.items || []).find(entry => String(entry.id) === String(itemId));\n  if (!item) return;\n  item.done = !item.done;\n  if (item.done) {\n    item.doneAt = Date.now();\n    recordShopPurchase(item);\n    showToast(`«${item.title}» خریداری شد`);\n  } else {\n    item.doneAt = null;\n    shoppingData.history = shoppingData.history.filter(entry => entry.sourceId !== item.id);\n    showToast(`«${item.title}» به لیست برگشت`);\n  }\n  saveShopping();\n  renderShoppingPage();\n}\nfunction deleteShopItem(itemId) {\n  const item = (shoppingData.items || []).find(entry => String(entry.id) === String(itemId));\n  if (!item) return;\n  showConfirm(`«${item.title}» از لیست خرید حذف شود؟`, () => {\n    shoppingData.items = shoppingData.items.filter(entry => String(entry.id) !== String(itemId));\n    saveShopping();\n    renderShoppingPage();\n    showToast('حذف شد');\n  });\n}\nfunction clearDoneShopItems() {\n  const doneItems = (shoppingData.items || []).filter(item => item.done);\n  if (!doneItems.length) { showToast('خریداری‌شده‌ای برای پاک کردن نیست');  + 0.4);\n    });\n  } catch (error) {}\n}\nfunction openSmsPage() {\n  renderSmsPage();\n  document.getElementById('smsPage').classList.add('open');\n  document.body.style.overflow = 'hidden';\n}\nfunction closeSmsPage() {\n  document.getElementById('smsPage').classList.remove('open');\n  document.body.style.overflow = '';\n}\nfunction renderSmsPage() {\n  const list = document.getElementById('smsList');\n  if (!list) return;\n  const items = [...smsData.items].sort((a, b) => String(a.dateKey || '').localeCompare(String(b.dateKey || '')) || String(a.time || '').localeCompare(String(b.time || '')));\n  if (!items.length) {\n    list.innerHTML = '<div class=\"sms-empty\">هنوز پیامک زمان‌داری نساخته‌ای<br><small>با دکمه «پیامک جدید» شماره، متن و زمان را انتخاب کن.<\/small><\/div>';\n    return;\n  }\n  list.innerHTML = items.map(item => {\n    const j = keyToJ(item.dateKey);\n    const dateText = j ? jDateText(j) : (item.dateKey || '');\n    const preview = smsItemText(item).replace(/\\s+/g, ' ').trim();\n    const enabled = item.enabled !== false;\n    return `<div class=\"sms-card${enabled ? '' : ' off'}\" data-sms-card=\"${item.id}\">\n      <div class=\"sms-card-head\">\n        <div class=\"sms-avatar\">${item.mode === 'tasks' ? '📋' : '✉️'}<\/div>\n        <div class=\"sms-card-main\">\n          <div class=\"sms-number\">${faN(item.number)}<\/div>\n          <div class=\"sms-card-meta\">${dateText} · ساعت ${faN(item.time)} · ${smsRepeatLabel(item.repeat)}<\/div>\n        <\/div>\n        <span class=\"sms-status${enabled ? '' : ' off'}\">${enabled ? 'فعال' : 'خاموش'}<\/span>\n      <\/div>\n      <div class=\"sms-preview-line\">${escapeHtml(preview.slice(0, 150)) || 'متن خالی'}<\/div>\n      <div class=\"sms-card-actions\">\n        <button type=\"button\" class=\"sms-action primary\" data-sms-send=\"${item.id}\">ارسال حالا<\/button>\n        <button type=\"button\" class=\"sms-action\" data-sms-toggle=\"${item.id}\">${enabled ? 'خاموش' : 'فعال'}<\/button>\n og)) alarmsData.log = {};\n  if (!isStoredRecord(alarmsData.log[day])) alarmsData.log[day] = {};\n  return alarmsData.log[day];\n}\nfunction renderAlarmPage() {\n  const list = document.getElementById('alarmSettingsList');\n  if (!list) return;\n  list.innerHTML = ALARM_SLOT_DEFS.map(slot => {\n    const conf = alarmsData[slot.id] || ALARM_DEFAULTS[slot.id];\n    const enabled = conf.enabled !== false;\n    return `<div class=\"alarm-setting ${enabled ? '' : 'off'}\" data-alarm-setting=\"${slot.id}\">\n      <div class=\"alarm-setting-icon\">${slot.icon}<\/div>\n      <div class=\"alarm-setting-main\">\n        <div class=\"alarm-setting-title\">${slot.title}<\/div>\n        <div class=\"alarm-setting-desc\">${slot.desc}<\/div>\n      <\/div>\n      <div class=\"alarm-setting-trailing\">\n        <input type=\"time\" class=\"alarm-time-input\" data-alarm-time=\"${slot.id}\" value=\"${conf.time}\" step=\"300\" aria-label=\"زمان ${slot.title}\">\n        <div class=\"toggle-switch ${enabled ? 'on' : ''}\" data-alarm-toggle=\"${slot.id}\" role=\"switch\" aria-checked=\"${enabled ? 'true' : 'false'}\" tabindex=\"0\"><\/div>\n      <\/div>\n    <\/div>`;\n  }).join('');\n  updateAlarmNotifyStatus();\n}\nfunction updateAlarmNotifyStatus() {\n  const status = document.getElementById('alarmNotifyStatus');\n  const btn = document.getElementById('alarmNotifyBtn');\n  if (!status || !btn) return;\n  if (!('Notification' in window)) {\n    status.textContent = 'این مرورگر از اعلان سیستمی پشتیبانی نمی‌کند.';\n    btn.disabled = true; btn.textContent = 'ناموجود';\n    return;\n  }\n  if (Notification.permission === 'granted') {\n    status.textContent = 'اعلان سیستمی فعال است؛ یادآورها در پس‌زمینه هم نمایش داده می‌شوند.';\n    btn.disabled = true; btn.textContent = 'فعال';\n    return;\n  }\n  if (Notification.permission === 'denied') {\n    status.textContent = 'اجازه اعلان رد شده؛ از تنظیمات مرورگر فعالش کن.';\n    btn.disabled = false; btn.textContent = 'راهنما';\n    return;\ e || 'لیست ادواری', meta: 'خرید ادواری' }));\n  return { goals, workday, misc, recurring, followups, routines };\n}\nfunction collectFollowupPlan() {\n  const today = todayKey();\n  const plan = collectTodayPlan();\n  const wd = workdayData[today] || {};\n  const workdayFollowups = (wd.followups || [])\n    .filter(text => text && text.trim())\n    .map(text => ({ text: text.trim(), meta: 'پیگیری روز' }));\n  const shopRemaining = (shoppingData.items || []).filter(item => !item.done).length;\n  const shopping = shopRemaining ? [{ text: `${faN(shopRemaining)} قلم در لیست خرید مانده`, meta: 'خرید منزل' }] : [];\n  return { ...plan, workdayFollowups, shopping };\n}\nfunction collectTomorrowPlan() {\n  const tomorrow = addDaysToKey(todayKey(), 1);\n  const goals = goalTasksForDay(tomorrow)\n    .filter(task => !task.done)\n    .map(task => ({ text: task.title, meta: task.time ? `ساعت ${faN(task.time)}` : 'کار فردا' }));\n  const wd = workdayData[tomorrow] || {};\n  const workday = (wd.tasks || [])\n    .filter((text, idx) => text && text.trim() && !(wd.tasksDone || [])[idx])\n    .map(text => ({ text: text.trim(), meta: 'برنامه فردا' }));\n  const recurring = trackerItems()\n    .filter(item => (item.due || '').slice(0, 10) === tomorrow && !item.done)\n    .map(item => ({ text: item.title, meta: item.repeatLabel || 'تکرارشونده' }));\n  const followups = goalFollowupsForDay(todayKey())\n    .filter(item => !item.done)\n    .map(item => ({ text: item.title, meta: alarmFollowupMeta(item) }));\n  const routines = getDueShopRoutines().map(routine => ({ text: routine.name || 'لیست ادواری', meta: 'خرید ادواری' }));\n  return { goals, workday, recurring, followups, routines };\n}\nfunction alarmSectionHtml(icon, title, items, emptyText) {\n  if (!items.length && !emptyText) return '';\n  const rows = items.slice(0, 5);\n  return `<div class=\"alarm-pop-section\">\n    <div class=\"alarm-pop-sec-head\"><span>${icon} ${title}<\/span><span>${items.length ? faN(items.length) : ''}<\/span><\/div>\n    ${rows.length\n      ? `<ul class=\"alarm-pop-list\">${rows.map(item => `<li>${escapeHtml(item.text)}${item.meta ? ` <small>${escapeHtml(item.meta)}<\/small>` : ''}<\/li>`).join('')}<\/ul>`\n      : `<div class=\"alarm-pop-empty\">${emptyText || 'موردی نیست'}<\/div>`}\n  <\/div>`;\n}\nfunction buildAlarmPopup(slotId) {\n  const today = todayKey();\n  const tomorrow = addDaysToKey(today, 1);\n  if (slotId === 'morning') {\n    const plan = collectTodayPlan();\n    const total = plan.goals.length + plan.workday.length + plan.misc.length + plan.recurring.length;\n    const body = [\n      alarmSectionHtml('🎯', 'کارهای اهداف', plan.goals, total ? '' : 'کاری برای امروز ثبت نشده'),\n      alarmSectionHtml('📋', 'برنامه روز', plan.workday, ''),\n      alarmSectionHtml('🧩', 'کارهای روز', plan.misc, total ? '' : 'کار متفرقه‌ای ثبت نشده'),\n      alarmSectionHtml('🔁', 'تکرارشونده‌های امروز', plan.recurring, ''),\n      alarmSectionHtml('⏳', 'پیگیری‌های باز', plan.followups, ''),\n      alarmSectionHtml('🛒', 'خرید ادواری', plan.routines, '')\n    ].filter(Boolean).join('');\n    return {\n      icon: '☀️',\n      title: 'صبح بخیر',\n      sub: `${dateKeyToPersian(today)} · ${faN(total)} مورد در برنامه`,\n      body: total || plan.followups.length || plan.routines.length ? body : '<div class=\"alarm-pop-empty\">برای امروز هنوز برنامه‌ای ثبت نکردی. یک کار کوچک برای شروع اضافه کن.<\/div>',\n      actionLabel: 'برنامه امروز',\n      summary: `${faN(total)} کار برای امروز${plan.followups.length ? `، ${faN(plan.followups.length)} پیگیری باز` : ''}`,\n      handler: () => openTimelinePage(today)\n    };\n  }\n  if (slotId === 'midday') {\n    const plan = collectFollowupPlan();\n    const total = plan.followups.length + plan.workdayFollowups.length + plan.routines.length + plan.shopping.length + plan.goals.length;\n    const body = [\n      alarmSectionHtml('⏳', 'پیگیری‌های عقب‌افتاده', plan.followups, 'پیگیری عقب‌افتاده‌ای نداری'),\n      alarmSectionHtml('🎯', 'کا
